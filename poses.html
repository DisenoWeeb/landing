<style>
  :root {
    --brand-accent: #49d3ff;
    --brand-accent-2: #6ee7c9;
    --color-bg: #05070a;
    --color-text: #ffffff8a;
    --color-text-muted: rgba(244, 241, 234, 0.6);
    --font-display: "Space Grotesk", sans-serif;
    --font-body: "Inter", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    overflow-x: hidden;
  }

  @media (min-width: 769px) and (pointer: fine) {
    html {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar {
      display: none;
    }
  }

  #root { width: 100%; }

  .app-root {
    position: relative;
    width: 100%;
  }

  .canvas-stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #05070a;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .canvas-stage--ready { opacity: 1; }
  .canvas-stage canvas { display: block; width: 100% !important; height: 100% !important; }

  .hero-text {
    position: absolute;
    top: 25%;
    left: 50%;
    transform: translate(-50%, -50%);
    transform-origin: center center;
    z-index: 5;
    pointer-events: none;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2.1rem, 4.5vw, 3.2rem);
    letter-spacing: 0.07em;
    color: var(--color-text);
    white-space: nowrap;
    will-change: opacity, transform;
  }

  .scene-text-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }
  .scene-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 8vw;
    max-width: 720px;
    will-change: opacity, transform;
  }
  .scene-text--left    { align-items: flex-start; text-align: left; }
  .scene-text--center  { align-items: center; text-align: center; left: 50%; transform: translateX(-50%); max-width: 640px; }
  .scene-text--right   { align-items: flex-end; text-align: right; margin-left: auto; }

  .scene-text__eyebrow {
    font-family: var(--font-body);
    font-size: 0.75rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--brand-accent);
    margin-bottom: 0.75rem;
    display: inline-block;
  }
  .scene-text__title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2rem, 5vw, 4rem);
    line-height: 1.05;
    margin: 0 0 0.75rem 0;
    color: var(--color-text);
  }
  .scene-text__subtitle {
    font-family: var(--font-body);
    font-weight: 300;
    font-size: clamp(0.95rem, 1.4vw, 1.15rem);
    line-height: 1.5;
    color: var(--color-text-muted);
    margin: 0;
    max-width: 46ch;
  }

  .cta-layer {
    position: absolute;
    bottom: 8vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    will-change: opacity, transform;
  }
  .cta-button {
    display: inline-block;
    padding: 0.9rem 2.2rem;
    border-radius: 999px;
    background: var(--brand-accent);
    color: #0a0a0a;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 0.9rem;
    letter-spacing: 0.04em;
    text-decoration: none;
    box-shadow: 0 8px 30px rgba(200, 255, 0, 0.35);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .cta-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 36px rgba(200, 255, 0, 0.5);
  }

  .progress-rail {
    position: fixed;
    top: 50%;
    right: 3vw;
    transform: translateY(-50%);
    height: 28vh;
    z-index: 6;
  }
  .progress-rail__track {
    position: relative;
    width: 2px;
    height: 100%;
    background: rgba(244, 241, 234, 0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-rail__fill {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 0%;
    background: var(--brand-accent);
    border-radius: 2px;
    transition: height 0.05s linear;
  }

  .brand-mark {
    position: fixed;
    top: 3vh;
    left: 3vw;
    z-index: 6;
    font-family: var(--font-display);
    font-size: 1rem;
    letter-spacing: 0.08em;
    color: var(--color-text);
  }

  .scroll-hint {
    position: fixed;
    bottom: 4vh;
    left: 3vw;
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--color-text-muted);
    opacity: 0.7;
  }
  .scroll-hint__line {
    width: 1px;
    height: 32px;
    background: linear-gradient(to bottom, var(--color-text-muted), transparent);
    animation: scrollHintPulse 2s ease-in-out infinite;
  }
  @keyframes scrollHintPulse {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  .cursor-trail-canvas {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    mix-blend-mode: screen;
  }

  .scroll-spacer { width: 100%; }

  .app-root--scrolled .scroll-hint { opacity: 0; pointer-events: none; }
</style>
</head>

function smoothstep(edge0, edge1, x) {
  const t = clamp((x - edge0) / (edge1 - edge0));
  return t * t * (3 - 2 * t);
}

/* Curva de velocidad ("easing") por tramo, elegible desde la pestaña
   Duración. Se aplica por igual a cámara, movimiento, pose y ambiente
   para que todos lleguen coordinados al mismo punto en el tiempo. */
function applyEasing(t, kind) {
  switch (kind) {
    case "linear": return t;
    case "easeIn": return t * t;
    case "easeOut": return 1 - (1 - t) * (1 - t);
    case "smooth":
    default: return smoothstep(0, 1, t);
  }
}

function sampleMovement(progress) {
  const list = MOVEMENT_KEYFRAMES;
  const p = clamp(progress, 0, 1);
  if (p <= list[0].progress) return list[0];
  const last = list[list.length - 1];
  if (p >= last.progress) return last;
  let i = 0;
  while (i < list.length - 1 && list[i + 1].progress < p) i++;
  const a = list[i], b = list[i + 1];
  const span = b.progress - a.progress || 1;
  const t = applyEasing(clamp((p - a.progress) / span), b.easing);
  return {
    pos: [lerp(a.pos[0], b.pos[0], t), lerp(a.pos[1], b.pos[1], t), lerp(a.pos[2], b.pos[2], t)],
    yaw: lerp(a.yaw, b.yaw, t),
    pitch: lerp(a.pitch, b.pitch, t),
  };
}

  const list = BONE_POSE_KEYFRAMES;
  const p = clamp(progress, 0, 1);
  const pick = (kf) => kf.bones;
  if (p <= list[0].progress) return pick(list[0]);

  let i = 0;
  while (i < list.length - 1 && list[i + 1].progress < p) i++;
  const a = list[i], b = list[i + 1];
  const span = b.progress - a.progress || 1;
  const t = applyEasing(clamp((p - a.progress) / span), b.easing);
  const out = {};
  const keys = new Set([...Object.keys(a.bones), ...Object.keys(b.bones)]);
  keys.forEach((k) => {
    const va = a.bones[k] || [0, 0, 0];
    const vb = b.bones[k] || [0, 0, 0];
    out[k] = [lerp(va[0], vb[0], t), lerp(va[1], vb[1], t), lerp(va[2], vb[2], t)];
  });
  return out;
}

function damp(current, target, lambda, dt) {
  return current + (target - current) * (1 - Math.exp(-lambda * dt));
}
function clamp(value, min = 0, max = 1) {
  return Math.min(max, Math.max(min, value));
}

function getDeviceProfile() {
  const isMobile = typeof window !== "undefined" && window.matchMedia("(max-width: 768px)").matches;
  return {
    isMobile,
    dpr: isMobile ? [1, 2] : [1, 1.5],
    enablePostProcessing: !isMobile,
  };
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}
function lerpVec3(a, b, t) {
  return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
}
function lerpAngle(a, b, t) {
  let diff = ((b - a + 180) % 360 + 360) % 360 - 180;
  return a + diff * t;
}
function lightDirFromAngles(azimuthDeg, elevationDeg, distance) {
  const az = (azimuthDeg * Math.PI) / 180;
  const el = (elevationDeg * Math.PI) / 180;
  return [
    distance * Math.cos(el) * Math.sin(az),
    distance * Math.sin(el),
    distance * Math.cos(el) * Math.cos(az),
  ];
}
function lerpColor(a, b, t) {
  const ca = new THREE.Color(a);
  const cb = new THREE.Color(b);
  ca.lerp(cb, t);
  return "#" + ca.getHexString();
}

function sceneToState(kf) {
  return {
    camera: kf.camera,
    light: kf.light,
    fog: kf.fog,
    background: kf.background,
  };
}

function blendScenes(list, rawProgress) {
  const progress = clamp(rawProgress, 0, 1);
  if (progress <= list[0].progress) return sceneToState(list[0]);
  const last = list[list.length - 1];
  if (progress >= last.progress) return sceneToState(last);

  let i = 0;
  while (i < list.length - 1 && list[i + 1].progress < progress) i++;
  const a = list[i];
  const b = list[i + 1];
  const span = b.progress - a.progress || 1;
  const t = applyEasing(clamp((progress - a.progress) / span), b.easing);

  return {
    camera: {
      position: lerpVec3(a.camera.position, b.camera.position, t),
      lookAt: lerpVec3(a.camera.lookAt, b.camera.lookAt, t),
      fov: lerp(a.camera.fov, b.camera.fov, t),
      roll: lerp(a.camera.roll || 0, b.camera.roll || 0, t),
    },
    light: {
      color: lerpColor(a.light.color, b.light.color, t),
      intensity: lerp(a.light.intensity, b.light.intensity, t),
      azimuth: lerpAngle(a.light.azimuth ?? 45, b.light.azimuth ?? 45, t),
      elevation: lerp(a.light.elevation ?? 35, b.light.elevation ?? 35, t),
      rimColor: lerpColor(a.light.rimColor, b.light.rimColor, t),
      rimIntensity: lerp(a.light.rimIntensity, b.light.rimIntensity, t),
    },
    fog: {
      enabled: t < 0.5 ? (a.fog.enabled ?? true) : (b.fog.enabled ?? true),
      color: lerpColor(a.fog.color, b.fog.color, t),
      far: lerp(a.fog.far, b.fog.far, t),
    },
    background: {
      from: lerpColor(a.background.from, b.background.from, t),
      to: lerpColor(a.background.to, b.background.to, t),
      angle: lerp(a.background.angle ?? 180, b.background.angle ?? 180, t),
    },
  };
}

const useScrollStore = create((set) => ({
  progress: 0,
  smoothProgress: 0,
  setProgress: (p) => set({ progress: p }),
  setSmoothProgress: (p) => set({ smoothProgress: p }),
}));

function useScrollProgress(spacerRef) {
  useEffect(() => {
    const compute = () => {
      const el = spacerRef.current;
      if (!el) return;
      const total = el.offsetHeight - window.innerHeight;
      const raw = total > 0 ? window.scrollY / total : 0;
      const p = clamp(raw, 0, 1);
      useScrollStore.getState().setProgress(p);
      document.body.classList.toggle("app-root--scrolled", window.scrollY > 20);
    };
    compute();
    window.addEventListener("scroll", compute, { passive: true });
    window.addEventListener("resize", compute);
    return () => {
      window.removeEventListener("scroll", compute);
      window.removeEventListener("resize", compute);
    };
  }, [spacerRef]);
}

function useArrowKeyScroll(step = 140) {
  useEffect(() => {
    const onKeyDown = (e) => {
      if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
      const tag = document.activeElement?.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || document.activeElement?.isContentEditable) return;
      e.preventDefault();
      window.scrollBy({ top: e.key === "ArrowDown" ? step : -step, behavior: "smooth" });
    };
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, [step]);
}

function ScrollSmoother() {
  useFrame((_, delta) => {
    const { progress, smoothProgress, setSmoothProgress } = useScrollStore.getState();
    setSmoothProgress(damp(smoothProgress, progress, 4, delta));
  });
  return null;
}

function useMouseParallax() {
  const mouse = useRef({ x: 0, y: 0 });
  useEffect(() => {
    const onMove = (e) => {
      if (e.pointerType !== "mouse") return;
      mouse.current.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.current.y = (e.clientY / window.innerHeight) * 2 - 1;
    };
    window.addEventListener("pointermove", onMove, { passive: true });
    return () => window.removeEventListener("pointermove", onMove);
  }, []);
  return mouse;
}

function CameraRig({ mouse, parallaxStrength = 0.18 }) {
  const { camera } = useThree();
  const lookAtTarget = useRef(new THREE.Vector3());
  const currentLookAt = useRef(new THREE.Vector3());
  const dampedRoll = useRef(0);

  useFrame((_, delta) => {
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    const [px, py, pz] = state.camera.position;
    const [lx, ly, lz] = state.camera.lookAt;
    const mx = mouse.current?.x ?? 0;
    const my = mouse.current?.y ?? 0;

    camera.position.x = damp(camera.position.x, px + mx * parallaxStrength, 6, delta);
    camera.position.y = damp(camera.position.y, py - my * parallaxStrength * 0.6, 6, delta);
    camera.position.z = damp(camera.position.z, pz, 6, delta);

    lookAtTarget.current.set(lx + mx * 0.05, ly - my * 0.05, lz);
    currentLookAt.current.lerp(lookAtTarget.current, 1 - Math.exp(-6 * delta));
    camera.up.set(0, 1, 0);
    camera.lookAt(currentLookAt.current);

    dampedRoll.current = damp(dampedRoll.current, state.camera.roll || 0, 6, delta);
    if (dampedRoll.current) camera.rotateZ((dampedRoll.current * Math.PI) / 180);

    if ("fov" in camera) {
      camera.fov = damp(camera.fov, state.camera.fov, 5, delta);
      camera.updateProjectionMatrix();
    }
  });

  return null;
}

const CHAR_CENTER_Y = 0.52;
const CHAR_SCALE = 1.7;

const _deltaEuler = new THREE.Euler();
const _deltaQuat = new THREE.Quaternion();
function applyLocalDelta(bone, restQuat, ex, ey, ez) {
  _deltaEuler.set(ex, ey, ez, "XYZ");
  _deltaQuat.setFromEuler(_deltaEuler);
  bone.quaternion.copy(restQuat).multiply(_deltaQuat);
}

function AnimatedCharacter({ mouse }) {
  const outerRef = useRef(null);
  const pivotRef = useRef(null);
  const { scene } = useGLTF(CHARACTER_MODEL_URL);
  const bonesRef = useRef({});
  const restRef = useRef({});
  const clockRef = useRef(0);

  const chainRef = useRef({
    pelvis: 0, spine: 0, chest: 0, shoulder: 0, head: 0,
    thigh: 0, calf: 0, foot: 0,
  });

  useEffect(() => {
    const names = {
      spine1: "Spine01", spine2: "Spine02", head: "Head", neck: "NeckTwist01",
      lClavicle: "L_Clavicle", rClavicle: "R_Clavicle",
      lForearm: "L_Forearm", rForearm: "R_Forearm",
      lHand: "L_Hand", rHand: "R_Hand",
      lThigh: "L_Thigh", rThigh: "R_Thigh",
      lCalf: "L_Calf", rCalf: "R_Calf",
      lFoot: "L_Foot", rFoot: "R_Foot",
    };
    const bones = {};
    const rest = {};
    Object.entries(names).forEach(([key, boneName]) => {
      const bone = scene.getObjectByName(boneName);
      if (bone) {
        bones[key] = bone;
        rest[key] = bone.quaternion.clone();
      }
    });
    bonesRef.current = bones;
    restRef.current = rest;
  }, [scene]);

  useFrame((_, delta) => {
    clockRef.current += delta;
    const t = clockRef.current;
    const progress = useScrollStore.getState().smoothProgress;
    const bones = bonesRef.current;
    const rest = restRef.current;
    const outer = outerRef.current;
    const pivot = pivotRef.current;
    if (!outer || !pivot) return;

    /*@GEN:MOVEMENT_START*/
    const m = sampleMovement(progress);
    const idleFloat = Math.sin(t * 0.8) * 0.022;
    outer.position.x = damp(outer.position.x, m.pos[0], 3, delta);
    outer.position.y = damp(outer.position.y, m.pos[1] + idleFloat, 5, delta);
    outer.position.z = damp(outer.position.z, m.pos[2], 2.0, delta);

    pivot.rotation.y = damp(pivot.rotation.y, (m.yaw * Math.PI) / 180, 4.5, delta);
    pivot.rotation.x = damp(pivot.rotation.x, (m.pitch * Math.PI) / 180, 4.5, delta);
    pivot.rotation.z = damp(pivot.rotation.z, Math.sin(t * 0.35) * 0.04, 4, delta);
    /*@GEN:MOVEMENT_END*/

    const chain = chainRef.current;
    chain.pelvis = pivot.rotation.y;
    chain.spine = damp(chain.spine, chain.pelvis, 7, delta);
    chain.chest = damp(chain.chest, chain.spine, 5.5, delta);
    chain.shoulder = damp(chain.shoulder, chain.chest, 4.2, delta);
    chain.head = damp(chain.head, chain.shoulder, 3.2, delta);

    chain.thigh = damp(chain.thigh, chain.pelvis, 6, delta);
    chain.calf = damp(chain.calf, chain.thigh, 5, delta);
    chain.foot = damp(chain.foot, chain.calf, 4, delta);

    const idleAmp = 1;
    const floatArm = 0.26 * idleAmp;
    const floatLeg = 0.18 * idleAmp;
    const legWave = Math.sin(t * 0.6 + 0.3) * floatLeg;
    const calfWave = Math.sin(t * 0.7 + 1.0) * floatLeg * 0.7;
    const footWave = Math.sin(t * 0.8 + 0.2) * floatLeg * 0.5;
    const limbFloat = {
      lForearm: [0, 0, Math.sin(t * 0.9 + 0.0) * floatArm],
      rForearm: [0, 0, Math.sin(t * 0.85 + 1.4) * floatArm],
      lHand: [Math.sin(t * 1.1 + 0.6) * floatArm * 0.6, 0, 0],
      rHand: [Math.sin(t * 1.05 + 2.1) * floatArm * 0.6, 0, 0],
      lThigh: [legWave, 0, 0],
      rThigh: [legWave, 0, 0],
      lCalf: [calfWave, 0, 0],
      rCalf: [calfWave, 0, 0],
      lFoot: [0, 0, footWave],
      rFoot: [0, 0, footWave],
    };

    const _pose = sampleBonePose(progress);
    Object.entries(_pose).forEach(([key, [ex, ey, ez]]) => {
      const bone = bones[key];
      const r = rest[key];
      if (!bone || !r) return;
      const f = limbFloat[key];
      const fx = f ? ex + f[0] : ex;
      const fy = f ? ey + f[1] : ey;
      const fz = f ? ez + f[2] : ez;
      applyLocalDelta(bone, r, fx, fy, fz);
    });
  });

  return (
    <group ref={outerRef} position={[0, -0.95, -1.3]}>
      <group ref={pivotRef}>
        <primitive object={scene} position={[0, -CHAR_CENTER_Y, 0]} scale={CHAR_SCALE} />
      </group>
    </group>
  );
}
useGLTF.preload(CHARACTER_MODEL_URL);

/* ============================================================
   Objetos de entorno. Cada uno puede ser un modelo 3D estático (.glb,
   sin huesos ni animación propia) o una imagen/SVG plana (con opción
   de "billboard" para que siempre mire a cámara). Cada objeto anima
   su propia posición/escala/rotación por etapa (keyframes), leídas
   del mismo "progress" de scroll que usa el personaje — por eso el
   transform se aplica de forma imperativa (ref + useFrame) en vez de
   como props de React, igual que AnimatedCharacter, para no forzar un
   re-render en cada frame de scroll.
   ============================================================ */
function sampleObjectKeyframes(keyframes, progress) {
  const list = keyframes;
  const p = clamp(progress, 0, 1);
  if (p <= list[0].progress) return list[0];
  const last = list[list.length - 1];
  if (p >= last.progress) return last;
  let i = 0;
  while (i < list.length - 1 && list[i + 1].progress < p) i++;
  const a = list[i], b = list[i + 1];
  const span = b.progress - a.progress || 1;
  const t = applyEasing(clamp((p - a.progress) / span), b.easing);
  return {
    position: lerpVec3(a.position, b.position, t),
    scale: lerp(a.scale, b.scale, t),
    rotationY: lerpAngle(a.rotationY, b.rotationY, t),
  };
}

function useObjectTransformRef(keyframes, billboard) {
  const groupRef = useRef(null);
  useFrame((_, delta) => {
    const g = groupRef.current;
    if (!g) return;
    const progress = useScrollStore.getState().smoothProgress;
    const kf = sampleObjectKeyframes(keyframes, progress);
    g.position.x = damp(g.position.x, kf.position[0], 4, delta);
    g.position.y = damp(g.position.y, kf.position[1], 4, delta);
    g.position.z = damp(g.position.z, kf.position[2], 2.2, delta);
    const s = damp(g.scale.x, kf.scale, 4, delta);
    g.scale.set(s, s, s);
    if (!billboard) {
      g.rotation.y = damp(g.rotation.y, (kf.rotationY * Math.PI) / 180, 4, delta);
    }
  });
  return groupRef;
}

/* Los navegadores rasterizan un SVG a un tamaño chico por defecto
   (a veces 300x150px) antes de poder usarlo como textura — se ve
   pixelado al escalarlo grande en pantalla. Esto lo vuelve a dibujar
   en un canvas de alta resolución antes de crear la textura. Solo
   aplica a .svg; una imagen .png/.jpg ya es un bitmap y sigue el
   camino normal (useTexture). */
function useHiResSvgTexture(url, targetLong) {
  const [texture, setTexture] = useState(null);
  useEffect(() => {
    let cancelled = false;
    const img = new Image();
    img.onload = () => {
      if (cancelled) return;
      const w0 = img.naturalWidth || 300;
      const h0 = img.naturalHeight || 150;
      const aspect = w0 / h0 || 1;
      const canvas = document.createElement("canvas");
      if (aspect >= 1) { canvas.width = targetLong; canvas.height = Math.round(targetLong / aspect); }
      else { canvas.height = targetLong; canvas.width = Math.round(targetLong * aspect); }
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      setTexture(tex);
    };
    img.onerror = () => { if (!cancelled) setTexture(null); };
    img.src = url;
    return () => { cancelled = true; };
  }, [url, targetLong]);
  return texture;
}
function isSvgUrl(url) {
  return /\.svg($|\?)/i.test(url || "");
}

function SceneObjectModel({ data }) {
  const { scene } = useGLTF(data.url);
  const groupRef = useObjectTransformRef(data.keyframes, false);
  return (
    <group ref={groupRef}>
      <primitive object={scene} />
    </group>
  );
}
function SceneObjectImageRaster({ data }) {
  const texture = useTexture(data.url);
  const aspect = texture.image ? texture.image.width / texture.image.height : 1;
  const groupRef = useObjectTransformRef(data.keyframes, data.billboard);
  const mesh = (
    <mesh scale={[aspect, 1, 1]}>
      <planeGeometry args={[1, 1]} />
      <meshBasicMaterial map={texture} transparent toneMapped={false} />
    </mesh>
  );
  return (
    <group ref={groupRef}>
      {data.billboard ? <Billboard>{mesh}</Billboard> : mesh}
    </group>
  );
}
function SceneObjectImageSvg({ data }) {
  const texture = useHiResSvgTexture(data.url, 3072);
  const groupRef = useObjectTransformRef(data.keyframes, data.billboard);
  if (!texture) return <group ref={groupRef} />;
  const aspect = texture.image.width / texture.image.height;
  const mesh = (
    <mesh scale={[aspect, 1, 1]}>
      <planeGeometry args={[1, 1]} />
      <meshBasicMaterial map={texture} transparent toneMapped={false} />
    </mesh>
  );
  return (
    <group ref={groupRef}>
      {data.billboard ? <Billboard>{mesh}</Billboard> : mesh}
    </group>
  );
}
function SceneObjectImage({ data }) {
  return isSvgUrl(data.url) ? <SceneObjectImageSvg data={data} /> : <SceneObjectImageRaster data={data} />;
}
function SceneObject({ data }) {
  return data.type === "image" ? <SceneObjectImage data={data} /> : <SceneObjectModel data={data} />;
}
/* Si un archivo de un objeto (glb, png, svg) no se encuentra en el
   servidor (404) o falla al leerse, esto evita que tumbe TODA la
   experiencia — sin esto, un solo archivo faltante rompe el canvas
   entero (WebGL "Context Lost") y la página queda negra. Cada objeto
   tiene su propio boundary, así uno roto no afecta a los demás ni al
   personaje. */
class ObjectBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false }; }
  static getDerivedStateFromError() { return { hasError: true }; }
  componentDidCatch(error) { console.warn("No se pudo cargar un objeto de la escena:", error && error.message); }
  render() {
    if (this.state.hasError) return null;
    return this.props.children;
  }
}
function SceneObjects() {
  return (
    <>
      {OBJECTS.map((obj, i) => (
        <ObjectBoundary key={i}>
          <Suspense fallback={null}>
            <SceneObject data={obj} />
          </Suspense>
        </ObjectBoundary>
      ))}
    </>
  );
}
OBJECTS.forEach((obj) => {
  if (obj.type === "image") useTexture.preload(obj.url);
  else useGLTF.preload(obj.url);
});

function Lighting() {
  const keyRef = useRef(null);
  const rimRef = useRef(null);
  const dampedPos = useRef(new THREE.Vector3(...lightDirFromAngles(45, 35, 6)));

  useFrame((_, delta) => {
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    if (keyRef.current) {
      keyRef.current.color.set(state.light.color);
      keyRef.current.intensity = damp(keyRef.current.intensity, state.light.intensity, 4, delta);
      const target = lightDirFromAngles(state.light.azimuth, state.light.elevation, 6);
      dampedPos.current.x = damp(dampedPos.current.x, target[0], 5, delta);
      dampedPos.current.y = damp(dampedPos.current.y, target[1], 5, delta);
      dampedPos.current.z = damp(dampedPos.current.z, target[2], 5, delta);
      keyRef.current.position.copy(dampedPos.current);
    }
    if (rimRef.current) {
      rimRef.current.color.set(state.light.rimColor);
      rimRef.current.intensity = damp(rimRef.current.intensity, state.light.rimIntensity, 4, delta);
    }
  });

  return (
    <>
      <hemisphereLight color="#cfe8ff" groundColor="#1a1410" intensity={0.45} />
      <ambientLight intensity={0.32} />
      <directionalLight ref={keyRef} intensity={0.9} />
      <directionalLight position={[-3, 2, -2]} intensity={0.5} />
      <pointLight ref={rimRef} position={[-2.5, -1, -2]} intensity={1.4} distance={12} />
    </>
  );
}

function SceneEnvironment() {
  const { scene } = useThree();
  const fog = useRef(new THREE.FogExp2("#05070a", 0.12));

  useEffect(() => {
    scene.background = null;
  }, [scene]);

  useFrame(() => {
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    if (state.fog.enabled) {
      scene.fog = fog.current;
      fog.current.color.set(state.fog.color);
      fog.current.density = 1 / Math.max(state.fog.far, 1);
    } else {
      scene.fog = null;
    }
  });

  return null;
}

function HeroText() {
  const ref = useRef(null);
  const FADE_IN_END = 0.05;
  const ZOOM_START = ST_TURN_END;

  useEffect(() => {
    const update = (progress) => {
      if (!ref.current) return;
      const fadeIn = smoothstep(0, FADE_IN_END, progress);
      const zoomOut = smoothstep(ZOOM_START, 1, progress);
      const scale = 1 + zoomOut * 14;
      const opacity = fadeIn * (1 - zoomOut);
      ref.current.style.opacity = String(opacity);
      ref.current.style.transform = `translate(-50%, -50%) scale(${scale})`;
    };
    update(useScrollStore.getState().smoothProgress);
    return useScrollStore.subscribe((s) => update(s.smoothProgress));
  }, []);

  return (
    <div ref={ref} className="hero-text" style={{ opacity: 0 }}>
     
    </div>
  );
}

function textWeight(kf, progress, window_ = 0.14) {
  const d = Math.abs(progress - kf.progress);
  return clamp(1 - d / window_);
}

function SceneText() {
  const refs = useRef([]);

  useEffect(() => {
    const update = (progress) => {
      scenes.forEach((kf, i) => {
        const el = refs.current[i];
        if (!el || !kf.text) return;
        const weight = textWeight(kf, progress);
        el.style.opacity = String(weight);
        el.style.transform =
          kf.text.align === "center"
            ? `translateX(-50%) translateY(${(1 - weight) * 24}px)`
            : `translateY(${(1 - weight) * 24}px)`;
        el.style.pointerEvents = weight > 0.5 ? "auto" : "none";
      });
    };
    update(useScrollStore.getState().smoothProgress);
    const unsubscribe = useScrollStore.subscribe((s) => update(s.smoothProgress));
    return unsubscribe;
  }, []);

  return (
    <div className="scene-text-layer">
      {scenes.map((kf, i) =>
        kf.text ? (
          <div
            key={kf.id}
            ref={(el) => { refs.current[i] = el; }}
            className={`scene-text scene-text--${kf.text.align}`}
            style={{ opacity: 0 }}
          >
            {kf.text.eyebrow && <span className="scene-text__eyebrow">{kf.text.eyebrow}</span>}
            <h2 className="scene-text__title">{kf.text.title}</h2>
            {kf.text.subtitle && <p className="scene-text__subtitle">{kf.text.subtitle}</p>}
          </div>
        ) : null
      )}
    </div>
  );
}

const CTA_START = scenes.find((s) => s.showCTA)?.progress ?? 1;

function CTAButton() {

function CursorTrail() {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let width = window.innerWidth;
    let height = window.innerHeight;
    let points = [];
    let rafId = 0;

    const resize = () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();

    const addPoint = (x, y) => {
      points.push({ x, y, life: 1 });
      if (points.length > 40) points.shift();
    };
    const onPointerMove = (e) => addPoint(e.clientX, e.clientY);
    const onTouchMove = (e) => {
      if (e.touches && e.touches[0]) addPoint(e.touches[0].clientX, e.touches[0].clientY);
    };

    window.addEventListener("resize", resize);
    window.addEventListener("pointermove", onPointerMove, { passive: true });
    window.addEventListener("touchmove", onTouchMove, { passive: true });

    const draw = () => {
      ctx.clearRect(0, 0, width, height);
      points.forEach((p) => { p.life *= 0.94; });
      points = points.filter((p) => p.life > 0.02);

      if (points.length > 1) {
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.globalCompositeOperation = "lighter";
        for (let i = 1; i < points.length; i++) {
          const p0 = points[i - 1];
          const p1 = points[i];
          const alpha = Math.min(p0.life, p1.life) * 0.55;
          ctx.strokeStyle = clientConfig.colors.accent;
          ctx.globalAlpha = alpha;
          ctx.lineWidth = 1.5 + alpha * 4;
          ctx.beginPath();
          ctx.moveTo(p0.x, p0.y);
          ctx.lineTo(p1.x, p1.y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
      }
      rafId = requestAnimationFrame(draw);
    };
    rafId = requestAnimationFrame(draw);

    return () => {
      cancelAnimationFrame(rafId);
      window.removeEventListener("resize", resize);
      window.removeEventListener("pointermove", onPointerMove);
      window.removeEventListener("touchmove", onTouchMove);
    };
  }, []);

  return <canvas ref={canvasRef} className="cursor-trail-canvas" aria-hidden="true" />;
}

function App() {
  const spacerRef = useRef(null);
  const stageRef = useRef(null);
  useScrollProgress(spacerRef);
  useArrowKeyScroll();
  const device = useMemo(() => getDeviceProfile(), []);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    const t = setTimeout(() => setReady(true), 60);
    return () => clearTimeout(t);
  }, []);

  return (
    <div
      className="app-root"
      style={{
        "--brand-accent": clientConfig.colors.accent,
        "--brand-accent-2": clientConfig.colors.accentSecondary,
        "--color-bg": clientConfig.colors.background,
        "--color-text": clientConfig.colors.textPrimary,
        "--color-text-muted": clientConfig.colors.textMuted,
        "--font-display": clientConfig.fonts.display,
        "--font-body": clientConfig.fonts.body,
      }}
    >
      <div ref={stageRef} className={`canvas-stage ${ready ? "canvas-stage--ready" : ""}`}>
        <Canvas
          dpr={device.dpr}
          gl={{ antialias: true, alpha: true, powerPreference: "high-performance" }}
          camera={{ position: [0, 0.2, 6.5], fov: 35, near: 0.1, far: 60 }}
        >
          <Experience device={device} />
        </Canvas>
        <BackgroundGradient stageRef={stageRef} />
        <CursorTrail />
        <HeroText />
        <SceneText />
        <ProgressIndicator />
        <div className="scroll-hint" aria-hidden="true">
          <span>Scroll</span>
          <div className="scroll-hint__line" />
        </div>
      </div>
      <div ref={spacerRef} className="scroll-spacer" style={{ height: `${SCROLL_LENGTH_VH}vh` }} />
    </div>
  );
}

createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
