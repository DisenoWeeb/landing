    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    opacity: 0;
    transition: opacity 0.8s ease;

    font-size: clamp(0.95rem, 1.4vw, 1.15rem);
    line-height: 1.5;
    color: var(--color-text-muted);
    margin: 0;
    max-width: 46ch;
  }

  /* -------- CTA -------- */
  .cta-layer {
    position: absolute;
    bottom: 8vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    will-change: opacity, transform;

    display: inline-block;
    padding: 0.9rem 2.2rem;
    border-radius: 999px;

  .progress-rail {
    position: fixed;
    top: 50%;
    right: 3vw;

    height: 28vh;
    z-index: 6;

    width: 2px;
    height: 100%;
    background: rgba(244, 241, 234, 0.15);
    border-radius: 2px;
    overflow: hidden;

    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 0%;
    background: var(--brand-accent);
    border-radius: 2px;
    transition: height 0.05s linear;

    position: fixed;
    top: 3vh;
    left: 3vw;
    z-index: 6;
    font-family: var(--font-display);
    font-size: 1rem;
    letter-spacing: 0.08em;
    color: var(--color-text);

    position: fixed;
    bottom: 4vh;
    left: 3vw;
    z-index: 6;

    flex-direction: column;

    letter-spacing: 0.2em;

    inset: 0;
    z-index: 4;

  .app-root--scrolled .scroll-hint { opacity: 0; pointer-events: none; }

/* ============================================================

const ST_TURN_END = 0.7;

// Curva suave tipo "ease" para que toda transición sea fluida,
// nunca lineal/brusca.
function smoothstep(edge0, edge1, x) {
  const t = clamp((x - edge0) / (edge1 - edge0));
  return t * t * (3 - 2 * t);
}

/* ============================================================

   caída) pero el protagonista del movimiento es el personaje.
   ============================================================ */
const scenes = [

    particles: { spread: 1.3, opacity: 0.4 },
    light: { color: "#ffffff", intensity: 0.5, rimColor: "#7dfff0", rimIntensity: 1.7 },
    fog: { color: "#0a0a14", far: 14 },
    background: "#0a0a14",
  },
  {
    id: "fall",
    progress: 1,
    camera: { position: [0, 0.4, 4.2], lookAt: [0, -0.6, 0], fov: 32 },
    particles: { spread: 1.5, opacity: 0.45 },
    light: { color: "#ffffff", intensity: 0.45, rimColor: "#c8ff00", rimIntensity: 1.6 },
    fog: { color: "#000000", far: 11 },
    background: "#000000",

const BONE_POSE_KEYFRAMES = [
  {
    id: "front-idle",
    progress: 0,
    bones: {
        lHand: [0.1222, 1.3090, -0.3491],
        rHand: [-0.3665, -1.2566, -0.3142],
    },

    progress: 0.25,

        head: [-0.1571, -0.5760, 0.2793],
    },
  },
  {
    id: "turn",
    progress: 0.5,

      // (sin cambios respecto al rest pose)
    },

  {
    id: "fall-pose",
    progress: 0.7,
    bones: {
        spine1: [0.1571, 0.0000, 0.0000],
        head: [0.7505, 0.0000, 0.0000],
        lClavicle: [0.0000, -0.7505, 0.5236],
        rClavicle: [0.0000, 0.9425, -0.5061],
        lHand: [-0.1571, 0.8029, 0.1920],
        rHand: [-0.3316, -1.0472, -0.0698],
        lCalf: [-0.7156, 0.0000, 0.0000],
        rCalf: [-0.8203, -0.2094, 0.0000],
    },

    },

// Interpola linealmente entre los dos keyframes que rodean `progress`
// (idéntica lógica a blendScenes, pero por hueso).
function sampleBonePose(progress) {
  const list = BONE_POSE_KEYFRAMES;
  const p = clamp(progress, 0, 1);
  const pick = (kf) => kf.bones;
  if (p <= list[0].progress) return pick(list[0]);
  const last = list[list.length - 1];
  if (p >= last.progress) return pick(last);
  let i = 0;
  while (i < list.length - 1 && list[i + 1].progress < p) i++;
  const a = list[i], b = list[i + 1];
  const span = b.progress - a.progress || 1;
  const t = clamp((p - a.progress) / span);
  const out = {};
  const keys = new Set([...Object.keys(a.bones), ...Object.keys(b.bones)]);
  keys.forEach((k) => {
    const va = a.bones[k] || [0, 0, 0];
    const vb = b.bones[k] || [0, 0, 0];
    out[k] = [lerp(va[0], vb[0], t), lerp(va[1], vb[1], t), lerp(va[2], vb[2], t)];
  });
  return out;
}

const SCROLL_LENGTH_VH = 950;

/* ============================================================
   UTILS: easing.ts
   ============================================================ */
function damp(current, target, lambda, dt) {
  return current + (target - current) * (1 - Math.exp(-lambda * dt));
}
function clamp(value, min = 0, max = 1) {
  return Math.min(max, Math.max(min, value));
}

/* ============================================================
   UTILS: device.ts
   ============================================================ */
function getDeviceProfile() {
  const isMobile = typeof window !== "undefined" && window.matchMedia("(max-width: 768px)").matches;
  return {
    isMobile,
    dpr: isMobile ? [1, 1.5] : [1, 2],
    particleMultiplier: isMobile ? 0.4 : 1,
    enablePostProcessing: !isMobile,
  };
}

/* ============================================================
   UTILS: interpolate.ts
   ============================================================ */
function lerp(a, b, t) {
  return a + (b - a) * t;
}
function lerpVec3(a, b, t) {
  return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
}
function lerpColor(a, b, t) {
  const ca = new THREE.Color(a);
  const cb = new THREE.Color(b);
  ca.lerp(cb, t);
  return "#" + ca.getHexString();
}

function sceneToState(kf) {
  return {
    camera: kf.camera,
    particles: kf.particles,
    light: kf.light,
    fog: kf.fog,
    background: kf.background,
  };
}

function blendScenes(list, rawProgress) {
  const progress = clamp(rawProgress, 0, 1);
  if (progress <= list[0].progress) return sceneToState(list[0]);
  const last = list[list.length - 1];
  if (progress >= last.progress) return sceneToState(last);

  let i = 0;
  while (i < list.length - 1 && list[i + 1].progress < progress) i++;
  const a = list[i];
  const b = list[i + 1];
  const span = b.progress - a.progress || 1;
  const t = clamp((progress - a.progress) / span);

  return {
    camera: {
      position: lerpVec3(a.camera.position, b.camera.position, t),
      lookAt: lerpVec3(a.camera.lookAt, b.camera.lookAt, t),
      fov: lerp(a.camera.fov, b.camera.fov, t),
    },
    particles: {
      spread: lerp(a.particles.spread, b.particles.spread, t),
      opacity: lerp(a.particles.opacity, b.particles.opacity, t),
    },
    light: {
      color: lerpColor(a.light.color, b.light.color, t),
      intensity: lerp(a.light.intensity, b.light.intensity, t),
      rimColor: lerpColor(a.light.rimColor, b.light.rimColor, t),
      rimIntensity: lerp(a.light.rimIntensity, b.light.rimIntensity, t),
    },
    fog: {
      color: lerpColor(a.fog.color, b.fog.color, t),
      far: lerp(a.fog.far, b.fog.far, t),
    },
    background: lerpColor(a.background, b.background, t),
  };
}

function textWeight(kf, progress, window_ = 0.14) {
  const d = Math.abs(progress - kf.progress);
  return clamp(1 - d / window_);
}

/* ============================================================
   STORE: scroll/scrollStore.ts
   ============================================================ */
const useScrollStore = create((set) => ({
  progress: 0,
  smoothProgress: 0,
  setProgress: (p) => set({ progress: p }),
  setSmoothProgress: (p) => set({ smoothProgress: p }),
}));

/* ============================================================
   HOOK: scroll/useScrollProgress.ts
   Traduce el alto del spacer + scrollY del documento en un
   progreso 0..1 crudo, guardado en el store.
   ============================================================ */
function useScrollProgress(spacerRef) {
  useEffect(() => {
    const compute = () => {
      const el = spacerRef.current;
      if (!el) return;
      const total = el.offsetHeight - window.innerHeight;
      const raw = total > 0 ? window.scrollY / total : 0;
      const p = clamp(raw, 0, 1);
      useScrollStore.getState().setProgress(p);
      document.body.classList.toggle("app-root--scrolled", window.scrollY > 20);
    };
    compute();
    window.addEventListener("scroll", compute, { passive: true });
    window.addEventListener("resize", compute);
    return () => {
      window.removeEventListener("scroll", compute);
      window.removeEventListener("resize", compute);
    };
  }, [spacerRef]);
}

/* ============================================================
   COMPONENT (dentro de <Canvas>): scroll/ScrollSmoother.tsx
   Amortigua smoothProgress hacia progress cuadro a cuadro.
   ============================================================ */
function ScrollSmoother() {
  useFrame((_, delta) => {
    const { progress, smoothProgress, setSmoothProgress } = useScrollStore.getState();
    setSmoothProgress(damp(smoothProgress, progress, 4, delta));
  });
  return null;
}

/* ============================================================
   HOOK: engine/utils/useMouseParallax.ts
   ============================================================ */
function useMouseParallax() {
  const mouse = useRef({ x: 0, y: 0 });
  useEffect(() => {
    const onMove = (e) => {
      if (e.pointerType !== "mouse") return;
      mouse.current.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.current.y = (e.clientY / window.innerHeight) * 2 - 1;
    };
    window.addEventListener("pointermove", onMove, { passive: true });
    return () => window.removeEventListener("pointermove", onMove);
  }, []);
  return mouse;
}

/* ============================================================
   three/CameraRig.jsx
   ============================================================ */
function CameraRig({ mouse, parallaxStrength = 0.18 }) {
  const { camera } = useThree();
  const lookAtTarget = useRef(new THREE.Vector3());
  const currentLookAt = useRef(new THREE.Vector3());

  useFrame((_, delta) => {
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    const [px, py, pz] = state.camera.position;
    const [lx, ly, lz] = state.camera.lookAt;
    const mx = mouse.current?.x ?? 0;
    const my = mouse.current?.y ?? 0;

    camera.position.x = damp(camera.position.x, px + mx * parallaxStrength, 6, delta);
    camera.position.y = damp(camera.position.y, py - my * parallaxStrength * 0.6, 6, delta);
    camera.position.z = damp(camera.position.z, pz, 6, delta);

    lookAtTarget.current.set(lx + mx * 0.05, ly - my * 0.05, lz);
    currentLookAt.current.lerp(lookAtTarget.current, 1 - Math.exp(-6 * delta));
    camera.lookAt(currentLookAt.current);

    if ("fov" in camera) {
      camera.fov = damp(camera.fov, state.camera.fov, 5, delta);
      camera.updateProjectionMatrix();
    }
  });

  return null;
}

/* ============================================================
   three/AnimatedCharacter.jsx
   Personaje 3D suspendido en el aire — NO un muñeco girando
   sobre sus pies. Arquitectura:

   1) PIVOT EN EL CENTRO DE MASA
      El modelo tiene su origen (0,0,0) en los pies (típico de
      un rig biped). Para que las rotaciones ocurran alrededor
      del centro del cuerpo (pelvis) y no de los pies, el
      <primitive> se desplaza hacia abajo dentro de un grupo, de
      modo que el pivote del grupo (lo que rota) coincide con la
      altura de la pelvis, no con el piso.

   2) MÁQUINA DE ESTADOS (ver ST_* arriba)
      FRONT_IDLE → APPROACH → TURN → FALL_POSE → FALL
      Cada estado tiene su propio target de posición/rotación;
      se interpola con smoothstep entre estados, nunca de golpe.

   3) CADENA DE HUESOS CON RETRASO (no todo rota como una pieza)
      Durante TURN, el giro no se aplica de una sola vez a todo
      el cuerpo: la pelvis (el grupo entero) lidera, la columna
      la sigue con un poco de retraso, los hombros después, la
      cabeza al final — igual con las piernas hacia abajo. Cada
      hueso solo aplica la DIFERENCIA entre su objetivo y el de
      su padre en la cadena (así no se duplica la rotación).

   NOTA HONESTA: "R_Upperarm"/"L_Upperarm" tienen pesos de piel
   mal distribuidos en este GLB (ver conversación anterior — al
   rotarlos se desprendía un pedazo de tela). Por eso el "hombro"
   de la cadena se resuelve con la clavícula (Clavicle) en vez
   del brazo superior, y el movimiento visible del brazo viene
   del antebrazo (Forearm) hacia abajo. Si en tu modelo el brazo
   superior sí tiene buenos pesos, avisame y lo sumo de nuevo.

   Como no hay forma de previsualizar el rig desde acá, los
   signos exactos de cada eje son la mejor estimación posible —
   contame puntualmente qué se ve mal (ej: "gira al revés",
   "las palmas miran para arriba") y lo corrijo con precisión.
   ============================================================ */

// Altura aproximada (en unidades del propio modelo, no escaladas)
// del centro de masa/pelvis, medida desde los pies. Si el
// personaje "flota" muy alto o muy bajo en pantalla, ajustar acá.
const CHAR_CENTER_Y = 0.52;
const CHAR_SCALE = 1.7;

// Aplica una rotación EXTRA (en radianes, ejes locales del hueso)
// por ENCIMA de su pose de reposo, componiendo por cuaterniones.
// Esto es matemáticamente correcto sin importar qué tan "rara" sea
// la pose de reposo — sumar componentes de Euler directamente NO
// funciona bien cuando el reposo ya es una rotación grande (como
// pasa en este rig: brazos/piernas vienen con ~90-180° de fábrica).
const _deltaEuler = new THREE.Euler();
const _deltaQuat = new THREE.Quaternion();
function applyLocalDelta(bone, restQuat, ex, ey, ez) {
  _deltaEuler.set(ex, ey, ez, "XYZ");
  _deltaQuat.setFromEuler(_deltaEuler);
  bone.quaternion.copy(restQuat).multiply(_deltaQuat);
}

function AnimatedCharacter({ mouse }) {
  const outerRef = useRef(null); // posición en el mundo (dolly/caída)
  const pivotRef = useRef(null); // rotación alrededor del centro de masa
  const { scene } = useGLTF(CHARACTER_MODEL_URL);
  const bonesRef = useRef({});
  const restRef = useRef({});
  const clockRef = useRef(0);

  // Ángulos acumulados de cada eslabón de la cadena (mundo, no
  // relativos) — así cada uno puede perseguir al anterior con su
  // propio retraso ("follow-through").
  const chainRef = useRef({
    pelvis: 0,
    spine: 0,
    chest: 0,
    shoulder: 0,
    head: 0,
    thigh: 0,
    calf: 0,
    foot: 0,
  });

  useEffect(() => {
    const names = {
      spine1: "Spine01",
      spine2: "Spine02",
      head: "Head",
      neck: "NeckTwist01",
      lClavicle: "L_Clavicle",
      rClavicle: "R_Clavicle",
      lForearm: "L_Forearm",
      rForearm: "R_Forearm",
      lHand: "L_Hand",
      rHand: "R_Hand",
      lThigh: "L_Thigh",
      rThigh: "R_Thigh",
      lCalf: "L_Calf",
      rCalf: "R_Calf",
      lFoot: "L_Foot",
      rFoot: "R_Foot",
    };
    const bones = {};
    const rest = {};
    Object.entries(names).forEach(([key, boneName]) => {
      const bone = scene.getObjectByName(boneName);
      if (bone) {
        bones[key] = bone;
        rest[key] = bone.quaternion.clone(); // cuaternión, no Euler
      }
    });
    bonesRef.current = bones;
    restRef.current = rest;
  }, [scene]);

  useFrame((_, delta) => {
    clockRef.current += delta;
    const t = clockRef.current;
    const progress = useScrollStore.getState().smoothProgress;
    const bones = bonesRef.current;
    const rest = restRef.current;
    const outer = outerRef.current;
    const pivot = pivotRef.current;
    if (!outer || !pivot) return;

    // ---- Pesos de cada estado (0..1), transición suave ----
    const approachW = smoothstep(0, ST_FRONT_END, progress); // 0→1 en FRONT_IDLE
    const dollyW = smoothstep(ST_FRONT_END, ST_APPROACH_END, progress); // acercamiento
    const turnW = smoothstep(ST_APPROACH_END, ST_TURN_END, progress); // giro corporal
    const poseW = smoothstep(ST_TURN_END, ST_FALLPOSE_END, progress); // adopta postura de caída
    const fallW = smoothstep(ST_FALLPOSE_END, 1, progress); // caída libre
    const inTurn = progress >= ST_APPROACH_END && progress < ST_TURN_END;

    // ---- POSICIÓN: acercamiento (dolly) → caída acelerada ----
    const zFront = -1.3;
    const zClose = -0.55;
    const targetZ = zFront + (zClose - zFront) * dollyW;
    outer.position.z = damp(outer.position.z, targetZ, 2.5, delta);

    // Caída: cuadrática (empieza lenta, acelera) — puramente atada
    // al scroll, no al reloj, para que siga siendo "scrubbable".
    const fallDrop = fallW * fallW * 7.5;
    outer.position.y = -fallDrop;

    // Suspendido: nunca hay un "piso" — solo un flote idle sutil,
    // que se atenúa a medida que la caída toma el control.
    const idleFloat = Math.sin(t * 0.8) * 0.05 * (1 - fallW * 0.6);
    outer.position.y += idleFloat;

    // ---- ROTACIÓN: cadena con retraso, alrededor del centro ----
    // Objetivo de yaw (girar) durante TURN, y de pitch (clavado)
    // durante FALL_POSE/FALL. Un tirabuzón MUY lento se suma
    // durante la caída, sin ser el protagonista del movimiento.
    const YAW_TARGET = -Math.PI; // da la vuelta completa
    const PITCH_TARGET = -1.15; // inclinación de clavado (~66°)
    const corkscrew = fallW * t * 0.12; // tirabuzón lento y continuo

    const pelvisYawTarget = YAW_TARGET * turnW;
    const pelvisPitchTarget = PITCH_TARGET * poseW + corkscrew;

    // La pelvis (el pivote entero) lidera el movimiento — responde
    // más rápido que el resto de la cadena.
    pivot.rotation.y = damp(pivot.rotation.y, pelvisYawTarget, 4.5, delta);
    pivot.rotation.x = damp(pivot.rotation.x, pelvisPitchTarget, 4.5, delta);
    pivot.rotation.z = damp(
      pivot.rotation.z,
      Math.sin(t * 0.35) * 0.04 + fallW * Math.sin(t * 0.2) * 0.06,
      4,
      delta
    );

    // Cadena hacia arriba: columna → pecho → hombros → cabeza,
    // cada uno persiguiendo al anterior con más retraso (lambda
    // más baja = más lag = llega después).
    const chain = chainRef.current;
    chain.pelvis = pivot.rotation.y;
    chain.spine = damp(chain.spine, chain.pelvis, 7, delta);
    chain.chest = damp(chain.chest, chain.spine, 5.5, delta);
    chain.shoulder = damp(chain.shoulder, chain.chest, 4.2, delta);
    chain.head = damp(chain.head, chain.shoulder, 3.2, delta);

    // Cadena hacia abajo: pelvis → muslo → pantorrilla → pie.
    chain.thigh = damp(chain.thigh, chain.pelvis, 6, delta);
    chain.calf = damp(chain.calf, chain.thigh, 5, delta);
    chain.foot = damp(chain.foot, chain.calf, 4, delta);

    // Cada hueso solo aplica la DIFERENCIA con su padre en la
    // cadena — el padre ya aporta su propia rotación al heredarla.
    const spineLag = chain.spine - chain.pelvis;
    const chestLag = chain.chest - chain.spine;
    const shoulderLag = chain.shoulder - chain.chest;
    const headLag = chain.head - chain.shoulder;
    const thighLag = chain.thigh - chain.pelvis;
    const calfLag = chain.calf - chain.thigh;
    const footLag = chain.foot - chain.calf;

    // ---- Postura de caída: brazos adelante, palmas abajo ----
    // (se suma progresivamente durante FALL_POSE, se mantiene en FALL)
    const armForward = poseW * 1.0; // codo/hombro hacia adelante
    const elbowBend = poseW * 1.1; // antebrazo doblado
    const palmDown = poseW * 1.3; // giro de muñeca para palma-abajo
    const legSpread = poseW * 0.18; // piernas separándose levemente
    const legExtend = poseW * 0.35; // piernas extendiéndose

    // Balanceo idle sutil, siempre presente, MUY leve — se apaga
    // un poco durante el giro para que la cadena se note limpia.
    const idleAmp = 1 - turnW * 0.6;
    const idle = (freq, phase, amp) => Math.sin(t * freq + phase) * amp * idleAmp;

    // Spine/Head/Neck: la pose de reposo acá SÍ es identidad (0,0,0),
    // así que asignar Euler directo es seguro (no hay pose extraña
    // de base que rompa la composición).
const _pose = sampleBonePose(progress);
Object.entries(_pose).forEach(([key, [ex, ey, ez]]) => {
  const bone = bones[key];
  const r = rest[key];
  if (!bone || !r) return;
  applyLocalDelta(bone, r, ex, ey, ez);
});

    void inTurn;
    void approachW;
  });

  return (
    <group ref={outerRef} position={[0, 0.05, -1.3]}>
      <group ref={pivotRef}>
        <primitive object={scene} position={[0, -CHAR_CENTER_Y, 0]} scale={CHAR_SCALE} />
      </group>
    </group>
  );
}
useGLTF.preload(CHARACTER_MODEL_URL);

/* ============================================================
   ============================================================ */
function Particles({ device }) {
  const pointsRef = useRef(null);
  const materialRef = useRef(null);
  const count = Math.round(clientConfig.particles.count * device.particleMultiplier);

  const positions = useMemo(() => {
    const arr = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      arr[i * 3] = (Math.random() - 0.5) * 2;
      arr[i * 3 + 1] = (Math.random() - 0.5) * 2;
      arr[i * 3 + 2] = (Math.random() - 0.5) * 2;
    }
    return arr;
  }, [count]);

  useFrame((state, delta) => {
    const progress = useScrollStore.getState().smoothProgress;
    const blended = blendScenes(scenes, progress);
    if (pointsRef.current) {
      const targetScale = blended.particles.spread;
      pointsRef.current.scale.setScalar(damp(pointsRef.current.scale.x, targetScale, 3, delta));
      pointsRef.current.rotation.y += delta * 0.02;
    }
    if (materialRef.current) {
      materialRef.current.opacity = damp(materialRef.current.opacity, blended.particles.opacity, 4, delta);
    }
    void state;
  });

  return (
    <points ref={pointsRef}>
      <bufferGeometry>
        <bufferAttribute attach="attributes-position" args={[positions, 3]} />
      </bufferGeometry>
      <pointsMaterial
        ref={materialRef}
        color={clientConfig.particles.color}
        size={clientConfig.particles.size}
        transparent
        opacity={0.4}
        depthWrite={false}
        sizeAttenuation
      />
    </points>
  );
}

/* ============================================================
   three/Lighting.jsx
   ============================================================ */
function Lighting() {
  const keyRef = useRef(null);
  const rimRef = useRef(null);

  useFrame((_, delta) => {
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    if (keyRef.current) {
      keyRef.current.color.set(state.light.color);
      keyRef.current.intensity = damp(keyRef.current.intensity, state.light.intensity, 4, delta);
    }
    if (rimRef.current) {
      rimRef.current.color.set(state.light.rimColor);
      rimRef.current.intensity = damp(rimRef.current.intensity, state.light.rimIntensity, 4, delta);
    }
  });

  return (
    <>
      <ambientLight intensity={0.25} />
      <directionalLight ref={keyRef} position={[3, 4, 5]} intensity={0.9} />
      <directionalLight position={[-3, 2, -2]} intensity={0.35} />
      <pointLight ref={rimRef} position={[-2.5, -1, -2]} intensity={1.4} distance={12} />
    </>
  );
}

/* ============================================================
   three/SceneEnvironment.jsx
   ============================================================ */
function SceneEnvironment() {
  const { scene } = useThree();
  const fog = useRef(new THREE.FogExp2("#05070a", 0.12));
  const bgColor = useRef(new THREE.Color("#05070a"));

  useEffect(() => {
    scene.fog = fog.current;
    scene.background = bgColor.current;
  }, [scene]);

  useFrame(() => {
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    fog.current.color.set(state.fog.color);
    fog.current.density = 1 / Math.max(state.fog.far, 1);
    bgColor.current.set(state.background);
  });

  return null;
}

/* ============================================================
   three/Experience.jsx
   ============================================================ */
function Experience({ device }) {
  const mouse = useMouseParallax();
  return (
    <>
      <ScrollSmoother />
      <SceneEnvironment />
      <CameraRig mouse={mouse} />
      <Lighting />
      <Environment preset="city" background={false} />
      <Suspense fallback={null}>
        <AnimatedCharacter mouse={mouse} />
      </Suspense>
      <Particles device={device} />
      {device.enablePostProcessing && (
        <EffectComposer multisampling={0}>
          <Bloom intensity={0.55} luminanceThreshold={0.2} luminanceSmoothing={0.9} mipmapBlur />
          <Vignette eskil={false} offset={0.15} darkness={0.7} />
        </EffectComposer>
      )}
    </>
  );
}

/* ============================================================
   ui/HeroText.jsx
   El único texto "de entrada": aparece al principio, y cuando
   arranca el giro/caída (fase GIRAR) se agranda hacia la
   pantalla mientras se desvanece, hasta desaparecer del todo.
   No vuelve a aparecer ningún otro texto hasta el CTA final
   (ese lo maneja SceneText con el keyframe "cierre").
   ============================================================ */
function HeroText() {
  const ref = useRef(null);
  const FADE_IN_END = 0.05;

  useEffect(() => {
    const update = (progress) => {
      if (!ref.current) return;
      const fadeIn = smoothstep(0, FADE_IN_END, progress);
      const zoomOut = smoothstep(ST_APPROACH_END, ST_TURN_END, progress);
      const scale = 1 + zoomOut * 14;
      const opacity = fadeIn * (1 - zoomOut);
      ref.current.style.opacity = String(opacity);
      ref.current.style.transform = `translate(-50%, -50%) scale(${scale})`;
    };
    update(useScrollStore.getState().smoothProgress);
    return useScrollStore.subscribe((s) => update(s.smoothProgress));
  }, []);

  return (
    <div ref={ref} className="hero-text" style={{ opacity: 0 }}>
      Scroll Experience
    </div>
  );
}

/* ============================================================
   ui/SceneText.jsx
   ============================================================ */
function SceneText() {
  const refs = useRef([]);

  useEffect(() => {
    const update = (progress) => {
      scenes.forEach((kf, i) => {
        const el = refs.current[i];
        if (!el || !kf.text) return;
        const weight = textWeight(kf, progress);
        el.style.opacity = String(weight);
        el.style.transform =
          kf.text.align === "center"
            ? `translateX(-50%) translateY(${(1 - weight) * 24}px)`
            : `translateY(${(1 - weight) * 24}px)`;
        el.style.pointerEvents = weight > 0.5 ? "auto" : "none";
      });
    };
    update(useScrollStore.getState().smoothProgress);
    const unsubscribe = useScrollStore.subscribe((s) => update(s.smoothProgress));
    return unsubscribe;
  }, []);

  return (
    <div className="scene-text-layer">
      {scenes.map((kf, i) =>
        kf.text ? (
          <div
            key={kf.id}
            ref={(el) => { refs.current[i] = el; }}
            className={`scene-text scene-text--${kf.text.align}`}
            style={{ opacity: 0 }}
          >
            {kf.text.eyebrow && <span className="scene-text__eyebrow">{kf.text.eyebrow}</span>}
            <h2 className="scene-text__title">{kf.text.title}</h2>
            {kf.text.subtitle && <p className="scene-text__subtitle">{kf.text.subtitle}</p>}
          </div>
        ) : null
      )}
    </div>
  );
}

/* ============================================================
   ui/CTAButton.jsx
   ============================================================ */
const CTA_START = scenes.find((s) => s.showCTA)?.progress ?? 1;
const FADE_WINDOW = 0.06;

function CTAButton() {
  const ref = useRef(null);

  useEffect(() => {
    const update = (progress) => {
      if (!ref.current) return;
      const weight = clamp((progress - (CTA_START - FADE_WINDOW)) / FADE_WINDOW);
      ref.current.style.opacity = String(weight);
      ref.current.style.transform = `translateX(-50%) translateY(${(1 - weight) * 16}px)`;
      ref.current.style.pointerEvents = weight > 0.6 ? "auto" : "none";
    };
    update(useScrollStore.getState().smoothProgress);
    return useScrollStore.subscribe((s) => update(s.smoothProgress));
  }, []);

  return (
    <div ref={ref} className="cta-layer" style={{ opacity: 0 }}>
      <a className="cta-button" href={clientConfig.cta.href}>
        {clientConfig.cta.label}
      </a>
    </div>
  );
}

/* ============================================================
   ui/ProgressIndicator.jsx
   ============================================================ */
function ProgressIndicator() {
  const fillRef = useRef(null);

  useEffect(() => {
    const update = (progress) => {
      if (fillRef.current) fillRef.current.style.height = `${progress * 100}%`;
    };
    update(useScrollStore.getState().smoothProgress);
    return useScrollStore.subscribe((s) => update(s.smoothProgress));
  }, []);

  return (
    <div className="progress-rail" aria-hidden="true">
      <div className="progress-rail__track">
        <div ref={fillRef} className="progress-rail__fill" />
      </div>
    </div>
  );
}

/* ============================================================
   ui/CursorTrail.jsx
   Rastro luminoso que sigue al mouse (pointermove) o al dedo
   (touchmove) — el "touch trail / cursor trail" genérico.
   Dibuja en un <canvas> 2D encima del canvas 3D, con blend
   "lighter" para que el rastro brille sobre el fondo oscuro.
   ============================================================ */
function CursorTrail() {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let width = window.innerWidth;
    let height = window.innerHeight;
    let points = [];
    let rafId = 0;

    const resize = () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();

    const addPoint = (x, y) => {
      points.push({ x, y, life: 1 });
      if (points.length > 40) points.shift();
    };
    const onPointerMove = (e) => addPoint(e.clientX, e.clientY);
    const onTouchMove = (e) => {
      if (e.touches && e.touches[0]) addPoint(e.touches[0].clientX, e.touches[0].clientY);
    };

    window.addEventListener("resize", resize);
    window.addEventListener("pointermove", onPointerMove, { passive: true });
    window.addEventListener("touchmove", onTouchMove, { passive: true });

    const draw = () => {
      ctx.clearRect(0, 0, width, height);
      points.forEach((p) => { p.life *= 0.94; });
      points = points.filter((p) => p.life > 0.02);

      if (points.length > 1) {
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.globalCompositeOperation = "lighter";
        for (let i = 1; i < points.length; i++) {
          const p0 = points[i - 1];
          const p1 = points[i];
          const alpha = Math.min(p0.life, p1.life) * 0.55;
          ctx.strokeStyle = clientConfig.colors.accent;
          ctx.globalAlpha = alpha;
          ctx.lineWidth = 1.5 + alpha * 4;
          ctx.beginPath();
          ctx.moveTo(p0.x, p0.y);
          ctx.lineTo(p1.x, p1.y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
      }
      rafId = requestAnimationFrame(draw);
    };
    rafId = requestAnimationFrame(draw);

    return () => {
      cancelAnimationFrame(rafId);
      window.removeEventListener("resize", resize);
      window.removeEventListener("pointermove", onPointerMove);
      window.removeEventListener("touchmove", onTouchMove);
    };
  }, []);

  return <canvas ref={canvasRef} className="cursor-trail-canvas" aria-hidden="true" />;
}

        >

}

createRoot(document.getElementById("root")).render(<App />);
