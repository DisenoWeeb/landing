  const span = b.progress - a.progress || 1;
  const t = clamp((p - a.progress) / span);
  const out = {};
  const keys = new Set([...Object.keys(a.bones), ...Object.keys(b.bones)]);
  keys.forEach((k) => {
    const va = a.bones[k] || [0, 0, 0];
    const vb = b.bones[k] || [0, 0, 0];
    out[k] = [lerp(va[0], vb[0], t), lerp(va[1], vb[1], t), lerp(va[2], vb[2], t)];
  });
  return out;
}

const SCROLL_LENGTH_VH = 950;

function damp(current, target, lambda, dt) {
  return current + (target - current) * (1 - Math.exp(-lambda * dt));
}
function clamp(value, min = 0, max = 1) {
  return Math.min(max, Math.max(min, value));
}

function getDeviceProfile() {
  const isMobile = typeof window !== "undefined" && window.matchMedia("(max-width: 768px)").matches;
  return {
    isMobile,
    dpr: isMobile ? [1, 1.5] : [1, 2],
    particleMultiplier: isMobile ? 0.4 : 1,
    enablePostProcessing: !isMobile,
  };
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}
function lerpVec3(a, b, t) {
  return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
}
function lerpColor(a, b, t) {
  const ca = new THREE.Color(a);
  const cb = new THREE.Color(b);
  ca.lerp(cb, t);
  return "#" + ca.getHexString();
}

function sceneToState(kf) {
  return {
    camera: kf.camera,
    particles: kf.particles,
    light: kf.light,
    fog: kf.fog,
    background: kf.background,
  };
}

function blendScenes(list, rawProgress) {
  const progress = clamp(rawProgress, 0, 1);
  if (progress <= list[0].progress) return sceneToState(list[0]);
  const last = list[list.length - 1];
  if (progress >= last.progress) return sceneToState(last);

  let i = 0;
  while (i < list.length - 1 && list[i + 1].progress < progress) i++;
  const a = list[i];
  const b = list[i + 1];
  const span = b.progress - a.progress || 1;
  const t = clamp((progress - a.progress) / span);

  return {
    camera: {
      position: lerpVec3(a.camera.position, b.camera.position, t),
      lookAt: lerpVec3(a.camera.lookAt, b.camera.lookAt, t),
      fov: lerp(a.camera.fov, b.camera.fov, t),
    },
    particles: {
      spread: lerp(a.particles.spread, b.particles.spread, t),
      opacity: lerp(a.particles.opacity, b.particles.opacity, t),
    },
    light: {
      color: lerpColor(a.light.color, b.light.color, t),
      intensity: lerp(a.light.intensity, b.light.intensity, t),
      rimColor: lerpColor(a.light.rimColor, b.light.rimColor, t),
      rimIntensity: lerp(a.light.rimIntensity, b.light.rimIntensity, t),
    },
    fog: {
      color: lerpColor(a.fog.color, b.fog.color, t),
      far: lerp(a.fog.far, b.fog.far, t),
    },
    background: lerpColor(a.background, b.background, t),
  };
}

function textWeight(kf, progress, window_ = 0.14) {
  const d = Math.abs(progress - kf.progress);
  return clamp(1 - d / window_);
}

const useScrollStore = create((set) => ({
  progress: 0,
  smoothProgress: 0,
  setProgress: (p) => set({ progress: p }),
  setSmoothProgress: (p) => set({ smoothProgress: p }),
}));

function useScrollProgress(spacerRef) {
  useEffect(() => {
    const compute = () => {
      const el = spacerRef.current;
      if (!el) return;
      const total = el.offsetHeight - window.innerHeight;
      const raw = total > 0 ? window.scrollY / total : 0;
      const p = clamp(raw, 0, 1);
      useScrollStore.getState().setProgress(p);
      document.body.classList.toggle("app-root--scrolled", window.scrollY > 20);
    };
    compute();
    window.addEventListener("scroll", compute, { passive: true });
    window.addEventListener("resize", compute);
    return () => {
      window.removeEventListener("scroll", compute);
      window.removeEventListener("resize", compute);
    };
  }, [spacerRef]);
}

function useArrowKeyScroll(step = 140) {
  useEffect(() => {
    const onKeyDown = (e) => {
      if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
      const tag = document.activeElement?.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || document.activeElement?.isContentEditable) return;
      e.preventDefault();
      window.scrollBy({ top: e.key === "ArrowDown" ? step : -step, behavior: "smooth" });
    };
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, [step]);
}

function ScrollSmoother() {
  useFrame((_, delta) => {
    const { progress, smoothProgress, setSmoothProgress } = useScrollStore.getState();
    setSmoothProgress(damp(smoothProgress, progress, 4, delta));
  });
  return null;
}

function useMouseParallax() {
  const mouse = useRef({ x: 0, y: 0 });
  useEffect(() => {
    const onMove = (e) => {
      if (e.pointerType !== "mouse") return;
      mouse.current.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.current.y = (e.clientY / window.innerHeight) * 2 - 1;
    };
    window.addEventListener("pointermove", onMove, { passive: true });
    return () => window.removeEventListener("pointermove", onMove);
  }, []);
  return mouse;
}

function CameraRig({ mouse, parallaxStrength = 0.18 }) {
  const { camera } = useThree();
  const lookAtTarget = useRef(new THREE.Vector3());
  const currentLookAt = useRef(new THREE.Vector3());

  useFrame((_, delta) => {
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    const [px, py, pz] = state.camera.position;
    const [lx, ly, lz] = state.camera.lookAt;
    const mx = mouse.current?.x ?? 0;
    const my = mouse.current?.y ?? 0;

    camera.position.x = damp(camera.position.x, px + mx * parallaxStrength, 6, delta);
    camera.position.y = damp(camera.position.y, py - my * parallaxStrength * 0.6, 6, delta);
    camera.position.z = damp(camera.position.z, pz, 6, delta);

    lookAtTarget.current.set(lx + mx * 0.05, ly - my * 0.05, lz);
    currentLookAt.current.lerp(lookAtTarget.current, 1 - Math.exp(-6 * delta));
    camera.lookAt(currentLookAt.current);

    if ("fov" in camera) {
      camera.fov = damp(camera.fov, state.camera.fov, 5, delta);
      camera.updateProjectionMatrix();
    }
  });

  return null;
}

/* ============================================================
   three/AnimatedCharacter.jsx

   Arquitectura (sin cambios respecto a versiones previas):
   - outer: traslación en el mundo (posición).
   - pivot: rotación alrededor del centro de masa.
   - Cadena de huesos con retraso (spine → chest → shoulder → head,
     y pelvis → thigh → calf → foot) para que no todo rote como una
     sola pieza rígida.

   LO QUE CAMBIÓ: el objetivo de posición/rotación de outer/pivot ya
   NO sale de fórmulas fijas por fase — sale de MOVEMENT_KEYFRAMES
   vía sampleMovement(progress), editable desde la herramienta.
   ============================================================ */
const CHAR_CENTER_Y = 0.52;
const CHAR_SCALE = 1.7;

const _deltaEuler = new THREE.Euler();
const _deltaQuat = new THREE.Quaternion();
function applyLocalDelta(bone, restQuat, ex, ey, ez) {
  _deltaEuler.set(ex, ey, ez, "XYZ");
  _deltaQuat.setFromEuler(_deltaEuler);
  bone.quaternion.copy(restQuat).multiply(_deltaQuat);
}

function AnimatedCharacter({ mouse }) {
  const outerRef = useRef(null);
  const pivotRef = useRef(null);
  const { scene } = useGLTF(CHARACTER_MODEL_URL);
  const bonesRef = useRef({});
  const restRef = useRef({});
  const clockRef = useRef(0);

  const chainRef = useRef({
    pelvis: 0, spine: 0, chest: 0, shoulder: 0, head: 0,
    thigh: 0, calf: 0, foot: 0,
  });

  useEffect(() => {
    const names = {
      spine1: "Spine01", spine2: "Spine02", head: "Head", neck: "NeckTwist01",
      lClavicle: "L_Clavicle", rClavicle: "R_Clavicle",
      lForearm: "L_Forearm", rForearm: "R_Forearm",
      lHand: "L_Hand", rHand: "R_Hand",
      lThigh: "L_Thigh", rThigh: "R_Thigh",
      lCalf: "L_Calf", rCalf: "R_Calf",
      lFoot: "L_Foot", rFoot: "R_Foot",
    };
    const bones = {};
    const rest = {};
    Object.entries(names).forEach(([key, boneName]) => {
      const bone = scene.getObjectByName(boneName);
      if (bone) {
        bones[key] = bone;
        rest[key] = bone.quaternion.clone();
      }
    });
    bonesRef.current = bones;
    restRef.current = rest;
  }, [scene]);

  useFrame((_, delta) => {
    clockRef.current += delta;
    const t = clockRef.current;
    const progress = useScrollStore.getState().smoothProgress;
    const bones = bonesRef.current;
    const rest = restRef.current;
    const outer = outerRef.current;
    const pivot = pivotRef.current;
    if (!outer || !pivot) return;

    /*@GEN:MOVEMENT_START*/
    const m = sampleMovement(progress);
    const idleFloat = Math.sin(t * 0.8) * 0.022;
    outer.position.x = damp(outer.position.x, m.pos[0], 3, delta);
    outer.position.y = damp(outer.position.y, m.pos[1] + idleFloat, 5, delta);
    outer.position.z = damp(outer.position.z, m.pos[2], 2.0, delta);

    pivot.rotation.y = damp(pivot.rotation.y, (m.yaw * Math.PI) / 180, 4.5, delta);
    pivot.rotation.x = damp(pivot.rotation.x, (m.pitch * Math.PI) / 180, 4.5, delta);
    pivot.rotation.z = damp(pivot.rotation.z, Math.sin(t * 0.35) * 0.04, 4, delta);
    /*@GEN:MOVEMENT_END*/

    // Cadena hacia arriba: columna → pecho → hombros → cabeza.
    const chain = chainRef.current;
    chain.pelvis = pivot.rotation.y;
    chain.spine = damp(chain.spine, chain.pelvis, 7, delta);
    chain.chest = damp(chain.chest, chain.spine, 5.5, delta);
    chain.shoulder = damp(chain.shoulder, chain.chest, 4.2, delta);
    chain.head = damp(chain.head, chain.shoulder, 3.2, delta);

    // Cadena hacia abajo: pelvis → muslo → pantorrilla → pie.
    chain.thigh = damp(chain.thigh, chain.pelvis, 6, delta);
    chain.calf = damp(chain.calf, chain.thigh, 5, delta);
    chain.foot = damp(chain.foot, chain.calf, 4, delta);

    const idleAmp = 1;
    const floatArm = 0.26 * idleAmp;
    const floatLeg = 0.18 * idleAmp;
    const limbFloat = {
      lForearm: [0, 0, Math.sin(t * 0.9 + 0.0) * floatArm],
      rForearm: [0, 0, Math.sin(t * 0.85 + 1.4) * floatArm],
      lHand: [Math.sin(t * 1.1 + 0.6) * floatArm * 0.6, 0, 0],
      rHand: [Math.sin(t * 1.05 + 2.1) * floatArm * 0.6, 0, 0],
      lThigh: [Math.sin(t * 0.6 + 0.3) * floatLeg, 0, 0],
      rThigh: [Math.sin(t * 0.65 + 1.8) * floatLeg, 0, 0],
      lCalf: [Math.sin(t * 0.7 + 1.0) * floatLeg * 0.7, 0, 0],
      rCalf: [Math.sin(t * 0.75 + 2.4) * floatLeg * 0.7, 0, 0],
      lFoot: [0, 0, Math.sin(t * 0.8 + 0.2) * floatLeg * 0.5],
      rFoot: [0, 0, Math.sin(t * 0.78 + 1.6) * floatLeg * 0.5],
    };

    const _pose = sampleBonePose(progress);
    Object.entries(_pose).forEach(([key, [ex, ey, ez]]) => {
      const bone = bones[key];
      const r = rest[key];
      if (!bone || !r) return;
      const f = limbFloat[key];
      const fx = f ? ex + f[0] : ex;
      const fy = f ? ey + f[1] : ey;
      const fz = f ? ez + f[2] : ez;
      applyLocalDelta(bone, r, fx, fy, fz);
    });
  });

  return (
    <group ref={outerRef} position={[0, -0.95, -1.3]}>
      <group ref={pivotRef}>
        <primitive object={scene} position={[0, -CHAR_CENTER_Y, 0]} scale={CHAR_SCALE} />
      </group>
    </group>
  );
}
useGLTF.preload(CHARACTER_MODEL_URL);

function Particles({ device }) {
  const pointsRef = useRef(null);
  const materialRef = useRef(null);
  const count = Math.round(clientConfig.particles.count * device.particleMultiplier);

  const positions = useMemo(() => {
    const arr = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      arr[i * 3] = (Math.random() - 0.5) * 2;
      arr[i * 3 + 1] = (Math.random() - 0.5) * 2;
      arr[i * 3 + 2] = (Math.random() - 0.5) * 2;
    }
    return arr;
  }, [count]);

  useFrame((state, delta) => {
    const progress = useScrollStore.getState().smoothProgress;
    const blended = blendScenes(scenes, progress);
    if (pointsRef.current) {
      const targetScale = blended.particles.spread;
      pointsRef.current.scale.setScalar(damp(pointsRef.current.scale.x, targetScale, 3, delta));
      pointsRef.current.rotation.y += delta * 0.02;
    }
    if (materialRef.current) {
      materialRef.current.opacity = damp(materialRef.current.opacity, blended.particles.opacity, 4, delta);
    }
    void state;
  });

  return (
    <points ref={pointsRef}>
      <bufferGeometry>
        <bufferAttribute attach="attributes-position" args={[positions, 3]} />
      </bufferGeometry>
      <pointsMaterial
        ref={materialRef}
        color={clientConfig.particles.color}
        size={clientConfig.particles.size}
        transparent
        opacity={0.4}
        depthWrite={false}
        sizeAttenuation
      />
    </points>
  );
}

function Lighting() {
  const keyRef = useRef(null);
  const rimRef = useRef(null);

  useFrame((_, delta) => {
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    if (keyRef.current) {
      keyRef.current.color.set(state.light.color);
      keyRef.current.intensity = damp(keyRef.current.intensity, state.light.intensity, 4, delta);
    }
    if (rimRef.current) {
      rimRef.current.color.set(state.light.rimColor);
      rimRef.current.intensity = damp(rimRef.current.intensity, state.light.rimIntensity, 4, delta);
    }
  });

  return (
    <>
      <hemisphereLight color="#cfe8ff" groundColor="#1a1410" intensity={0.45} />
      <ambientLight intensity={0.32} />
      <directionalLight ref={keyRef} position={[3, 4, 5]} intensity={0.9} />
      <directionalLight position={[-3, 2, -2]} intensity={0.5} />
      <pointLight ref={rimRef} position={[-2.5, -1, -2]} intensity={1.4} distance={12} />
    </>
  );
}

function SceneEnvironment() {
  const { scene } = useThree();
  const fog = useRef(new THREE.FogExp2("#05070a", 0.12));
  const bgColor = useRef(new THREE.Color("#05070a"));

  useEffect(() => {
    scene.fog = fog.current;
    scene.background = bgColor.current;
  }, [scene]);

  useFrame(() => {
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    fog.current.color.set(state.fog.color);
    fog.current.density = 1 / Math.max(state.fog.far, 1);
    bgColor.current.set(state.background);
  });

  return null;
}

function HeroText() {
  const ref = useRef(null);
  const FADE_IN_END = 0.05;
  const ZOOM_START = ST_TURN_END;

  useEffect(() => {
    const update = (progress) => {
      if (!ref.current) return;
      const fadeIn = smoothstep(0, FADE_IN_END, progress);
      const zoomOut = smoothstep(ZOOM_START, 1, progress);
      const scale = 1 + zoomOut * 14;
      const opacity = fadeIn * (1 - zoomOut);
      ref.current.style.opacity = String(opacity);
      ref.current.style.transform = `translate(-50%, -50%) scale(${scale})`;
    };
    update(useScrollStore.getState().smoothProgress);
    return useScrollStore.subscribe((s) => update(s.smoothProgress));
  }, []);

  return (
    <div ref={ref} className="hero-text" style={{ opacity: 0 }}>
      Scroll Experience
    </div>
  );
}

function SceneText() {

function CursorTrail() {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let width = window.innerWidth;
    let height = window.innerHeight;
    let points = [];
    let rafId = 0;

    const resize = () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();

    const addPoint = (x, y) => {
      points.push({ x, y, life: 1 });
      if (points.length > 40) points.shift();
    };
    const onPointerMove = (e) => addPoint(e.clientX, e.clientY);
    const onTouchMove = (e) => {
      if (e.touches && e.touches[0]) addPoint(e.touches[0].clientX, e.touches[0].clientY);
    };

    window.addEventListener("resize", resize);
    window.addEventListener("pointermove", onPointerMove, { passive: true });
    window.addEventListener("touchmove", onTouchMove, { passive: true });

    const draw = () => {
      ctx.clearRect(0, 0, width, height);
      points.forEach((p) => { p.life *= 0.94; });
      points = points.filter((p) => p.life > 0.02);

      if (points.length > 1) {
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.globalCompositeOperation = "lighter";
        for (let i = 1; i < points.length; i++) {
          const p0 = points[i - 1];
          const p1 = points[i];
          const alpha = Math.min(p0.life, p1.life) * 0.55;
          ctx.strokeStyle = clientConfig.colors.accent;
          ctx.globalAlpha = alpha;
          ctx.lineWidth = 1.5 + alpha * 4;
          ctx.beginPath();
          ctx.moveTo(p0.x, p0.y);
          ctx.lineTo(p1.x, p1.y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
      }
      rafId = requestAnimationFrame(draw);
    };
    rafId = requestAnimationFrame(draw);

    return () => {
      cancelAnimationFrame(rafId);
      window.removeEventListener("resize", resize);
      window.removeEventListener("pointermove", onPointerMove);
      window.removeEventListener("touchmove", onTouchMove);
    };
  }, []);

  return <canvas ref={canvasRef} className="cursor-trail-canvas" aria-hidden="true" />;
}

        <ProgressIndicator />
        <div className="scroll-hint" aria-hidden="true">
          <span>Scroll</span>
          <div className="scroll-hint__line" />
        </div>
      </div>
      <div ref={spacerRef} className="scroll-spacer" style={{ height: `${SCROLL_LENGTH_VH}vh` }} />
    </div>
  );
}

createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>

{

<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

<script type="text/babel" data-type="module" data-presets="react">
import React, { useEffect, useMemo, useRef, useState } from "react";
import { createRoot } from "react-dom/client";
import * as THREE from "three";
import { Canvas, useFrame, useThree } from "@react-three/fiber";
import { useGLTF, OrbitControls, Environment, Grid } from "@react-three/drei";

const MODEL_URL = "./assets/models/weeb.glb";

const BONE_DEFS = [
  ["spine1", "Spine01"], ["spine2", "Spine02"], ["neck", "NeckTwist01"], ["head", "Head"],
  ["lClavicle", "L_Clavicle"], ["rClavicle", "R_Clavicle"],
  ["lForearm", "L_Forearm"], ["rForearm", "R_Forearm"],
  ["lHand", "L_Hand"], ["rHand", "R_Hand"],
  ["lThigh", "L_Thigh"], ["rThigh", "R_Thigh"],
  ["lCalf", "L_Calf"], ["rCalf", "R_Calf"],
  ["lFoot", "L_Foot"], ["rFoot", "R_Foot"],
];
const BONE_KEYS = BONE_DEFS.map(([k]) => k);

const rad = (d) => (d * Math.PI) / 180;
const deg = (r) => (r * 180) / Math.PI;
const clamp = (v, min = 0, max = 1) => Math.min(max, Math.max(min, v));
const lerp = (a, b, t) => a + (b - a) * t;
function smoothstep(edge0, edge1, x) {
  const t = clamp((x - edge0) / (edge1 - edge0));
  return t * t * (3 - 2 * t);
}

/* ============================================================
   UNA sola lista de "etapas" (stages) compartida por Pose, Cámara
   y Movimiento. Antes cada sección tenía su propia lista de
   keyframes con progress distintos (la pose iba a 0/0.25/0.5/0.7/1
   mientras que cámara y movimiento iban a 0/0.18/0.47/0.6/0.8/1),
   lo que hacía que la pose y la cámara/movimiento quedaran
   desincronizadas durante el scroll. Ahora las tres comparten
   exactamente las mismas 6 etapas.
   ============================================================ */
const STAGE_DEFS = [
  { id: "front-idle", label: "Frente", progress: 0 },
  { id: "approach", label: "Acercamiento", progress: 0.18 },
  { id: "turn", label: "Giro", progress: 0.47 },
  { id: "pause", label: "Pausa", progress: 0.6 },
  { id: "fall-pose", label: "Postura caída", progress: 0.8 },
  { id: "fall", label: "Caída", progress: 1 },
];

const zeroPose = () => Object.fromEntries(BONE_KEYS.map((k) => [k, { x: 0, y: 0, z: 0 }]));

/* Todo arranca en cero / neutro: ninguna etapa tiene pose, cámara
   ni movimiento predefinidos. Vos lo armás a gusto desde acá. */
function initialPoses() {
  return Object.fromEntries(STAGE_DEFS.map((kf) => [kf.id, zeroPose()]));
}
function initialCameras() {
  return Object.fromEntries(
    STAGE_DEFS.map((kf) => [kf.id, { position: [0, 0, 3.5], lookAt: [0, 0.5, 0], fov: 30 }])
  );
}
function initialMovements() {
  return Object.fromEntries(STAGE_DEFS.map((kf) => [kf.id, { pos: [0, 0, 0], yaw: 0, pitch: 0 }]));
}
// Valores fijos (partículas / luz / niebla / fondo) que todavía no tienen
// control propio en la UI: quedan neutros y parejos en todas las etapas
// para que no cambien nada por sorpresa al descargar.
const FIXED_SCENE_DEFAULTS = Object.fromEntries(
  STAGE_DEFS.map((kf) => [
    kf.id,
    {
      particles: { spread: 1, opacity: 0.3 },
      light: { color: "#ffffff", intensity: 0.8, rimColor: "#ffffff", rimIntensity: 1 },
      fog: { color: "#0f0f1a", far: 18 },
      background: "#0f0f1a",
    },
  ])
);

function samplePose(posesByKf, progress) {
  const p = clamp(progress, 0, 1);
  if (p <= STAGE_DEFS[0].progress) return posesByKf[STAGE_DEFS[0].id];
  const last = STAGE_DEFS[STAGE_DEFS.length - 1];
  if (p >= last.progress) return posesByKf[last.id];
  let i = 0;
  while (i < STAGE_DEFS.length - 1 && STAGE_DEFS[i + 1].progress < p) i++;
  const a = STAGE_DEFS[i], b = STAGE_DEFS[i + 1];
  const span = b.progress - a.progress || 1;
  const t = clamp((p - a.progress) / span);
  const pa = posesByKf[a.id], pb = posesByKf[b.id];
  const out = {};
  BONE_KEYS.forEach((k) => { out[k] = { x: lerp(pa[k].x, pb[k].x, t), y: lerp(pa[k].y, pb[k].y, t), z: lerp(pa[k].z, pb[k].z, t) }; });
  return out;
}

function lerpVec3(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }

function sampleCamera(camsByKf, progress) {
  const p = clamp(progress, 0, 1);
  if (p <= STAGE_DEFS[0].progress) return camsByKf[STAGE_DEFS[0].id];
  const last = STAGE_DEFS[STAGE_DEFS.length - 1];
  if (p >= last.progress) return camsByKf[last.id];
  let i = 0;
  while (i < STAGE_DEFS.length - 1 && STAGE_DEFS[i + 1].progress < p) i++;
  const a = STAGE_DEFS[i], b = STAGE_DEFS[i + 1];
  const span = b.progress - a.progress || 1;
  const t = clamp((p - a.progress) / span);
  const ca = camsByKf[a.id], cb = camsByKf[b.id];
  return { position: lerpVec3(ca.position, cb.position, t), lookAt: lerpVec3(ca.lookAt, cb.lookAt, t), fov: lerp(ca.fov, cb.fov, t) };
}

function sampleMovement(movesByKf, progress) {
  const p = clamp(progress, 0, 1);
  if (p <= STAGE_DEFS[0].progress) return movesByKf[STAGE_DEFS[0].id];
  const last = STAGE_DEFS[STAGE_DEFS.length - 1];
  if (p >= last.progress) return movesByKf[last.id];
  let i = 0;
  while (i < STAGE_DEFS.length - 1 && STAGE_DEFS[i + 1].progress < p) i++;
  const a = STAGE_DEFS[i], b = STAGE_DEFS[i + 1];
  const span = b.progress - a.progress || 1;
  const t = smoothstep(0, 1, clamp((p - a.progress) / span));
  const ma = movesByKf[a.id], mb = movesByKf[b.id];
  return { pos: lerpVec3(ma.pos, mb.pos, t), yaw: lerp(ma.yaw, mb.yaw, t), pitch: lerp(ma.pitch, mb.pitch, t) };
}

/* ---- Personaje ----
   IMPORTANTE: este componente ya no se desmonta/remonta al cambiar
   de pestaña (antes a veces quedaba envuelto en <MovedGroup> y a
   veces no, lo que forzaba un remount de <primitive>). Un remount
   hacía que el useEffect volviera a "capturar" como pose de
   referencia (rest) la pose YA deformada del frame anterior, en vez
   del bind pose real del modelo — de ahí la deformación acumulada
   al ir y volver entre pestañas. Ahora el personaje se monta una
   sola vez y sólo cambian sus props. Este bug era exclusivo de esta
   herramienta de edición: en el archivo final exportado (arriba en
   tpl-source) el personaje siempre estuvo montado una sola vez, así
   que la deformación NO se exporta al index.html. */
function Character({ pose, onBonesFound }) {
  const { scene } = useGLTF(MODEL_URL);
  const bonesRef = useRef({});
  const restRef = useRef({});
  const foundOnce = useRef(false);

  useEffect(() => {
    const bones = {}; const rest = {}; const found = {};
    BONE_DEFS.forEach(([key, boneName]) => {
      const bone = scene.getObjectByName(boneName);
      if (bone) { bones[key] = bone; rest[key] = bone.quaternion.clone(); found[key] = true; }
      else found[key] = false;
    });
    bonesRef.current = bones; restRef.current = rest;
    if (!foundOnce.current) { foundOnce.current = true; onBonesFound(found); }
  }, [scene]);

  useFrame(() => {
    const bones = bonesRef.current, rest = restRef.current;
    BONE_KEYS.forEach((key) => {
      const bone = bones[key], r = rest[key];
      if (!bone || !r) return;
      const xyz = pose[key];
      const dq = new THREE.Quaternion().setFromEuler(new THREE.Euler(rad(xyz.x), rad(xyz.y), rad(xyz.z), "XYZ"));
      bone.quaternion.copy(r).multiply(dq);
    });
  });

  return <primitive object={scene} position={[0, -0.9, 0]} scale={1.7} />;
}
useGLTF.preload(MODEL_URL);

function SceneCameraDriver({ target, active }) {
  const { camera } = useThree();
  useFrame(() => {
    if (!active || !target) return;
    camera.position.set(target.position[0], target.position[1], target.position[2]);
    camera.lookAt(target.lookAt[0], target.lookAt[1], target.lookAt[2]);
    if ("fov" in camera) { camera.fov = target.fov; camera.updateProjectionMatrix(); }
  });
  return null;
}

function MovedGroup({ movement, children }) {
  const ref = useRef(null);
  useFrame(() => {
    if (!ref.current || !movement) return;
    ref.current.position.set(movement.pos[0], movement.pos[1], movement.pos[2]);
    ref.current.rotation.set(rad(movement.pitch), rad(movement.yaw), 0);
  });
  return <group ref={ref}>{children}</group>;
}

/* La estructura de la escena ahora es SIEMPRE la misma (luces, grilla,
   MovedGroup > Character, cámara, controles). Nunca cambia de forma
   entre pestañas, así React nunca desmonta el personaje. */
function Scene({ pose, onBonesFound, cameraTarget, sceneCameraActive, autoRotate, movement }) {
  return (
    <>
      <ambientLight intensity={0.4} />
      <directionalLight position={[3, 4, 5]} intensity={1} />
      <directionalLight position={[-3, 2, -2]} intensity={0.4} />
      <Environment preset="city" background={false} />
      <Grid args={[10, 10]} position={[0, -0.02, 0]} cellColor="#333" sectionColor="#555" />
      <MovedGroup movement={movement}>
        <Character pose={pose} onBonesFound={onBonesFound} />
      </MovedGroup>
      <SceneCameraDriver target={cameraTarget} active={sceneCameraActive} />
      <OrbitControls target={[0, 0.5, 0]} enabled={!sceneCameraActive} autoRotate={autoRotate && !sceneCameraActive} autoRotateSpeed={2.2} />
    </>
  );
}

/* ---- Generadores de código (mismo formato que espera el template) ---- */
function generateBoneArrayCode(posesByKf) {
  const fmt = (n) => { const r = rad(n); return (Math.abs(r) < 0.0001 ? 0 : r).toFixed(4); };
  const kfLines = STAGE_DEFS.map((kf) => {
    const pose = posesByKf[kf.id];
    const boneLines = BONE_KEYS.map((k) => {
      const v = pose[k];
      if (v.x === 0 && v.y === 0 && v.z === 0) return null;
      return `        ${k}: [${fmt(v.x)}, ${fmt(v.y)}, ${fmt(v.z)}],`;
    }).filter(Boolean).join("\n");
    return `  {\n    id: "${kf.id}",\n    progress: ${kf.progress},\n    bones: {\n${boneLines || "      // (sin cambios respecto al rest pose)"}\n    },\n  },`;
  }).join("\n");
  return `const BONE_POSE_KEYFRAMES = [\n${kfLines}\n];`;
}

function generateScenesArrayCode(camsByKf) {
  const fmtNum = (n) => (Math.abs(n) < 0.0001 ? 0 : Math.round(n * 1000) / 1000);
  const fmtVec = (v) => `[${v.map(fmtNum).join(", ")}]`;
  const kfLines = STAGE_DEFS.map((kf) => {
    const cam = camsByKf[kf.id];
    const f = FIXED_SCENE_DEFAULTS[kf.id];
    return `  {
    id: "${kf.id}",
    progress: ${kf.progress},
    camera: { position: ${fmtVec(cam.position)}, lookAt: ${fmtVec(cam.lookAt)}, fov: ${fmtNum(cam.fov)} },
    particles: { spread: ${f.particles.spread}, opacity: ${f.particles.opacity} },
    light: { color: "${f.light.color}", intensity: ${f.light.intensity}, rimColor: "${f.light.rimColor}", rimIntensity: ${f.light.rimIntensity} },
    fog: { color: "${f.fog.color}", far: ${f.fog.far} },
    background: "${f.background}",
  },`;
  }).join("\n");
  return `const scenes = [\n${kfLines}\n];`;
}

function generateMovementDefsCode(movesByKf) {
  const fmtNum = (n) => (Math.abs(n) < 0.0001 ? 0 : Math.round(n * 1000) / 1000);
  const kfLines = STAGE_DEFS.map((kf) => {
    const mv = movesByKf[kf.id];
    return `  { id: "${kf.id}", progress: ${kf.progress}, pos: [${mv.pos.map(fmtNum).join(", ")}], yaw: ${fmtNum(mv.yaw)}, pitch: ${fmtNum(mv.pitch)} },`;
  }).join("\n");
  return `const MOVEMENT_KEYFRAMES = [
${kfLines}
];

function sampleMovement(progress) {
  const list = MOVEMENT_KEYFRAMES;
  const p = clamp(progress, 0, 1);
  if (p <= list[0].progress) return list[0];
  const last = list[list.length - 1];
  if (p >= last.progress) return last;
  let i = 0;
  while (i < list.length - 1 && list[i + 1].progress < p) i++;
  const a = list[i], b = list[i + 1];
  const span = b.progress - a.progress || 1;
  const t = smoothstep(0, 1, clamp((p - a.progress) / span));
  return {
    pos: [lerp(a.pos[0], b.pos[0], t), lerp(a.pos[1], b.pos[1], t), lerp(a.pos[2], b.pos[2], t)],
    yaw: lerp(a.yaw, b.yaw, t),
    pitch: lerp(a.pitch, b.pitch, t),
  };
}`;
}

function buildFullHtml(boneCode, scenesCode, movementCode) {
  const tplEl = document.getElementById("tpl-source");
  let tpl = tplEl.value;
  const swap = (src, startMark, endMark, code) => {
    const start = src.indexOf(startMark);
    const end = src.indexOf(endMark);
    if (start === -1 || end === -1) return src;
    const before = src.slice(0, start + startMark.length);
    const after = src.slice(end);
    return `${before}\n${code}\n${after}`;
  };
  tpl = swap(tpl, "/*@GEN:SCENES_START*/", "/*@GEN:SCENES_END*/", scenesCode);
  tpl = swap(tpl, "/*@GEN:MOVEMENT_DEFS_START*/", "/*@GEN:MOVEMENT_DEFS_END*/", movementCode);
  tpl = swap(tpl, "/*@GEN:BONES_START*/", "/*@GEN:BONES_END*/", boneCode);
  return tpl;
}

/* ---- App ---- */
function App() {
  const [section, setSection] = useState("pose"); // pose | camera | movement | preview
  const [posesByKf, setPosesByKf] = useState(initialPoses);
  const [camsByKf, setCamsByKf] = useState(initialCameras);
  const [movesByKf, setMovesByKf] = useState(initialMovements);

  // Una sola etapa activa, compartida por Pose / Cámara / Movimiento.
  // Así, sea cual sea la pestaña que tengas abierta, el visor de la
  // izquierda siempre muestra la MISMA etapa con su pose + su cámara +
  // su movimiento combinados de verdad — no hace falta ir a "Preview"
  // para saber qué genera cada cosa.
  const [activeStage, setActiveStage] = useState(STAGE_DEFS[0].id);

  const [scrub, setScrub] = useState(0);
  const [freeOrbit, setFreeOrbit] = useState(false);
  const [autoRotate, setAutoRotate] = useState(false);
  const [foundMap, setFoundMap] = useState({});
  const [copiedWhich, setCopiedWhich] = useState(null);
  const [downloaded, setDownloaded] = useState(false);

  const stageIndex = STAGE_DEFS.findIndex((s) => s.id === activeStage);

  const setBoneAxis = (boneKey, axis, value) => {
    setPosesByKf((prev) => ({ ...prev, [activeStage]: { ...prev[activeStage], [boneKey]: { ...prev[activeStage][boneKey], [axis]: value } } }));
  };
  const resetBone = (boneKey) => {
    setPosesByKf((prev) => ({ ...prev, [activeStage]: { ...prev[activeStage], [boneKey]: { x: 0, y: 0, z: 0 } } }));
  };
  const copyPoseFromPrev = () => {
    if (stageIndex <= 0) return;
    const prevId = STAGE_DEFS[stageIndex - 1].id;
    setPosesByKf((prev) => ({ ...prev, [activeStage]: JSON.parse(JSON.stringify(prev[prevId])) }));
  };

  const setCamField = (field, axis, value) => {
    setCamsByKf((prev) => {
      const cam = { ...prev[activeStage] };
      if (field === "fov") cam.fov = value;
      else { cam[field] = [...cam[field]]; cam[field]["xyz".indexOf(axis)] = value; }
      return { ...prev, [activeStage]: cam };
    });
  };
  const copyCamFromPrev = () => {
    if (stageIndex <= 0) return;
    const prevId = STAGE_DEFS[stageIndex - 1].id;
    setCamsByKf((prev) => ({ ...prev, [activeStage]: JSON.parse(JSON.stringify(prev[prevId])) }));
  };

  const setMoveField = (field, axis, value) => {
    setMovesByKf((prev) => {
      const mv = { ...prev[activeStage] };
      if (field === "yaw" || field === "pitch") mv[field] = value;
      else { mv.pos = [...mv.pos]; mv.pos["xyz".indexOf(axis)] = value; }
      return { ...prev, [activeStage]: mv };
    });
  };
  const copyMoveFromPrev = () => {
    if (stageIndex <= 0) return;
    const prevId = STAGE_DEFS[stageIndex - 1].id;
    setMovesByKf((prev) => ({ ...prev, [activeStage]: JSON.parse(JSON.stringify(prev[prevId])) }));
  };
  const applyYawPreset = (deg_) => setMoveField("yaw", null, deg_);
  const applyPitchPreset = (deg_) => setMoveField("pitch", null, deg_);

  const isPreview = section === "preview";
  // Fuera de "Preview": se muestra la etapa activa EXACTA (pose + cámara +
  // movimiento), sin interpolar, para que edites viendo el resultado real.
  // En "Preview": se interpola con el scrub, como una pasada de scroll real.
  const currentPose = isPreview ? samplePose(posesByKf, scrub) : posesByKf[activeStage];
  const currentCamTarget = isPreview ? sampleCamera(camsByKf, scrub) : camsByKf[activeStage];
  const currentMovement = isPreview ? sampleMovement(movesByKf, scrub) : movesByKf[activeStage];
  // La cámara de la escena manda siempre que no actives "cámara libre",
  // sea cual sea la pestaña — así ves de entrada qué genera cada ajuste.
  const sceneCameraActive = !freeOrbit;

  const boneCode = useMemo(() => generateBoneArrayCode(posesByKf), [posesByKf]);
  const scenesCode = useMemo(() => generateScenesArrayCode(camsByKf), [camsByKf]);
  const movementCode = useMemo(() => generateMovementDefsCode(movesByKf), [movesByKf]);

  const copy = async (text, which) => {
    try { await navigator.clipboard.writeText(text); setCopiedWhich(which); setTimeout(() => setCopiedWhich(null), 1500); }
    catch (e) { /* fallback: seleccionar manualmente */ }
  };

  const downloadFullHtml = () => {
    const html = buildFullHtml(boneCode, scenesCode, movementCode);
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "index.html";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setDownloaded(true);
    setTimeout(() => setDownloaded(false), 2000);
  };

  const showStageTabs = section === "pose" || section === "camera" || section === "movement";

  return (
    <>
      <div className="viewport">
        <div className="top-controls">
          <span>{!freeOrbit ? "Vista: cámara de la escena (real)" : "Arrastrá para orbitar · Scroll para zoom"}</span>
          <label className="toggle-row"><input type="checkbox" checked={freeOrbit} onChange={(e) => setFreeOrbit(e.target.checked)} />Cámara libre (inspeccionar)</label>
          {freeOrbit && (
            <label className="toggle-row"><input type="checkbox" checked={autoRotate} onChange={(e) => setAutoRotate(e.target.checked)} />Auto-rotar vista</label>
          )}
        </div>
        <Canvas camera={{ position: [0, 0.3, 3.5], fov: 35 }}>
          <Scene pose={currentPose} onBonesFound={setFoundMap} cameraTarget={currentCamTarget} sceneCameraActive={sceneCameraActive} autoRotate={autoRotate} movement={currentMovement} />
        </Canvas>
      </div>

      <div className="panel">
        <div>
          <h1>Pose, Cámara &amp; Movimiento</h1>
          <p className="hint">Todas las etapas arrancan en cero: sin pose, cámara fija por defecto y sin desplazamiento. Armalo a tu gusto. El visor de la izquierda siempre muestra la etapa que estés editando con su pose + cámara + movimiento juntos, sin necesidad de ir a "Preview". Al final descargás el index.html completo, editado.</p>
        </div>

        <div className="section-tabs">
          <div className={`section-tab ${section === "pose" ? "active" : ""}`} onClick={() => setSection("pose")}>Pose</div>
          <div className={`section-tab ${section === "camera" ? "active" : ""}`} onClick={() => setSection("camera")}>Cámara</div>
          <div className={`section-tab ${section === "movement" ? "active" : ""}`} onClick={() => setSection("movement")}>Movimiento</div>
          <div className={`section-tab ${section === "preview" ? "active" : ""}`} onClick={() => setSection("preview")}>Preview</div>
        </div>

        {showStageTabs && (
          <>
            <div className="section-title">Etapa (compartida por Pose / Cámara / Movimiento)</div>
            <div className="kf-tabs">
              {STAGE_DEFS.map((kf) => (
                <div key={kf.id} className={`kf-tab ${activeStage === kf.id ? "active" : ""}`} onClick={() => setActiveStage(kf.id)}>{kf.label}<span className="p">progress {kf.progress}</span></div>
              ))}
            </div>
          </>
        )}

        {isPreview && (
          <div className="scrub-row">
            <label style={{ fontSize: 11 }}>progress</label>
            <input type="range" min={0} max={1} step={0.001} value={scrub} onChange={(e) => setScrub(Number(e.target.value))} />
            <span className="val">{scrub.toFixed(2)}</span>
          </div>
        )}

        {section === "pose" && (
          <>
            <div className="btn-row"><button className="btn" onClick={copyPoseFromPrev}>Copiar etapa anterior</button></div>
            <div className="section-title">Huesos ({BONE_KEYS.length})</div>
            {BONE_DEFS.map(([key, boneName]) => {
              const found = foundMap[key];
              const v = posesByKf[activeStage][key];
              return (
                <div className="bone-block" key={key} style={{ opacity: found === false ? 0.4 : 1 }}>
                  <div className="bone-name">{boneName} {found === false ? "· FALTA" : ""}</div>
                  {["x", "y", "z"].map((axis) => (
                    <div className="axis-row" key={axis}>
                      <label>{axis.toUpperCase()}</label>
                      <input type="range" min={-180} max={180} value={v[axis]} onChange={(e) => setBoneAxis(key, axis, Number(e.target.value))} />
                      <span className="val">{Math.round(v[axis])}°</span>
                    </div>
                  ))}
                  <button className="btn" style={{ fontSize: 10, padding: "2px 6px" }} onClick={() => resetBone(key)}>reset</button>
                </div>
              );
            })}
          </>
        )}

        {section === "camera" && (
          <>
            <div className="btn-row"><button className="btn" onClick={copyCamFromPrev}>Copiar etapa anterior</button></div>
            <div className="cam-group">
              <div className="cam-group-title">Posición (x, y, z)</div>
              {["x", "y", "z"].map((axis, i) => (
                <div className="axis-row" key={axis}>
                  <label>{axis.toUpperCase()}</label>
                  <input type="range" min={-6} max={6} step={0.05} value={camsByKf[activeStage].position[i]} onChange={(e) => setCamField("position", axis, Number(e.target.value))} />
                  <span className="val">{camsByKf[activeStage].position[i].toFixed(2)}</span>
                </div>
              ))}
              <p className="hint">Z más grande = más lejos. Z más chico = más cerca.</p>
            </div>
            <div className="cam-group">
              <div className="cam-group-title">Mira hacia (lookAt x, y, z)</div>
              {["x", "y", "z"].map((axis, i) => (
                <div className="axis-row" key={axis}>
                  <label>{axis.toUpperCase()}</label>
                  <input type="range" min={-3} max={3} step={0.05} value={camsByKf[activeStage].lookAt[i]} onChange={(e) => setCamField("lookAt", axis, Number(e.target.value))} />
                  <span className="val">{camsByKf[activeStage].lookAt[i].toFixed(2)}</span>
                </div>
              ))}
            </div>
            <div className="cam-group">
              <div className="cam-group-title">Zoom (FOV)</div>
              <div className="axis-row">
                <label>°</label>
                <input type="range" min={15} max={50} step={0.5} value={camsByKf[activeStage].fov} onChange={(e) => setCamField("fov", null, Number(e.target.value))} />
                <span className="val">{camsByKf[activeStage].fov.toFixed(1)}</span>
              </div>
            </div>
          </>
        )}

        {section === "movement" && (
          <>
            <div className="btn-row"><button className="btn" onClick={copyMoveFromPrev}>Copiar etapa anterior</button></div>

            <div className="cam-group">
              <div className="cam-group-title">Posición (x, y, z)</div>
              {["x", "y", "z"].map((axis, i) => (
                <div className="axis-row" key={axis}>
                  <label>{axis.toUpperCase()}</label>
                  <input type="range" min={axis === "z" ? -20 : -3} max={axis === "z" ? 4 : 3} step={0.05} value={movesByKf[activeStage].pos[i]} onChange={(e) => setMoveField("pos", axis, Number(e.target.value))} />
                  <span className="val">{movesByKf[activeStage].pos[i].toFixed(2)}</span>
                </div>
              ))}
              <p className="hint">X: izquierda/derecha (diagonal si lo combinás con Z). Y: altura en cuadro. Z: profundidad — más negativo, más al fondo/lejos.</p>
            </div>

            <div className="cam-group">
              <div className="cam-group-title">Giro (yaw)</div>
              <div className="axis-row">
                <label>°</label>
                <input type="range" min={-180} max={180} step={1} value={movesByKf[activeStage].yaw} onChange={(e) => setMoveField("yaw", null, Number(e.target.value))} />
                <span className="val">{Math.round(movesByKf[activeStage].yaw)}°</span>
              </div>
              <div className="btn-row">
                <button className="btn" onClick={() => applyYawPreset(0)}>Frente</button>
                <button className="btn" onClick={() => applyYawPreset(-90)}>Derecha 90°</button>
                <button className="btn" onClick={() => applyYawPreset(90)}>Izquierda 90°</button>
                <button className="btn" onClick={() => applyYawPreset(180)}>Espalda 180°</button>
              </div>
            </div>

            <div className="cam-group">
              <div className="cam-group-title">Inclinación (pitch)</div>
              <div className="axis-row">
                <label>°</label>
                <input type="range" min={-90} max={90} step={1} value={movesByKf[activeStage].pitch} onChange={(e) => setMoveField("pitch", null, Number(e.target.value))} />
                <span className="val">{Math.round(movesByKf[activeStage].pitch)}°</span>
              </div>
              <div className="btn-row">
                <button className="btn" onClick={() => applyPitchPreset(0)}>Neutral</button>
                <button className="btn" onClick={() => applyPitchPreset(60)}>Adelante</button>
                <button className="btn" onClick={() => applyPitchPreset(-60)}>Atrás</button>
              </div>
            </div>
          </>
        )}

        <div className="section-title">Descarga</div>
        <p className="hint">Genera tu index.html completo con todo lo ajustado en Pose, Cámara y Movimiento — listo para subir a GitHub Pages.</p>
        <div className="btn-row">
          <button className="btn primary" onClick={downloadFullHtml}>⬇ Descargar index.html completo</button>
          {downloaded && <span className="copied">¡Descargado!</span>}
        </div>

        <div className="section-title">Código individual (opcional)</div>
        <p className="hint">Por si preferís pegar a mano en tu propio archivo en vez de descargar el completo.</p>

        <details>
          <summary style={{ cursor: "pointer", fontSize: 11.5, color: "rgba(245,246,242,0.7)" }}>Ver bloques de código</summary>
          <div style={{ marginTop: 8 }}>
            <div className="section-title">Huesos</div>
            <textarea className="code" readOnly value={boneCode} onFocus={(e) => e.target.select()} />
            <div className="btn-row"><button className="btn" onClick={() => copy(boneCode, "bones")}>Copiar</button>{copiedWhich === "bones" && <span className="copied">¡Copiado!</span>}</div>

            <div className="section-title">Cámara (scenes)</div>
            <textarea className="code" readOnly value={scenesCode} onFocus={(e) => e.target.select()} />
            <div className="btn-row"><button className="btn" onClick={() => copy(scenesCode, "camera")}>Copiar</button>{copiedWhich === "camera" && <span className="copied">¡Copiado!</span>}</div>

            <div className="section-title">Movimiento</div>
            <textarea className="code" readOnly value={movementCode} onFocus={(e) => e.target.select()} />
            <div className="btn-row"><button className="btn" onClick={() => copy(movementCode, "movement")}>Copiar</button>{copiedWhich === "movement" && <span className="copied">¡Copiado!</span>}</div>
          </div>
        </details>
      </div>
    </>
  );
}

createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
