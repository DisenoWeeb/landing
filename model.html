<title>Scroll Experience</title>

<!-- ==========================================================
     Tipografías. Cambiá estas familias si tu client.config
     usa otras (deben coincidir con fonts.display / fonts.body).
     ========================================================== -->

<style>
  :root {
    --brand-accent: #d9a441;
    --brand-accent-2: #6ee7c9;
    --color-bg: #05070a;
    --color-text: #f4f1ea;
    --color-text-muted: rgba(244, 241, 234, 0.6);
    --font-display: "Fraunces", serif;
    --font-body: "Inter", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    overflow-x: hidden;
  }

  #root { width: 100%; }

  .app-root {
    position: relative;
    width: 100%;
  }

  /* -------- Escenario 3D fijo -------- */
  .canvas-stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .canvas-stage--ready { opacity: 1; }
  .canvas-stage canvas { display: block; width: 100% !important; height: 100% !important; }

  /* -------- Texto de entrada (Scroll Experience) -------- */
  .hero-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transform-origin: center center;
    z-index: 5;
    pointer-events: none;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(1.8rem, 4.5vw, 3.2rem);
    letter-spacing: 0.02em;
    color: var(--color-text);
    white-space: nowrap;
    will-change: opacity, transform;
  }

  /* -------- Textos por escena -------- */
  .scene-text-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }
  .scene-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 8vw;
    max-width: 720px;
    will-change: opacity, transform;
  }
  .scene-text--left    { align-items: flex-start; text-align: left; }
  .scene-text--center  { align-items: center; text-align: center; left: 50%; transform: translateX(-50%); max-width: 640px; }
  .scene-text--right   { align-items: flex-end; text-align: right; margin-left: auto; }

  .scene-text__eyebrow {
    font-family: var(--font-body);
    font-size: 0.75rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--brand-accent);
    margin-bottom: 0.75rem;
    display: inline-block;
  }
  .scene-text__title {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(2rem, 5vw, 4rem);
    line-height: 1.05;
    margin: 0 0 0.75rem 0;
    color: var(--color-text);
  }
  .scene-text__subtitle {
    font-family: var(--font-body);
    font-weight: 300;
    font-size: clamp(0.95rem, 1.4vw, 1.15rem);
    line-height: 1.5;
    color: var(--color-text-muted);
    margin: 0;
    max-width: 46ch;
  }

  /* -------- CTA -------- */
  .cta-layer {
    position: absolute;
    bottom: 8vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    will-change: opacity, transform;
  }
  .cta-button {
    display: inline-block;
    padding: 0.9rem 2.2rem;
    border-radius: 999px;
    background: var(--brand-accent);
    color: #0a0a0a;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 0.9rem;
    letter-spacing: 0.04em;
    text-decoration: none;
    box-shadow: 0 8px 30px rgba(200, 255, 0, 0.35);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .cta-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 36px rgba(200, 255, 0, 0.5);
  }

  /* -------- Barra de progreso -------- */
  .progress-rail {
    position: fixed;
    top: 50%;
    right: 3vw;
    transform: translateY(-50%);
    height: 28vh;
    z-index: 6;
  }
  .progress-rail__track {
    position: relative;
    width: 2px;
    height: 100%;
    background: rgba(244, 241, 234, 0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-rail__fill {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 0%;
    background: var(--brand-accent);
    border-radius: 2px;
    transition: height 0.05s linear;
  }

  /* -------- Marca -------- */
  .brand-mark {
    position: fixed;
    top: 3vh;
    left: 3vw;
    z-index: 6;
    font-family: var(--font-display);
    font-size: 1rem;
    letter-spacing: 0.08em;
    color: var(--color-text);
  }

  /* -------- Hint de scroll -------- */
  .scroll-hint {
    position: fixed;
    bottom: 4vh;
    left: 3vw;
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--color-text-muted);
    opacity: 0.7;
  }
  .scroll-hint__line {
    width: 1px;
    height: 32px;
    background: linear-gradient(to bottom, var(--color-text-muted), transparent);
    animation: scrollHintPulse 2s ease-in-out infinite;
  }
  @keyframes scrollHintPulse {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  /* -------- Cursor / touch trail -------- */
  .cursor-trail-canvas {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    mix-blend-mode: screen;
  }

  .scroll-spacer { width: 100%; }

  /* Oculta el hint una vez que se empezó a scrollear (clase agregada por JS) */
  .app-root--scrolled .scroll-hint { opacity: 0; pointer-events: none; }
</style>
</head>

<script type="text/babel" data-type="module" data-presets="react">

import React, { useEffect, useMemo, useRef, useState, Suspense } from "react";
import { createRoot } from "react-dom/client";
import { create } from "zustand";
import * as THREE from "three";
import { Canvas, useFrame, useThree } from "@react-three/fiber";
import { useGLTF, Environment } from "@react-three/drei";
import { EffectComposer, Bloom, Vignette } from "@react-three/postprocessing";

/* ============================================================
   CONFIG: client.config
   Ajustá acá colores de marca, tipografías, CTA, partículas y
   la ruta de tu modelo GLTF/GLB (si no hay, se usa un objeto
   procedural como placeholder).
   ============================================================ */
const clientConfig = {
  brand: { name: "weeb studio" },
  colors: {
    accent: "#c8ff00",
    accentSecondary: "#7dfff0",
    background: "#0f0f1a",
    textPrimary: "#f5f6f2",
    textMuted: "rgba(245, 246, 242, 0.6)",
  },
  fonts: {
    display: "'Fraunces', serif",
    body: "'Inter', sans-serif",
  },
  particles: {
    count: 900,
    color: "#c8ff00",
    size: 0.015,
  },
  cta: {
    href: "https://wa.me/5493435020970?text=Hola%20weebStudio,%20quiero%20una%20Scroll%20Experience",
    label: "Hablar por WhatsApp",
  },
};

/* ============================================================
   CONFIG: personaje 3D animado (GLB con esqueleto, sin clips)
   Poné el .glb en tu repo (ej: assets/models/weeb.glb) y apuntá
   CHARACTER_MODEL_URL ahí — GitHub Pages lo sirve como estático.
   Coreografía 100% procedural, en 4 fases a lo largo del scroll:
     1) FLOTAR   — de frente, quieto en cámara, movimiento suave
     2) ACERCAR  — se acerca un poco a la pantalla
     3) GIRAR    — gira y cae "de cabeza" (se ve la suela)
     4) CAER     — se aleja, gira sin control en todos los ejes
   Los huesos de brazos/piernas nunca están del todo quietos:
   siempre hay un balanceo suave encima de cualquier otra pose.
   ============================================================ */
const CHARACTER_MODEL_URL = "./assets/models/weeb.glb";

const PH_FLOAT_END = 0.15; // hasta acá: flota de frente, quieto en cámara
const PH_APPROACH_END = 0.24; // hasta acá: se acerca un poco
const PH_FLIP_END = 0.4; // hasta acá: termina de girar boca abajo
const PH_TUMBLE_END = 0.88; // hasta acá: cae dando vueltas sin control

// Curva suave tipo "ease" para que toda transición sea fluida,
// nunca lineal/brusca.
function smoothstep(edge0, edge1, x) {
  const t = clamp((x - edge0) / (edge1 - edge0));
  return t * t * (3 - 2 * t);
}

/* ============================================================
   CONFIG: scenes.config
   Cada keyframe define un "beat" narrativo entre progress 0..1.
   blendScenes() interpola linealmente entre el keyframe anterior
   y el siguiente según el scroll. Ahora solo maneja cámara,
   luz, niebla y partículas — la coreografía del personaje vive
   en AnimatedCharacter. Ningún keyframe lleva texto salvo el
   primero (manejado aparte por HeroText) y el último (CTA).
   ============================================================ */
const scenes = [
  {
    id: "float",
    progress: 0,
    camera: { position: [0, 0.1, 4.3], lookAt: [0, 0, 0], fov: 30 },
    particles: { spread: 1, opacity: 0.3 },
    light: { color: "#ffffff", intensity: 0.5, rimColor: "#c8ff00", rimIntensity: 1.2 },
    fog: { color: "#0f0f1a", far: 20 },
    background: "#0f0f1a",
    tunnelIntensity: 0,
  },
  {
    id: "approach",
    progress: 0.24,
    camera: { position: [0, 0.08, 3.7], lookAt: [0, 0, 0], fov: 29 },
    particles: { spread: 1.1, opacity: 0.35 },
    light: { color: "#ffffff", intensity: 0.5, rimColor: "#c8ff00", rimIntensity: 1.3 },
    fog: { color: "#0f0f1a", far: 18 },
    background: "#0f0f1a",
    tunnelIntensity: 0.05,
  },
  {
    id: "flip",
    progress: 0.4,
    camera: { position: [0.2, 0, 4.2], lookAt: [0, -0.1, 0], fov: 32 },
    particles: { spread: 1.4, opacity: 0.45 },
    light: { color: "#ffffff", intensity: 0.45, rimColor: "#7dfff0", rimIntensity: 1.8 },
    fog: { color: "#0a0a14", far: 12 },
    background: "#0a0a14",
    tunnelIntensity: 0.3,
  },
  {
    id: "tumble-mid",
    progress: 0.62,
    camera: { position: [-0.3, 0.05, 4.6], lookAt: [0, 0, 0], fov: 34 },
    particles: { spread: 2, opacity: 0.6 },
    light: { color: "#ffffff", intensity: 0.4, rimColor: "#7dfff0", rimIntensity: 2.2 },
    fog: { color: "#050508", far: 8 },
    background: "#050508",
    tunnelIntensity: 0.8,
  },
  {
    id: "tumble-end",
    progress: 0.88,
    camera: { position: [0, 0, 5.2], lookAt: [0, 0, 0], fov: 30 },
    particles: { spread: 1.2, opacity: 0.3 },
    light: { color: "#ffffff", intensity: 0.5, rimColor: "#c8ff00", rimIntensity: 1.5 },
    fog: { color: "#000000", far: 12 },
    background: "#000000",
    tunnelIntensity: 0.1,
  },
  {
    id: "cierre",
    progress: 1,
    camera: { position: [0, 0, 5.2], lookAt: [0, 0, 0], fov: 28 },
    particles: { spread: 1, opacity: 0.25 },
    light: { color: "#ffffff", intensity: 0.6, rimColor: "#c8ff00", rimIntensity: 1.8 },
    fog: { color: "#000000", far: 10 },
    background: "#000000",
    tunnelIntensity: 0,
    showCTA: true,
    text: {
      eyebrow: "¿Charlamos?",
      title: "Llevemos tu marca a otro nivel.",
      subtitle: "",
      align: "center",
    },
  },
];

const SCROLL_LENGTH_VH = 950;

/* ============================================================
   UTILS: easing.ts
   ============================================================ */
function damp(current, target, lambda, dt) {
  return current + (target - current) * (1 - Math.exp(-lambda * dt));
}
function clamp(value, min = 0, max = 1) {
  return Math.min(max, Math.max(min, value));
}

/* ============================================================
   UTILS: device.ts
   ============================================================ */
function getDeviceProfile() {
  const isMobile = typeof window !== "undefined" && window.matchMedia("(max-width: 768px)").matches;
  return {
    isMobile,
    dpr: isMobile ? [1, 1.5] : [1, 2],
    particleMultiplier: isMobile ? 0.4 : 1,
    enablePostProcessing: !isMobile,
  };
}

/* ============================================================
   UTILS: interpolate.ts
   ============================================================ */
function lerp(a, b, t) {
  return a + (b - a) * t;
}
function lerpVec3(a, b, t) {
  return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
}
function lerpColor(a, b, t) {
  const ca = new THREE.Color(a);
  const cb = new THREE.Color(b);
  ca.lerp(cb, t);
  return "#" + ca.getHexString();
}

function sceneToState(kf) {
  return {
    camera: kf.camera,
    particles: kf.particles,
    light: kf.light,
    fog: kf.fog,
    background: kf.background,
    tunnelIntensity: kf.tunnelIntensity ?? 0,
  };
}

function blendScenes(list, rawProgress) {
  const progress = clamp(rawProgress, 0, 1);
  if (progress <= list[0].progress) return sceneToState(list[0]);
  const last = list[list.length - 1];
  if (progress >= last.progress) return sceneToState(last);

  let i = 0;
  while (i < list.length - 1 && list[i + 1].progress < progress) i++;
  const a = list[i];
  const b = list[i + 1];
  const span = b.progress - a.progress || 1;
  const t = clamp((progress - a.progress) / span);

  return {
    camera: {
      position: lerpVec3(a.camera.position, b.camera.position, t),
      lookAt: lerpVec3(a.camera.lookAt, b.camera.lookAt, t),
      fov: lerp(a.camera.fov, b.camera.fov, t),
    },
    particles: {
      spread: lerp(a.particles.spread, b.particles.spread, t),
      opacity: lerp(a.particles.opacity, b.particles.opacity, t),
    },
    light: {
      color: lerpColor(a.light.color, b.light.color, t),
      intensity: lerp(a.light.intensity, b.light.intensity, t),
      rimColor: lerpColor(a.light.rimColor, b.light.rimColor, t),
      rimIntensity: lerp(a.light.rimIntensity, b.light.rimIntensity, t),
    },
    fog: {
      color: lerpColor(a.fog.color, b.fog.color, t),
      far: lerp(a.fog.far, b.fog.far, t),
    },
    background: lerpColor(a.background, b.background, t),
    tunnelIntensity: lerp(a.tunnelIntensity ?? 0, b.tunnelIntensity ?? 0, t),
  };
}

function textWeight(kf, progress, window_ = 0.14) {
  const d = Math.abs(progress - kf.progress);
  return clamp(1 - d / window_);
}

/* ============================================================
   STORE: scroll/scrollStore.ts
   ============================================================ */
const useScrollStore = create((set) => ({
  progress: 0,
  smoothProgress: 0,
  setProgress: (p) => set({ progress: p }),
  setSmoothProgress: (p) => set({ smoothProgress: p }),
}));

/* ============================================================
   HOOK: scroll/useScrollProgress.ts
   Traduce el alto del spacer + scrollY del documento en un
   progreso 0..1 crudo, guardado en el store.
   ============================================================ */
function useScrollProgress(spacerRef) {
  useEffect(() => {
    const compute = () => {
      const el = spacerRef.current;
      if (!el) return;
      const total = el.offsetHeight - window.innerHeight;
      const raw = total > 0 ? window.scrollY / total : 0;
      const p = clamp(raw, 0, 1);
      useScrollStore.getState().setProgress(p);
      document.body.classList.toggle("app-root--scrolled", window.scrollY > 20);
    };
    compute();
    window.addEventListener("scroll", compute, { passive: true });
    window.addEventListener("resize", compute);
    return () => {
      window.removeEventListener("scroll", compute);
      window.removeEventListener("resize", compute);
    };
  }, [spacerRef]);
}

/* ============================================================
   COMPONENT (dentro de <Canvas>): scroll/ScrollSmoother.tsx
   Amortigua smoothProgress hacia progress cuadro a cuadro.
   ============================================================ */
function ScrollSmoother() {
  useFrame((_, delta) => {
    const { progress, smoothProgress, setSmoothProgress } = useScrollStore.getState();
    setSmoothProgress(damp(smoothProgress, progress, 4, delta));
  });
  return null;
}

/* ============================================================
   HOOK: engine/utils/useMouseParallax.ts
   ============================================================ */
function useMouseParallax() {
  const mouse = useRef({ x: 0, y: 0 });
  useEffect(() => {
    const onMove = (e) => {
      if (e.pointerType !== "mouse") return;
      mouse.current.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.current.y = (e.clientY / window.innerHeight) * 2 - 1;
    };
    window.addEventListener("pointermove", onMove, { passive: true });
    return () => window.removeEventListener("pointermove", onMove);
  }, []);
  return mouse;
}

/* ============================================================
   three/CameraRig.jsx
   ============================================================ */
function CameraRig({ mouse, parallaxStrength = 0.18 }) {
  const { camera } = useThree();
  const lookAtTarget = useRef(new THREE.Vector3());
  const currentLookAt = useRef(new THREE.Vector3());

  useFrame((_, delta) => {
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    const [px, py, pz] = state.camera.position;
    const [lx, ly, lz] = state.camera.lookAt;
    const mx = mouse.current?.x ?? 0;
    const my = mouse.current?.y ?? 0;

    camera.position.x = damp(camera.position.x, px + mx * parallaxStrength, 6, delta);
    camera.position.y = damp(camera.position.y, py - my * parallaxStrength * 0.6, 6, delta);
    camera.position.z = damp(camera.position.z, pz, 6, delta);

    lookAtTarget.current.set(lx + mx * 0.05, ly - my * 0.05, lz);
    currentLookAt.current.lerp(lookAtTarget.current, 1 - Math.exp(-6 * delta));
    camera.lookAt(currentLookAt.current);

    if ("fov" in camera) {
      camera.fov = damp(camera.fov, state.camera.fov, 5, delta);
      camera.updateProjectionMatrix();
    }
  });

  return null;
}

/* ============================================================
   three/AnimatedCharacter.jsx
   Personaje 3D real (GLB con esqueleto, sin clips grabados).
   Coreografía procedural en 4 fases (ver constantes PH_* arriba):
     1) FLOTAR   — de frente a cámara, con vaivén suave de brazos
                   y piernas, como flotando en el aire.
     2) ACERCAR  — se acerca un poco a la pantalla (dolly in).
     3) GIRAR    — gira 180° en X: pasa de estar de frente a
                   quedar boca abajo, "cayendo de cabeza" (se
                   empieza a ver la suela de los zapatos).
     4) CAER     — sigue alejándose (más chico) mientras gira
                   sin control en varios ejes a la vez, con el
                   torso encorvándose hacia adelante para vender
                   la sensación de caída real.
   En todo momento, brazos y piernas tienen un balanceo propio
   independiente — nunca quedan del todo quietos.
   NOTA: como no hay forma de previsualizar el rig desde acá, el
   sentido exacto de cada eje (¿"boca abajo" es +X o -X en este
   rig?) es un primer intento — avisame qué se ve mal y ajusto
   signos/ejes con precisión quirúrgica.
   ============================================================ */
function AnimatedCharacter({ mouse }) {
  const groupRef = useRef(null);
  const { scene } = useGLTF(CHARACTER_MODEL_URL);
  const bonesRef = useRef({});
  const restRef = useRef({});
  const clockRef = useRef(0);
  const tumbleRef = useRef({ x: 0, y: 0, z: 0 });

  useEffect(() => {
    const names = {
      spine1: "Spine01",
      spine2: "Spine02",
      head: "Head",
      neck: "NeckTwist01",
      lForearm: "L_Forearm",
      rForearm: "R_Forearm",
      lThigh: "L_Thigh",
      lCalf: "L_Calf",
      rThigh: "R_Thigh",
      rCalf: "R_Calf",
    };
    const bones = {};
    const rest = {};
    Object.entries(names).forEach(([key, boneName]) => {
      const bone = scene.getObjectByName(boneName);
      if (bone) {
        bones[key] = bone;
        rest[key] = bone.rotation.clone();
      }
    });
    bonesRef.current = bones;
    restRef.current = rest;
  }, [scene]);

  useFrame((_, delta) => {
    clockRef.current += delta;
    const t = clockRef.current;
    const progress = useScrollStore.getState().smoothProgress;
    const bones = bonesRef.current;
    const rest = restRef.current;
    const group = groupRef.current;
    if (!group) return;

    // Pesos de cada fase (0..1), con transición suave (smoothstep)
    // en vez de cortes duros entre una fase y la siguiente.
    const approachW = smoothstep(PH_FLOAT_END, PH_APPROACH_END, progress);
    const flipW = smoothstep(PH_APPROACH_END, PH_FLIP_END, progress);
    const tumbleW = smoothstep(PH_FLIP_END, PH_TUMBLE_END, progress);
    const settleW = smoothstep(PH_TUMBLE_END, 1, progress);

    // Posición: flota → se acerca (menor z) → se aleja cayendo (mayor -z).
    const zFloat = -1.4;
    const zApproach = -0.6;
    const zFar = -6.5;
    let targetZ;
    if (progress < PH_FLIP_END) {
      targetZ = zFloat + (zApproach - zFloat) * approachW;
    } else {
      targetZ = zApproach + (zFar - zApproach) * tumbleW * (1 - settleW * 0.3);
    }
    group.position.z = damp(group.position.z, targetZ, 2.5, delta);
    group.position.y = -0.5 + Math.sin(t * 0.8) * 0.06; // flote constante

    // Rotación: gira hacia la izquierda (yaw) mientras se inclina
    // hacia adelante como un clavado — NO es una voltereta completa,
    // queda de espaldas e inclinado, no boca abajo del todo.
    const YAW_TARGET = -Math.PI * 1.05; // gira a la izquierda, algo más de media vuelta
    const PITCH_TARGET = -1.25; // inclinación tipo clavado (radianes, ~72°)
    if (progress < PH_FLIP_END) {
      group.rotation.y = damp(group.rotation.y, YAW_TARGET * flipW, 3.2, delta);
      group.rotation.x = damp(group.rotation.x, PITCH_TARGET * flipW, 3.2, delta);
      group.rotation.z = damp(group.rotation.z, Math.sin(t * 0.4) * 0.05, 4, delta);
    } else {
      // Tumbling: sigue desde la orientación de clavado, cada eje
      // gira a su propia velocidad errática ("sin control").
      const tumbleSpeed = tumbleW * (1 - settleW * 0.85);
      tumbleRef.current.x += delta * tumbleSpeed * (1.6 + Math.sin(t * 0.5) * 0.5);
      tumbleRef.current.y += delta * tumbleSpeed * (1.1 + Math.sin(t * 0.33) * 0.7);
      tumbleRef.current.z += delta * tumbleSpeed * (1.4 + Math.cos(t * 0.41) * 0.6);
      group.rotation.x = PITCH_TARGET + tumbleRef.current.x;
      group.rotation.y = YAW_TARGET + tumbleRef.current.y;
      group.rotation.z = tumbleRef.current.z;
    }

    // Balanceo de extremidades: SIEMPRE bien visible desde el arranque
    // (sensación de estar flotando/nadando), con más amplitud durante
    // el tumbling. Se mueve en más de un eje a la vez porque no hay
    // forma de saber acá qué eje es "torsión invisible" en este rig
    // — así, sea cual sea el eje correcto, el movimiento se nota.
    const limbBoost = 1 + tumbleW * 2;
    const wob = (freq, phase, amp) => Math.sin(t * freq + phase) * amp * limbBoost;

    if (bones.lForearm) bones.lForearm.rotation.x = rest.lForearm.x + wob(1.8, 0.6, 0.32);
    if (bones.rForearm) bones.rForearm.rotation.x = rest.rForearm.x + wob(1.7, 2.0, 0.32);
    if (bones.lThigh) {
      bones.lThigh.rotation.x = rest.lThigh.x + wob(0.85, 2.4, 0.25);
      bones.lThigh.rotation.z = rest.lThigh.z + wob(0.7, 1.0, 0.12);
    }
    if (bones.rThigh) {
      bones.rThigh.rotation.x = rest.rThigh.x + wob(0.9, 0.3, 0.25);
      bones.rThigh.rotation.z = rest.rThigh.z - wob(0.75, 1.9, 0.12);
    }
    if (bones.lCalf) bones.lCalf.rotation.x = rest.lCalf.x + wob(1.4, 1.5, 0.22);
    if (bones.rCalf) bones.rCalf.rotation.x = rest.rCalf.x + wob(1.3, 3.0, 0.22);

    // Torso encorvado hacia adelante durante la caída (más creíble).
    const curl = tumbleW * 0.35;
    if (bones.spine1) bones.spine1.rotation.x = rest.spine1.x + curl * 0.5 + Math.sin(t * 1.1) * 0.02;
    if (bones.spine2) bones.spine2.rotation.x = rest.spine2.x + curl * 0.7;

    // Cabeza: sigue el mouse mientras flota de frente; durante la
    // caída, se suma al balanceo general en vez de "corregir" la mirada.
    const headFollow = 1 - flipW;
    const mx = (mouse?.current?.x ?? 0) * headFollow;
    const my = (mouse?.current?.y ?? 0) * headFollow;
    if (bones.head) {
      bones.head.rotation.y = damp(bones.head.rotation.y, rest.head.y + mx * 0.2 + wob(0.9, 4, 0.05), 4, delta);
      bones.head.rotation.x = damp(bones.head.rotation.x, rest.head.x - my * 0.12, 4, delta);
    }
    if (bones.neck) {
      bones.neck.rotation.y = damp(bones.neck.rotation.y, rest.neck.y + mx * 0.08, 4, delta);
    }
  });

  return <primitive ref={groupRef} object={scene} position={[0, -0.5, -1.4]} scale={1.7} />;
}
useGLTF.preload(CHARACTER_MODEL_URL);

/* ============================================================
   three/SpeedLines.jsx
   Líneas radiales tipo "warp speed" que aparecen durante el
   beat de túnel (tunnelIntensity 0→1→0), dando sensación de
   velocidad al atravesar el logo.
   ============================================================ */
function SpeedLines() {
  const LINE_COUNT = 40;
  const groupRef = useRef(null);
  const materialRef = useRef(null);

  const positions = useMemo(() => {
    const arr = new Float32Array(LINE_COUNT * 2 * 3);
    for (let i = 0; i < LINE_COUNT; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 0.4 + Math.random() * 1.6;
      const length = 0.6 + Math.random() * 1.8;
      const x1 = Math.cos(angle) * radius;
      const y1 = Math.sin(angle) * radius;
      const x2 = Math.cos(angle) * (radius + length);
      const y2 = Math.sin(angle) * (radius + length);
      arr[i * 6 + 0] = x1;
      arr[i * 6 + 1] = y1;
      arr[i * 6 + 2] = 0;
      arr[i * 6 + 3] = x2;
      arr[i * 6 + 4] = y2;
      arr[i * 6 + 5] = 0;
    }
    return arr;
  }, []);

  useFrame((_, delta) => {
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    const intensity = state.tunnelIntensity;

    if (groupRef.current) {
      groupRef.current.rotation.z += delta * (0.3 + intensity * 0.6);
      const s = 0.6 + intensity * 2.4;
      groupRef.current.scale.setScalar(damp(groupRef.current.scale.x, s, 5, delta));
    }
    if (materialRef.current) {
      materialRef.current.opacity = damp(materialRef.current.opacity, intensity * 0.75, 5, delta);
    }
  });

  return (
    <group ref={groupRef} position={[0, 0, 2]}>
      <lineSegments>
        <bufferGeometry>
          <bufferAttribute attach="attributes-position" args={[positions, 3]} />
        </bufferGeometry>
        <lineBasicMaterial
          ref={materialRef}
          color={clientConfig.colors.accent}
          transparent
          opacity={0}
          toneMapped={false}
        />
      </lineSegments>
    </group>
  );
}

/* ============================================================
   three/TunnelRings.jsx
   El "agujero infinito que gira": anillos concéntricos que se
   alejan en Z en loop (nunca se acaban) y giran en espiral,
   cada vez más rápido a medida que crece tunnelIntensity — da
   la sensación de caer atravesando un túnel que gira, en vez de
   simples líneas planas.
   ============================================================ */
function TunnelRings() {
  const RING_COUNT = 12;
  const SEGMENTS = 28;
  const RING_SPACING = 2.4;
  const TOTAL_DEPTH = RING_COUNT * RING_SPACING;

  const groupRef = useRef(null);
  const geomRef = useRef(null);
  const materialRef = useRef(null);
  const flowRef = useRef(0);

  const radii = useMemo(() => new Array(RING_COUNT).fill(0).map((_, i) => 1.3 + i * 0.06), []);
  const positions = useMemo(() => new Float32Array(RING_COUNT * SEGMENTS * 2 * 3), []);

  useFrame((_, delta) => {
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    const intensity = state.tunnelIntensity;

    flowRef.current += delta * (0.5 + intensity * 3.5);
    const arr = positions;

    for (let r = 0; r < RING_COUNT; r++) {
      const radius = radii[r];
      const z = -(((r * RING_SPACING + flowRef.current * 1.8) % TOTAL_DEPTH));
      const twist = r * 0.4 + flowRef.current * 0.6;
      for (let s = 0; s < SEGMENTS; s++) {
        const a0 = (s / SEGMENTS) * Math.PI * 2 + twist;
        const a1 = ((s + 1) / SEGMENTS) * Math.PI * 2 + twist;
        const idx = (r * SEGMENTS + s) * 6;
        arr[idx + 0] = Math.cos(a0) * radius;
        arr[idx + 1] = Math.sin(a0) * radius;
        arr[idx + 2] = z;
        arr[idx + 3] = Math.cos(a1) * radius;
        arr[idx + 4] = Math.sin(a1) * radius;
        arr[idx + 5] = z;
      }
    }
    if (geomRef.current) {
      geomRef.current.attributes.position.needsUpdate = true;
    }
    if (materialRef.current) {
      materialRef.current.opacity = damp(materialRef.current.opacity, intensity * 0.55, 5, delta);
    }
    if (groupRef.current) {
      groupRef.current.rotation.z += delta * (0.15 + intensity * 0.9);
    }
  });

  return (
    <group ref={groupRef} position={[0, 0, 1.5]}>
      <lineSegments>
        <bufferGeometry ref={geomRef}>
          <bufferAttribute attach="attributes-position" args={[positions, 3]} />
        </bufferGeometry>
        <lineBasicMaterial
          ref={materialRef}
          color={clientConfig.colors.accentSecondary}
          transparent
          opacity={0}
          toneMapped={false}
        />
      </lineSegments>
    </group>
  );
}

/* ============================================================
   three/Particles.jsx
   ============================================================ */
function Particles({ device }) {
  const pointsRef = useRef(null);
  const materialRef = useRef(null);
  const count = Math.round(clientConfig.particles.count * device.particleMultiplier);

  const positions = useMemo(() => {
    const arr = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      arr[i * 3] = (Math.random() - 0.5) * 2;
      arr[i * 3 + 1] = (Math.random() - 0.5) * 2;
      arr[i * 3 + 2] = (Math.random() - 0.5) * 2;
    }
    return arr;
  }, [count]);

  useFrame((state, delta) => {
    const progress = useScrollStore.getState().smoothProgress;
    const blended = blendScenes(scenes, progress);
    if (pointsRef.current) {
      const targetScale = blended.particles.spread;
      pointsRef.current.scale.setScalar(damp(pointsRef.current.scale.x, targetScale, 3, delta));
      pointsRef.current.rotation.y += delta * 0.02;
    }
    if (materialRef.current) {
      materialRef.current.opacity = damp(materialRef.current.opacity, blended.particles.opacity, 4, delta);
    }
    void state;
  });

  return (
    <points ref={pointsRef}>
      <bufferGeometry>
        <bufferAttribute attach="attributes-position" args={[positions, 3]} />
      </bufferGeometry>
      <pointsMaterial
        ref={materialRef}
        color={clientConfig.particles.color}
        size={clientConfig.particles.size}
        transparent
        opacity={0.4}
        depthWrite={false}
        sizeAttenuation
      />
    </points>
  );
}

/* ============================================================
   three/Lighting.jsx
   ============================================================ */
function Lighting() {
  const keyRef = useRef(null);
  const rimRef = useRef(null);

  useFrame((_, delta) => {
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    if (keyRef.current) {
      keyRef.current.color.set(state.light.color);
      keyRef.current.intensity = damp(keyRef.current.intensity, state.light.intensity, 4, delta);
    }
    if (rimRef.current) {
      rimRef.current.color.set(state.light.rimColor);
      rimRef.current.intensity = damp(rimRef.current.intensity, state.light.rimIntensity, 4, delta);
    }
  });

  return (
    <>
      <ambientLight intensity={0.25} />
      <directionalLight ref={keyRef} position={[3, 4, 5]} intensity={0.9} />
      <directionalLight position={[-3, 2, -2]} intensity={0.35} />
      <pointLight ref={rimRef} position={[-2.5, -1, -2]} intensity={1.4} distance={12} />
    </>
  );
}

/* ============================================================
   three/SceneEnvironment.jsx
   ============================================================ */
function SceneEnvironment() {
  const { scene } = useThree();
  const fog = useRef(new THREE.FogExp2("#05070a", 0.12));
  const bgColor = useRef(new THREE.Color("#05070a"));

  useEffect(() => {
    scene.fog = fog.current;
    scene.background = bgColor.current;
  }, [scene]);

  useFrame(() => {
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    fog.current.color.set(state.fog.color);
    fog.current.density = 1 / Math.max(state.fog.far, 1);
    bgColor.current.set(state.background);
  });

  return null;
}

/* ============================================================
   three/Experience.jsx
   ============================================================ */
function Experience({ device }) {
  const mouse = useMouseParallax();
  return (
    <>
      <ScrollSmoother />
      <SceneEnvironment />
      <CameraRig mouse={mouse} />
      <Lighting />
      <Environment preset="city" background={false} />
      <Suspense fallback={null}>
        <AnimatedCharacter mouse={mouse} />
      </Suspense>
      <SpeedLines />
      <TunnelRings />
      <Particles device={device} />
      {device.enablePostProcessing && (
        <EffectComposer multisampling={0}>
          <Bloom intensity={0.55} luminanceThreshold={0.2} luminanceSmoothing={0.9} mipmapBlur />
          <Vignette eskil={false} offset={0.15} darkness={0.7} />
        </EffectComposer>
      )}
    </>
  );
}

/* ============================================================
   ui/HeroText.jsx
   El único texto "de entrada": aparece al principio, y cuando
   arranca el giro/caída (fase GIRAR) se agranda hacia la
   pantalla mientras se desvanece, hasta desaparecer del todo.
   No vuelve a aparecer ningún otro texto hasta el CTA final
   (ese lo maneja SceneText con el keyframe "cierre").
   ============================================================ */
function HeroText() {
  const ref = useRef(null);
  const FADE_IN_END = 0.05;

  useEffect(() => {
    const update = (progress) => {
      if (!ref.current) return;
      const fadeIn = smoothstep(0, FADE_IN_END, progress);
      const zoomOut = smoothstep(PH_APPROACH_END, PH_FLIP_END, progress);
      const scale = 1 + zoomOut * 14;
      const opacity = fadeIn * (1 - zoomOut);
      ref.current.style.opacity = String(opacity);
      ref.current.style.transform = `translate(-50%, -50%) scale(${scale})`;
    };
    update(useScrollStore.getState().smoothProgress);
    return useScrollStore.subscribe((s) => update(s.smoothProgress));
  }, []);

  return (
    <div ref={ref} className="hero-text" style={{ opacity: 0 }}>
      Scroll Experience
    </div>
  );
}

/* ============================================================
   ui/SceneText.jsx
   ============================================================ */
function SceneText() {
  const refs = useRef([]);

  useEffect(() => {
    const update = (progress) => {
      scenes.forEach((kf, i) => {
        const el = refs.current[i];
        if (!el || !kf.text) return;
        const weight = textWeight(kf, progress);
        el.style.opacity = String(weight);
        el.style.transform =
          kf.text.align === "center"
            ? `translateX(-50%) translateY(${(1 - weight) * 24}px)`
            : `translateY(${(1 - weight) * 24}px)`;
        el.style.pointerEvents = weight > 0.5 ? "auto" : "none";
      });
    };
    update(useScrollStore.getState().smoothProgress);
    const unsubscribe = useScrollStore.subscribe((s) => update(s.smoothProgress));
    return unsubscribe;
  }, []);

  return (
    <div className="scene-text-layer">
      {scenes.map((kf, i) =>
        kf.text ? (
          <div
            key={kf.id}
            ref={(el) => { refs.current[i] = el; }}
            className={`scene-text scene-text--${kf.text.align}`}
            style={{ opacity: 0 }}
          >
            {kf.text.eyebrow && <span className="scene-text__eyebrow">{kf.text.eyebrow}</span>}
            <h2 className="scene-text__title">{kf.text.title}</h2>
            {kf.text.subtitle && <p className="scene-text__subtitle">{kf.text.subtitle}</p>}
          </div>
        ) : null
      )}
    </div>
  );
}

/* ============================================================
   ui/CTAButton.jsx
   ============================================================ */
const CTA_START = scenes.find((s) => s.showCTA)?.progress ?? 1;
const FADE_WINDOW = 0.06;

function CTAButton() {
  const ref = useRef(null);

  useEffect(() => {
    const update = (progress) => {
      if (!ref.current) return;
      const weight = clamp((progress - (CTA_START - FADE_WINDOW)) / FADE_WINDOW);
      ref.current.style.opacity = String(weight);
      ref.current.style.transform = `translateX(-50%) translateY(${(1 - weight) * 16}px)`;
      ref.current.style.pointerEvents = weight > 0.6 ? "auto" : "none";
    };
    update(useScrollStore.getState().smoothProgress);
    return useScrollStore.subscribe((s) => update(s.smoothProgress));
  }, []);

  return (
    <div ref={ref} className="cta-layer" style={{ opacity: 0 }}>
      <a className="cta-button" href={clientConfig.cta.href}>
        {clientConfig.cta.label}
      </a>
    </div>
  );
}

/* ============================================================
   ui/ProgressIndicator.jsx
   ============================================================ */
function ProgressIndicator() {
  const fillRef = useRef(null);

  useEffect(() => {
    const update = (progress) => {
      if (fillRef.current) fillRef.current.style.height = `${progress * 100}%`;
    };
    update(useScrollStore.getState().smoothProgress);
    return useScrollStore.subscribe((s) => update(s.smoothProgress));
  }, []);

  return (
    <div className="progress-rail" aria-hidden="true">
      <div className="progress-rail__track">
        <div ref={fillRef} className="progress-rail__fill" />
      </div>
    </div>
  );
}

/* ============================================================
   ui/CursorTrail.jsx
   Rastro luminoso que sigue al mouse (pointermove) o al dedo
   (touchmove) — el "touch trail / cursor trail" genérico.
   Dibuja en un <canvas> 2D encima del canvas 3D, con blend
   "lighter" para que el rastro brille sobre el fondo oscuro.
   ============================================================ */
function CursorTrail() {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let width = window.innerWidth;
    let height = window.innerHeight;
    let points = [];
    let rafId = 0;

    const resize = () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();

    const addPoint = (x, y) => {
      points.push({ x, y, life: 1 });
      if (points.length > 40) points.shift();
    };
    const onPointerMove = (e) => addPoint(e.clientX, e.clientY);
    const onTouchMove = (e) => {
      if (e.touches && e.touches[0]) addPoint(e.touches[0].clientX, e.touches[0].clientY);
    };

    window.addEventListener("resize", resize);
    window.addEventListener("pointermove", onPointerMove, { passive: true });
    window.addEventListener("touchmove", onTouchMove, { passive: true });

    const draw = () => {
      ctx.clearRect(0, 0, width, height);
      points.forEach((p) => { p.life *= 0.94; });
      points = points.filter((p) => p.life > 0.02);

      if (points.length > 1) {
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.globalCompositeOperation = "lighter";
        for (let i = 1; i < points.length; i++) {
          const p0 = points[i - 1];
          const p1 = points[i];
          const alpha = Math.min(p0.life, p1.life) * 0.55;
          ctx.strokeStyle = clientConfig.colors.accent;
          ctx.globalAlpha = alpha;
          ctx.lineWidth = 1.5 + alpha * 4;
          ctx.beginPath();
          ctx.moveTo(p0.x, p0.y);
          ctx.lineTo(p1.x, p1.y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
      }
      rafId = requestAnimationFrame(draw);
    };
    rafId = requestAnimationFrame(draw);

    return () => {
      cancelAnimationFrame(rafId);
      window.removeEventListener("resize", resize);
      window.removeEventListener("pointermove", onPointerMove);
      window.removeEventListener("touchmove", onTouchMove);
    };
  }, []);

  return <canvas ref={canvasRef} className="cursor-trail-canvas" aria-hidden="true" />;
}

/* ============================================================
   App.jsx
   ============================================================ */
function App() {
  const spacerRef = useRef(null);
  useScrollProgress(spacerRef);
  const device = useMemo(() => getDeviceProfile(), []);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    const t = setTimeout(() => setReady(true), 60);
    return () => clearTimeout(t);
  }, []);

  return (
    <div
      className="app-root"
      style={{
        "--brand-accent": clientConfig.colors.accent,
        "--brand-accent-2": clientConfig.colors.accentSecondary,
        "--color-bg": clientConfig.colors.background,
        "--color-text": clientConfig.colors.textPrimary,
        "--color-text-muted": clientConfig.colors.textMuted,
        "--font-display": clientConfig.fonts.display,
        "--font-body": clientConfig.fonts.body,
      }}
    >
      <div className={`canvas-stage ${ready ? "canvas-stage--ready" : ""}`}>
        <Canvas
          dpr={device.dpr}
          gl={{ antialias: true, powerPreference: "high-performance" }}
          camera={{ position: [0, 0.2, 6.5], fov: 35, near: 0.1, far: 60 }}
        >
          <Experience device={device} />
        </Canvas>
        <CursorTrail />
        <HeroText />
        <SceneText />
        <CTAButton />
        <ProgressIndicator />
        <header className="brand-mark">
          <span>{clientConfig.brand.name}</span>
        </header>
        <div className="scroll-hint" aria-hidden="true">
          <span>Scroll</span>
          <div className="scroll-hint__line" />
        </div>
      </div>
      <div ref={spacerRef} className="scroll-spacer" style={{ height: `${SCROLL_LENGTH_VH}vh` }} />
    </div>
  );
}

createRoot(document.getElementById("root")).render(<App />);
