<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Preview modelo — oveja</title>
<style>
  html, body { margin: 0; padding: 0; background: #0f0f1a; height: 100%; overflow: hidden; }
  #root { width: 100%; height: 100%; }
  canvas { display: block; }
  .hint {
    position: fixed; bottom: 3vh; left: 50%; transform: translateX(-50%);
    color: rgba(245,246,242,0.6); font-family: system-ui, sans-serif;
    font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="root"></div>
<div class="hint">Scrolleá para girar y ver el saludo</div>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "three": "https://esm.sh/three@0.160.0",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.17.10?external=react,react-dom,three",
    "@react-three/drei": "https://esm.sh/@react-three/drei@9.114.3?external=react,react-dom,three,@react-three/fiber"
  }
}
</script>

<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

<script type="text/babel" data-type="module" data-presets="react">
import React, { useEffect, useRef, useState } from "react";
import { createRoot } from "react-dom/client";
import { Canvas, useFrame } from "@react-three/fiber";
import { useGLTF, Environment } from "@react-three/drei";

// Mismo archivo que usa index.html, suelto en la misma carpeta.
const MODEL_URL = "./sheep_mascot_3d_model.glb";

// Ajustá esto si la oveja aparece muy grande o muy chica.
const SCALE = 1.7;

// Cuántas vueltas completas de 360° a lo largo de todo el scroll.
const SPINS = 2;

// Ventana del scroll (0..1) donde saluda.
const WAVE_CENTER = 0.55;
const WAVE_WIDTH = 0.16;

function damp(current, target, lambda, dt) {
  return current + (target - current) * (1 - Math.exp(-lambda * dt));
}
function clamp(v, min = 0, max = 1) {
  return Math.min(max, Math.max(min, v));
}

function Sheep({ progress }) {
  const groupRef = useRef(null);
  const { scene } = useGLTF(MODEL_URL);
  const bonesRef = useRef({});
  const restRef = useRef({});
  const clockRef = useRef(0);

  useEffect(() => {
    const names = {
      spine1: "Spine01",
      spine2: "Spine02",
      head: "Head",
      neck: "NeckTwist01",
      rClavicle: "R_Clavicle",
      rUpperarm: "R_Upperarm",
      rForearm: "R_Forearm",
      rHand: "R_Hand",
    };
    const bones = {};
    const rest = {};
    Object.entries(names).forEach(([key, boneName]) => {
      const bone = scene.getObjectByName(boneName);
      if (bone) {
        bones[key] = bone;
        rest[key] = bone.rotation.clone();
      }
    });
    bonesRef.current = bones;
    restRef.current = rest;
  }, [scene]);

  useFrame((_, delta) => {
    clockRef.current += delta;
    const t = clockRef.current;
    const p = progress.current;
    const bones = bonesRef.current;
    const rest = restRef.current;

    if (groupRef.current) {
      const targetY = p * Math.PI * 2 * SPINS;
      groupRef.current.rotation.y = damp(groupRef.current.rotation.y, targetY, 3, delta);
    }

    const breathe = Math.sin(t * 1.1) * 0.02;
    const sway = Math.sin(t * 0.7) * 0.015;
    if (bones.spine1) {
      bones.spine1.rotation.x = rest.spine1.x + breathe;
      bones.spine1.rotation.z = rest.spine1.z + sway;
    }
    if (bones.spine2) {
      bones.spine2.rotation.x = rest.spine2.x + breathe * 0.6;
    }

    const waveWeight = clamp(1 - Math.abs(p - WAVE_CENTER) / WAVE_WIDTH);
    const wiggle = Math.sin(t * 7) * 0.18 * waveWeight;
    if (bones.rClavicle) bones.rClavicle.rotation.z = rest.rClavicle.z - waveWeight * 0.3;
    if (bones.rUpperarm) {
      bones.rUpperarm.rotation.z = rest.rUpperarm.z - waveWeight * 1.9;
      bones.rUpperarm.rotation.x = rest.rUpperarm.x + waveWeight * 0.3;
    }
    if (bones.rForearm) bones.rForearm.rotation.z = rest.rForearm.z - waveWeight * 0.9 + wiggle;
    if (bones.rHand) bones.rHand.rotation.z = rest.rHand.z + wiggle * 1.4;
  });

  return <primitive ref={groupRef} object={scene} position={[0, -0.9, 0]} scale={SCALE} />;
}
useGLTF.preload(MODEL_URL);

function Scene({ progress }) {
  return (
    <>
      <ambientLight intensity={0.5} />
      <directionalLight position={[3, 4, 5]} intensity={1} />
      <directionalLight position={[-3, 2, -2]} intensity={0.4} />
      <Environment preset="city" background={false} />
      <Sheep progress={progress} />
    </>
  );
}

function App() {
  const progress = useRef(0);

  useEffect(() => {
    const spacer = 400; // vh virtuales de scroll simulado
    const onWheel = (e) => {
      progress.current = clamp(progress.current + e.deltaY / (window.innerHeight * (spacer / 100)));
    };
    window.addEventListener("wheel", onWheel, { passive: true });
    // Soporte touch básico
    let lastY = null;
    const onTouchStart = (e) => { lastY = e.touches[0].clientY; };
    const onTouchMove = (e) => {
      if (lastY == null) return;
      const dy = lastY - e.touches[0].clientY;
      lastY = e.touches[0].clientY;
      progress.current = clamp(progress.current + dy / (window.innerHeight * (spacer / 100)));
    };
    window.addEventListener("touchstart", onTouchStart, { passive: true });
    window.addEventListener("touchmove", onTouchMove, { passive: true });
    return () => {
      window.removeEventListener("wheel", onWheel);
      window.removeEventListener("touchstart", onTouchStart);
      window.removeEventListener("touchmove", onTouchMove);
    };
  }, []);

  return (
    <Canvas camera={{ position: [0, 0.2, 4], fov: 35 }}>
      <Scene progress={progress} />
    </Canvas>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
