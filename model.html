<style>
  :root {
    --brand-accent: #d9a441;
    --brand-accent-2: #6ee7c9;

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    overflow-x: hidden;
  }

  #root { width: 100%; }

  .app-root {
    position: relative;
    width: 100%;
  }

  /* -------- Escenario 3D fijo -------- */
  .canvas-stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .canvas-stage--ready { opacity: 1; }
  .canvas-stage canvas { display: block; width: 100% !important; height: 100% !important; }

  /* -------- Texto de entrada (Scroll Experience) -------- */
  .hero-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transform-origin: center center;
    z-index: 5;
    pointer-events: none;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(1.8rem, 4.5vw, 3.2rem);
    letter-spacing: 0.02em;
    color: var(--color-text);
    white-space: nowrap;
    will-change: opacity, transform;

  .scene-text-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;

    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 8vw;
    max-width: 720px;
    will-change: opacity, transform;

    font-size: clamp(2rem, 5vw, 4rem);
    line-height: 1.05;
    margin: 0 0 0.75rem 0;
    color: var(--color-text);

  .scene-text__subtitle {
    font-family: var(--font-body);
    font-weight: 300;
    font-size: clamp(0.95rem, 1.4vw, 1.15rem);
    line-height: 1.5;
    color: var(--color-text-muted);
    margin: 0;
    max-width: 46ch;
  }

  /* -------- CTA -------- */
  .cta-layer {
    position: absolute;
    bottom: 8vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    will-change: opacity, transform;
  }
  .cta-button {
    display: inline-block;
    padding: 0.9rem 2.2rem;
    border-radius: 999px;
    background: var(--brand-accent);
    color: #0a0a0a;
    font-family: var(--font-body);

    font-size: 0.9rem;

    text-decoration: none;

  .cta-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 36px rgba(200, 255, 0, 0.5);
  }

  .progress-rail {
    position: fixed;
    top: 50%;
    right: 3vw;
    transform: translateY(-50%);
    height: 28vh;
    z-index: 6;
  }
  .progress-rail__track {
    position: relative;
    width: 2px;
    height: 100%;
    background: rgba(244, 241, 234, 0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-rail__fill {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 0%;
    background: var(--brand-accent);
    border-radius: 2px;
    transition: height 0.05s linear;
  }

  /* -------- Marca -------- */
  .brand-mark {
    position: fixed;
    top: 3vh;
    left: 3vw;
    z-index: 6;
    font-family: var(--font-display);
    font-size: 1rem;
    letter-spacing: 0.08em;
    color: var(--color-text);
  }

  /* -------- Hint de scroll -------- */
  .scroll-hint {
    position: fixed;
    bottom: 4vh;
    left: 3vw;
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--color-text-muted);
    opacity: 0.7;
  }
  .scroll-hint__line {
    width: 1px;
    height: 32px;
    background: linear-gradient(to bottom, var(--color-text-muted), transparent);
    animation: scrollHintPulse 2s ease-in-out infinite;
  }
  @keyframes scrollHintPulse {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  /* -------- Cursor / touch trail -------- */
  .cursor-trail-canvas {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    mix-blend-mode: screen;
  }

  .scroll-spacer { width: 100%; }

  /* Oculta el hint una vez que se empezó a scrollear (clase agregada por JS) */
  .app-root--scrolled .scroll-hint { opacity: 0; pointer-events: none; }

/* ============================================================
   CONFIG: client.config
   Ajustá acá colores de marca, tipografías, CTA, partículas y
   la ruta de tu modelo GLTF/GLB (si no hay, se usa un objeto

   ============================================================ */
const clientConfig = {

  colors: {
    accent: "#c8ff00",
    accentSecondary: "#7dfff0",
    background: "#0f0f1a",
    textPrimary: "#f5f6f2",
    textMuted: "rgba(245, 246, 242, 0.6)",
  },
  fonts: {
    display: "'Fraunces', serif",
    body: "'Inter', sans-serif",
  },
  particles: {
    count: 900,
    color: "#c8ff00",
    size: 0.015,
  },
  cta: {
    href: "https://wa.me/5493435020970?text=Hola%20weebStudio,%20quiero%20una%20Scroll%20Experience",
    label: "Hablar por WhatsApp",
  },

/* ============================================================
   CONFIG: personaje 3D animado (GLB con esqueleto, sin clips)
   ------------------------------------------------------------
   FÍSICA DEL PERSONAJE — CÓMO FUNCIONA (leer antes de tocar)
   ------------------------------------------------------------
   En vez de aplicar rotaciones directas (rotation = progress*PI)
   o mover cada hueso con un Math.sin() independiente, el cuerpo
   se modela como una CADENA DE MASAS-RESORTE (spring-damper):

     torso  →  hombro/cadera  →  brazo/muslo  →  antebrazo/gemelo  →  mano/pie

   1. Existe un "objetivo de rotación del cuerpo" (bodyTargetEuler)
      que es una FUNCIÓN PURA del progreso de scroll (0..1). No
      depende del tiempo, así que es 100% reversible: si el
      usuario vuelve hacia arriba, el objetivo baja exactamente
      por el mismo camino, sin saltos.

   2. Ese objetivo no se aplica directamente al modelo. En cambio,
      cada "tier" (torso, hombros, brazos, antebrazos, manos) es
      un spring-damper independiente que PERSIGUE al tier anterior
      (no al objetivo final). Un resorte crítica/sub-amortiguado
      genera automáticamente: aceleración, velocidad máxima,
      desaceleración y un pequeño "pasarse" (overshoot) antes de
      estabilizarse — exactamente la curva que pedía el brief,
      sin tener que animarla a mano.

   3. Como cada tier persigue al anterior con menor rigidez
      (STIFFNESS), el torso se mueve primero, los hombros lo
      siguen con un pequeño retraso, los brazos más, los
      antebrazos más, y las manos son las últimas en "enterarse"
      del movimiento. Eso es inercia real, no una ola sinusoidal.

   4. La diferencia entre el valor actual de un tier y el
      anterior (su "atraso") se usa como magnitud de swing para
      los huesos de esa extremidad — así el brazo se abre/cierra
      según cuánto está atrasado respecto al torso, en vez de
      seguir una curva prefijada.

   5. Un pequeño balanceo residual (idle sway), con frecuencias
      irracionales entre sí y desfasadas entre izquierda/derecha,
      se suma SIEMPRE por encima de todo lo anterior — así el
      personaje nunca queda 100% congelado ni 100% simétrico.
      Esta capa es la única que depende del tiempo real (no del
      progreso), y su amplitud se atenúa automáticamente durante
      las fases de mayor energía (giro/caída) para no ensuciar el
      movimiento principal.

   Podés ajustar la intensidad de todo el sistema desde el bloque
   PHYSICS_TUNABLES más abajo.
   ============================================================ */
const CHARACTER_MODEL_URL = "./assets/models/weeb2.glb";

// ---- Fases narrativas del scroll (0..1) ----
const PH_FLOAT_END = 0.15;    // hasta acá: suspensión, casi sin desplazamiento de cámara
const PH_APPROACH_END = 0.24; // hasta acá: acercamiento (dolly-in)
const PH_FLIP_END = 0.4;      // hasta acá: impulso — gira 180° (queda boca abajo)
const PH_TUMBLE_END = 0.88;   // hasta acá: caída con giro libre en varios ejes
// de PH_TUMBLE_END a 1: asentamiento — la energía decae y vuelve el idle sway

/* ---- Parámetros ajustables de la física visual ----
   Subí STIFFNESS para menos retraso entre articulaciones (más
   "rígido"); bajalo para más inercia/pesadez. DAMPING controla
   cuánto "overshoot" (rebote) hay antes de estabilizarse: valores
   más bajos = más rebote; valores más altos = más seco. */
const PHYSICS_TUNABLES = {
  tierStiffness: { torso: 170, shoulder: 78, upper: 44, fore: 27, hand: 17 },
  tierDamping:   { torso: 21,  shoulder: 13, upper: 9.2, fore: 7,  hand: 5.4 },
  armSwingGain: 0.62,      // cuánto abren/cierran los brazos según el atraso
  legSwingGain: 0.5,       // ídem piernas
  handFlopGain: 0.85,      // ídem manos/pies (más sueltos, al final de la cadena)
  twistGain: 0.32,         // huesos *Twist* (torsión) — fracción del segmento padre
  idleSwayAmplitude: 1.0,  // multiplicador global del balanceo residual
  extraSpinsX: 1.05,       // vueltas extra en X durante la caída (además del giro de 180°)
  extraSpinsY: 0.45,       // vueltas extra en Y durante la caída
  extraSpinsZ: 0.65,       // vueltas extra en Z durante la caída
  overshootDamping: 0.82,  // <1 = sub-amortiguado (rebota un poco), 1 = crítico (sin rebote)
};

// Curva suave tipo "ease" para que toda transición sea fluida,
// nunca lineal/brusca.
function smoothstep(edge0, edge1, x) {
  const t = clamp((x - edge0) / (edge1 - edge0));
  return t * t * (3 - 2 * t);
}

/* ============================================================
   CONFIG: scenes.config
   Cada keyframe define un "beat" narrativo entre progress 0..1.
   blendScenes() interpola linealmente entre el keyframe anterior
   y el siguiente según el scroll. Maneja cámara, luz, niebla y
   partículas — la coreografía del personaje vive en
   AnimatedCharacter. Ningún keyframe lleva texto salvo el
   primero (manejado aparte por HeroText) y el último (CTA).
   ============================================================ */
const scenes = [
  {
    id: "float",
    progress: 0,
    camera: { position: [0, 0.1, 4.3], lookAt: [0, 0, 0], fov: 30 },
    particles: { spread: 1, opacity: 0.3 },

    fog: { color: "#0f0f1a", far: 20 },
    background: "#0f0f1a",
    tunnelIntensity: 0,
  },
  {
    id: "approach",
    progress: 0.24,
    camera: { position: [0, 0.08, 3.7], lookAt: [0, 0, 0], fov: 29 },
    particles: { spread: 1.1, opacity: 0.35 },
    light: { color: "#ffffff", intensity: 0.5, rimColor: "#c8ff00", rimIntensity: 1.3 },
    fog: { color: "#0f0f1a", far: 18 },
    background: "#0f0f1a",
    tunnelIntensity: 0.05,
  },
  {
    id: "flip",
    progress: 0.4,
    camera: { position: [0.2, 0, 4.2], lookAt: [0, -0.1, 0], fov: 32 },
    particles: { spread: 1.4, opacity: 0.45 },
    light: { color: "#ffffff", intensity: 0.45, rimColor: "#7dfff0", rimIntensity: 1.8 },
    fog: { color: "#0a0a14", far: 12 },
    background: "#0a0a14",
    tunnelIntensity: 0.3,
  },
  {
    id: "tumble-mid",
    progress: 0.62,
    camera: { position: [-0.3, 0.05, 4.6], lookAt: [0, 0, 0], fov: 34 },
    particles: { spread: 2, opacity: 0.6 },
    light: { color: "#ffffff", intensity: 0.4, rimColor: "#7dfff0", rimIntensity: 2.2 },
    fog: { color: "#050508", far: 8 },
    background: "#050508",
    tunnelIntensity: 0.8,
  },
  {
    id: "tumble-end",
    progress: 0.88,
    camera: { position: [0, 0, 5.2], lookAt: [0, 0, 0], fov: 30 },
    particles: { spread: 1.2, opacity: 0.3 },
    light: { color: "#ffffff", intensity: 0.5, rimColor: "#c8ff00", rimIntensity: 1.5 },
    fog: { color: "#000000", far: 12 },
    background: "#000000",
    tunnelIntensity: 0.1,
  },
  {
    id: "cierre",
    progress: 1,
    camera: { position: [0, 0, 5.2], lookAt: [0, 0, 0], fov: 28 },
    particles: { spread: 1, opacity: 0.25 },
    light: { color: "#ffffff", intensity: 0.6, rimColor: "#c8ff00", rimIntensity: 1.8 },
    fog: { color: "#000000", far: 10 },
    background: "#000000",
    tunnelIntensity: 0,
    showCTA: true,
    text: {

      title: "Llevemos tu marca a otro nivel.",
      subtitle: "",
      align: "center",
    },

const SCROLL_LENGTH_VH = 950;

/* ============================================================
   UTILS: easing.ts
   ============================================================ */
function damp(current, target, lambda, dt) {
  return current + (target - current) * (1 - Math.exp(-lambda * dt));
}
function clamp(value, min = 0, max = 1) {
  return Math.min(max, Math.max(min, value));
}

/* ============================================================
   UTILS: spring.ts
   Spring-damper vectorial (x,y,z) para simular inercia real
   entre "tiers" del cuerpo. Ver comentario grande arriba.
   ============================================================ */
class Spring3 {
  constructor(stiffness = 120, damping = 14) {
    this.x = 0; this.y = 0; this.z = 0;
    this.vx = 0; this.vy = 0; this.vz = 0;
    this.stiffness = stiffness;
    this.damping = damping;
  }
  snap(x, y, z) {
    this.x = x; this.y = y; this.z = z;
    this.vx = this.vy = this.vz = 0;
  }
  update(tx, ty, tz, dt) {
    const dtc = Math.min(dt, 1 / 30); // clamp para estabilidad si el tab pierde foco
    const ax = (tx - this.x) * this.stiffness - this.vx * this.damping;
    const ay = (ty - this.y) * this.stiffness - this.vy * this.damping;
    const az = (tz - this.z) * this.stiffness - this.vz * this.damping;
    this.vx += ax * dtc; this.vy += ay * dtc; this.vz += az * dtc;
    this.x += this.vx * dtc; this.y += this.vy * dtc; this.z += this.vz * dtc;
  }
}

/* ============================================================
   UTILS: device.ts
   ============================================================ */
function getDeviceProfile() {
  const isMobile = typeof window !== "undefined" && window.matchMedia("(max-width: 768px)").matches;
  return {
    isMobile,
    dpr: isMobile ? [1, 1.5] : [1, 2],
    particleMultiplier: isMobile ? 0.4 : 1,
    enablePostProcessing: !isMobile,
  };
}

/* ============================================================
   UTILS: interpolate.ts
   ============================================================ */
function lerp(a, b, t) {
  return a + (b - a) * t;
}
function lerpVec3(a, b, t) {
  return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
}
function lerpColor(a, b, t) {
  const ca = new THREE.Color(a);
  const cb = new THREE.Color(b);
  ca.lerp(cb, t);
  return "#" + ca.getHexString();
}

function sceneToState(kf) {
  return {
    camera: kf.camera,
    particles: kf.particles,
    light: kf.light,
    fog: kf.fog,
    background: kf.background,
    tunnelIntensity: kf.tunnelIntensity ?? 0,
  };
}

function blendScenes(list, rawProgress) {
  const progress = clamp(rawProgress, 0, 1);
  if (progress <= list[0].progress) return sceneToState(list[0]);
  const last = list[list.length - 1];
  if (progress >= last.progress) return sceneToState(last);

  let i = 0;
  while (i < list.length - 1 && list[i + 1].progress < progress) i++;
  const a = list[i];
  const b = list[i + 1];
  const span = b.progress - a.progress || 1;
  const t = clamp((progress - a.progress) / span);

  return {
    camera: {
      position: lerpVec3(a.camera.position, b.camera.position, t),
      lookAt: lerpVec3(a.camera.lookAt, b.camera.lookAt, t),
      fov: lerp(a.camera.fov, b.camera.fov, t),
    },
    particles: {
      spread: lerp(a.particles.spread, b.particles.spread, t),
      opacity: lerp(a.particles.opacity, b.particles.opacity, t),
    },
    light: {
      color: lerpColor(a.light.color, b.light.color, t),
      intensity: lerp(a.light.intensity, b.light.intensity, t),
      rimColor: lerpColor(a.light.rimColor, b.light.rimColor, t),
      rimIntensity: lerp(a.light.rimIntensity, b.light.rimIntensity, t),
    },
    fog: {
      color: lerpColor(a.fog.color, b.fog.color, t),
      far: lerp(a.fog.far, b.fog.far, t),
    },
    background: lerpColor(a.background, b.background, t),
    tunnelIntensity: lerp(a.tunnelIntensity ?? 0, b.tunnelIntensity ?? 0, t),
  };
}

function textWeight(kf, progress, window_ = 0.14) {
  const d = Math.abs(progress - kf.progress);
  return clamp(1 - d / window_);
}

/* ============================================================
   PHYSICS: bodyTargetEuler(progress)
   Objetivo de rotación del "torso líder" — función PURA del
   progreso de scroll (sin dependencia del tiempo), por eso es
   perfectamente reversible ante scroll hacia atrás. El giro de
   180° ocurre durante IMPULSO; los giros extra (tumbling) se
   siguen acumulando de forma determinística según el progreso
   durante CAÍDA, y se congelan naturalmente al llegar a
   PH_TUMBLE_END (ahí termina de crecer el objetivo, así que el
   resorte lo alcanza y se asienta solo — sin necesidad de un
   "freno" manual).
   ============================================================ */
function bodyTargetEuler(progress) {
  const approachW = smoothstep(PH_FLOAT_END, PH_APPROACH_END, progress);
  const flipW = smoothstep(PH_APPROACH_END, PH_FLIP_END, progress);
  const tumbleW = smoothstep(PH_FLIP_END, PH_TUMBLE_END, progress);
  const settleW = smoothstep(PH_TUMBLE_END, 1, progress);

  const x = flipW * Math.PI + tumbleW * PHYSICS_TUNABLES.extraSpinsX * Math.PI * 2;
  const y = tumbleW * PHYSICS_TUNABLES.extraSpinsY * Math.PI * 2;
  const z = tumbleW * PHYSICS_TUNABLES.extraSpinsZ * Math.PI * 2;

  return { x, y, z, approachW, flipW, tumbleW, settleW };
}

/* ============================================================
   STORE: scroll/scrollStore.ts
   ============================================================ */
const useScrollStore = create((set) => ({
  progress: 0,
  smoothProgress: 0,
  setProgress: (p) => set({ progress: p }),
  setSmoothProgress: (p) => set({ smoothProgress: p }),
}));

/* ============================================================
   HOOK: scroll/useScrollProgress.ts
   Traduce el alto del spacer + scrollY del documento en un
   progreso 0..1 crudo, guardado en el store.
   ============================================================ */
function useScrollProgress(spacerRef) {
  useEffect(() => {
    const compute = () => {
      const el = spacerRef.current;
      if (!el) return;
      const total = el.offsetHeight - window.innerHeight;
      const raw = total > 0 ? window.scrollY / total : 0;
      const p = clamp(raw, 0, 1);
      useScrollStore.getState().setProgress(p);
      document.body.classList.toggle("app-root--scrolled", window.scrollY > 20);
    };
    compute();
    window.addEventListener("scroll", compute, { passive: true });
    window.addEventListener("resize", compute);
    return () => {
      window.removeEventListener("scroll", compute);
      window.removeEventListener("resize", compute);
    };
  }, [spacerRef]);
}

/* ============================================================
   COMPONENT (dentro de <Canvas>): scroll/ScrollSmoother.tsx
   Amortigua smoothProgress hacia progress cuadro a cuadro. Esto
   separa conceptualmente "intención de scroll" (progress, puede
   saltar) de "estado físico" (smoothProgress, siempre continuo)
   — así un scroll brusco nunca produce un salto instantáneo.
   ============================================================ */
function ScrollSmoother() {
  useFrame((_, delta) => {
    const { progress, smoothProgress, setSmoothProgress } = useScrollStore.getState();
    setSmoothProgress(damp(smoothProgress, progress, 4, delta));
  });
  return null;
}

/* ============================================================
   HOOK: engine/utils/useMouseParallax.ts
   ============================================================ */
function useMouseParallax() {
  const mouse = useRef({ x: 0, y: 0 });
  useEffect(() => {
    const onMove = (e) => {
      if (e.pointerType !== "mouse") return;
      mouse.current.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.current.y = (e.clientY / window.innerHeight) * 2 - 1;
    };
    window.addEventListener("pointermove", onMove, { passive: true });
    return () => window.removeEventListener("pointermove", onMove);
  }, []);
  return mouse;
}

/* ============================================================
   three/CameraRig.jsx
   Cámara cinematográfica: además de seguir el keyframe de la
   escena (posición/FOV/lookAt), suma:
     - microderiva orgánica constante (nunca 100% estática)
     - un "impulso" de anticipación justo antes del giro (se
       retrasa levemente, como tomando aire) y empuje durante él
     - un leve dutch-angle (roll) proporcional a la velocidad
       angular real del torso (tomada directo del spring), para
       que la cámara "sienta" el giro en vez de solo mostrarlo
     - parallax de mouse muy sutil, ya existente
   ============================================================ */
function CameraRig({ mouse, torsoAngVelRef }) {
  const { camera } = useThree();
  const lookAtTarget = useRef(new THREE.Vector3());
  const currentLookAt = useRef(new THREE.Vector3());
  const clockRef = useRef(0);
  const rollRef = useRef(0);

  useFrame((_, delta) => {
    clockRef.current += delta;
    const t = clockRef.current;
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    const [px, py, pz] = state.camera.position;
    const [lx, ly, lz] = state.camera.lookAt;
    const mx = mouse.current?.x ?? 0;
    const my = mouse.current?.y ?? 0;

    // Anticipación: justo antes del impulso la cámara se retrasa
    // un poco (se aleja levemente) y luego empuja al entrar al giro.
    const anticipation = smoothstep(PH_APPROACH_END - 0.05, PH_APPROACH_END + 0.01, progress) *
      (1 - smoothstep(PH_APPROACH_END + 0.01, PH_FLIP_END * 0.6, progress));
    const zAnticip = anticipation * 0.18;

    // Microderiva orgánica permanente (frecuencias no relacionadas).
    const driftX = Math.sin(t * 0.17) * 0.035 + Math.sin(t * 0.071 + 1.4) * 0.02;
    const driftY = Math.cos(t * 0.13 + 0.6) * 0.025;

    camera.position.x = damp(camera.position.x, px + mx * 0.18 + driftX, 6, delta);
    camera.position.y = damp(camera.position.y, py - my * 0.11 + driftY, 6, delta);
    camera.position.z = damp(camera.position.z, pz + zAnticip, 5, delta);

    lookAtTarget.current.set(lx + mx * 0.05, ly - my * 0.05, lz);
    currentLookAt.current.lerp(lookAtTarget.current, 1 - Math.exp(-6 * delta));
    camera.lookAt(currentLookAt.current);

    if ("fov" in camera) {
      const fovKick = anticipation * -1.2; // se "cierra" levemente antes de empujar
      camera.fov = damp(camera.fov, state.camera.fov + fovKick, 5, delta);
      camera.updateProjectionMatrix();
    }

    // Dutch-angle sutil ligado a la velocidad angular real del torso.
    const angVel = torsoAngVelRef?.current ?? 0;
    rollRef.current = damp(rollRef.current, clamp(angVel * 0.018, -0.12, 0.12), 5, delta);
    camera.rotation.z = rollRef.current;
  });

  return null;
}

/* ============================================================
   three/AnimatedCharacter.jsx
   Personaje 3D real (GLB con esqueleto propio, sin clips
   grabados). Ver el bloque de comentarios grande más arriba
   ("FÍSICA DEL PERSONAJE") para el diseño general.

   Jerarquía real detectada en el GLB (weeb2.glb):
     Hip → Pelvis → L_Thigh/R_Thigh → L_Calf/R_Calf → L_Foot/R_Foot
     Hip → Waist → Spine01 → Spine02 → NeckTwist01 → NeckTwist02 → Head
                             → L_Clavicle → L_Upperarm → L_Forearm → L_Hand
                             → R_Clavicle → R_Upperarm → R_Forearm → R_Hand
   más huesos *Twist* intermedios (torsión), que se detectan y
   usan automáticamente si existen (ver detección de huesos
   secundarios más abajo).
   ============================================================ */
const PRIMARY_BONE_NAMES = {
  spine1: "Spine01",
  spine2: "Spine02",
  head: "Head",
  neck1: "NeckTwist01",
  neck2: "NeckTwist02",
  lClavicle: "L_Clavicle",
  rClavicle: "R_Clavicle",
  lUpperarm: "L_Upperarm",
  lForearm: "L_Forearm",
  lHand: "L_Hand",
  rUpperarm: "R_Upperarm",
  rForearm: "R_Forearm",
  rHand: "R_Hand",
  lThigh: "L_Thigh",
  lCalf: "L_Calf",
  lFoot: "L_Foot",
  rThigh: "R_Thigh",
  rCalf: "R_Calf",
  rFoot: "R_Foot",
};

// Patrones para detectar huesos secundarios (torsión) automáticamente,
// sin necesidad de listarlos uno por uno — punto 18 del brief.
const TWIST_PATTERN = /Twist/i;

function AnimatedCharacter({ mouse, torsoAngVelRef }) {
  const groupRef = useRef(null);
  const { scene } = useGLTF(CHARACTER_MODEL_URL);
  const bonesRef = useRef({});
  const restRef = useRef({});
  const twistBonesRef = useRef([]); // [{ bone, rest, parentKey }]
  const clockRef = useRef(0);

  // Tiers del spring-damper (cadena torso → hombro → brazo → antebrazo → mano)
  const torsoSpring = useRef(new Spring3(
    PHYSICS_TUNABLES.tierStiffness.torso, PHYSICS_TUNABLES.tierDamping.torso
  )).current;
  const shoulderSpring = useRef(new Spring3(
    PHYSICS_TUNABLES.tierStiffness.shoulder, PHYSICS_TUNABLES.tierDamping.shoulder
  )).current;
  const upperSpring = useRef(new Spring3(
    PHYSICS_TUNABLES.tierStiffness.upper, PHYSICS_TUNABLES.tierDamping.upper
  )).current;
  const foreSpring = useRef(new Spring3(
    PHYSICS_TUNABLES.tierStiffness.fore, PHYSICS_TUNABLES.tierDamping.fore
  )).current;
  const handSpring = useRef(new Spring3(
    PHYSICS_TUNABLES.tierStiffness.hand, PHYSICS_TUNABLES.tierDamping.hand
  )).current;

  const prevTorsoX = useRef(0);

  useEffect(() => {
    const bones = {};
    const rest = {};
    Object.entries(PRIMARY_BONE_NAMES).forEach(([key, boneName]) => {
      const bone = scene.getObjectByName(boneName);
      if (bone) {
        bones[key] = bone;
        rest[key] = bone.rotation.clone();
      }
    });
    bonesRef.current = bones;
    restRef.current = rest;

    // Detección automática de huesos de torsión (*Twist*) — se
    // asocian por cercanía de nombre al segmento primario más
    // parecido (ej: L_ForearmTwist01 → lForearm).
    const twists = [];
    scene.traverse((obj) => {
      if (!obj.isBone && !obj.isObject3D) return;
      if (!TWIST_PATTERN.test(obj.name || "")) return;
      const lower = obj.name.toLowerCase();
      let parentKey = null;
      if (lower.includes("forearm")) parentKey = lower.startsWith("l_") || lower.includes("l_forearm") ? "lForearm" : "rForearm";
      else if (lower.includes("upperarm")) parentKey = lower.includes("l_") ? "lUpperarm" : "rUpperarm";
      else if (lower.includes("thigh")) parentKey = lower.includes("l_") ? "lThigh" : "rThigh";
      else if (lower.includes("calf")) parentKey = lower.includes("l_") ? "lCalf" : "rCalf";
      if (parentKey) {
        twists.push({ bone: obj, rest: obj.rotation.clone(), parentKey });
      }
    });
    twistBonesRef.current = twists;

    // "Snap" inicial de los springs a un estado neutro coherente.
    torsoSpring.snap(0, 0, 0);
    shoulderSpring.snap(0, 0, 0);
    upperSpring.snap(0, 0, 0);
    foreSpring.snap(0, 0, 0);
    handSpring.snap(0, 0, 0);
  }, [scene]);

  useFrame((_, deltaRaw) => {
    const delta = Math.min(deltaRaw, 1 / 30);
    clockRef.current += delta;
    const t = clockRef.current;
    const progress = useScrollStore.getState().smoothProgress;
    const bones = bonesRef.current;
    const rest = restRef.current;
    const group = groupRef.current;
    if (!group) return;

    const { x, y, z, approachW, flipW, tumbleW, settleW } = bodyTargetEuler(progress);

    // ---- Cadena de resortes: cada tier persigue al anterior ----
    torsoSpring.update(x, y, z, delta);
    shoulderSpring.update(torsoSpring.x, torsoSpring.y, torsoSpring.z, delta);
    upperSpring.update(shoulderSpring.x, shoulderSpring.y, shoulderSpring.z, delta);
    foreSpring.update(upperSpring.x, upperSpring.y, upperSpring.z, delta);
    handSpring.update(foreSpring.x, foreSpring.y, foreSpring.z, delta);

    // Velocidad angular real del torso (para la cámara / vórtice).
    const angVel = (torsoSpring.x - prevTorsoX.current) / Math.max(delta, 1e-4);
    prevTorsoX.current = torsoSpring.x;
    if (torsoAngVelRef) torsoAngVelRef.current = angVel;

    // ---- Idle sway residual: siempre presente, nunca 0 ----
    // Se atenúa durante las fases de más energía para no ensuciar
    // el movimiento principal, y vuelve con fuerza al asentarse.
    const idleGain = PHYSICS_TUNABLES.idleSwayAmplitude *
      clamp(1 - flipW * 0.9 - tumbleW * 0.75 + settleW * 0.5);
    const idleX = (Math.sin(t * 0.9) * 0.55 + Math.sin(t * 0.233 + 1.7) * 0.45) * 0.045 * idleGain;
    const idleY = (Math.sin(t * 0.61 + 0.4) * 0.5 + Math.sin(t * 0.157 + 2.9) * 0.5) * 0.035 * idleGain;
    const idleZ = Math.sin(t * 0.41 + 2.2) * 0.03 * idleGain;

    // ---- Posición: flota → se acerca → se aleja cayendo ----
    const zFloat = -1.4;
    const zApproach = -0.6;
    const zFar = -6.2;
    let targetZ;
    if (progress < PH_FLIP_END) {
      targetZ = zFloat + (zApproach - zFloat) * approachW;
    } else {
      targetZ = zApproach + (zFar - zApproach) * tumbleW;
    }
    group.position.z = damp(group.position.z, targetZ, 2.2, delta);
    group.position.y = -0.5 + idleY * 0.6 + Math.sin(t * 0.8) * 0.045 * idleGain;

    // ---- Rotación principal del grupo = tier "torso" (líder) ----
    group.rotation.x = torsoSpring.x + idleX;
    group.rotation.y = torsoSpring.y + idleY * 0.4;
    group.rotation.z = torsoSpring.z + idleZ;

    // ---- Atrasos entre tiers (magnitud del "follow-through") ----
    const dShoulder = {
      x: torsoSpring.x - shoulderSpring.x,
      y: torsoSpring.y - shoulderSpring.y,
      z: torsoSpring.z - shoulderSpring.z,
    };
    const dUpper = {
      x: shoulderSpring.x - upperSpring.x,
      y: shoulderSpring.y - upperSpring.y,
      z: shoulderSpring.z - upperSpring.z,
    };
    const dFore = {
      x: upperSpring.x - foreSpring.x,
      y: upperSpring.y - foreSpring.y,
      z: upperSpring.z - foreSpring.z,
    };
    const dHand = {
      x: foreSpring.x - handSpring.x,
      y: foreSpring.y - handSpring.y,
      z: foreSpring.z - handSpring.z,
    };

    const armGain = PHYSICS_TUNABLES.armSwingGain;
    const legGain = PHYSICS_TUNABLES.legSwingGain;
    const flopGain = PHYSICS_TUNABLES.handFlopGain;

    // Pequeña asimetría izquierda/derecha: distintas ganancias y
    // fases, para que ningún lado se mueva exactamente igual.
    const asymL = 1.0;
    const asymR = 0.9;
    const phL = 0;
    const phR = 1.15;

    // ---- Clavículas: apenas se mueven, pero no están muertas ----
    if (bones.lClavicle) bones.lClavicle.rotation.z = rest.lClavicle.z + dShoulder.x * 0.12 * asymL + Math.sin(t * 1.1) * 0.01 * idleGain;
    if (bones.rClavicle) bones.rClavicle.rotation.z = rest.rClavicle.z - dShoulder.x * 0.12 * asymR - Math.sin(t * 1.05 + phR) * 0.01 * idleGain;

    // ---- Brazos: swing principal por atraso del tier "upper" ----
    if (bones.lUpperarm) {
      bones.lUpperarm.rotation.z = rest.lUpperarm.z + dUpper.x * armGain * asymL + Math.sin(t * 1.3 + phL) * 0.05 * idleGain;
      bones.lUpperarm.rotation.x = rest.lUpperarm.x + dUpper.z * armGain * 0.5;
    }
    if (bones.rUpperarm) {
      bones.rUpperarm.rotation.z = rest.rUpperarm.z - dUpper.x * armGain * asymR - Math.sin(t * 1.5 + phR) * 0.05 * idleGain;
      bones.rUpperarm.rotation.x = rest.rUpperarm.x - dUpper.z * armGain * 0.5;
    }
    if (bones.lForearm) bones.lForearm.rotation.x = rest.lForearm.x + dFore.x * armGain * 0.9 * asymL + Math.sin(t * 1.8 + phL) * 0.045 * idleGain;
    if (bones.rForearm) bones.rForearm.rotation.x = rest.rForearm.x + dFore.x * armGain * 0.9 * asymR + Math.sin(t * 1.7 + phR) * 0.045 * idleGain;

    // ---- Manos: último eslabón, el más "suelto" ----
    if (bones.lHand) bones.lHand.rotation.x = rest.lHand.x + dHand.x * flopGain * asymL;
    if (bones.rHand) bones.rHand.rotation.x = rest.rHand.x + dHand.x * flopGain * asymR;

    // ---- Piernas: mismos tiers, ganancia y ejes propios ----
    if (bones.lThigh) {
      bones.lThigh.rotation.x = rest.lThigh.x + dUpper.x * legGain * asymL + Math.sin(t * 1.1 + phL + 2.4) * 0.035 * idleGain;
      bones.lThigh.rotation.z = rest.lThigh.z + dUpper.z * legGain * 0.4;
    }
    if (bones.rThigh) {
      bones.rThigh.rotation.x = rest.rThigh.x + dUpper.x * legGain * asymR + Math.sin(t * 1.2 + phR + 0.3) * 0.035 * idleGain;
      bones.rThigh.rotation.z = rest.rThigh.z - dUpper.z * legGain * 0.4;
    }
    if (bones.lCalf) bones.lCalf.rotation.x = rest.lCalf.x + dFore.x * legGain * 0.85 * asymL + Math.sin(t * 1.6 + phL + 1.5) * 0.03 * idleGain;
    if (bones.rCalf) bones.rCalf.rotation.x = rest.rCalf.x + dFore.x * legGain * 0.85 * asymR + Math.sin(t * 1.4 + phR + 3.0) * 0.03 * idleGain;
    if (bones.lFoot) bones.lFoot.rotation.x = rest.lFoot.x + dHand.x * flopGain * 0.6 * asymL;
    if (bones.rFoot) bones.rFoot.rotation.x = rest.rFoot.x + dHand.x * flopGain * 0.6 * asymR;

    // ---- Torso: además del liderazgo del grupo, un curl propio
    // hacia adelante durante la caída (postura de caída libre). ----
    const curl = tumbleW * 0.32;
    if (bones.spine1) bones.spine1.rotation.x = rest.spine1.x + curl * 0.45 + dShoulder.x * 0.08 + Math.sin(t * 1.05) * 0.018 * idleGain;
    if (bones.spine2) bones.spine2.rotation.x = rest.spine2.x + curl * 0.65 + dShoulder.x * 0.05;

    // ---- Cabeza/cuello: sigue el mouse mientras flota, y suma
    // su propio desfase de "independencia" durante el giro/caída. ----
    const headFollow = 1 - flipW - tumbleW * 0.6;
    const mx = (mouse?.current?.x ?? 0) * clamp(headFollow);
    const my = (mouse?.current?.y ?? 0) * clamp(headFollow);
    if (bones.neck1) bones.neck1.rotation.y = damp(bones.neck1.rotation.y, rest.neck1.y + dShoulder.x * 0.1 + mx * 0.06, 5, delta);
    if (bones.neck2) bones.neck2.rotation.x = damp(bones.neck2.rotation.x, rest.neck2.x + dUpper.x * 0.06, 5, delta);
    if (bones.head) {
      bones.head.rotation.y = damp(bones.head.rotation.y, rest.head.y + mx * 0.22 + dHand.x * 0.07 + Math.sin(t * 0.85 + 4) * 0.04 * idleGain, 5, delta);
      bones.head.rotation.x = damp(bones.head.rotation.x, rest.head.x - my * 0.13 + Math.sin(t * 0.6 + 1) * 0.02 * idleGain, 5, delta);
    }

    // ---- Huesos de torsión detectados automáticamente: cada uno
    // recibe una fracción de la rotación de su segmento padre, en
    // sentido contrario, simulando una torsión de tejido real. ----
    const segmentDeltas = {
      lForearm: dFore.x * armGain * 0.9 * asymL,
      rForearm: dFore.x * armGain * 0.9 * asymR,
      lUpperarm: dUpper.x * armGain * asymL,
      rUpperarm: dUpper.x * armGain * asymR,
      lThigh: dUpper.x * legGain * asymL,
      rThigh: dUpper.x * legGain * asymR,
      lCalf: dFore.x * legGain * 0.85 * asymL,
      rCalf: dFore.x * legGain * 0.85 * asymR,
    };
    twistBonesRef.current.forEach(({ bone, rest: r, parentKey }) => {
      const src = segmentDeltas[parentKey] ?? 0;
      bone.rotation.x = r.x - src * PHYSICS_TUNABLES.twistGain;
    });
  });

  return <primitive ref={groupRef} object={scene} position={[0, -0.5, -1.4]} scale={1.7} />;
}
useGLTF.preload(CHARACTER_MODEL_URL);

/* ============================================================
   three/SpeedLines.jsx
   Líneas radiales tipo "warp speed" que aparecen durante el
   giro/caída. A diferencia de la versión anterior, ahora
   reaccionan tanto al beat narrativo (tunnelIntensity de la
   escena) COMO a la velocidad angular real del torso — así se
   sienten producidas por el movimiento del personaje y no un
   efecto decorativo pegado detrás. Se integran a la profundidad
   (viven detrás del personaje, escalan con la cámara) y jamás
   compiten con él: su opacidad máxima está deliberadamente
   limitada.
   ============================================================ */
function SpeedLines({ torsoAngVelRef }) {
  const LINE_COUNT = 36;
  const groupRef = useRef(null);
  const materialRef = useRef(null);
  const velSmoothed = useRef(0);

  const positions = useMemo(() => {
    const arr = new Float32Array(LINE_COUNT * 2 * 3);
    for (let i = 0; i < LINE_COUNT; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 0.4 + Math.random() * 1.6;
      const length = 0.6 + Math.random() * 1.8;
      const x1 = Math.cos(angle) * radius;
      const y1 = Math.sin(angle) * radius;
      const x2 = Math.cos(angle) * (radius + length);
      const y2 = Math.sin(angle) * (radius + length);
      arr[i * 6 + 0] = x1;
      arr[i * 6 + 1] = y1;
      arr[i * 6 + 2] = 0;
      arr[i * 6 + 3] = x2;
      arr[i * 6 + 4] = y2;
      arr[i * 6 + 5] = 0;
    }
    return arr;
  }, []);

  useFrame((_, delta) => {
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    const rawVel = clamp(Math.abs(torsoAngVelRef?.current ?? 0) / 6, 0, 1);
    velSmoothed.current = damp(velSmoothed.current, rawVel, 4, delta);
    const intensity = clamp(state.tunnelIntensity * 0.6 + velSmoothed.current * 0.5, 0, 1);

    if (groupRef.current) {
      groupRef.current.rotation.z += delta * (0.25 + intensity * 0.9);
      const s = 0.6 + intensity * 2.2;
      groupRef.current.scale.setScalar(damp(groupRef.current.scale.x, s, 5, delta));
    }
    if (materialRef.current) {
      // Techo de opacidad deliberadamente bajo: nunca debe robarle
      // protagonismo al personaje (punto 9 / 14 del brief).
      materialRef.current.opacity = damp(materialRef.current.opacity, intensity * 0.6, 5, delta);
    }
  });

  return (
    <group ref={groupRef} position={[0, 0, 2]}>
      <lineSegments>
        <bufferGeometry>
          <bufferAttribute attach="attributes-position" args={[positions, 3]} />
        </bufferGeometry>
        <lineBasicMaterial
          ref={materialRef}
          color={clientConfig.colors.accent}
          transparent
          opacity={0}
          toneMapped={false}
        />
      </lineSegments>
    </group>
  );
}

/* ============================================================
   three/Particles.jsx
   Además del spread/opacidad ya ligados a la escena, ahora la
   rotación del sistema y una leve "elongación" radial reaccionan
   a la velocidad angular real del personaje, para dar sensación
   de velocidad durante la caída sin agregar más partículas.
   ============================================================ */
function Particles({ device, torsoAngVelRef }) {
  const pointsRef = useRef(null);
  const materialRef = useRef(null);
  const count = Math.round(clientConfig.particles.count * device.particleMultiplier);

  const positions = useMemo(() => {
    const arr = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      arr[i * 3] = (Math.random() - 0.5) * 2;
      arr[i * 3 + 1] = (Math.random() - 0.5) * 2;
      arr[i * 3 + 2] = (Math.random() - 0.5) * 2;
    }
    return arr;
  }, [count]);

  useFrame((state, delta) => {
    const progress = useScrollStore.getState().smoothProgress;
    const blended = blendScenes(scenes, progress);
    const speedBoost = clamp(Math.abs(torsoAngVelRef?.current ?? 0) / 8, 0, 1);
    if (pointsRef.current) {
      const targetScale = blended.particles.spread * (1 + speedBoost * 0.25);
      pointsRef.current.scale.setScalar(damp(pointsRef.current.scale.x, targetScale, 3, delta));
      pointsRef.current.rotation.y += delta * (0.02 + speedBoost * 0.08);
      pointsRef.current.rotation.z += delta * speedBoost * 0.05;
    }
    if (materialRef.current) {
      materialRef.current.opacity = damp(materialRef.current.opacity, blended.particles.opacity, 4, delta);
    }
    void state;
  });

  return (
    <points ref={pointsRef}>
      <bufferGeometry>
        <bufferAttribute attach="attributes-position" args={[positions, 3]} />
      </bufferGeometry>
      <pointsMaterial
        ref={materialRef}
        color={clientConfig.particles.color}
        size={clientConfig.particles.size}
        transparent
        opacity={0.4}
        depthWrite={false}
        sizeAttenuation
      />
    </points>
  );
}

/* ============================================================
   three/Lighting.jsx
   ============================================================ */
function Lighting() {
  const keyRef = useRef(null);
  const rimRef = useRef(null);

  useFrame((_, delta) => {
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    if (keyRef.current) {
      keyRef.current.color.set(state.light.color);
      keyRef.current.intensity = damp(keyRef.current.intensity, state.light.intensity, 4, delta);
    }
    if (rimRef.current) {
      rimRef.current.color.set(state.light.rimColor);
      rimRef.current.intensity = damp(rimRef.current.intensity, state.light.rimIntensity, 4, delta);
    }
  });

  return (
    <>
      <ambientLight intensity={0.25} />
      <directionalLight ref={keyRef} position={[3, 4, 5]} intensity={0.9} />
      <directionalLight position={[-3, 2, -2]} intensity={0.35} />
      <pointLight ref={rimRef} position={[-2.5, -1, -2]} intensity={1.4} distance={12} />
    </>
  );
}

/* ============================================================
   three/SceneEnvironment.jsx
   ============================================================ */
function SceneEnvironment() {
  const { scene } = useThree();
  const fog = useRef(new THREE.FogExp2("#05070a", 0.12));
  const bgColor = useRef(new THREE.Color("#05070a"));

  useEffect(() => {
    scene.fog = fog.current;
    scene.background = bgColor.current;
  }, [scene]);

  useFrame(() => {
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    fog.current.color.set(state.fog.color);
    fog.current.density = 1 / Math.max(state.fog.far, 1);
    bgColor.current.set(state.background);
  });

  return null;
}

/* ============================================================
   three/Experience.jsx
   ============================================================ */
function Experience({ device }) {
  const mouse = useMouseParallax();
  // Velocidad angular real del torso, compartida entre el
  // personaje, la cámara, el vórtice y las partículas — así todo
  // reacciona al MISMO movimiento físico en vez de tener cada
  // efecto su propia curva inventada.
  const torsoAngVelRef = useRef(0);

  return (
    <>
      <ScrollSmoother />
      <SceneEnvironment />
      <CameraRig mouse={mouse} torsoAngVelRef={torsoAngVelRef} />
      <Lighting />
      <Environment preset="city" background={false} />
      <Suspense fallback={null}>
        <AnimatedCharacter mouse={mouse} torsoAngVelRef={torsoAngVelRef} />
      </Suspense>
      <SpeedLines torsoAngVelRef={torsoAngVelRef} />
      <Particles device={device} torsoAngVelRef={torsoAngVelRef} />
      {device.enablePostProcessing && (
        <EffectComposer multisampling={0}>
          <Bloom intensity={0.55} luminanceThreshold={0.2} luminanceSmoothing={0.9} mipmapBlur />
          <Vignette eskil={false} offset={0.15} darkness={0.7} />
        </EffectComposer>
      )}
    </>
  );
}

/* ============================================================
   ui/HeroText.jsx
   El único texto "de entrada": aparece al principio, y cuando
   arranca el giro/caída (fase GIRAR) se agranda hacia la
   pantalla mientras se desvanece, hasta desaparecer del todo.
   No vuelve a aparecer ningún otro texto hasta el CTA final
   (ese lo maneja SceneText con el keyframe "cierre").
   ============================================================ */
function HeroText() {
  const ref = useRef(null);
  const FADE_IN_END = 0.05;

  useEffect(() => {
    const update = (progress) => {
      if (!ref.current) return;
      const fadeIn = smoothstep(0, FADE_IN_END, progress);
      const zoomOut = smoothstep(PH_APPROACH_END, PH_FLIP_END, progress);
      const scale = 1 + zoomOut * 14;
      const opacity = fadeIn * (1 - zoomOut);
      ref.current.style.opacity = String(opacity);
      ref.current.style.transform = `translate(-50%, -50%) scale(${scale})`;
    };
    update(useScrollStore.getState().smoothProgress);
    return useScrollStore.subscribe((s) => update(s.smoothProgress));
  }, []);

  return (
    <div ref={ref} className="hero-text" style={{ opacity: 0 }}>
      Scroll Experience
    </div>
  );
}

/* ============================================================
   ui/SceneText.jsx
   ============================================================ */
function SceneText() {
  const refs = useRef([]);

  useEffect(() => {
    const update = (progress) => {
      scenes.forEach((kf, i) => {
        const el = refs.current[i];
        if (!el || !kf.text) return;
        const weight = textWeight(kf, progress);
        el.style.opacity = String(weight);
        el.style.transform =
          kf.text.align === "center"
            ? `translateX(-50%) translateY(${(1 - weight) * 24}px)`
            : `translateY(${(1 - weight) * 24}px)`;
        el.style.pointerEvents = weight > 0.5 ? "auto" : "none";
      });
    };
    update(useScrollStore.getState().smoothProgress);
    const unsubscribe = useScrollStore.subscribe((s) => update(s.smoothProgress));
    return unsubscribe;
  }, []);

  return (
    <div className="scene-text-layer">
      {scenes.map((kf, i) =>
        kf.text ? (
          <div
            key={kf.id}
            ref={(el) => { refs.current[i] = el; }}
            className={`scene-text scene-text--${kf.text.align}`}
            style={{ opacity: 0 }}
          >
            {kf.text.eyebrow && <span className="scene-text__eyebrow">{kf.text.eyebrow}</span>}
            <h2 className="scene-text__title">{kf.text.title}</h2>
            {kf.text.subtitle && <p className="scene-text__subtitle">{kf.text.subtitle}</p>}
          </div>
        ) : null
      )}
    </div>
  );
}

/* ============================================================
   ui/CTAButton.jsx
   ============================================================ */
const CTA_START = scenes.find((s) => s.showCTA)?.progress ?? 1;
const FADE_WINDOW = 0.06;

function CTAButton() {
  const ref = useRef(null);

  useEffect(() => {
    const update = (progress) => {
      if (!ref.current) return;
      const weight = clamp((progress - (CTA_START - FADE_WINDOW)) / FADE_WINDOW);
      ref.current.style.opacity = String(weight);
      ref.current.style.transform = `translateX(-50%) translateY(${(1 - weight) * 16}px)`;
      ref.current.style.pointerEvents = weight > 0.6 ? "auto" : "none";
    };
    update(useScrollStore.getState().smoothProgress);
    return useScrollStore.subscribe((s) => update(s.smoothProgress));
  }, []);

  return (
    <div ref={ref} className="cta-layer" style={{ opacity: 0 }}>
      <a className="cta-button" href={clientConfig.cta.href}>
        {clientConfig.cta.label}
      </a>
    </div>
  );
}

/* ============================================================
   ui/ProgressIndicator.jsx
   ============================================================ */
function ProgressIndicator() {
  const fillRef = useRef(null);

  useEffect(() => {
    const update = (progress) => {
      if (fillRef.current) fillRef.current.style.height = `${progress * 100}%`;
    };
    update(useScrollStore.getState().smoothProgress);
    return useScrollStore.subscribe((s) => update(s.smoothProgress));
  }, []);

  return (
    <div className="progress-rail" aria-hidden="true">
      <div className="progress-rail__track">
        <div ref={fillRef} className="progress-rail__fill" />
      </div>
    </div>
  );
}

/* ============================================================
   ui/CursorTrail.jsx
   Rastro luminoso que sigue al mouse (pointermove) o al dedo
   (touchmove) — el "touch trail / cursor trail" genérico.
   Dibuja en un <canvas> 2D encima del canvas 3D, con blend
   "lighter" para que el rastro brille sobre el fondo oscuro.
   ============================================================ */
function CursorTrail() {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let width = window.innerWidth;
    let height = window.innerHeight;
    let points = [];
    let rafId = 0;

    const resize = () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();

    const addPoint = (x, y) => {
      points.push({ x, y, life: 1 });
      if (points.length > 40) points.shift();
    };
    const onPointerMove = (e) => addPoint(e.clientX, e.clientY);
    const onTouchMove = (e) => {
      if (e.touches && e.touches[0]) addPoint(e.touches[0].clientX, e.touches[0].clientY);
    };

    window.addEventListener("resize", resize);
    window.addEventListener("pointermove", onPointerMove, { passive: true });
    window.addEventListener("touchmove", onTouchMove, { passive: true });

    const draw = () => {
      ctx.clearRect(0, 0, width, height);
      points.forEach((p) => { p.life *= 0.94; });
      points = points.filter((p) => p.life > 0.02);

      if (points.length > 1) {
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.globalCompositeOperation = "lighter";
        for (let i = 1; i < points.length; i++) {
          const p0 = points[i - 1];
          const p1 = points[i];
          const alpha = Math.min(p0.life, p1.life) * 0.55;
          ctx.strokeStyle = clientConfig.colors.accent;
          ctx.globalAlpha = alpha;
          ctx.lineWidth = 1.5 + alpha * 4;
          ctx.beginPath();
          ctx.moveTo(p0.x, p0.y);
          ctx.lineTo(p1.x, p1.y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
      }
      rafId = requestAnimationFrame(draw);
    };
    rafId = requestAnimationFrame(draw);

    return () => {
      cancelAnimationFrame(rafId);
      window.removeEventListener("resize", resize);
      window.removeEventListener("pointermove", onPointerMove);
      window.removeEventListener("touchmove", onTouchMove);
    };
  }, []);

  return <canvas ref={canvasRef} className="cursor-trail-canvas" aria-hidden="true" />;
}

/* ============================================================
   App.jsx
   ============================================================ */
function App() {
  const spacerRef = useRef(null);
  useScrollProgress(spacerRef);
  const device = useMemo(() => getDeviceProfile(), []);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    const t = setTimeout(() => setReady(true), 60);
    return () => clearTimeout(t);
  }, []);

  return (
    <div
      className="app-root"
      style={{
        "--brand-accent": clientConfig.colors.accent,
        "--brand-accent-2": clientConfig.colors.accentSecondary,
        "--color-bg": clientConfig.colors.background,
        "--color-text": clientConfig.colors.textPrimary,
        "--color-text-muted": clientConfig.colors.textMuted,
        "--font-display": clientConfig.fonts.display,
        "--font-body": clientConfig.fonts.body,
      }}
    >
      <div className={`canvas-stage ${ready ? "canvas-stage--ready" : ""}`}>
        <Canvas
          dpr={device.dpr}
          gl={{ antialias: true, powerPreference: "high-performance" }}
          camera={{ position: [0, 0.2, 6.5], fov: 35, near: 0.1, far: 60 }}
        >
          <Experience device={device} />
        </Canvas>
        <CursorTrail />
        <HeroText />
        <SceneText />
        <CTAButton />
        <ProgressIndicator />
        <header className="brand-mark">
          <span>{clientConfig.brand.name}</span>
        </header>
        <div className="scroll-hint" aria-hidden="true">
          <span>Scroll</span>
          <div className="scroll-hint__line" />
        </div>
      </div>
      <div ref={spacerRef} className="scroll-spacer" style={{ height: `${SCROLL_LENGTH_VH}vh` }} />
    </div>
  );
}

createRoot(document.getElementById("root")).render(<App />);

</script>
