<style>
  :root {
    --brand-accent: #49d3ff;
    --brand-accent-2: #6ee7c9;
    --color-bg: #05070a;
    --color-text: #ffffff8a;
    --color-text-muted: rgba(244, 241, 234, 0.6);
    --font-display: "Space Grotesk", sans-serif;
    --font-body: "Inter", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    overflow-x: hidden;
  }

  @media (min-width: 769px) and (pointer: fine) {
    html {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar {
      display: none;
    }
  }

  #root { width: 100%; }

  .app-root {
    position: relative;
    width: 100%;
  }

  .canvas-stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #05070a;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .canvas-stage--ready { opacity: 1; }
  .canvas-stage canvas { display: block; width: 100% !important; height: 100% !important; }

  .hero-text {
    position: absolute;
    top: 25%;
    left: 50%;
    transform: translate(-50%, -50%);
    transform-origin: center center;
    z-index: 5;
    pointer-events: none;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2.1rem, 4.5vw, 3.2rem);
    letter-spacing: 0.07em;
    color: var(--color-text);
    white-space: nowrap;
    will-change: opacity, transform;
  }

  .scene-text-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }
  .scene-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 8vw;
    max-width: 720px;
    will-change: opacity, transform;
  }
  .scene-text--left    { align-items: flex-start; text-align: left; }
  .scene-text--center  { align-items: center; text-align: center; left: 50%; transform: translateX(-50%); max-width: 640px; }
  .scene-text--right   { align-items: flex-end; text-align: right; margin-left: auto; }

  .scene-text__eyebrow {
    font-family: var(--font-body);
    font-size: 0.75rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--brand-accent);
    margin-bottom: 0.75rem;
    display: inline-block;
  }
  .scene-text__title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2rem, 5vw, 4rem);
    line-height: 1.05;
    margin: 0 0 0.75rem 0;
    color: var(--color-text);
  }
  .kinetic-word { display: inline-block; }
  .kinetic-char {
    display: inline-block;
    will-change: transform, opacity, filter;
  }
  .scene-text__subtitle {
    font-family: var(--font-body);
    font-weight: 300;
    font-size: clamp(0.95rem, 1.4vw, 1.15rem);
    line-height: 1.5;
    color: var(--color-text-muted);
    margin: 0;
    max-width: 46ch;
  }

  .cta-layer {
    position: absolute;
    bottom: 8vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    will-change: opacity, transform;
  }
  .cta-button {
    display: inline-block;
    padding: 0.9rem 2.2rem;
    border-radius: 999px;
    background: var(--brand-accent);
    color: #0a0a0a;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 0.9rem;
    letter-spacing: 0.04em;
    text-decoration: none;
    box-shadow: 0 8px 30px rgba(200, 255, 0, 0.35);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .cta-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 36px rgba(200, 255, 0, 0.5);
  }

  .progress-rail {
    position: fixed;
    top: 50%;
    right: 3vw;
    transform: translateY(-50%);
    height: 28vh;
    z-index: 6;
  }
  .progress-rail__track {
    position: relative;
    width: 2px;
    height: 100%;
    background: rgba(244, 241, 234, 0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-rail__fill {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 0%;
    background: var(--brand-accent);
    border-radius: 2px;
    transition: height 0.05s linear;
  }

  .brand-mark {
    position: fixed;
    top: 3vh;
    left: 3vw;
    z-index: 6;
    font-family: var(--font-display);
    font-size: 1rem;
    letter-spacing: 0.08em;
    color: var(--color-text);
  }

  .scroll-hint {
    position: fixed;
    bottom: 4vh;
    left: 3vw;
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--color-text-muted);
    opacity: 0.7;
  }
  .scroll-hint__line {
    width: 1px;
    height: 32px;
    background: linear-gradient(to bottom, var(--color-text-muted), transparent);
    animation: scrollHintPulse 2s ease-in-out infinite;
  }
  @keyframes scrollHintPulse {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  .cursor-trail-canvas {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    mix-blend-mode: screen;
  }

  .scroll-spacer { width: 100%; }

  .app-root--scrolled .scroll-hint { opacity: 0; pointer-events: none; }
</style>

<script>
  /* Scroll con inercia (Lenis). No requiere tocar el resto del código:
     Lenis intercepta la rueda/touch y anima window.scrollTo() de forma
     suave, disparando eventos "scroll" nativos igual que siempre — así
     que useScrollProgress() sigue funcionando sin cambios, solo que
     ahora el movimiento llega amortiguado en vez de "a saltos". */
  (function () {
    if (typeof Lenis === "undefined") return;
    const lenis = new Lenis({
      duration: 1.2,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      smoothWheel: true,
      smoothTouch: false, // en mobile el scroll táctil nativo se siente mejor
    });
    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);
    window.__lenis = lenis; // por si algún otro script necesita pausarlo/reanudarlo
  })();
</script>

  useEffect(() => {

      const raw = total > 0 ? window.scrollY / total : 0;
      const p = clamp(raw, 0, 1);

        emitAccum.current -= emitEvery;
        const t = 1 - emitAccum.current / delta;
        const px = lerp(from.x, ax, isFinite(t) ? t : 1);
        const py = lerp(from.y, ay, isFinite(t) ? t : 1);
        const pz = lerp(from.z, az, isFinite(t) ? t : 1);
        particles.current.push({
          x: px, y: py, z: pz,
          age: 0,
          seed: Math.random() * Math.PI * 2,
          ox: (Math.random() - 0.5) * size * 6,
          oy: (Math.random() - 0.5) * size * 6,
          oz: (Math.random() - 0.5) * size * 6,
          sizeMul: 0.5 + Math.random() * 0.9,
        });
        if (particles.current.length > maxParticles) particles.current.shift();
      }
    } else {
      // Sin scroll: no acumules emisión pendiente, así no larga una
      // ráfaga de golpe apenas el usuario vuelve a mover la rueda.
      emitAccum.current = 0;
    }
    prevAnchor.current = { x: ax, y: ay, z: az };

    for (let i = particles.current.length - 1; i >= 0; i--) {
      particles.current[i].age += delta;
      if (particles.current[i].age >= life) particles.current.splice(i, 1);
    }

    const n = Math.min(particles.current.length, maxParticles);
    const now = performance.now() * 0.001;
    for (let i = 0; i < n; i++) {
      const p = particles.current[i];
      const t = clamp(p.age / life);
      const drift = t;
      positions[i * 3] = p.x + p.ox * drift;
      positions[i * 3 + 1] = p.y + p.oy * drift + t * size * 4;
      positions[i * 3 + 2] = p.z + p.oz * drift;
      const twinkle = 0.5 + 0.5 * Math.sin(now * 9 + p.seed * 7);
      opacities[i] = (1 - t) * (1 - t) * (0.35 + 0.65 * twinkle);
      sizes[i] = size * p.sizeMul * (1 - t * 0.35);
    }

    const geom = group.geometry;
    geom.attributes.position.needsUpdate = true;
    geom.attributes.aOpacity.needsUpdate = true;
    geom.attributes.aSize.needsUpdate = true;
    geom.setDrawRange(0, n);
  });

  return (
    <points key={maxParticles} ref={pointsRef} frustumCulled={false} userData={{ excludeFromReflection: true }}>
      <bufferGeometry>
        <bufferAttribute attach="attributes-position" count={maxParticles} array={positions} itemSize={3} />
        <bufferAttribute attach="attributes-aSize" count={maxParticles} array={sizes} itemSize={1} />
        <bufferAttribute attach="attributes-aOpacity" count={maxParticles} array={opacities} itemSize={1} />
      </bufferGeometry>
      <shaderMaterial
        ref={materialRef}
        vertexShader={TRAIL_VERTEX_SHADER}
        fragmentShader={TRAIL_FRAGMENT_SHADER}
        uniforms={{ uColor: { value: new THREE.Color(color) } }}
        transparent
        depthWrite={false}
        blending={THREE.AdditiveBlending}
      />
    </points>
  );
}

  /* Cámara de reflejo (cube camera): ubicada en el Modelo principal, cada
   ciertos frames fotografía los 360° a su alrededor (paredes, objetos,
   el PNG del perro, etc. — todo lo que haya en la escena, salvo el
   propio modelo, que se oculta un instante durante la captura) y usa
   esa foto como reflejo en los materiales metálicos del modelo. La
   cámara principal (la que ve el usuario) no necesita apuntar a lo que
   se refleja — el reflejo se calcula aparte, en 360°, todo el tiempo. */
function ReflectionProbe({ anchorRef, enabled, resolution, updateEvery, intensity }) {
  const { gl, scene } = useThree();
  const rtRef = useRef(null);
  const camRef = useRef(null);
  const frameRef = useRef(0);
  const appliedRef = useRef(new Set());
  const posRef = useRef(new THREE.Vector3());

  useEffect(() => {
    const rt = new THREE.WebGLCubeRenderTarget(resolution, {
      generateMipmaps: true,
      minFilter: THREE.LinearMipmapLinearFilter,
    });
    rtRef.current = rt;
    camRef.current = new THREE.CubeCamera(0.05, 1000, rt);
    appliedRef.current = new Set();
    return () => rt.dispose();
  }, [resolution]);

  useFrame(() => {
    if (!enabled || !anchorRef.current || !camRef.current) return;
    frameRef.current++;
    if (frameRef.current % Math.max(1, updateEvery) !== 0) return;

    const anchor = anchorRef.current;
    anchor.getWorldPosition(posRef.current);
    camRef.current.position.copy(posRef.current);

    // Oculta el modelo (para que no se refleje a sí mismo) y también todo lo
    // marcado como "no reflejar" (rayo de luz, estela de chispas) — si no,
    // esos brillos quedan pegados adentro del reflejo aunque estén apagados
    // en pantalla, porque el reflejo los captura igual un instante antes.
    const hidden = [];
    scene.traverse((obj) => {
      if (obj.userData && obj.userData.excludeFromReflection && obj.visible) {
        hidden.push(obj);
        obj.visible = false;
      }
    });
    const wasVisible = anchor.visible;
    anchor.visible = false;
    camRef.current.update(gl, scene);
    anchor.visible = wasVisible;
    hidden.forEach((obj) => { obj.visible = true; });

    const texture = rtRef.current.texture;
    anchor.traverse((child) => {
      if (!child.isMesh || !child.material) return;
      const mats = Array.isArray(child.material) ? child.material : [child.material];
      mats.forEach((m) => {
        if (!("envMap" in m)) return;
        if (!appliedRef.current.has(m.uuid)) {
          m.envMap = texture;
          m.needsUpdate = true;
          appliedRef.current.add(m.uuid);
        }
        if ("envMapIntensity" in m) m.envMapIntensity = intensity;
      });
    });
  });

  return null;
}

/* Textura de degradado para el rayo de luz: brillante en el centro,
   transparente en los bordes y en las puntas (arriba/abajo) — se genera
   una sola vez con canvas, no hace falta subir ningún asset. */
let _beamTextureCache = null;
function getBeamTexture() {
  if (_beamTextureCache) return _beamTextureCache;
  const size = 128;
  const canvas = document.createElement("canvas");
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext("2d");
  const grad = ctx.createLinearGradient(0, 0, size, 0);
  grad.addColorStop(0, "rgba(255,255,255,0)");
  grad.addColorStop(0.5, "rgba(255,255,255,1)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  const vgrad = ctx.createLinearGradient(0, 0, 0, size);
  vgrad.addColorStop(0, "rgba(0,0,0,1)");
  vgrad.addColorStop(0.12, "rgba(0,0,0,0)");
  vgrad.addColorStop(0.82, "rgba(0,0,0,0)");
  vgrad.addColorStop(1, "rgba(0,0,0,1)");
  ctx.globalCompositeOperation = "destination-out";
  ctx.fillStyle = vgrad;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(canvas);
  _beamTextureCache = tex;
  return tex;
}

/* Rayo de luz volumétrico (fake): 3 planos cruzados con degradado
   aditivo, apuntando siempre hacia la dirección/color de la luz de la
   etapa actual (se actualiza solo — nunca hay que tocar un color a
   mano acá). No es raymarching real, pero con blending aditivo encima
   de la niebla se lee como un haz de luz que baja, sin pesar nada.
   Por ahora apunta al origen de la escena (0,0,0) — si tu objeto
   principal no está ahí, movelo o avisame para agregar un offset. */
function LightBeam({ enabled, opacity, width, height }) {
  const groupRef = useRef(null);
  const matRefs = useRef([]);
  const texture = useMemo(() => getBeamTexture(), []);

  useFrame(() => {
    if (!enabled || !groupRef.current) return;
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    const dir = lightDirFromAngles(state.light.azimuth, state.light.elevation, 1);
    const dirVec = new THREE.Vector3(dir[0], dir[1], dir[2]).normalize();
    groupRef.current.position.set(dirVec.x * height * 0.5, dirVec.y * height * 0.5, dirVec.z * height * 0.5);
    groupRef.current.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirVec);
    matRefs.current.forEach((m) => {
      if (!m) return;
      m.color.set(state.light.color);
      m.opacity = opacity;
    });
  });

  if (!enabled) return null;

  return (
    <group ref={groupRef} userData={{ excludeFromReflection: true }}>
      {[0, 60, 120].map((deg, i) => (
        <mesh key={deg} rotation={[0, (deg * Math.PI) / 180, 0]}>
          <planeGeometry args={[width, height]} />
          <meshBasicMaterial
            ref={(m) => { matRefs.current[i] = m; }}
            map={texture}
            transparent
            opacity={opacity}
            color="#ffffff"
            blending={THREE.AdditiveBlending}
            depthWrite={false}
            side={THREE.DoubleSide}
            toneMapped={false}
          />
        </mesh>
      ))}
    </group>
  );
}

/* ============================================================
   Objetos de entorno. Cada uno puede ser un modelo 3D estático (.glb,
   sin huesos ni animación propia), una imagen/SVG plana o un video .mp4 (con opción
   de "billboard" para que siempre mire a cámara). Cada objeto anima
   su propia posición/escala/rotación por etapa (keyframes), leídas
   del mismo "progress" de scroll que usa el personaje — por eso el
   transform se aplica de forma imperativa (ref + useFrame) en vez de
   como props de React, igual que AnimatedCharacter, para no forzar un
   re-render en cada frame de scroll.

/* ============================================================
   FADE POR TRANSPARENCIA CON BARRIDO (izq→der / der→izq).
   Cada pose de un objeto puede estar "invisible". Al pasar de una
   pose visible a una invisible (o al revés) el objeto se desvanece /
   aparece con un barrido de transparencia sobre la pantalla, en la
   dirección elegida en la pose de destino. Funciona sobre cualquier
   material (modelos .glb, imágenes, SVG y texto) parchando el shader.
   ============================================================ */
function makeFadeUniforms() {

    uFadeAmt: { value: 1 },
    uFadeMode: { value: 0 },
    uFadeOut: { value: 0 },
    uFadeDir: { value: 1 },
    uFadeMin: { value: -1 },
    uFadeMax: { value: 1 },

const FADE_SOFT = 1.0;
const FADE_FRAG_DECL = `
varying float vFadeX;
uniform float uFadeAmt;
uniform float uFadeMode;
uniform float uFadeOut;
uniform float uFadeDir;
uniform float uFadeMin;
uniform float uFadeMax;
`;
const FADE_FRAG_BODY = `
{
  float fa = uFadeAmt;
  if (uFadeMode > 0.5) {
    float u = (vFadeX - uFadeMin) / max(uFadeMax - uFadeMin, 0.0001);
    if (uFadeDir < 0.0) u = 1.0 - u;
    float soft = ${FADE_SOFT.toFixed(2)};
    if (uFadeOut > 0.5) fa = clamp((u - (1.0 - uFadeAmt) * (1.0 + soft) + soft) / soft, 0.0, 1.0);
    else fa = clamp((uFadeAmt * (1.0 + soft) - u) / soft, 0.0, 1.0);
    fa = fa * fa * (3.0 - 2.0 * fa);

    mat.userData.__fadeU = uniforms;
    if (mat.userData.__fadeShader) Object.assign(mat.userData.__fadeShader.uniforms, uniforms);
    return;

  mat.userData.__fadePatched = true;

    mat.userData.__fadeShader = shader;
    shader.vertexShader = "varying float vFadeX;\n" + shader.vertexShader.replace(
      "#include <project_vertex>",

  if (p >= last.progress) return { ...last, fade: fadeStateFor(last, last, 1) };

  while (i < list.length - 1 && list[i + 1].progress < p) i++;

/* Los navegadores rasterizan un SVG a un tamaño chico por defecto
   (a veces 300x150px) antes de poder usarlo como textura — se ve
   pixelado al escalarlo grande en pantalla. Esto lo vuelve a dibujar
   en un canvas de alta resolución antes de crear la textura. Solo
   aplica a .svg; una imagen .png/.jpg ya es un bitmap y sigue el
   camino normal (useTexture). */
function useHiResSvgTexture(url, targetLong) {
  const [texture, setTexture] = useState(null);
  useEffect(() => {
    let cancelled = false;
    const img = new Image();
    img.onload = () => {
      if (cancelled) return;
      const w0 = img.naturalWidth || 300;
      const h0 = img.naturalHeight || 150;
      const aspect = w0 / h0 || 1;
      const canvas = document.createElement("canvas");
      if (aspect >= 1) { canvas.width = targetLong; canvas.height = Math.round(targetLong / aspect); }
      else { canvas.height = targetLong; canvas.width = Math.round(targetLong * aspect); }
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      setTexture(tex);
    };
    img.onerror = () => { if (!cancelled) setTexture(null); };
    img.src = url;
    return () => { cancelled = true; };

  return /\.svg($|\?)/i.test(url || "");

function isVideoUrl(url) {

      scene.fog = fog.current;
      fog.current.color.set(state.fog.color);
      fog.current.density = 1 / Math.max(state.fog.far, 1);
    } else {
      scene.fog = null;
    }
  });

  return null;
}

function Experience({ device }) {
  const mouse = useMouseParallax();
  const charAnchorRef = useRef(null);
  return (
    <>
      <ScrollSmoother />
      <SceneEnvironment />
      <CameraRig mouse={mouse} />
      <Lighting />
      <Stars radius={140} depth={70} count={device.isMobile ? 800 : 1800} factor={4} saturation={0} fade speed={0.3} />
      <Suspense fallback={null}>
        <SceneObjects />
        <ObjectBoundary>
          <Suspense fallback={null}>
            {CHARACTER_MODEL_URL ? <AnimatedCharacter mouse={mouse} anchorRef={charAnchorRef} /> : null}
          </Suspense>
        </ObjectBoundary>
      </Suspense>
      <SparkleTrail
        anchorRef={charAnchorRef}
        enabled={TRAIL_ENABLED}
        color={TRAIL_COLOR}
        size={TRAIL_SIZE}
        life={TRAIL_LIFE}
        rate={TRAIL_RATE}
      />

        <ReflectionProbe
        anchorRef={charAnchorRef}
        enabled={REFLECTION_ENABLED}
        resolution={REFLECTION_RESOLUTION}
        updateEvery={REFLECTION_UPDATE_EVERY}
        intensity={REFLECTION_INTENSITY}
      />

      <LightBeam enabled={BEAM_ENABLED} opacity={BEAM_OPACITY} width={BEAM_WIDTH} height={BEAM_HEIGHT} />
  
      {BLOOM_ENABLED && (
        <EffectComposer multisampling={0}>
          <Bloom intensity={BLOOM_INTENSITY} luminanceThreshold={0.25} luminanceSmoothing={0.9} mipmapBlur height={240} />
        </EffectComposer>
      )}
    </>
  );
}

function textWeight(kf, progress, window_ = 0.14) {
  const d = Math.abs(progress - kf.progress);
  return clamp(1 - d / window_);
}

/* Divide un título en palabras (para que no corten mal el renglón) y cada
   palabra en caracteres — cada <span> de caracter se anima individualmente
   para el efecto de tipografía cinética (entra/sale en cascada con el
   scroll, no como bloque entero). Guarda cada span en charRefsArr. */
function renderKineticTitle(text, charRefsArr) {
  charRefsArr.length = 0;
  const words = String(text || "").split(" ");
  let globalIndex = 0;
  return words.map((word, wi) => (
    <span key={wi} className="kinetic-word">
      {word.split("").map((ch, ci) => {
        const idx = globalIndex++;
        return (
          <span
            key={ci}
            ref={(el) => { charRefsArr[idx] = el; }}
            className="kinetic-char"
            style={{ opacity: 0 }}
          >
            {ch}
          </span>
        );
      })}
      {wi < words.length - 1 ? "\u00A0" : ""}
    </span>
  ));
}

function SceneText() {
  const refs = useRef([]);
  const charRefsByScene = useRef(scenes.map(() => []));

  useEffect(() => {
    const update = (progress) => {
      scenes.forEach((kf, i) => {
        const el = refs.current[i];
        if (!el || !kf.text) return;
        const weight = textWeight(kf, progress);
        el.style.opacity = String(weight > 0 ? 1 : 0); // el contenedor solo controla visibilidad/posición del bloque
        el.style.transform =
          kf.text.align === "center"
            ? `translateX(-50%) translateY(${(1 - weight) * 10}px)`
            : `translateY(${(1 - weight) * 10}px)`;
        el.style.pointerEvents = weight > 0.5 ? "auto" : "none";

        // Reveal en cascada por caracter (tipografía cinética)
        const chars = charRefsByScene.current[i];
        if (chars && chars.length) {
          const stagger = 0.6; // qué tan "esparcida" queda la cascada entre el primer y el último caracter
          const n = chars.length;
          chars.forEach((cel, j) => {
            if (!cel) return;
            const localW = clamp(weight * (1 + stagger) - (j / n) * stagger);
            cel.style.opacity = String(localW);
            cel.style.transform = `translateY(${(1 - localW) * 14}px)`;
            cel.style.filter = `blur(${(1 - localW) * 3}px)`;
          });
        }
      });
    };
    update(useScrollStore.getState().smoothProgress);
    const unsubscribe = useScrollStore.subscribe((s) => update(s.smoothProgress));
    return unsubscribe;
  }, []);

  return (
    <div className="scene-text-layer">
      {scenes.map((kf, i) =>
        kf.text ? (
          <div
            key={kf.id}
            ref={(el) => { refs.current[i] = el; }}
            className={`scene-text scene-text--${kf.text.align}`}
            style={{ opacity: 0 }}
          >
            {kf.text.eyebrow && <span className="scene-text__eyebrow">{kf.text.eyebrow}</span>}
            <h2 className="scene-text__title">{renderKineticTitle(kf.text.title, charRefsByScene.current[i])}</h2>
            {kf.text.subtitle && <p className="scene-text__subtitle">{kf.text.subtitle}</p>}
          </div>
        ) : null
      )}
    </div>
  );
}

const CTA_START = scenes.find((s) => s.showCTA)?.progress ?? 1;
const FADE_WINDOW = 0.06;

function CTAButton() {
  const ref = useRef(null);

  useEffect(() => {
    const update = (progress) => {
      if (!ref.current) return;
      const weight = clamp((progress - (CTA_START - FADE_WINDOW)) / FADE_WINDOW);
      ref.current.style.opacity = String(weight);
      ref.current.style.transform = `translateX(-50%) translateY(${(1 - weight) * 16}px)`;
      ref.current.style.pointerEvents = weight > 0.6 ? "auto" : "none";
    };
    update(useScrollStore.getState().smoothProgress);
    return useScrollStore.subscribe((s) => update(s.smoothProgress));
  }, []);

  return (
    <div ref={ref} className="cta-layer" style={{ opacity: 0 }}>
      <a className="cta-button" href={clientConfig.cta.href}>
        {clientConfig.cta.label}
      </a>
    </div>
  );
}

function BackgroundGradient({ stageRef }) {
  useEffect(() => {
    const update = (progress) => {
      const el = stageRef.current;
      if (!el) return;
      const state = blendScenes(scenes, progress);
      el.style.background = `linear-gradient(${state.background.angle}deg, ${state.background.from}, ${state.background.to})`;
    };
    update(useScrollStore.getState().smoothProgress);
    return useScrollStore.subscribe((s) => update(s.smoothProgress));
  }, [stageRef]);

  return null;
}

function ProgressIndicator() {
  const fillRef = useRef(null);

  useEffect(() => {
    const update = (progress) => {
      if (fillRef.current) fillRef.current.style.height = `${progress * 100}%`;
    };
    update(useScrollStore.getState().smoothProgress);
    return useScrollStore.subscribe((s) => update(s.smoothProgress));
  }, []);

  return (
    <div className="progress-rail" aria-hidden="true">
      <div className="progress-rail__track">
        <div ref={fillRef} className="progress-rail__fill" />
      </div>
    </div>
  );
}

function CursorTrail() {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let width = window.innerWidth;
    let height = window.innerHeight;
    let points = [];
    let rafId = 0;

    const resize = () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();

    const addPoint = (x, y) => {
      points.push({ x, y, life: 1 });
      if (points.length > 40) points.shift();
    };
    const onPointerMove = (e) => addPoint(e.clientX, e.clientY);
    const onTouchMove = (e) => {
      if (e.touches && e.touches[0]) addPoint(e.touches[0].clientX, e.touches[0].clientY);
    };

    window.addEventListener("resize", resize);
    window.addEventListener("pointermove", onPointerMove, { passive: true });
    window.addEventListener("touchmove", onTouchMove, { passive: true });

    const draw = () => {
      ctx.clearRect(0, 0, width, height);
      points.forEach((p) => { p.life *= 0.94; });
      points = points.filter((p) => p.life > 0.02);

      if (points.length > 1) {
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.globalCompositeOperation = "lighter";
        for (let i = 1; i < points.length; i++) {
          const p0 = points[i - 1];
          const p1 = points[i];
          const alpha = Math.min(p0.life, p1.life) * 0.55;
          ctx.strokeStyle = clientConfig.colors.accent;
          ctx.globalAlpha = alpha;
          ctx.lineWidth = 1.5 + alpha * 4;
          ctx.beginPath();
          ctx.moveTo(p0.x, p0.y);
          ctx.lineTo(p1.x, p1.y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
      }
      rafId = requestAnimationFrame(draw);
    };
    rafId = requestAnimationFrame(draw);

    return () => {
      cancelAnimationFrame(rafId);
      window.removeEventListener("resize", resize);
      window.removeEventListener("pointermove", onPointerMove);
      window.removeEventListener("touchmove", onTouchMove);
    };
  }, []);

  return <canvas ref={canvasRef} className="cursor-trail-canvas" aria-hidden="true" />;
}

function App() {
  const spacerRef = useRef(null);
  const stageRef = useRef(null);
  useScrollProgress(spacerRef);
  useArrowKeyScroll();
  const device = useMemo(() => getDeviceProfile(), []);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    const t = setTimeout(() => setReady(true), 60);
    return () => clearTimeout(t);
  }, []);

  return (
    <div
      className="app-root"
      style={{
        "--brand-accent": clientConfig.colors.accent,
        "--brand-accent-2": clientConfig.colors.accentSecondary,
        "--color-bg": clientConfig.colors.background,
        "--color-text": clientConfig.colors.textPrimary,
        "--color-text-muted": clientConfig.colors.textMuted,
        "--font-display": clientConfig.fonts.display,
        "--font-body": clientConfig.fonts.body,
      }}
    >
      <div ref={stageRef} className={`canvas-stage ${ready ? "canvas-stage--ready" : ""}`}>
        <Canvas
          dpr={device.dpr}
          shadows="soft"
          gl={{ antialias: true, alpha: true, powerPreference: "high-performance" }}
          camera={{ position: [0, 0.2, 6.5], fov: 35, near: 0.1, far: 60 }}
        >
          <Experience device={device} />
        </Canvas>
        <BackgroundGradient stageRef={stageRef} />
        {VIGNETTE_ENABLED && (
          <div
            aria-hidden="true"
            style={{
              position: "absolute",
              inset: 0,
              zIndex: 3,
              pointerEvents: "none",
              background: `radial-gradient(ellipse farthest-corner at center, transparent ${(1 - VIGNETTE_OFFSET) * 100}%, rgba(0,0,0,${VIGNETTE_DARKNESS}) 100%)`,
            }}
          />
        )}
        <CursorTrail />
        <SceneText />
        <ProgressIndicator />
        <div className="scroll-hint" aria-hidden="true">
          <span>Scroll</span>
          <div className="scroll-hint__line" />
        </div>
      </div>
      <div ref={spacerRef} className="scroll-spacer" style={{ height: `${SCROLL_LENGTH_VH}vh` }} />
    </div>
  );
}

createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
