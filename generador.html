  const [fxByKf, setFxByKf] = useState(() => initialFx(makeDefaultStages()));

  const stagesComputed = useMemo(() => stagesWithProgress(stages, durationsVh), [stages, durationsVh]);
  const totalVh = useMemo(() => durationsVh.reduce((a, b) => a + b, 0), [durationsVh]);
  const setDurationAt = (i, value) => {
    setDurationsVh((prev) => { const next = [...prev]; next[i] = value; return next; });
  };
  const setEasingAt = (i, value) => {
    setEasings((prev) => { const next = [...prev]; next[i] = value; return next; });
  };

  // Una sola etapa activa, compartida por Pose / Cámara / Movimiento.
  const [activeStage, setActiveStage] = useState(() => makeDefaultStages()[0].id);

  const addStage = () => {
    const n = stages.length + 1;
    const newId = `pose-${Date.now()}`;
    const lastId = stages[stages.length - 1].id;
    setStages((prev) => [...prev, { id: newId, label: `Pose ${n}` }]);
    setDurationsVh((prev) => [...prev, 150]);
    setEasings((prev) => [...prev, "smooth"]);
    setPosesByKf((prev) => ({ ...prev, [newId]: JSON.parse(JSON.stringify(prev[lastId] || zeroPose())) }));
    setCamsByKf((prev) => ({ ...prev, [newId]: JSON.parse(JSON.stringify(prev[lastId] || defaultCamera())) }));
    setMovesByKf((prev) => ({ ...prev, [newId]: JSON.parse(JSON.stringify(prev[lastId] || defaultMovement())) }));
    setFxByKf((prev) => ({ ...prev, [newId]: JSON.parse(JSON.stringify(prev[lastId] || defaultFx())) }));
    setObjectTransformsByKf((prev) => {
      const next = { ...prev };
      Object.keys(next).forEach((objId) => {
        next[objId] = { ...next[objId], [newId]: JSON.parse(JSON.stringify(next[objId][lastId] || { position: [0, 0, 0], scale: 1, rotationY: 0 })) };
      });
      return next;
    });
    setActiveStage(newId);
  };

  const removeStage = (id) => {
    const idx = stages.findIndex((s) => s.id === id);
    if (stages.length <= 2 || idx === -1) return;
    const remIdx = idx === 0 ? 0 : idx - 1;
    setStages((prev) => prev.filter((s) => s.id !== id));
    setDurationsVh((prev) => { const next = [...prev]; next.splice(remIdx, 1); return next; });
    setEasings((prev) => { const next = [...prev]; next.splice(remIdx, 1); return next; });
    setPosesByKf((prev) => { const next = { ...prev }; delete next[id]; return next; });
    setCamsByKf((prev) => { const next = { ...prev }; delete next[id]; return next; });
    setMovesByKf((prev) => { const next = { ...prev }; delete next[id]; return next; });
    setFxByKf((prev) => { const next = { ...prev }; delete next[id]; return next; });
    setObjectTransformsByKf((prev) => {
      const next = { ...prev };
      Object.keys(next).forEach((objId) => {
        const forObj = { ...next[objId] };
        delete forObj[id];
        next[objId] = forObj;
      });
      return next;
    });
    if (activeStage === id) {
      const remaining = stages.filter((s) => s.id !== id);
      setActiveStage(remaining[Math.max(0, idx - 1)]?.id || remaining[0]?.id);
    }
  };

  const renameStage = (id, label) => setStages((prev) => prev.map((s) => (s.id === id ? { ...s, label } : s)));


  const [scrub, setScrub] = useState(0);
  const [isPlaying, setIsPlaying] = useState(false);
  const [playSpeed, setPlaySpeed] = useState(1);

  /* Reproduce automáticamente el "progress" de 0 a 1 (pasa de largo el
     scroll manual) para poder ver la coordinación real entre cámara,
     personaje y ambiente sin tener que arrastrar el slider a mano.
     "Velocidad" es un multiplicador sobre un recorrido nominal de 10s. */
  useEffect(() => {
    if (!isPlaying) return;
    const durationMs = 10000 / playSpeed;
    let raf;
    let startTime = null;
    let startScrub = scrub >= 0.999 ? 0 : scrub;
    if (scrub >= 0.999) setScrub(0);
    const tick = (now) => {
      if (startTime === null) startTime = now;
      const elapsed = now - startTime;
      const p = startScrub + elapsed / durationMs;
      if (p >= 1) { setScrub(1); setIsPlaying(false); return; }
      setScrub(p);
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [isPlaying, playSpeed]);
  const [freeOrbit, setFreeOrbit] = useState(false);
  const [autoRotate, setAutoRotate] = useState(false);
  const [foundMap, setFoundMap] = useState({});
  const [copiedWhich, setCopiedWhich] = useState(null);
  const [downloaded, setDownloaded] = useState(false);

  // Objetos de entorno (antes "Entorno" / un solo universo.glb). Ahora
  // se pueden agregar tantos como haga falta, cada uno con su propio
  // archivo (modelo .glb o imagen .png/.jpg). La posición/escala/giro
  // de cada uno vive POR ETAPA (objectTransformsByKf) — igual que la
  // Cámara o el Movimiento del personaje — así también pueden moverse
  // a lo largo del scroll y no quedan estáticos.
  const [objects, setObjects] = useState(() => [
    { id: "obj-universo", label: "Universo (rampa)", type: "model", url: "./assets/models/universo.glb", previewUrl: null, billboard: false, visible: true },
  ]);
  const defaultObjectTransform = () => ({ position: [0, 0, 0], scale: 1, rotationY: 0 });
  const [objectTransformsByKf, setObjectTransformsByKf] = useState(() => {
    const stageList = makeDefaultStages();
    return {
      "obj-universo": Object.fromEntries(stageList.map((s) => [s.id, { position: [0, -0.2, 2.2], scale: 5, rotationY: 0 }])),
    };
  });
  const [showObjects, setShowObjects] = useState(true);
  const [showGrid, setShowGrid] = useState(true);
  const [showFx, setShowFx] = useState(true);
  const [showMobileFrame, setShowMobileFrame] = useState(true);
  const viewportRef = useRef(null);

  const addObject = () => {
    const n = objects.length + 1;
    const newId = `obj-${Date.now()}`;
    setObjects((prev) => [...prev, {
      id: newId,
      label: `Objeto ${n}`,
      type: "model",
      url: `./assets/models/objeto${n}.glb`,
      previewUrl: null,
      billboard: false,
      visible: true,
    }]);
    setObjectTransformsByKf((prev) => ({
      ...prev,
      [newId]: Object.fromEntries(stagesComputed.map((s) => [s.id, defaultObjectTransform()])),
    }));
  };
  const removeObject = (id) => {
    setObjects((prev) => prev.filter((o) => o.id !== id));
    setObjectTransformsByKf((prev) => { const next = { ...prev }; delete next[id]; return next; });
  };
  const updateObject = (id, patch) => setObjects((prev) => prev.map((o) => (o.id === id ? { ...o, ...patch } : o)));
  const setObjectTransform = (id, field, axis, value) => {
    setObjectTransformsByKf((prev) => {
      const forObj = { ...prev[id] };
      const cur = { ...forObj[activeStage] };
      if (field === "position") {
        const pos = [...cur.position];
        pos["xyz".indexOf(axis)] = value;
        cur.position = pos;
      } else {
        cur[field] = value;
      }
      forObj[activeStage] = cur;
      return { ...prev, [id]: forObj };
    });
  };
  const copyObjectTransformFromPrev = (id) => {
    if (stageIndex <= 0) return;
    const prevId = stagesComputed[stageIndex - 1].id;
    setObjectTransformsByKf((prev) => ({
      ...prev,
      [id]: { ...prev[id], [activeStage]: JSON.parse(JSON.stringify(prev[id][prevId])) },
    }));
  };
  const copyAllObjectTransformsFromPrev = () => {
    if (stageIndex <= 0) return;
    const prevId = stagesComputed[stageIndex - 1].id;
    setObjectTransformsByKf((prev) => {
      const next = { ...prev };
      objects.forEach((o) => {
        next[o.id] = { ...next[o.id], [activeStage]: JSON.parse(JSON.stringify(prev[o.id][prevId])) };
      });
      return next;
    });
  };
  /* Fija la posición/escala/rotación ACTUAL de un objeto (la de la etapa
     que estás viendo ahora) en TODAS las etapas de una — para objetos que
     no se mueven, evita tener que entrar pose por pose a acomodarlo. */
  const applyObjectTransformToAllStages = (id) => {
    const current = objectTransformsByKf[id] && objectTransformsByKf[id][activeStage];
    if (!current) return;
    const snapshot = JSON.parse(JSON.stringify(current));
    setObjectTransformsByKf((prev) => {
      const forObj = { ...prev[id] };
      stagesComputed.forEach((kf) => { forObj[kf.id] = JSON.parse(JSON.stringify(snapshot)); });
      return { ...prev, [id]: forObj };
    });
  };
  /* Igual que arriba pero para TODOS los objetos a la vez — útil recién
     agregaste varios objetos nuevos y quedaron todos amontonados al
     centro: los acomodás una vez en la etapa que estés viendo y con este
     botón quedan fijos así en las 20 (o las que sean) poses de un saque. */
  const applyAllObjectTransformsToAllStages = () => {
    setObjectTransformsByKf((prev) => {
      const next = { ...prev };
      objects.forEach((o) => {
        const current = prev[o.id] && prev[o.id][activeStage];
        if (!current) return;
        const snapshot = JSON.parse(JSON.stringify(current));
        const forObj = { ...next[o.id] };
        stagesComputed.forEach((kf) => { forObj[kf.id] = JSON.parse(JSON.stringify(snapshot)); });
        next[o.id] = forObj;
      });
      return next;
    });
  };
  const setObjectType = (id, type) => {
    setObjects((prev) => prev.map((o) => {
      if (o.id !== id) return o;
      if (type === "text") {
        return {
          ...o,
          type: "text",
          billboard: o.billboard ?? true,
          text: o.text ?? "Texto",
          textColor: o.textColor ?? "#ffffff",
          fontFamily: o.fontFamily ?? "'Inter', sans-serif",
          fontWeight: o.fontWeight ?? 600,
          textAlign: o.textAlign ?? "center",
          textOutline: o.textOutline ?? false,
          textOutlineColor: o.textOutlineColor ?? "#000000",
        };
      }
      let url = o.url;
      if (type === "image" && /\.glb$/i.test(url)) url = url.replace(/\.glb$/i, ".png");
      if (type === "model" && /\.(svg|png|jpe?g|webp)$/i.test(url)) url = url.replace(/\.(svg|png|jpe?g|webp)$/i, ".glb");
      return { ...o, type, url, previewUrl: type === "model" ? null : o.previewUrl, billboard: type === "image" ? (o.billboard ?? true) : false };
    }));
  };
  /* Subida real de archivo (SVG exportado de Corel Draw, PNG, JPG). El
     navegador no puede escribir el archivo en el disco del proyecto —
     eso lo hace el botón "Descargar" de abajo, con el mismo nombre que
     va a usar el index.html final — pero sí puede leerlo localmente
     con URL.createObjectURL para mostrarlo YA en el visor 3D, sin
     esperar a que lo copies a mano. */
  const uploadObjectFile = (id, file) => {
    if (!file) return;
    const blobUrl = URL.createObjectURL(file);
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    updateObject(id, {
      type: "image",
      previewUrl: blobUrl,
      url: `./assets/models/${safeName}`,
      billboard: true,
    });
  };
  /* Si editás el campo "Archivo" a mano (en vez de usar "Subir
     archivo"), esto evita el bug de dejar una imagen/SVG con el tipo
     "Modelo" seleccionado — lo que hace que el navegador intente
     leerla con el cargador de .glb y falle ("no es JSON válido"). */
  const setObjectUrl = (id, newUrl) => {
    setObjects((prev) => prev.map((o) => {
      if (o.id !== id) return o;
      const isImgExt = /\.(svg|png|jpe?g|webp)$/i.test(newUrl);
      const isGlbExt = /\.glb$/i.test(newUrl);
      let patch = { url: newUrl };
      if (isImgExt && o.type !== "image") patch = { ...patch, type: "image", billboard: o.billboard ?? true, previewUrl: null };
      if (isGlbExt && o.type !== "model") patch = { ...patch, type: "model", billboard: false, previewUrl: null };
      return { ...o, ...patch };
    }));
  };

  const stageIndex = stagesComputed.findIndex((s) => s.id === activeStage);

  const setBoneAxis = (boneKey, axis, value) => {
    setPosesByKf((prev) => ({ ...prev, [activeStage]: { ...prev[activeStage], [boneKey]: { ...prev[activeStage][boneKey], [axis]: value } } }));
  };
  const resetBone = (boneKey) => {
    setPosesByKf((prev) => ({ ...prev, [activeStage]: { ...prev[activeStage], [boneKey]: { x: 0, y: 0, z: 0 } } }));
  };
  const copyPoseFromPrev = () => {
    if (stageIndex <= 0) return;
    const prevId = stagesComputed[stageIndex - 1].id;
    setPosesByKf((prev) => ({ ...prev, [activeStage]: JSON.parse(JSON.stringify(prev[prevId])) }));
  };

  const setCamField = (field, axis, value) => {
    setCamsByKf((prev) => {
      const cam = { ...prev[activeStage] };
      if (field === "fov" || field === "roll") cam[field] = value;
      else { cam[field] = [...cam[field]]; cam[field]["xyz".indexOf(axis)] = value; }
      return { ...prev, [activeStage]: cam };
    });
  };
  const orbitRef = useRef(null);
  const liveCameraRef = useRef(null);
  const captureFreeCamera = () => {
    const live = liveCameraRef.current;
    if (!live) return;
    setCamsByKf((prev) => ({
      ...prev,
      [activeStage]: { position: live.position, lookAt: live.lookAt, fov: live.fov, roll: prev[activeStage].roll || 0 },
    }));
  };
  const setFxField = (group, field, value) => {
    setFxByKf((prev) => {
      const fx = { ...prev[activeStage] };
      fx[group] = { ...fx[group], [field]: value };
      return { ...prev, [activeStage]: fx };
    });
  };
  /* Genera un segundo color con contraste real (más oscuro/claro que
     el primero) para que, al pasar a "Degradado", el cambio se note
     de una — antes copiaba el mismo color en los dos extremos y por
     eso el botón parecía no hacer nada. */
  const nudgeColor = (hex) => {
    const c = new THREE.Color(hex);
    const lum = 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b;
    const target = new THREE.Color(lum > 0.5 ? "#000000" : "#ffffff");
    c.lerp(target, 0.55);
    return "#" + c.getHexString();
  };
  const setBackgroundMode = (mode) => {
    setFxByKf((prev) => {
      const fx = { ...prev[activeStage] };
      const bg = fx.background;
      if (mode === "solid") {
        fx.background = { ...bg, mode: "solid", to: bg.from };
      } else {
        fx.background = { ...bg, mode: "gradient", to: bg.to !== bg.from ? bg.to : nudgeColor(bg.from) };
      }
      return { ...prev, [activeStage]: fx };
    });
  };
  const setBackgroundColor = (field, value) => {
    setFxByKf((prev) => {
      const fx = { ...prev[activeStage] };
      const bg = { ...fx.background, [field]: value };
      if (fx.background.mode !== "gradient" && field === "from") bg.to = value;
      fx.background = bg;
      return { ...prev, [activeStage]: fx };
    });
  };
  const copyCamFromPrev = () => {
    if (stageIndex <= 0) return;
    const prevId = stagesComputed[stageIndex - 1].id;
    setCamsByKf((prev) => ({ ...prev, [activeStage]: JSON.parse(JSON.stringify(prev[prevId])) }));
    setFxByKf((prev) => ({ ...prev, [activeStage]: JSON.parse(JSON.stringify(prev[prevId])) }));
  };

  const setMoveField = (field, axis, value) => {
    setMovesByKf((prev) => {
      const mv = { ...prev[activeStage] };
      if (field === "yaw" || field === "pitch") mv[field] = value;
      else { mv.pos = [...mv.pos]; mv.pos["xyz".indexOf(axis)] = value; }
      return { ...prev, [activeStage]: mv };
    });
  };
  const copyMoveFromPrev = () => {
    if (stageIndex <= 0) return;
    const prevId = stagesComputed[stageIndex - 1].id;
    setMovesByKf((prev) => ({ ...prev, [activeStage]: JSON.parse(JSON.stringify(prev[prevId])) }));
  };
  const applyYawPreset = (deg_) => setMoveField("yaw", null, deg_);
  const applyPitchPreset = (deg_) => setMoveField("pitch", null, deg_);

  const isPreview = section === "preview";
  const currentPose = isPreview ? samplePose(posesByKf, scrub, stagesComputed, easings) : posesByKf[activeStage];
  const currentCamTarget = isPreview ? sampleCamera(camsByKf, scrub, stagesComputed, easings) : camsByKf[activeStage];
  const currentMovement = isPreview ? sampleMovement(movesByKf, scrub, stagesComputed, easings) : movesByKf[activeStage];
  const renderFx = isPreview ? sampleFx(fxByKf, scrub, stagesComputed, easings) : fxByKf[activeStage];
  const renderObjects = useMemo(() => objects.map((o) => {
    const transforms = objectTransformsByKf[o.id];
    if (!transforms) return { ...o, ...defaultObjectTransform() };
    const t = isPreview ? sampleObjectTransform(transforms, scrub, stagesComputed, easings) : (transforms[activeStage] || defaultObjectTransform());
    return { ...o, ...t };
  }), [objects, objectTransformsByKf, isPreview, scrub, stagesComputed, easings, activeStage]);
  const sceneCameraActive = !freeOrbit;

  const boneCode = useMemo(() => generateBoneArrayCode(posesByKf, stagesComputed, easings), [posesByKf, stagesComputed, easings]);
  const scenesCode = useMemo(() => generateScenesArrayCode(camsByKf, fxByKf, stagesComputed, easings), [camsByKf, fxByKf, stagesComputed, easings]);
  const movementCode = useMemo(() => generateMovementDefsCode(movesByKf, stagesComputed, easings), [movesByKf, stagesComputed, easings]);
  const scrollLengthCode = useMemo(() => generateScrollLengthCode(totalVh), [totalVh]);
  const objectsCode = useMemo(() => generateObjectsCode(objects, objectTransformsByKf, stagesComputed, easings), [objects, objectTransformsByKf, stagesComputed, easings]);
  const modelUrlCode = useMemo(() => generateModelUrlCode(modelUrl), [modelUrl]);
  const charTransformCode = useMemo(() => generateCharTransformCode(charScale, charCenterY), [charScale, charCenterY]);
  const postFxCode = useMemo(() => generatePostFxCode(postFx), [postFx]);
  const trailCode = useMemo(() => generateTrailCode(trail), [trail]);
  const reflectionCode = useMemo(() => generateReflectionCode(reflection), [reflection]);

  const copy = async (text, which) => {
    try { await navigator.clipboard.writeText(text); setCopiedWhich(which); setTimeout(() => setCopiedWhich(null), 1500); }
    catch (e) { /* fallback: seleccionar manualmente */ }
  };

  /* Guarda/carga el ESTADO DE EDICIÓN completo (etapas, poses, cámara,
     movimiento, ambiente, objetos y sus animaciones) como un .json
     aparte — distinto del index.html final. Esto es lo que hay que
     usar para "seguir mañana donde quedaste". Los blobs de vista
     previa (SVG/imagen subida) no se guardan porque no sobreviven
     entre sesiones — al recargar el proyecto, la ruta del archivo
     queda intacta pero hay que volver a "Subir archivo" si querés
     verla de nuevo en el visor. */
  const [projectLoadError, setProjectLoadError] = useState(null);
  const [projectLoaded, setProjectLoaded] = useState(false);

  const buildProjectSnapshot = () => ({
    kind: "weeb-scroll-project",
    version: 1,
    savedAt: new Date().toISOString(),
    modelUrl,
    charScale,
    charCenterY,
    postFx,
    trail,
    reflection,
    stages,
    durationsVh,
    easings,
    posesByKf,
    camsByKf,
    movesByKf,
    fxByKf,
    objects: objects.map((o) => ({ ...o, previewUrl: null })),
    objectTransformsByKf,
  });

  const restoreProjectState = (p) => {
    if (!p || p.kind !== "weeb-scroll-project") throw new Error("no es un archivo de proyecto de esta herramienta");
    setModelUrl(p.modelUrl || DEFAULT_MODEL_URL);
    setCharScale(typeof p.charScale === "number" ? p.charScale : 0.4);
    setCharCenterY(typeof p.charCenterY === "number" ? p.charCenterY : 0.05);
    if (p.postFx) setPostFx((prev) => ({ ...prev, ...p.postFx }));
    if (p.trail) setTrail((prev) => ({ ...prev, ...p.trail }));
    if (p.reflection) setReflection((prev) => ({ ...prev, ...p.reflection }));
    const loadedStages = p.stages && p.stages.length ? p.stages : makeDefaultStages();
    setStages(loadedStages);
    setDurationsVh(p.durationsVh || DEFAULT_DURATIONS_VH);
    setEasings(p.easings || loadedStages.slice(1).map(() => "smooth"));
    setPosesByKf(p.posesByKf || {});
    setCamsByKf(p.camsByKf || {});
    setMovesByKf(p.movesByKf || {});
    setFxByKf(p.fxByKf || {});
    setObjects(p.objects || []);
    setObjectTransformsByKf(p.objectTransformsByKf || {});
    setActiveStage(loadedStages[0].id);
  };

  /* Al abrir un archivo que "Guardar como editor" generó, este mismo
     componente ya viene con el progreso embebido (base64, en un tag
     invisible fuera de #root). Se detecta y se carga solo, una vez,
     al montar. */
  useEffect(() => {
    const el = document.getElementById("embedded-project-b64");
    const b64 = el && el.textContent.trim();
    if (!b64) return;
    try {
      const json = decodeURIComponent(escape(atob(b64)));
      restoreProjectState(JSON.parse(json));
      setProjectLoaded(true);
      setTimeout(() => setProjectLoaded(false), 2500);
    } catch (e) {
      console.warn("No se pudo restaurar el progreso embebido:", e);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const saveProject = () => {
    const project = buildProjectSnapshot();
    const blob = new Blob([JSON.stringify(project, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "proyecto.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const loadProject = (file) => {
    if (!file) return;
    setProjectLoadError(null);
    const reader = new FileReader();
    reader.onload = () => {
      try {
        restoreProjectState(JSON.parse(reader.result));
        setProjectLoaded(true);
        setTimeout(() => setProjectLoaded(false), 2500);
      } catch (e) {
        setProjectLoadError("No se pudo leer ese archivo como proyecto (¿es el .json que bajaste con \"Guardar proyecto\" de esta misma herramienta?).");
      }
    };
    reader.readAsText(file);
  };

  /* Genera una COPIA COMPLETA de esta misma herramienta (HTML + los
     dos scripts, tal cual están corriendo ahora mismo — React nunca
     toca el texto de un <script>, así que sigue siendo el código
     original) con tu progreso actual metido adentro en base64. Al
     abrir ese archivo de nuevo — doble clic, o subido a GitHub Pages
     con el nombre que quieras — arranca ya con todo cargado. */
  const [projectName, setProjectName] = useState("proyecto");
  const saveProjectAsEditor = () => {
    const project = buildProjectSnapshot();
    const json = JSON.stringify(project);
    const b64 = btoa(unescape(encodeURIComponent(json)));
    const docClone = document.documentElement.cloneNode(true);
    const rootClone = docClone.querySelector("#root");
    if (rootClone) rootClone.innerHTML = "";
    let html = "<!DOCTYPE html>\n" + docClone.outerHTML;
