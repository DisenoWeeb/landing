<textarea id="tpl-source" style="display:none">&lt;!DOCTYPE html&gt;
&lt;html lang="es"&gt;
&lt;head&gt;
&lt;meta charset="UTF-8" /&gt;
&lt;meta name="viewport" content="width=device-width, initial-scale=1.0" /&gt;
&lt;title&gt;Scroll Experience&lt;/title&gt;

&lt;link rel="preconnect" href="https://fonts.googleapis.com" /&gt;
&lt;link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /&gt;
&lt;link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@300;400;500&amp;display=swap"
  rel="stylesheet"
/&gt;

&lt;style&gt;
  :root {
    --brand-accent: #49d3ff;
    --brand-accent-2: #6ee7c9;
    --color-bg: #05070a;
    --color-text: #ffffff8a;
    --color-text-muted: rgba(244, 241, 234, 0.6);
    --font-display: "Space Grotesk", sans-serif;
    --font-body: "Inter", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    overflow-x: hidden;
  }

  @media (min-width: 769px) and (pointer: fine) {
    html {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar {
      display: none;
    }
  }

  #root { width: 100%; }

  .app-root {
    position: relative;
    width: 100%;
  }

  .canvas-stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #05070a;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .canvas-stage--ready { opacity: 1; }
  .canvas-stage canvas { display: block; width: 100% !important; height: 100% !important; }

  .hero-text {
    position: absolute;
    top: 25%;
    left: 50%;
    transform: translate(-50%, -50%);
    transform-origin: center center;
    z-index: 5;
    pointer-events: none;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2.1rem, 4.5vw, 3.2rem);
    letter-spacing: 0.07em;
    color: var(--color-text);
    white-space: nowrap;
    will-change: opacity, transform;
  }

  .scene-text-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }
  .scene-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 8vw;
    max-width: 720px;
    will-change: opacity, transform;
  }
  .scene-text--left    { align-items: flex-start; text-align: left; }
  .scene-text--center  { align-items: center; text-align: center; left: 50%; transform: translateX(-50%); max-width: 640px; }
  .scene-text--right   { align-items: flex-end; text-align: right; margin-left: auto; }

  .scene-text__eyebrow {
    font-family: var(--font-body);
    font-size: 0.75rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--brand-accent);
    margin-bottom: 0.75rem;
    display: inline-block;
  }
  .scene-text__title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2rem, 5vw, 4rem);
    line-height: 1.05;
    margin: 0 0 0.75rem 0;
    color: var(--color-text);
  }
  .kinetic-word { display: inline-block; }
  .kinetic-char {
    display: inline-block;
    will-change: transform, opacity, filter;
  }
  .scene-text__subtitle {
    font-family: var(--font-body);
    font-weight: 300;
    font-size: clamp(0.95rem, 1.4vw, 1.15rem);
    line-height: 1.5;
    color: var(--color-text-muted);
    margin: 0;
    max-width: 46ch;
  }

  .cta-layer {
    position: absolute;
    bottom: 8vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    will-change: opacity, transform;
  }
  .cta-button {
    display: inline-block;
    padding: 0.9rem 2.2rem;
    border-radius: 999px;
    background: var(--brand-accent);
    color: #0a0a0a;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 0.9rem;
    letter-spacing: 0.04em;
    text-decoration: none;
    box-shadow: 0 8px 30px rgba(200, 255, 0, 0.35);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .cta-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 36px rgba(200, 255, 0, 0.5);
  }

  .progress-rail {
    position: fixed;
    top: 50%;
    right: 3vw;
    transform: translateY(-50%);
    height: 28vh;
    z-index: 6;
  }
  .progress-rail__track {
    position: relative;
    width: 2px;
    height: 100%;
    background: rgba(244, 241, 234, 0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-rail__fill {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 0%;
    background: var(--brand-accent);
    border-radius: 2px;
    transition: height 0.05s linear;
  }

  .brand-mark {
    position: fixed;
    top: 3vh;
    left: 3vw;
    z-index: 6;
    font-family: var(--font-display);
    font-size: 1rem;
    letter-spacing: 0.08em;
    color: var(--color-text);
  }

  .scroll-hint {
    position: fixed;
    bottom: 4vh;
    left: 3vw;
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--color-text-muted);
    opacity: 0.7;
  }
  .scroll-hint__line {
    width: 1px;
    height: 32px;
    background: linear-gradient(to bottom, var(--color-text-muted), transparent);
    animation: scrollHintPulse 2s ease-in-out infinite;
  }
  @keyframes scrollHintPulse {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  .cursor-trail-canvas {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    mix-blend-mode: screen;
  }

  .scroll-spacer { width: 100%; }

  .app-root--scrolled .scroll-hint { opacity: 0; pointer-events: none; }
&lt;/style&gt;

&lt;script&gt;
  /* Scroll con inercia (Lenis). No requiere tocar el resto del código:
     Lenis intercepta la rueda/touch y anima window.scrollTo() de forma
     suave, disparando eventos "scroll" nativos igual que siempre — así
     que useScrollProgress() sigue funcionando sin cambios, solo que
     ahora el movimiento llega amortiguado en vez de "a saltos". */
  (function () {
    if (typeof Lenis === "undefined") return;
    const lenis = new Lenis({
      duration: 1.2,
      easing: (t) =&gt; Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      smoothWheel: true,
      smoothTouch: false, // en mobile el scroll táctil nativo se siente mejor
    });
    function raf(time) {

function damp(current, target, lambda, dt) {
  return current + (target - current) * (1 - Math.exp(-lambda * dt));
}
function clamp(value, min = 0, max = 1) {
  return Math.min(max, Math.max(min, value));
}

function getDeviceProfile() {

    enablePostProcessing: !isMobile,
  };
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}
function lerpVec3(a, b, t) {
  return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
}
function lerpAngle(a, b, t) {
  let diff = ((b - a + 180) % 360 + 360) % 360 - 180;
  return a + diff * t;
}
function lightDirFromAngles(azimuthDeg, elevationDeg, distance) {
  const az = (azimuthDeg * Math.PI) / 180;
  const el = (elevationDeg * Math.PI) / 180;
  return [
    distance * Math.cos(el) * Math.sin(az),
    distance * Math.sin(el),
    distance * Math.cos(el) * Math.cos(az),
  ];
}
function lerpColor(a, b, t) {
  const ca = new THREE.Color(a);
  const cb = new THREE.Color(b);
  ca.lerp(cb, t);
  return "#" + ca.getHexString();
}

function sceneToState(kf) {
  return {
    camera: kf.camera,
    light: kf.light,
    fog: kf.fog,
    background: kf.background,
  };
}

function blendScenes(list, rawProgress) {
  const progress = clamp(rawProgress, 0, 1);
  if (progress &lt;= list[0].progress) return sceneToState(list[0]);
  const last = list[list.length - 1];
  if (progress &gt;= last.progress) return sceneToState(last);

  let i = 0;
  while (i &lt; list.length - 1 &amp;&amp; list[i + 1].progress &lt; progress) i++;
  const a = list[i];
  const b = list[i + 1];
  const span = b.progress - a.progress || 1;
  const t = applyEasing(clamp((progress - a.progress) / span), b.easing);

  return {
    camera: {
      position: lerpVec3(a.camera.position, b.camera.position, t),
      lookAt: lerpVec3(a.camera.lookAt, b.camera.lookAt, t),
      fov: lerp(a.camera.fov, b.camera.fov, t),
      roll: lerp(a.camera.roll || 0, b.camera.roll || 0, t),
    },
    light: {
      color: lerpColor(a.light.color, b.light.color, t),
      intensity: lerp(a.light.intensity, b.light.intensity, t),
      azimuth: lerpAngle(a.light.azimuth ?? 45, b.light.azimuth ?? 45, t),
      elevation: lerp(a.light.elevation ?? 35, b.light.elevation ?? 35, t),
      rimColor: lerpColor(a.light.rimColor, b.light.rimColor, t),
      rimIntensity: lerp(a.light.rimIntensity, b.light.rimIntensity, t),
    },
    fog: {
      enabled: t &lt; 0.5 ? (a.fog.enabled ?? true) : (b.fog.enabled ?? true),
      color: lerpColor(a.fog.color, b.fog.color, t),
      far: lerp(a.fog.far, b.fog.far, t),
    },
    background: {
      from: lerpColor(a.background.from, b.background.from, t),
      to: lerpColor(a.background.to, b.background.to, t),
      angle: lerp(a.background.angle ?? 180, b.background.angle ?? 180, t),

const useScrollStore = create((set) =&gt; ({
  progress: 0,
  smoothProgress: 0,
  setProgress: (p) =&gt; set({ progress: p }),
  setSmoothProgress: (p) =&gt; set({ smoothProgress: p }),
}));

function useScrollProgress(spacerRef) {
  useEffect(() =&gt; {
    const compute = () =&gt; {
      const el = spacerRef.current;
      if (!el) return;
      const total = el.offsetHeight - window.innerHeight;
      const raw = total &gt; 0 ? window.scrollY / total : 0;
      const p = clamp(raw, 0, 1);
      useScrollStore.getState().setProgress(p);
      document.body.classList.toggle("app-root--scrolled", window.scrollY &gt; 20);
    };
    compute();
    window.addEventListener("scroll", compute, { passive: true });
    window.addEventListener("resize", compute);
    return () =&gt; {
      window.removeEventListener("scroll", compute);
      window.removeEventListener("resize", compute);
    };
  }, [spacerRef]);
}

function useArrowKeyScroll(step = 140) {
  useEffect(() =&gt; {
    const onKeyDown = (e) =&gt; {
      if (e.key !== "ArrowDown" &amp;&amp; e.key !== "ArrowUp") return;
      const tag = document.activeElement?.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || document.activeElement?.isContentEditable) return;
      e.preventDefault();
      window.scrollBy({ top: e.key === "ArrowDown" ? step : -step, behavior: "smooth" });
    };
    window.addEventListener("keydown", onKeyDown);
    return () =&gt; window.removeEventListener("keydown", onKeyDown);
  }, [step]);
}

function ScrollSmoother() {
  useFrame((_, delta) =&gt; {
    const { progress, smoothProgress, setSmoothProgress } = useScrollStore.getState();
    setSmoothProgress(damp(smoothProgress, progress, 4, delta));
  });
  return null;
}

function useMouseParallax() {
  const mouse = useRef({ x: 0, y: 0 });
  useEffect(() =&gt; {
    const onMove = (e) =&gt; {
      if (e.pointerType !== "mouse") return;
      mouse.current.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.current.y = (e.clientY / window.innerHeight) * 2 - 1;
    };
    window.addEventListener("pointermove", onMove, { passive: true });
    return () =&gt; window.removeEventListener("pointermove", onMove);
  }, []);
  return mouse;
}

function CameraRig({ mouse, parallaxStrength = 0.18 }) {
  const { camera } = useThree();
  const lookAtTarget = useRef(new THREE.Vector3());
  const currentLookAt = useRef(new THREE.Vector3());
  const dampedRoll = useRef(0);

  useFrame((_, delta) =&gt; {
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    const [px, py, pz] = state.camera.position;
    const [lx, ly, lz] = state.camera.lookAt;
    const mx = mouse.current?.x ?? 0;
    const my = mouse.current?.y ?? 0;

    camera.position.x = damp(camera.position.x, px + mx * parallaxStrength, 6, delta);
    camera.position.y = damp(camera.position.y, py - my * parallaxStrength * 0.6, 6, delta);
    camera.position.z = damp(camera.position.z, pz, 6, delta);

    lookAtTarget.current.set(lx + mx * 0.05, ly - my * 0.05, lz);
    currentLookAt.current.lerp(lookAtTarget.current, 1 - Math.exp(-6 * delta));
    camera.up.set(0, 1, 0);
    camera.lookAt(currentLookAt.current);

    dampedRoll.current = damp(dampedRoll.current, state.camera.roll || 0, 6, delta);
    if (dampedRoll.current) camera.rotateZ((dampedRoll.current * Math.PI) / 180);

    if ("fov" in camera) {
      camera.fov = damp(camera.fov, state.camera.fov, 5, delta);
      camera.updateProjectionMatrix();
    }
  });

  return null;
}

const TRAIL_VERTEX_SHADER = `

  attribute float aOpacity;
  varying float vOpacity;
  void main() {

  const maxParticles = useMemo(() =&gt; Math.max(8, Math.ceil(rate * life) + 8), [rate, life]);
  const positions = useMemo(() =&gt; new Float32Array(maxParticles * 3), [maxParticles]);
  const sizes = useMemo(() =&gt; new Float32Array(maxParticles), [maxParticles]);
  const opacities = useMemo(() =&gt; new Float32Array(maxParticles), [maxParticles]);
  const emitAccum = useRef(0);
  const prevAnchor = useRef(null);
  const prevProgress = useRef(null);

  useEffect(() =&gt; {
    if (materialRef.current) materialRef.current.uniforms.uColor.value.set(color);
  }, [color]);

  useFrame((_, delta) =&gt; {
    const group = pointsRef.current;
    const anchor = anchorRef &amp;&amp; anchorRef.current;
    if (!group) return;

    if (!enabled || !anchor) {
      group.visible = false;
      particles.current.length = 0;
      prevAnchor.current = null;
      prevProgress.current = null;
      return;
    }
    group.visible = true;

    const ax = anchor.position.x, ay = anchor.position.y, az = anchor.position.z;

    // Solo emite si el scroll realmente se movió este frame — filtra el
    // "respirar" idle del personaje, que no cuenta como movimiento real.
    const progress = useScrollStore.getState().smoothProgress;
    const SCROLL_EPS = 0.00025;
    const isScrolling = prevProgress.current !== null &amp;&amp; Math.abs(progress - prevProgress.current) &gt; SCROLL_EPS;
    prevProgress.current = progress;

    if (isScrolling &amp;&amp; prevAnchor.current) {
      emitAccum.current += delta;
      const emitEvery = 1 / Math.max(rate, 1);
      const from = prevAnchor.current;
      while (emitAccum.current &gt;= emitEvery) {
        emitAccum.current -= emitEvery;
        const t = 1 - emitAccum.current / delta;
        const px = lerp(from.x, ax, isFinite(t) ? t : 1);
        const py = lerp(from.y, ay, isFinite(t) ? t : 1);
        const pz = lerp(from.z, az, isFinite(t) ? t : 1);
        particles.current.push({
          x: px, y: py, z: pz,
          age: 0,
          seed: Math.random() * Math.PI * 2,
          ox: (Math.random() - 0.5) * size * 6,
          oy: (Math.random() - 0.5) * size * 6,
          oz: (Math.random() - 0.5) * size * 6,
          sizeMul: 0.5 + Math.random() * 0.9,
        });
        if (particles.current.length &gt; maxParticles) particles.current.shift();
      }
    } else {
      // Sin scroll: no acumules emisión pendiente, así no larga una
      // ráfaga de golpe apenas el usuario vuelve a mover la rueda.
      emitAccum.current = 0;

    prevAnchor.current = { x: ax, y: ay, z: az };

    for (let i = particles.current.length - 1; i &gt;= 0; i--) {
      particles.current[i].age += delta;
      if (particles.current[i].age &gt;= life) particles.current.splice(i, 1);
    }

    const n = Math.min(particles.current.length, maxParticles);
    const now = performance.now() * 0.001;
    for (let i = 0; i &lt; n; i++) {
      const p = particles.current[i];

    geom.attributes.aOpacity.needsUpdate = true;
    geom.attributes.aSize.needsUpdate = true;

      &lt;bufferGeometry&gt;
        &lt;bufferAttribute attach="attributes-position" count={maxParticles} array={positions} itemSize={3} /&gt;
        &lt;bufferAttribute attach="attributes-aSize" count={maxParticles} array={sizes} itemSize={1} /&gt;
        &lt;bufferAttribute attach="attributes-aOpacity" count={maxParticles} array={opacities} itemSize={1} /&gt;
      &lt;/bufferGeometry&gt;
      &lt;shaderMaterial
        ref={materialRef}
        vertexShader={TRAIL_VERTEX_SHADER}
        fragmentShader={TRAIL_FRAGMENT_SHADER}
        uniforms={{ uColor: { value: new THREE.Color(color) } }}
        transparent
        depthWrite={false}
        blending={THREE.AdditiveBlending}

}

  /* Cámara de reflejo (cube camera): ubicada en el Modelo principal, cada
   ciertos frames fotografía los 360° a su alrededor (paredes, objetos,
   el PNG del perro, etc. — todo lo que haya en la escena, salvo el
   propio modelo, que se oculta un instante durante la captura) y usa
   esa foto como reflejo en los materiales metálicos del modelo. La
   cámara principal (la que ve el usuario) no necesita apuntar a lo que
   se refleja — el reflejo se calcula aparte, en 360°, todo el tiempo. */
function ReflectionProbe({ anchorRef, enabled, resolution, updateEvery, intensity }) {
  const { gl, scene } = useThree();

  const camRef = useRef(null);

  const appliedRef = useRef(new Set());
  const posRef = useRef(new THREE.Vector3());

  useEffect(() =&gt; {
    const rt = new THREE.WebGLCubeRenderTarget(resolution, {
      generateMipmaps: true,
      minFilter: THREE.LinearMipmapLinearFilter,
    });
    rtRef.current = rt;
    camRef.current = new THREE.CubeCamera(0.05, 1000, rt);
    appliedRef.current = new Set();
    return () =&gt; rt.dispose();
  }, [resolution]);

  useFrame(() =&gt; {
    if (!enabled || !anchorRef.current || !camRef.current) return;
    frameRef.current++;
    if (frameRef.current % Math.max(1, updateEvery) !== 0) return;

    const anchor = anchorRef.current;
    anchor.getWorldPosition(posRef.current);
    camRef.current.position.copy(posRef.current);

    // Oculta el modelo un instante para que no se refleje a sí mismo.
    const wasVisible = anchor.visible;
    anchor.visible = false;
    camRef.current.update(gl, scene);
    anchor.visible = wasVisible;

    const texture = rtRef.current.texture;
    anchor.traverse((child) =&gt; {
      if (!child.isMesh || !child.material) return;
      const mats = Array.isArray(child.material) ? child.material : [child.material];
      mats.forEach((m) =&gt; {
        if (!("envMap" in m)) return;
        if (!appliedRef.current.has(m.uuid)) {
          m.envMap = texture;
          m.needsUpdate = true;
          appliedRef.current.add(m.uuid);
        }
        if ("envMapIntensity" in m) m.envMapIntensity = intensity;
      });
    });
  });

  return null;
}

   transparente en los bordes y en las puntas (arriba/abajo) — se genera
   una sola vez con canvas, no hace falta subir ningún asset. */

function getBeamTexture() {
  if (_beamTextureCache) return _beamTextureCache;
  const size = 128;
  const canvas = document.createElement("canvas");
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext("2d");
  const grad = ctx.createLinearGradient(0, 0, size, 0);
  grad.addColorStop(0, "rgba(255,255,255,0)");
  grad.addColorStop(0.5, "rgba(255,255,255,1)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  const vgrad = ctx.createLinearGradient(0, 0, 0, size);
  vgrad.addColorStop(0, "rgba(0,0,0,1)");
  vgrad.addColorStop(0.12, "rgba(0,0,0,0)");
  vgrad.addColorStop(0.82, "rgba(0,0,0,0)");
  vgrad.addColorStop(1, "rgba(0,0,0,1)");
  ctx.globalCompositeOperation = "destination-out";
  ctx.fillStyle = vgrad;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(canvas);
  _beamTextureCache = tex;
  return tex;

/* Rayo de luz volumétrico (fake): 3 planos cruzados con degradado

   mano acá). No es raymarching real, pero con blending aditivo encima
   de la niebla se lee como un haz de luz que baja, sin pesar nada.

    const state = blendScenes(scenes, progress);

    &lt;group ref={groupRef}&gt;
      {[0, 60, 120].map((deg, i) =&gt; (
        &lt;mesh key={deg} rotation={[0, (deg * Math.PI) / 180, 0]}&gt;
          &lt;planeGeometry args={[width, height]} /&gt;
          &lt;meshBasicMaterial
            ref={(m) =&gt; { matRefs.current[i] = m; }}
            map={texture}
            transparent
            opacity={opacity}
            color="#ffffff"

   del mismo "progress" de scroll que usa el personaje — por eso el

   como props de React, igual que AnimatedCharacter, para no forzar un
   re-render en cada frame de scroll.

  const list = keyframes;

  const last = list[list.length - 1];
  if (p &gt;= last.progress) return last;
  let i = 0;
  while (i &lt; list.length - 1 &amp;&amp; list[i + 1].progress &lt; p) i++;
  const a = list[i], b = list[i + 1];
  const span = b.progress - a.progress || 1;
  const t = applyEasing(clamp((p - a.progress) / span), b.easing);
  return {
    position: lerpVec3(a.position, b.position, t),
    scale: lerp(a.scale, b.scale, t),
    rotationY: lerpAngle(a.rotationY, b.rotationY, t),

function useObjectTransformRef(keyframes, billboard) {
  const groupRef = useRef(null);

    const g = groupRef.current;

    const progress = useScrollStore.getState().smoothProgress;
    const kf = sampleObjectKeyframes(keyframes, progress);
    g.position.x = damp(g.position.x, kf.position[0], 4, delta);
    g.position.y = damp(g.position.y, kf.position[1], 4, delta);
    g.position.z = damp(g.position.z, kf.position[2], 2.2, delta);

  const { scene } = useGLTF(data.url);
  const groupRef = useObjectTransformRef(data.keyframes, false);
  useEffect(() =&gt; {
    scene.traverse((child) =&gt; {
      if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
    });
  }, [scene]);
  return (
    &lt;group ref={groupRef}&gt;
      &lt;primitive object={scene} /&gt;
    &lt;/group&gt;
  );
}
function SceneObjectImageRaster({ data }) {
  const texture = useTexture(data.url);
  const aspect = texture.image ? texture.image.width / texture.image.height : 1;
  const groupRef = useObjectTransformRef(data.keyframes, data.billboard);
  const mesh = (
    &lt;mesh scale={[aspect, 1, 1]}&gt;
      &lt;planeGeometry args={[1, 1]} /&gt;
      &lt;meshBasicMaterial map={texture} transparent toneMapped={false} /&gt;
    &lt;/mesh&gt;
  );
  return (
    &lt;group ref={groupRef}&gt;
      {data.billboard ? &lt;Billboard&gt;{mesh}&lt;/Billboard&gt; : mesh}
    &lt;/group&gt;
  );
}
function SceneObjectImageSvg({ data }) {
  const texture = useHiResSvgTexture(data.url, 3072);
  const groupRef = useObjectTransformRef(data.keyframes, data.billboard);
  if (!texture) return &lt;group ref={groupRef} /&gt;;
  const aspect = texture.image.width / texture.image.height;
  const mesh = (
    &lt;mesh scale={[aspect, 1, 1]}&gt;
      &lt;planeGeometry args={[1, 1]} /&gt;
      &lt;meshBasicMaterial map={texture} transparent toneMapped={false} /&gt;
    &lt;/mesh&gt;
  );
  return (
    &lt;group ref={groupRef}&gt;
      {data.billboard ? &lt;Billboard&gt;{mesh}&lt;/Billboard&gt; : mesh}
    &lt;/group&gt;
  );
}
function SceneObjectImage({ data }) {
  return isSvgUrl(data.url) ? &lt;SceneObjectImageSvg data={data} /&gt; : &lt;SceneObjectImageRaster data={data} /&gt;;
}
function SceneObject({ data }) {
  if (data.type === "text") return &lt;SceneObjectText data={data} /&gt;;
  return data.type === "image" ? &lt;SceneObjectImage data={data} /&gt; : &lt;SceneObjectModel data={data} /&gt;;
}
/* Si un archivo de un objeto (glb, png, svg) no se encuentra en el
   servidor (404) o falla al leerse, esto evita que tumbe TODA la
   experiencia — sin esto, un solo archivo faltante rompe el canvas
   entero (WebGL "Context Lost") y la página queda negra. Cada objeto
   tiene su propio boundary, así uno roto no afecta a los demás ni al
   personaje. */
class ObjectBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false }; }
  static getDerivedStateFromError() { return { hasError: true }; }
  componentDidCatch(error) { console.warn("No se pudo cargar un objeto de la escena:", error &amp;&amp; error.message); }
  render() {
    if (this.state.hasError) return null;
    return this.props.children;
  }
}
function SceneObjects() {
  return (
    &lt;&gt;
      {OBJECTS.map((obj, i) =&gt; (
        &lt;ObjectBoundary key={i}&gt;
          &lt;Suspense fallback={null}&gt;
            &lt;SceneObject data={obj} /&gt;
          &lt;/Suspense&gt;
        &lt;/ObjectBoundary&gt;
      ))}
    &lt;/&gt;
  );
}
OBJECTS.forEach((obj) =&gt; {
  if (obj.type === "text") return; // el texto no tiene archivo que precargar
  if (obj.type === "image") useTexture.preload(obj.url);
  else useGLTF.preload(obj.url);
});

function Lighting() {
  const keyRef = useRef(null);
  const rimRef = useRef(null);
  const dampedPos = useRef(new THREE.Vector3(...lightDirFromAngles(45, 35, 6)));

  useFrame((_, delta) =&gt; {
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    if (keyRef.current) {
      keyRef.current.color.set(state.light.color);
      keyRef.current.intensity = damp(keyRef.current.intensity, state.light.intensity, 4, delta);
      const target = lightDirFromAngles(state.light.azimuth, state.light.elevation, 6);
      dampedPos.current.x = damp(dampedPos.current.x, target[0], 5, delta);
      dampedPos.current.y = damp(dampedPos.current.y, target[1], 5, delta);
      dampedPos.current.z = damp(dampedPos.current.z, target[2], 5, delta);
      keyRef.current.position.copy(dampedPos.current);
    }
    if (rimRef.current) {
      rimRef.current.color.set(state.light.rimColor);
      rimRef.current.intensity = damp(rimRef.current.intensity, state.light.rimIntensity, 4, delta);
    }
  });

  return (
    &lt;&gt;
      &lt;hemisphereLight color="#cfe8ff" groundColor="#1a1410" intensity={0.45} /&gt;
      &lt;ambientLight intensity={0.32} /&gt;
      &lt;directionalLight
        ref={keyRef}
        intensity={0.9}
        castShadow
        shadow-mapSize={[1024, 1024]}
        shadow-bias={-0.0015}
        shadow-camera-left={-14}
        shadow-camera-right={14}
        shadow-camera-top={14}
        shadow-camera-bottom={-14}
        shadow-camera-near={0.5}
        shadow-camera-far={40}
      /&gt;
      &lt;directionalLight position={[-3, 2, -2]} intensity={0.5} /&gt;
      &lt;pointLight ref={rimRef} position={[-2.5, -1, -2]} intensity={1.4} distance={12} /&gt;
    &lt;/&gt;
  );
}

function SceneEnvironment() {
  const { scene } = useThree();
  const fog = useRef(new THREE.FogExp2("#05070a", 0.12));

  useEffect(() =&gt; {
    scene.background = null;
  }, [scene]);

  useFrame(() =&gt; {
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    if (state.fog.enabled) {
      scene.fog = fog.current;
      fog.current.color.set(state.fog.color);
      fog.current.density = 1 / Math.max(state.fog.far, 1);
    } else {
      scene.fog = null;
    }
  });

  return null;
}

function Experience({ device }) {
  const mouse = useMouseParallax();
  const charAnchorRef = useRef(null);
  return (
    &lt;&gt;
      &lt;ScrollSmoother /&gt;
      &lt;SceneEnvironment /&gt;
      &lt;CameraRig mouse={mouse} /&gt;
      &lt;Lighting /&gt;
      &lt;Stars radius={140} depth={70} count={device.isMobile ? 800 : 1800} factor={4} saturation={0} fade speed={0.3} /&gt;
      &lt;Suspense fallback={null}&gt;
        &lt;SceneObjects /&gt;
        &lt;ObjectBoundary&gt;
          &lt;Suspense fallback={null}&gt;
            &lt;AnimatedCharacter mouse={mouse} anchorRef={charAnchorRef} /&gt;
          &lt;/Suspense&gt;
        &lt;/ObjectBoundary&gt;
      &lt;/Suspense&gt;
      &lt;SparkleTrail
        anchorRef={charAnchorRef}
        enabled={TRAIL_ENABLED}
        color={TRAIL_COLOR}
        size={TRAIL_SIZE}
        life={TRAIL_LIFE}
        rate={TRAIL_RATE}
      /&gt;

        &lt;ReflectionProbe
        anchorRef={charAnchorRef}
        enabled={REFLECTION_ENABLED}
        resolution={REFLECTION_RESOLUTION}
        updateEvery={REFLECTION_UPDATE_EVERY}
        intensity={REFLECTION_INTENSITY}
      /&gt;

      &lt;LightBeam enabled={BEAM_ENABLED} opacity={BEAM_OPACITY} width={BEAM_WIDTH} height={BEAM_HEIGHT} /&gt;
  
      {device.enablePostProcessing &amp;&amp; BLOOM_ENABLED &amp;&amp; (
        &lt;EffectComposer multisampling={0}&gt;
          &lt;Bloom intensity={BLOOM_INTENSITY} luminanceThreshold={0.25} luminanceSmoothing={0.9} mipmapBlur height={240} /&gt;
        &lt;/EffectComposer&gt;
      )}
    &lt;/&gt;
  );
}

function textWeight(kf, progress, window_ = 0.14) {
  const d = Math.abs(progress - kf.progress);
  return clamp(1 - d / window_);
}

/* Divide un título en palabras (para que no corten mal el renglón) y cada
   palabra en caracteres — cada &lt;span&gt; de caracter se anima individualmente
   para el efecto de tipografía cinética (entra/sale en cascada con el
   scroll, no como bloque entero). Guarda cada span en charRefsArr. */
function renderKineticTitle(text, charRefsArr) {
  charRefsArr.length = 0;
  const words = String(text || "").split(" ");
  let globalIndex = 0;
  return words.map((word, wi) =&gt; (
    &lt;span key={wi} className="kinetic-word"&gt;
      {word.split("").map((ch, ci) =&gt; {
        const idx = globalIndex++;
        return (
          &lt;span
            key={ci}
            ref={(el) =&gt; { charRefsArr[idx] = el; }}
            className="kinetic-char"
            style={{ opacity: 0 }}
          &gt;
            {ch}
          &lt;/span&gt;
        );
      })}
      {wi &lt; words.length - 1 ? "\u00A0" : ""}
    &lt;/span&gt;
  ));
}

function SceneText() {
  const refs = useRef([]);
  const charRefsByScene = useRef(scenes.map(() =&gt; []));

  useEffect(() =&gt; {
    const update = (progress) =&gt; {
      scenes.forEach((kf, i) =&gt; {
        const el = refs.current[i];
        if (!el || !kf.text) return;
        const weight = textWeight(kf, progress);
        el.style.opacity = String(weight &gt; 0 ? 1 : 0); // el contenedor solo controla visibilidad/posición del bloque
        el.style.transform =
          kf.text.align === "center"
            ? `translateX(-50%) translateY(${(1 - weight) * 10}px)`
            : `translateY(${(1 - weight) * 10}px)`;
        el.style.pointerEvents = weight &gt; 0.5 ? "auto" : "none";

        // Reveal en cascada por caracter (tipografía cinética)
        const chars = charRefsByScene.current[i];
        if (chars &amp;&amp; chars.length) {
          const stagger = 0.6; // qué tan "esparcida" queda la cascada entre el primer y el último caracter
          const n = chars.length;
          chars.forEach((cel, j) =&gt; {
            if (!cel) return;
            const localW = clamp(weight * (1 + stagger) - (j / n) * stagger);
            cel.style.opacity = String(localW);
            cel.style.transform = `translateY(${(1 - localW) * 14}px)`;
            cel.style.filter = `blur(${(1 - localW) * 3}px)`;
          });
        }
      });
    };
    update(useScrollStore.getState().smoothProgress);
    const unsubscribe = useScrollStore.subscribe((s) =&gt; update(s.smoothProgress));

  return (
    &lt;div className="scene-text-layer"&gt;
      {scenes.map((kf, i) =&gt;
        kf.text ? (
          &lt;div
            key={kf.id}
            ref={(el) =&gt; { refs.current[i] = el; }}
            className={`scene-text scene-text--${kf.text.align}`}
            style={{ opacity: 0 }}
          &gt;
            {kf.text.eyebrow &amp;&amp; &lt;span className="scene-text__eyebrow"&gt;{kf.text.eyebrow}&lt;/span&gt;}
            &lt;h2 className="scene-text__title"&gt;{renderKineticTitle(kf.text.title, charRefsByScene.current[i])}&lt;/h2&gt;
            {kf.text.subtitle &amp;&amp; &lt;p className="scene-text__subtitle"&gt;{kf.text.subtitle}&lt;/p&gt;}
          &lt;/div&gt;
        ) : null
      )}
    &lt;/div&gt;
  );
}

const CTA_START = scenes.find((s) =&gt; s.showCTA)?.progress ?? 1;
const FADE_WINDOW = 0.06;

function CTAButton() {
  const ref = useRef(null);

  useEffect(() =&gt; {
    const update = (progress) =&gt; {
      if (!ref.current) return;
      const weight = clamp((progress - (CTA_START - FADE_WINDOW)) / FADE_WINDOW);
      ref.current.style.opacity = String(weight);
      ref.current.style.transform = `translateX(-50%) translateY(${(1 - weight) * 16}px)`;
      ref.current.style.pointerEvents = weight &gt; 0.6 ? "auto" : "none";

    return useScrollStore.subscribe((s) =&gt; update(s.smoothProgress));

}

function BackgroundGradient({ stageRef }) {
  useEffect(() =&gt; {
    const update = (progress) =&gt; {
      const el = stageRef.current;
      if (!el) return;

function ProgressIndicator() {
  const fillRef = useRef(null);

  useEffect(() =&gt; {
    const update = (progress) =&gt; {
      if (fillRef.current) fillRef.current.style.height = `${progress * 100}%`;
    };
    update(useScrollStore.getState().smoothProgress);
    return useScrollStore.subscribe((s) =&gt; update(s.smoothProgress));
  }, []);

  return (
    &lt;div className="progress-rail" aria-hidden="true"&gt;
      &lt;div className="progress-rail__track"&gt;
        &lt;div ref={fillRef} className="progress-rail__fill" /&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  );
}

function CursorTrail() {
  const canvasRef = useRef(null);

  useEffect(() =&gt; {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let width = window.innerWidth;
    let height = window.innerHeight;
    let points = [];
    let rafId = 0;

    const resize = () =&gt; {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();

    const addPoint = (x, y) =&gt; {
      points.push({ x, y, life: 1 });
      if (points.length &gt; 40) points.shift();
    };
    const onPointerMove = (e) =&gt; addPoint(e.clientX, e.clientY);
    const onTouchMove = (e) =&gt; {
      if (e.touches &amp;&amp; e.touches[0]) addPoint(e.touches[0].clientX, e.touches[0].clientY);
    };

    window.addEventListener("resize", resize);
    window.addEventListener("pointermove", onPointerMove, { passive: true });
    window.addEventListener("touchmove", onTouchMove, { passive: true });

    const draw = () =&gt; {
      ctx.clearRect(0, 0, width, height);
      points.forEach((p) =&gt; { p.life *= 0.94; });
      points = points.filter((p) =&gt; p.life &gt; 0.02);

      if (points.length &gt; 1) {
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.globalCompositeOperation = "lighter";
        for (let i = 1; i &lt; points.length; i++) {
          const p0 = points[i - 1];
          const p1 = points[i];
          const alpha = Math.min(p0.life, p1.life) * 0.55;
          ctx.strokeStyle = clientConfig.colors.accent;
          ctx.globalAlpha = alpha;
          ctx.lineWidth = 1.5 + alpha * 4;
          ctx.beginPath();
          ctx.moveTo(p0.x, p0.y);
          ctx.lineTo(p1.x, p1.y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
      }
      rafId = requestAnimationFrame(draw);
    };
    rafId = requestAnimationFrame(draw);

    return () =&gt; {
      cancelAnimationFrame(rafId);
      window.removeEventListener("resize", resize);
      window.removeEventListener("pointermove", onPointerMove);
      window.removeEventListener("touchmove", onTouchMove);
    };
  }, []);

  return &lt;canvas ref={canvasRef} className="cursor-trail-canvas" aria-hidden="true" /&gt;;
}

function App() {
  const spacerRef = useRef(null);
  const stageRef = useRef(null);
  useScrollProgress(spacerRef);
  useArrowKeyScroll();
  const device = useMemo(() =&gt; getDeviceProfile(), []);

        "--color-bg": clientConfig.colors.background,
        "--color-text": clientConfig.colors.textPrimary,
        "--color-text-muted": clientConfig.colors.textMuted,
        "--font-display": clientConfig.fonts.display,
        "--font-body": clientConfig.fonts.body,
      }}
    &gt;
      &lt;div ref={stageRef} className={`canvas-stage ${ready ? "canvas-stage--ready" : ""}`}&gt;
        &lt;Canvas
          dpr={device.dpr}
          shadows="soft"
          gl={{ antialias: true, alpha: true, powerPreference: "high-performance" }}
          camera={{ position: [0, 0.2, 6.5], fov: 35, near: 0.1, far: 60 }}
        &gt;
          &lt;Experience device={device} /&gt;
        &lt;/Canvas&gt;
        &lt;BackgroundGradient stageRef={stageRef} /&gt;
        {VIGNETTE_ENABLED &amp;&amp; (
          &lt;div
            aria-hidden="true"
            style={{
              position: "absolute",
              inset: 0,
              zIndex: 3,
              pointerEvents: "none",
              background: `radial-gradient(ellipse farthest-corner at center, transparent ${(1 - VIGNETTE_OFFSET) * 100}%, rgba(0,0,0,${VIGNETTE_DARKNESS}) 100%)`,
            }}
          /&gt;
        )}
        &lt;CursorTrail /&gt;
        &lt;SceneText /&gt;
        &lt;ProgressIndicator /&gt;
        &lt;div className="scroll-hint" aria-hidden="true"&gt;
          &lt;span&gt;Scroll&lt;/span&gt;
          &lt;div className="scroll-hint__line" /&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div ref={spacerRef} className="scroll-spacer" style={{ height: `${SCROLL_LENGTH_VH}vh` }} /&gt;
    &lt;/div&gt;
  );
}

createRoot(document.getElementById("root")).render(&lt;App /&gt;);

&lt;/script&gt;

<script type="text/babel" data-type="module" data-presets="react">

const deg = (r) => (r * 180) / Math.PI;
const clamp = (v, min = 0, max = 1) => Math.min(max, Math.max(min, v));

function smoothstep(edge0, edge1, x) {
  const t = clamp((x - edge0) / (edge1 - edge0));
  return t * t * (3 - 2 * t);
}

/* Curva de velocidad ("easing") por tramo — usada por samplePose /
   sampleCamera / sampleMovement / sampleFx más abajo para que la
   pestaña Preview respete lo elegido en "Duración". */
function applyEasing(t, kind) {
  switch (kind) {
    case "linear": return t;
    case "easeIn": return t * t;
    case "easeOut": return 1 - (1 - t) * (1 - t);
    case "smooth":
    default: return smoothstep(0, 1, t);
  }
}

/* ============================================================
   Etapas ("poses") — ahora en CANTIDAD VARIABLE. Ya no hay una lista
   fija de 6 nombres semánticos (Frente/Acercamiento/Giro/...); las
   etapas se llaman genéricamente "Pose 1", "Pose 2", etc. y se pueden
   agregar o quitar libremente desde la pestaña Pose/Cámara/Movimiento.
   Pose, Cámara, Movimiento y su Ambiente (luz/niebla/fondo) comparten
   siempre las mismas etapas.

function makeDefaultStages() {
  return [
    { id: "pose-1", label: "Pose 1" },
    { id: "pose-2", label: "Pose 2" },
    { id: "pose-3", label: "Pose 3" },
    { id: "pose-4", label: "Pose 4" },
    { id: "pose-5", label: "Pose 5" },
    { id: "pose-6", label: "Pose 6" },

/* Duración de cada tramo (en vh de scroll), entre etapa[i] y etapa[i+1].

   el largo total del scroll. Editable desde la pestaña "Duración". */
const DEFAULT_DURATIONS_VH = [170, 275, 125, 190, 190];

function stagesWithProgress(stageList, durationsVh) {
  const total = durationsVh.reduce((a, b) => a + b, 0) || 1;
  let acc = 0;
  const out = [{ ...stageList[0], progress: 0 }];
  for (let i = 0; i < durationsVh.length; i++) {
    acc += durationsVh[i];
    out.push({ ...stageList[i + 1], progress: acc / total });

  return out;
}
const roundProgress = (p) => Math.round(p * 1000) / 1000;

const zeroPose = () => Object.fromEntries(BONE_KEYS.map((k) => [k, { x: 0, y: 0, z: 0 }]));
const defaultCamera = () => ({ position: [0, 0, 3.5], lookAt: [0, 0.5, 0], fov: 30, roll: 0 });

const defaultFx = () => ({
  light: { color: "#dfeeff", intensity: 0.7, azimuth: 45, elevation: 35, rimColor: "#49d3ff", rimIntensity: 1.4 },
  fog: { enabled: true, color: "#05070a", far: 20 },
  background: { mode: "solid", from: "#05070a", to: "#05070a", angle: 180 },
});

/* Todo arranca en cero / neutro: ninguna etapa tiene pose, cámara,
   movimiento ni ambiente predefinidos (salvo el ambiente, que arranca
   con un valor neutro razonable). Se arma a gusto desde la herramienta. */
function initialPoses(stageList) {
  return Object.fromEntries(stageList.map((kf) => [kf.id, zeroPose()]));
}
function initialCameras(stageList) {
  return Object.fromEntries(stageList.map((kf) => [kf.id, defaultCamera()]));
}
function initialMovements(stageList) {
  return Object.fromEntries(stageList.map((kf) => [kf.id, defaultMovement()]));
}
function initialFx(stageList) {
  return Object.fromEntries(stageList.map((kf) => [kf.id, defaultFx()]));
}

function samplePose(posesByKf, progress, stages, easings) {
  const p = clamp(progress, 0, 1);
  if (p <= stages[0].progress) return posesByKf[stages[0].id];
  const last = stages[stages.length - 1];
  if (p >= last.progress) return posesByKf[last.id];
  let i = 0;
  while (i < stages.length - 1 && stages[i + 1].progress < p) i++;
  const a = stages[i], b = stages[i + 1];
  const span = b.progress - a.progress || 1;
  const t = applyEasing(clamp((p - a.progress) / span), easings[i]);
  const pa = posesByKf[a.id], pb = posesByKf[b.id];
  const out = {};
  BONE_KEYS.forEach((k) => { out[k] = { x: lerp(pa[k].x, pb[k].x, t), y: lerp(pa[k].y, pb[k].y, t), z: lerp(pa[k].z, pb[k].z, t) }; });
  return out;
}

function lerpVec3(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }

function sampleCamera(camsByKf, progress, stages, easings) {
  const p = clamp(progress, 0, 1);
  if (p <= stages[0].progress) return camsByKf[stages[0].id];
  const last = stages[stages.length - 1];
  if (p >= last.progress) return camsByKf[last.id];
  let i = 0;
  while (i < stages.length - 1 && stages[i + 1].progress < p) i++;
  const a = stages[i], b = stages[i + 1];
  const span = b.progress - a.progress || 1;
  const t = applyEasing(clamp((p - a.progress) / span), easings[i]);
  const ca = camsByKf[a.id], cb = camsByKf[b.id];
  return { position: lerpVec3(ca.position, cb.position, t), lookAt: lerpVec3(ca.lookAt, cb.lookAt, t), fov: lerp(ca.fov, cb.fov, t), roll: lerp(ca.roll || 0, cb.roll || 0, t) };
}

function sampleMovement(movesByKf, progress, stages, easings) {
  const p = clamp(progress, 0, 1);
  if (p <= stages[0].progress) return movesByKf[stages[0].id];
  const last = stages[stages.length - 1];
  if (p >= last.progress) return movesByKf[last.id];
  let i = 0;
  while (i < stages.length - 1 && stages[i + 1].progress < p) i++;
  const a = stages[i], b = stages[i + 1];
  const span = b.progress - a.progress || 1;
  const t = applyEasing(clamp((p - a.progress) / span), easings[i]);
  const ma = movesByKf[a.id], mb = movesByKf[b.id];
  return { pos: lerpVec3(ma.pos, mb.pos, t), yaw: lerp(ma.yaw, mb.yaw, t), pitch: lerp(ma.pitch, mb.pitch, t) };
}

/* Igual patrón que sampleMovement, pero por objeto: interpola
   posición/escala/rotación de un objeto de entorno entre las dos
   etapas que rodean el progreso actual. */
function sampleObjectTransform(transformsByStage, progress, stages, easings) {
  const p = clamp(progress, 0, 1);
  if (p <= stages[0].progress) return transformsByStage[stages[0].id];
  const last = stages[stages.length - 1];
  if (p >= last.progress) return transformsByStage[last.id];
  let i = 0;
  while (i < stages.length - 1 && stages[i + 1].progress < p) i++;
  const a = stages[i], b = stages[i + 1];
  const span = b.progress - a.progress || 1;
  const t = applyEasing(clamp((p - a.progress) / span), easings[i]);
  const ta = transformsByStage[a.id], tb = transformsByStage[b.id];
  return {
    position: lerpVec3(ta.position, tb.position, t),
    scale: lerp(ta.scale, tb.scale, t),
    rotationY: lerp(ta.rotationY, tb.rotationY, t),
  };
}

function lerpColorHex(a, b, t) {
  const ca = new THREE.Color(a);
  const cb = new THREE.Color(b);
  ca.lerp(cb, t);
  return "#" + ca.getHexString();
}
function lerpAngleDeg(a, b, t) {
  let diff = ((b - a + 180) % 360 + 360) % 360 - 180;
  return a + diff * t;
}
function lightDirFromAngles(azimuthDeg, elevationDeg, distance) {
  const az = (azimuthDeg * Math.PI) / 180;
  const el = (elevationDeg * Math.PI) / 180;
  return [
    distance * Math.cos(el) * Math.sin(az),
    distance * Math.sin(el),
    distance * Math.cos(el) * Math.cos(az),
  ];
}

/* Igual que sampleCamera/sampleMovement pero para Ambiente (luz, rim,
   niebla, fondo), para poder previsualizarlo también interpolado en la
   pestaña Preview. Fuera de Preview se usa el valor crudo de la etapa
   activa (ver App). */
function sampleFx(fxByKf, progress, stages, easings) {
  const p = clamp(progress, 0, 1);
  if (p <= stages[0].progress) return fxByKf[stages[0].id];
  const last = stages[stages.length - 1];
  if (p >= last.progress) return fxByKf[last.id];
  let i = 0;
  while (i < stages.length - 1 && stages[i + 1].progress < p) i++;
  const a = stages[i], b = stages[i + 1];
  const span = b.progress - a.progress || 1;
  const t = applyEasing(clamp((p - a.progress) / span), easings[i]);
  const fa = fxByKf[a.id], fb = fxByKf[b.id];
  return {
    light: {
      color: lerpColorHex(fa.light.color, fb.light.color, t),
      intensity: lerp(fa.light.intensity, fb.light.intensity, t),
      azimuth: lerpAngleDeg(fa.light.azimuth ?? 45, fb.light.azimuth ?? 45, t),
      elevation: lerp(fa.light.elevation ?? 35, fb.light.elevation ?? 35, t),
      rimColor: lerpColorHex(fa.light.rimColor, fb.light.rimColor, t),
      rimIntensity: lerp(fa.light.rimIntensity, fb.light.rimIntensity, t),
    },
    fog: {
      enabled: t < 0.5 ? (fa.fog.enabled ?? true) : (fb.fog.enabled ?? true),
      color: lerpColorHex(fa.fog.color, fb.fog.color, t),
      far: lerp(fa.fog.far, fb.fog.far, t),
    },
    background: {
      from: lerpColorHex(fa.background.from, fb.background.from, t),
      to: lerpColorHex(fa.background.to, fb.background.to, t),
      angle: lerp(fa.background.angle ?? 180, fb.background.angle ?? 180, t),
    },
  };
}

/* ---- Personaje ----
   Se monta UNA sola vez y sólo cambian sus props, para que cambiar de
   pestaña o de etapa activa nunca provoque un remount de <primitive>
   (un remount forzaría a recapturar como "rest pose" una pose ya
   deformada). Este detalle es exclusivo de esta herramienta de
   edición: en el archivo final exportado el personaje siempre se
   monta una sola vez.

   `scale` y `centerY` ahora se reciben como props (antes estaban
   hardcodeados como scale={1.7} / position={[0,-0.9,0]}), para que la
   pestaña "Modelo principal" del panel pueda controlarlos en vivo —
   igual que Escala/Posición en un objeto de la pestaña "Objetos". */
function Character({ pose, onBonesFound, modelUrl, scale, centerY }) {
  const { scene } = useGLTF(modelUrl);
  const bonesRef = useRef({});
  const restRef = useRef({});

  useEffect(() => {
    const bones = {}; const rest = {}; const found = {};
    BONE_DEFS.forEach(([key, boneName]) => {
      const bone = scene.getObjectByName(boneName);
      if (bone) { bones[key] = bone; rest[key] = bone.quaternion.clone(); found[key] = true; }
      else found[key] = false;
    });
    bonesRef.current = bones; restRef.current = rest;
    onBonesFound(found);
  }, [scene]);

  useEffect(() => {
    scene.traverse((child) => {
      if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
    });
  }, [scene]);

  useFrame(() => {
    const bones = bonesRef.current, rest = restRef.current;
    BONE_KEYS.forEach((key) => {
      const bone = bones[key], r = rest[key];
      if (!bone || !r) return;
      const xyz = pose[key];
      const dq = new THREE.Quaternion().setFromEuler(new THREE.Euler(rad(xyz.x), rad(xyz.y), rad(xyz.z), "XYZ"));
      bone.quaternion.copy(r).multiply(dq);
    });
  });

  return <primitive object={scene} position={[0, -centerY, 0]} scale={scale} />;
}
useGLTF.preload(DEFAULT_MODEL_URL);

function SceneCameraDriver({ target, active }) {
  const { camera } = useThree();
  useFrame(() => {
    if (!active || !target) return;
    camera.position.set(target.position[0], target.position[1], target.position[2]);
    camera.up.set(0, 1, 0);
    camera.lookAt(target.lookAt[0], target.lookAt[1], target.lookAt[2]);
    if (target.roll) camera.rotateZ((target.roll * Math.PI) / 180);
    if ("fov" in camera) { camera.fov = target.fov; camera.updateProjectionMatrix(); }
  });
  return null;
}

/* Mientras "Cámara libre" está activa, este componente lee en cada
   frame la posición/target/fov real de la cámara orbitada a mano y los
   guarda en liveCameraRef — así el botón "Capturar cámara libre" (en
   la pestaña Cámara) puede tomar exactamente lo que estás viendo y
   guardarlo como keyframe de la etapa activa. Control total: lo que
   armás a mano con el mouse se puede volcar directo a la animación. */
function LiveCameraTracker({ orbitRef, liveCameraRef, active }) {
  const { camera } = useThree();
  useFrame(() => {
    if (!active) return;
    const controls = orbitRef.current;
    const targetVec = controls ? controls.target : null;
    liveCameraRef.current = {
      position: [camera.position.x, camera.position.y, camera.position.z],
      lookAt: targetVec ? [targetVec.x, targetVec.y, targetVec.z] : [0, 0, 0],
      fov: "fov" in camera ? camera.fov : 30,
    };
  });
  return null;
}

function MovedGroup({ movement, anchorRef, children }) {
  const localRef = useRef(null);
  const ref = anchorRef || localRef;
  useFrame(() => {
    if (!ref.current || !movement) return;
    ref.current.position.set(movement.pos[0], movement.pos[1], movement.pos[2]);
    ref.current.rotation.set(rad(movement.pitch), rad(movement.yaw), 0);
  });
  return <group ref={ref}>{children}</group>;
}

/* Si un .glb de objeto todavía no está copiado junto a este archivo,
   useGLTF tira un error de carga (404). Este boundary evita que eso
   rompa toda la herramienta — cada objeto tiene su propio boundary,
   así uno que falte no tumba a los demás. */
class ObjectBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false }; }
  static getDerivedStateFromError() { return { hasError: true }; }
  componentDidCatch() {}
  render() {
    if (this.state.hasError) return null;
    return this.props.children;
  }
}

function ObjectPreviewModel({ obj }) {
  const { scene } = useGLTF(obj.url);
  useEffect(() => {
    scene.traverse((child) => {
      if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
    });
  }, [scene]);
  return (
    <primitive
      object={scene}
      scale={obj.scale}
      position={obj.position}
      rotation={[0, (obj.rotationY * Math.PI) / 180, 0]}
    />
  );
}
/* Los navegadores rasterizan un SVG a un tamaño chico por defecto (a
   veces 300x150px) antes de poder usarlo como textura — por eso se ve
   pixelado al escalarlo grande. Esto lo vuelve a dibujar en un canvas
   de alta resolución (respetando el aspecto real del archivo) antes
   de crear la textura, así se ve nítido. Solo aplica a .svg; una
   imagen .png/.jpg ya es un bitmap y no gana nada con este paso, así
   que sigue el camino normal (useTexture). */
function useHiResSvgTexture(url, targetLong = 3072) {
  const [texture, setTexture] = useState(null);
  useEffect(() => {
    let cancelled = false;
    const img = new Image();
    img.onload = () => {
      if (cancelled) return;
      const w0 = img.naturalWidth || 300;
      const h0 = img.naturalHeight || 150;
      const aspect = w0 / h0 || 1;
      const canvas = document.createElement("canvas");
      if (aspect >= 1) { canvas.width = targetLong; canvas.height = Math.round(targetLong / aspect); }
      else { canvas.height = targetLong; canvas.width = Math.round(targetLong * aspect); }
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      setTexture(tex);
    };
    img.onerror = () => { if (!cancelled) setTexture(null); };
    img.src = url;
    return () => { cancelled = true; };
  }, [url, targetLong]);
  return texture;
}

function isSvgUrl(url) {
  return /\.svg($|\?)/i.test(url || "");
}

/* Misma implementación que en la plantilla final (ver tpl-source),
   para que el texto se vea igual acá en el visor y en el index.html
   exportado. */
function useHiResTextTexture(text, opts) {
  const {
    color = "#ffffff",
    font = "'Inter', sans-serif",
    weight = 600,
    align = "center",
    outline = false,
    outlineColor = "#000000",
  } = opts || {};
  const [texture, setTexture] = useState(null);
  useEffect(() => {
    let cancelled = false;
    const fontSizePx = 200;
    const lineHeight = fontSizePx * 1.2;
    const padding = fontSizePx * 0.25;
    const fontSpec = `${weight} ${fontSizePx}px ${font}`;
    const draw = () => {
      if (cancelled) return;
      const lines = (text || "").split("\n");
      const measureCanvas = document.createElement("canvas");
      const mctx = measureCanvas.getContext("2d");
      mctx.font = fontSpec;
      let maxLineWidth = 1;
      lines.forEach((l) => { maxLineWidth = Math.max(maxLineWidth, mctx.measureText(l || " ").width); });
      const canvas = document.createElement("canvas");
      canvas.width = Math.ceil(maxLineWidth + padding * 2);
      canvas.height = Math.ceil(lines.length * lineHeight + padding * 2);
      const ctx = canvas.getContext("2d");
      ctx.font = fontSpec;
      ctx.textBaseline = "middle";
      ctx.textAlign = align;
      const xPos = align === "center" ? canvas.width / 2 : align === "right" ? canvas.width - padding : padding;
      lines.forEach((line, i) => {
        const y = padding + lineHeight * i + lineHeight / 2;
        if (outline) {
          ctx.lineJoin = "round";
          ctx.lineWidth = fontSizePx * 0.08;
          ctx.strokeStyle = outlineColor;
          ctx.strokeText(line, xPos, y);
        }
        ctx.fillStyle = color;
        ctx.fillText(line, xPos, y);
      });
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      setTexture(tex);
    };
    if (document.fonts && document.fonts.load) {
      document.fonts.load(fontSpec).catch(() => {}).then(draw);
    } else {
      draw();
    }
    return () => { cancelled = true; };
  }, [text, color, font, weight, align, outline, outlineColor]);
  return texture;
}

function ObjectPreviewText({ obj }) {
  const texture = useHiResTextTexture(obj.text, {
    color: obj.textColor,
    font: obj.fontFamily,
    weight: obj.fontWeight,
    align: obj.textAlign,
    outline: obj.textOutline,
    outlineColor: obj.textOutlineColor,
  });
  if (!texture) return null;
  const aspect = texture.image.width / texture.image.height;
  const mesh = (
    <mesh
      scale={[obj.scale * aspect, obj.scale, 1]}
      position={obj.billboard ? [0, 0, 0] : obj.position}
      rotation={obj.billboard ? [0, 0, 0] : [0, (obj.rotationY * Math.PI) / 180, 0]}
    >
      <planeGeometry args={[1, 1]} />
      <meshBasicMaterial map={texture} transparent toneMapped={false} />
    </mesh>
  );
  return obj.billboard ? <Billboard position={obj.position}>{mesh}</Billboard> : mesh;
}

function ObjectPreviewImageRaster({ obj }) {
  const texture = useTexture(obj.previewUrl || obj.url);
  const aspect = texture.image ? texture.image.width / texture.image.height : 1;
  const mesh = (
    <mesh
      scale={[obj.scale * aspect, obj.scale, 1]}
      position={obj.billboard ? [0, 0, 0] : obj.position}
      rotation={obj.billboard ? [0, 0, 0] : [0, (obj.rotationY * Math.PI) / 180, 0]}
    >
      <planeGeometry args={[1, 1]} />
      <meshBasicMaterial map={texture} transparent toneMapped={false} />
    </mesh>
  );
  return obj.billboard ? <Billboard position={obj.position}>{mesh}</Billboard> : mesh;
}
function ObjectPreviewImageSvg({ obj }) {
  const texture = useHiResSvgTexture(obj.previewUrl || obj.url);
  if (!texture) return null;
  const aspect = texture.image.width / texture.image.height;
  const mesh = (
    <mesh
      scale={[obj.scale * aspect, obj.scale, 1]}
      position={obj.billboard ? [0, 0, 0] : obj.position}
      rotation={obj.billboard ? [0, 0, 0] : [0, (obj.rotationY * Math.PI) / 180, 0]}
    >
      <planeGeometry args={[1, 1]} />
      <meshBasicMaterial map={texture} transparent toneMapped={false} />
    </mesh>
  );
  return obj.billboard ? <Billboard position={obj.position}>{mesh}</Billboard> : mesh;
}
function ObjectPreviewImage({ obj }) {
  return isSvgUrl(obj.url) ? <ObjectPreviewImageSvg obj={obj} /> : <ObjectPreviewImageRaster obj={obj} />;
}
function ObjectPreview({ obj }) {
  if (obj.type === "text") return <ObjectPreviewText obj={obj} />;
  return obj.type === "image" ? <ObjectPreviewImage obj={obj} /> : <ObjectPreviewModel obj={obj} />;
}

/* La estructura de la escena es SIEMPRE la misma (luces, grilla,
   MovedGroup > Character, objetos, cámara, controles). Nunca cambia de
   forma entre pestañas, así React nunca desmonta el personaje. */
function Scene({ pose, onBonesFound, cameraTarget, sceneCameraActive, autoRotate, movement, objects, showObjects, showGrid, fx, showFx, orbitRef, liveCameraRef, modelUrl, postFx, charScale, charCenterY, charAnchorRef, trail, reflection }) {
  return (
    <>
      {showFx && fx.fog.enabled !== false && <fogExp2 attach="fog" args={[fx.fog.color, 1 / Math.max(fx.fog.far, 1)]} />}
      <hemisphereLight color="#cfe8ff" groundColor="#1a1410" intensity={0.35} />
      <ambientLight intensity={0.28} />
      <directionalLight
        color={showFx ? fx.light.color : "#ffffff"}
        position={showFx ? lightDirFromAngles(fx.light.azimuth ?? 45, fx.light.elevation ?? 35, 6) : [3, 4, 5]}
        intensity={showFx ? fx.light.intensity : 0.9}
        castShadow
        shadow-mapSize={[1024, 1024]}
        shadow-bias={-0.0015}
        shadow-camera-left={-14}
        shadow-camera-right={14}
        shadow-camera-top={14}
        shadow-camera-bottom={-14}
        shadow-camera-near={0.5}
        shadow-camera-far={40}
      />
      <directionalLight position={[-3, 2, -2]} intensity={0.4} />
      <pointLight color={showFx ? fx.light.rimColor : "#ffffff"} position={[-2.5, -1, -2]} intensity={showFx ? fx.light.rimIntensity : 0} distance={12} />
      {showGrid && (
        <Grid
          args={[300, 300]}
          position={[0, -0.02, 0]}
          cellSize={2}
          cellThickness={0.8}
          cellColor="#333"
          sectionSize={20}
          sectionThickness={1.6}
          sectionColor="#555"
          fadeDistance={140}
          fadeStrength={1}
          infiniteGrid
        />
      )}
      {showObjects &&
        objects.filter((o) => o.visible).map((o) => (
          <ObjectBoundary key={o.id}>
            <Suspense fallback={null}>
              <ObjectPreview obj={o} />
            </Suspense>
          </ObjectBoundary>
        ))}
      <MovedGroup movement={movement} anchorRef={charAnchorRef}>
        <ObjectBoundary>
          <Suspense fallback={null}>
            <Character pose={pose} onBonesFound={onBonesFound} modelUrl={modelUrl} scale={charScale} centerY={charCenterY} />
          </Suspense>
        </ObjectBoundary>
      </MovedGroup>
            {trail && trail.enabled && (
        <SparkleTrail
          anchorRef={charAnchorRef}
          enabled={trail.enabled}
          color={trail.color}
          size={trail.size}
          life={trail.life}
          rate={trail.rate}
        />
      )}
      {reflection && (
        <ReflectionProbe
          anchorRef={charAnchorRef}
          enabled={reflection.enabled}
          resolution={reflection.resolution}
          updateEvery={reflection.updateEvery}
          intensity={reflection.intensity}
        />
      )}
      {showFx && postFx && postFx.beamEnabled && (
        <LightBeamEditor
          enabled={postFx.beamEnabled}
          opacity={postFx.beamOpacity ?? 0.5}
          width={postFx.beamWidth ?? 2.5}
          height={postFx.beamHeight ?? 14}
          fx={fx}
        />
      )}
      {sceneCameraActive ? (
        <SceneCameraDriver target={cameraTarget} active={true} />
      ) : (
        <>
          {/* Antes OrbitControls y SceneCameraDriver estaban montados
              siempre juntos (uno activo/otro no), y cada frame se
              peleaban por la cámara → sensación de "traba" al activar
              Cámara libre. Ahora solo uno de los dos está montado a la
              vez, así nunca compiten. */}
          <OrbitControls
            ref={orbitRef}
            makeDefault
            target={cameraTarget ? cameraTarget.lookAt : [0, 0.5, 0]}
            autoRotate={autoRotate}
            autoRotateSpeed={2.2}
          />
          <LiveCameraTracker orbitRef={orbitRef} liveCameraRef={liveCameraRef} active={true} />
        </>
      )}
      {postFx && postFx.bloomEnabled && (
        <EffectComposer multisampling={0}>
          <Bloom intensity={postFx.bloomIntensity} luminanceThreshold={0.25} luminanceSmoothing={0.9} mipmapBlur height={240} />
        </EffectComposer>
      )}
    </>
  );
}

/* Estela de brillo (sparkle trail) — misma implementación que la
   plantilla final (ver bloque TRAIL_* embebido en tpl-source), para
   que lo que se ve acá en el visor sea igual a lo que va a quedar en
   el index.html exportado. */
const TRAIL_VERTEX_SHADER = `
  attribute float aSize;
  attribute float aOpacity;
  varying float vOpacity;
  void main() {
    vOpacity = aOpacity;
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = aSize * (300.0 / max(-mvPosition.z, 0.001));
    gl_Position = projectionMatrix * mvPosition;
  }
`;
const TRAIL_FRAGMENT_SHADER = `
  uniform vec3 uColor;
  varying float vOpacity;
  void main() {
    vec2 uv = gl_PointCoord.xy - 0.5;
    float d = length(uv) * 2.0;
    float glow = smoothstep(1.0, 0.0, d);
    float core = smoothstep(0.35, 0.0, d);
    float alpha = (glow * glow * 0.6 + core * 0.9) * vOpacity;
    vec3 col = mix(uColor, vec3(1.0), core * 0.6);
    gl_FragColor = vec4(col, alpha);
  }
`;

function SparkleTrail({ anchorRef, enabled, color, size, life, rate }) {
  const pointsRef = useRef(null);
  const materialRef = useRef(null);
  const particles = useRef([]);
  const maxParticles = useMemo(() => Math.max(8, Math.ceil(rate * life) + 8), [rate, life]);
  const positions = useMemo(() => new Float32Array(maxParticles * 3), [maxParticles]);
  const sizes = useMemo(() => new Float32Array(maxParticles), [maxParticles]);
  const opacities = useMemo(() => new Float32Array(maxParticles), [maxParticles]);
  const emitAccum = useRef(0);
  const prevAnchor = useRef(null);

  useEffect(() => {
    if (materialRef.current) materialRef.current.uniforms.uColor.value.set(color);
  }, [color]);

  useFrame((_, delta) => {
    const group = pointsRef.current;
    const anchor = anchorRef && anchorRef.current;
    if (!group) return;

    if (!enabled || !anchor) {
      group.visible = false;
      particles.current.length = 0;
      prevAnchor.current = null;
      return;
    }
    group.visible = true;

    const ax = anchor.position.x, ay = anchor.position.y, az = anchor.position.z;

    if (prevAnchor.current) {
      emitAccum.current += delta;
      const emitEvery = 1 / Math.max(rate, 1);
      const from = prevAnchor.current;
      while (emitAccum.current >= emitEvery) {
        emitAccum.current -= emitEvery;
        const t = 1 - emitAccum.current / delta;
        const px = lerp(from.x, ax, isFinite(t) ? t : 1);
        const py = lerp(from.y, ay, isFinite(t) ? t : 1);
        const pz = lerp(from.z, az, isFinite(t) ? t : 1);
        particles.current.push({
          x: px, y: py, z: pz,
          age: 0,
          seed: Math.random() * Math.PI * 2,
          ox: (Math.random() - 0.5) * size * 6,
          oy: (Math.random() - 0.5) * size * 6,
          oz: (Math.random() - 0.5) * size * 6,
          sizeMul: 0.5 + Math.random() * 0.9,
        });
        if (particles.current.length > maxParticles) particles.current.shift();
      }
    }
    prevAnchor.current = { x: ax, y: ay, z: az };

    for (let i = particles.current.length - 1; i >= 0; i--) {
      particles.current[i].age += delta;
      if (particles.current[i].age >= life) particles.current.splice(i, 1);
    }

    const n = Math.min(particles.current.length, maxParticles);
    const now = performance.now() * 0.001;
    for (let i = 0; i < n; i++) {
      const p = particles.current[i];
      const t = clamp(p.age / life);
      const drift = t;
      positions[i * 3] = p.x + p.ox * drift;
      positions[i * 3 + 1] = p.y + p.oy * drift + t * size * 4;
      positions[i * 3 + 2] = p.z + p.oz * drift;
      const twinkle = 0.5 + 0.5 * Math.sin(now * 9 + p.seed * 7);
      opacities[i] = (1 - t) * (1 - t) * (0.35 + 0.65 * twinkle);
      sizes[i] = size * p.sizeMul * (1 - t * 0.35);
    }

    const geom = group.geometry;
    geom.attributes.position.needsUpdate = true;
    geom.attributes.aOpacity.needsUpdate = true;
    geom.attributes.aSize.needsUpdate = true;
    geom.setDrawRange(0, n);
  });

  return (
    <points key={maxParticles} ref={pointsRef} frustumCulled={false}>
      <bufferGeometry>
        <bufferAttribute attach="attributes-position" count={maxParticles} array={positions} itemSize={3} />
        <bufferAttribute attach="attributes-aSize" count={maxParticles} array={sizes} itemSize={1} />
        <bufferAttribute attach="attributes-aOpacity" count={maxParticles} array={opacities} itemSize={1} />
      </bufferGeometry>
      <shaderMaterial
        ref={materialRef}
        vertexShader={TRAIL_VERTEX_SHADER}
        fragmentShader={TRAIL_FRAGMENT_SHADER}
        uniforms={{ uColor: { value: new THREE.Color(color) } }}
        transparent
        depthWrite={false}
        blending={THREE.AdditiveBlending}
      />
    </points>
  );
}

  /* Cámara de reflejo (cube camera): ubicada en el Modelo principal, cada
   ciertos frames fotografía los 360° a su alrededor (paredes, objetos,
   el PNG del perro, etc. — todo lo que haya en la escena, salvo el
   propio modelo, que se oculta un instante durante la captura) y usa
   esa foto como reflejo en los materiales metálicos del modelo. La
   cámara principal (la que ve el usuario) no necesita apuntar a lo que
   se refleja — el reflejo se calcula aparte, en 360°, todo el tiempo. */
function ReflectionProbe({ anchorRef, enabled, resolution, updateEvery, intensity }) {
  const { gl, scene } = useThree();
  const rtRef = useRef(null);
  const camRef = useRef(null);
  const frameRef = useRef(0);
  const appliedRef = useRef(new Set());
  const posRef = useRef(new THREE.Vector3());

  useEffect(() => {
    const rt = new THREE.WebGLCubeRenderTarget(resolution, {
      generateMipmaps: true,
      minFilter: THREE.LinearMipmapLinearFilter,
    });
    rtRef.current = rt;
    camRef.current = new THREE.CubeCamera(0.05, 1000, rt);
    appliedRef.current = new Set();
    return () => rt.dispose();
  }, [resolution]);

  useFrame(() => {
    if (!enabled || !anchorRef.current || !camRef.current) return;
    frameRef.current++;
    if (frameRef.current % Math.max(1, updateEvery) !== 0) return;

    const anchor = anchorRef.current;
    anchor.getWorldPosition(posRef.current);
    camRef.current.position.copy(posRef.current);

    // Oculta el modelo un instante para que no se refleje a sí mismo.
    const wasVisible = anchor.visible;
    anchor.visible = false;
    camRef.current.update(gl, scene);
    anchor.visible = wasVisible;

    const texture = rtRef.current.texture;
    anchor.traverse((child) => {
      if (!child.isMesh || !child.material) return;
      const mats = Array.isArray(child.material) ? child.material : [child.material];
      mats.forEach((m) => {
        if (!("envMap" in m)) return;
        if (!appliedRef.current.has(m.uuid)) {
          m.envMap = texture;
          m.needsUpdate = true;
          appliedRef.current.add(m.uuid);
        }
        if ("envMapIntensity" in m) m.envMapIntensity = intensity;
      });
    });
  });

  return null;
}
/* Igual que LightBeam del sitio final, pero para la vista previa del
   editor: acá no hay scroll ni blendScenes, el color/dirección salen
   directo de la etapa activa (fx.light). */
let _beamTextureCacheEditor = null;
function getBeamTextureEditor() {
  if (_beamTextureCacheEditor) return _beamTextureCacheEditor;
  const size = 128;
  const canvas = document.createElement("canvas");
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext("2d");
  const grad = ctx.createLinearGradient(0, 0, size, 0);
  grad.addColorStop(0, "rgba(255,255,255,0)");
  grad.addColorStop(0.5, "rgba(255,255,255,1)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  const vgrad = ctx.createLinearGradient(0, 0, 0, size);
  vgrad.addColorStop(0, "rgba(0,0,0,1)");
  vgrad.addColorStop(0.12, "rgba(0,0,0,0)");
  vgrad.addColorStop(0.82, "rgba(0,0,0,0)");
  vgrad.addColorStop(1, "rgba(0,0,0,1)");
  ctx.globalCompositeOperation = "destination-out";
  ctx.fillStyle = vgrad;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(canvas);
  _beamTextureCacheEditor = tex;
  return tex;
}
function LightBeamEditor({ enabled, opacity, width, height, fx }) {
  const groupRef = useRef(null);
  const matRefs = useRef([]);
  const texture = useMemo(() => getBeamTextureEditor(), []);

  useFrame(() => {
    if (!enabled || !groupRef.current || !fx) return;
    const dir = lightDirFromAngles(fx.light.azimuth ?? 45, fx.light.elevation ?? 35, 1);
    const dirVec = new THREE.Vector3(dir[0], dir[1], dir[2]).normalize();
    groupRef.current.position.set(dirVec.x * height * 0.5, dirVec.y * height * 0.5, dirVec.z * height * 0.5);
    groupRef.current.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirVec);
    matRefs.current.forEach((m) => {
      if (!m) return;
      m.color.set(fx.light.color);
      m.opacity = opacity;
    });
  });

  if (!enabled) return null;

  return (
    <group ref={groupRef}>
      {[0, 60, 120].map((deg, i) => (
        <mesh key={deg} rotation={[0, (deg * Math.PI) / 180, 0]}>
          <planeGeometry args={[width, height]} />
          <meshBasicMaterial
            ref={(m) => { matRefs.current[i] = m; }}
            map={texture}
            transparent
            opacity={opacity}
            color="#ffffff"
            blending={THREE.AdditiveBlending}
            depthWrite={false}
            side={THREE.DoubleSide}
            toneMapped={false}
          />
        </mesh>
      ))}
    </group>
  );
}
/* Contorno de celular: dibuja el rectángulo 9:16 más grande que entra
   en el visor actual (igual que "object-fit: contain"), para ver de
   entrada qué parte de la composición realmente se ve en un teléfono.
   Se recalcula con ResizeObserver porque el visor cambia de tamaño al
   abrir/cerrar el panel o redimensionar la ventana. */
function MobileFrameOverlay({ containerRef, ratio = 9 / 16 }) {
  const [box, setBox] = useState(null);

  useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    const compute = () => {
      const w = el.clientWidth;
      const h = el.clientHeight;
      if (!w || !h) return;
      let fw = h * ratio;
      let fh = h;
      if (fw > w) { fw = w; fh = w / ratio; }
      setBox({ w: fw, h: fh, left: (w - fw) / 2, top: (h - fh) / 2 });
    };
    compute();
    const ro = new ResizeObserver(compute);
    ro.observe(el);
    return () => ro.disconnect();
  }, [containerRef, ratio]);

  if (!box) return null;
  return (
    <div
      className="mobile-frame"
      style={{ width: box.w, height: box.h, left: box.left, top: box.top }}
    >
      <span className="mobile-frame__label">Celular · 9:16</span>
    </div>
  );
}

function generateBoneArrayCode(posesByKf, stages, easings) {
  const fmt = (n) => { const r = rad(n); return (Math.abs(r) < 0.0001 ? 0 : r).toFixed(4); };
  const kfLines = stages.map((kf, idx) => {
    const pose = posesByKf[kf.id];
    const easing = idx === 0 ? "smooth" : (easings[idx - 1] || "smooth");
    const boneLines = BONE_KEYS.map((k) => {
      const v = pose[k];
      if (v.x === 0 && v.y === 0 && v.z === 0) return null;
      return `        ${k}: [${fmt(v.x)}, ${fmt(v.y)}, ${fmt(v.z)}],`;
    }).filter(Boolean).join("\n");
    return `  {\n    id: "${kf.id}",\n    progress: ${roundProgress(kf.progress)},\n    easing: "${easing}",\n    bones: {\n${boneLines || "      // (sin cambios respecto al rest pose)"}\n    },\n  },`;
  }).join("\n");
  return `const BONE_POSE_KEYFRAMES = [\n${kfLines}\n];`;
}

function generateScenesArrayCode(camsByKf, fxByKf, stages, easings) {
  const fmtNum = (n) => (Math.abs(n) < 0.0001 ? 0 : Math.round(n * 1000) / 1000);
  const fmtVec = (v) => `[${v.map(fmtNum).join(", ")}]`;
  const kfLines = stages.map((kf, idx) => {
    const cam = camsByKf[kf.id];
    const f = fxByKf[kf.id];
    const easing = idx === 0 ? "smooth" : (easings[idx - 1] || "smooth");
    return `  {
    id: "${kf.id}",
    progress: ${roundProgress(kf.progress)},
    easing: "${easing}",
    camera: { position: ${fmtVec(cam.position)}, lookAt: ${fmtVec(cam.lookAt)}, fov: ${fmtNum(cam.fov)}, roll: ${fmtNum(cam.roll || 0)} },
    light: { color: "${f.light.color}", intensity: ${f.light.intensity}, azimuth: ${fmtNum(f.light.azimuth)}, elevation: ${fmtNum(f.light.elevation)}, rimColor: "${f.light.rimColor}", rimIntensity: ${f.light.rimIntensity} },
    fog: { enabled: ${f.fog.enabled === false ? "false" : "true"}, color: "${f.fog.color}", far: ${f.fog.far} },
    background: { from: "${f.background.from}", to: "${f.background.to}", angle: ${fmtNum(f.background.angle)} },
  },`;
  }).join("\n");
  return `const scenes = [\n${kfLines}\n];`;
}

function generateMovementDefsCode(movesByKf, stages, easings) {
  const fmtNum = (n) => (Math.abs(n) < 0.0001 ? 0 : Math.round(n * 1000) / 1000);
  const kfLines = stages.map((kf, idx) => {
    const mv = movesByKf[kf.id];
    const easing = idx === 0 ? "smooth" : (easings[idx - 1] || "smooth");
    return `  { id: "${kf.id}", progress: ${roundProgress(kf.progress)}, easing: "${easing}", pos: [${mv.pos.map(fmtNum).join(", ")}], yaw: ${fmtNum(mv.yaw)}, pitch: ${fmtNum(mv.pitch)} },`;
  }).join("\n");
  return `const MOVEMENT_KEYFRAMES = [
${kfLines}
];

function sampleMovement(progress) {
  const list = MOVEMENT_KEYFRAMES;
  const p = clamp(progress, 0, 1);
  if (p <= list[0].progress) return list[0];
  const last = list[list.length - 1];
  if (p >= last.progress) return last;
  let i = 0;
  while (i < list.length - 1 && list[i + 1].progress < p) i++;
  const a = list[i], b = list[i + 1];
  const span = b.progress - a.progress || 1;
  const t = applyEasing(clamp((p - a.progress) / span), b.easing);
  return {
    pos: [lerp(a.pos[0], b.pos[0], t), lerp(a.pos[1], b.pos[1], t), lerp(a.pos[2], b.pos[2], t)],
    yaw: lerp(a.yaw, b.yaw, t),
    pitch: lerp(a.pitch, b.pitch, t),
  };
}`;
}

function generateScrollLengthCode(totalVh) {
  const n = Math.round(totalVh);

function generateModelUrlCode(url) {

function generateObjectsCode(objects, transformsByKf, stages, easings) {
  const fmtNum = (n) => (Math.abs(n) < 0.0001 ? 0 : Math.round(n * 1000) / 1000);
  const fmtVec = (v) => `[${v.map(fmtNum).join(", ")}]`;

function buildFullHtml(boneCode, scenesCode, movementCode, scrollLengthCode, objectsCode, modelUrlCode, postFxCode, charTransformCode, trailCode, reflectionCode) {
  const tplEl = document.getElementById("tpl-source");
  let tpl = tplEl.value;
  const swap = (src, startMark, endMark, code) => {
    const start = src.indexOf(startMark);
    const end = src.indexOf(endMark);
    if (start === -1 || end === -1) return src;
    const before = src.slice(0, start + startMark.length);
    const after = src.slice(end);
    return `${before}\n${code}\n${after}`;
  };
  tpl = swap(tpl, "/*@GEN:MODEL_URL_START*/", "/*@GEN:MODEL_URL_END*/", modelUrlCode);
  tpl = swap(tpl, "/*@GEN:SCENES_START*/", "/*@GEN:SCENES_END*/", scenesCode);
  tpl = swap(tpl, "/*@GEN:MOVEMENT_DEFS_START*/", "/*@GEN:MOVEMENT_DEFS_END*/", movementCode);
  tpl = swap(tpl, "/*@GEN:BONES_START*/", "/*@GEN:BONES_END*/", boneCode);
  tpl = swap(tpl, "/*@GEN:SCROLL_LENGTH_START*/", "/*@GEN:SCROLL_LENGTH_END*/", scrollLengthCode);
  tpl = swap(tpl, "/*@GEN:POSTFX_START*/", "/*@GEN:POSTFX_END*/", postFxCode);
  tpl = swap(tpl, "/*@GEN:TRAIL_START*/", "/*@GEN:TRAIL_END*/", trailCode);
  tpl = swap(tpl, "/*@GEN:REFLECTION_START*/", "/*@GEN:REFLECTION_END*/", reflectionCode);
  tpl = swap(tpl, "/*@GEN:OBJECTS_START*/", "/*@GEN:OBJECTS_END*/", objectsCode);
  tpl = swap(tpl, "/*@GEN:CHAR_TRANSFORM_START*/", "/*@GEN:CHAR_TRANSFORM_END*/", charTransformCode);
  return tpl;
}
