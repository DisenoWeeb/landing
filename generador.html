  .app-root {
    position: relative;
    width: 100%;

    width: 100vw;
    height: 100vh;
    opacity: 0;

  .canvas-stage--ready { opacity: 1; }
  .canvas-stage canvas { display: block; width: 100% !important; height: 100% !important; }

  .hero-text {
    position: absolute;
    top: 25%;
    left: 50%;
    transform: translate(-50%, -50%);
    transform-origin: center center;
    z-index: 5;
    pointer-events: none;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2.1rem, 4.5vw, 3.2rem);
    letter-spacing: 0.07em;
    color: var(--color-text);

    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }
  .scene-text {
    position: absolute;

  .scene-text__title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2rem, 5vw, 4rem);
    line-height: 1.05;
    margin: 0 0 0.75rem 0;
    color: var(--color-text);
  }
  .scene-text__subtitle {
    font-family: var(--font-body);
    font-weight: 300;
    font-size: clamp(0.95rem, 1.4vw, 1.15rem);
    line-height: 1.5;
    color: var(--color-text-muted);
    margin: 0;
    max-width: 46ch;
  }

  .cta-layer {
    position: absolute;
    bottom: 8vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    will-change: opacity, transform;
  }
  .cta-button {
    display: inline-block;
    padding: 0.9rem 2.2rem;
    border-radius: 999px;
    background: var(--brand-accent);
    color: #0a0a0a;
    font-family: var(--font-body);

    transform: translateY(-2px);

    top: 50%;
    right: 3vw;

    height: 28vh;
    z-index: 6;

    position: relative;
    width: 2px;
    height: 100%;
    background: rgba(244, 241, 234, 0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-rail__fill {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 0%;
    background: var(--brand-accent);
    border-radius: 2px;
    transition: height 0.05s linear;

    position: fixed;
    top: 3vh;
    left: 3vw;
    z-index: 6;
    font-family: var(--font-display);
    font-size: 1rem;
    letter-spacing: 0.08em;
    color: var(--color-text);

    bottom: 4vh;
    left: 3vw;
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;

  }

  const list = MOVEMENT_KEYFRAMES;
  const p = clamp(progress, 0, 1);
  if (p <= list[0].progress) return list[0];
  const last = list[list.length - 1];

  let i = 0;
  while (i < list.length - 1 && list[i + 1].progress < p) i++;

function sampleBonePose(progress) {
  const list = BONE_POSE_KEYFRAMES;
  const p = clamp(progress, 0, 1);
  const pick = (kf) => kf.bones;
  if (p <= list[0].progress) return pick(list[0]);
  const last = list[list.length - 1];
  if (p >= last.progress) return pick(last);
  let i = 0;
  while (i < list.length - 1 && list[i + 1].progress < p) i++;
  const a = list[i], b = list[i + 1];
  const span = b.progress - a.progress || 1;
  const t = clamp((p - a.progress) / span);
  const out = {};
  const keys = new Set([...Object.keys(a.bones), ...Object.keys(b.bones)]);
  keys.forEach((k) => {
    const va = a.bones[k] || [0, 0, 0];
    const vb = b.bones[k] || [0, 0, 0];
    out[k] = [lerp(va[0], vb[0], t), lerp(va[1], vb[1], t), lerp(va[2], vb[2], t)];
  });
  return out;
}

function damp(current, target, lambda, dt) {
  return current + (target - current) * (1 - Math.exp(-lambda * dt));
}
function clamp(value, min = 0, max = 1) {
  return Math.min(max, Math.max(min, value));
}

function getDeviceProfile() {
  const isMobile = typeof window !== "undefined" && window.matchMedia("(max-width: 768px)").matches;
  return {
    isMobile,
    dpr: isMobile ? [1, 1] : [1, 1.5],
    enablePostProcessing: !isMobile,
  };
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}
function lerpVec3(a, b, t) {
  return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
}
function lerpColor(a, b, t) {
  const ca = new THREE.Color(a);
  const cb = new THREE.Color(b);
  ca.lerp(cb, t);
  return "#" + ca.getHexString();
}

function sceneToState(kf) {
  return {
    camera: kf.camera,
    light: kf.light,
    fog: kf.fog,
    background: kf.background,
  };
}

function blendScenes(list, rawProgress) {
  const progress = clamp(rawProgress, 0, 1);
  if (progress <= list[0].progress) return sceneToState(list[0]);
  const last = list[list.length - 1];
  if (progress >= last.progress) return sceneToState(last);

  let i = 0;
  while (i < list.length - 1 && list[i + 1].progress < progress) i++;
  const a = list[i];
  const b = list[i + 1];
  const span = b.progress - a.progress || 1;
  const t = clamp((progress - a.progress) / span);

  return {
    camera: {
      position: lerpVec3(a.camera.position, b.camera.position, t),
      lookAt: lerpVec3(a.camera.lookAt, b.camera.lookAt, t),
      fov: lerp(a.camera.fov, b.camera.fov, t),
    },
    light: {
      color: lerpColor(a.light.color, b.light.color, t),
      intensity: lerp(a.light.intensity, b.light.intensity, t),
      rimColor: lerpColor(a.light.rimColor, b.light.rimColor, t),
      rimIntensity: lerp(a.light.rimIntensity, b.light.rimIntensity, t),
    },
    fog: {
      color: lerpColor(a.fog.color, b.fog.color, t),
      far: lerp(a.fog.far, b.fog.far, t),
    },
    background: lerpColor(a.background, b.background, t),
  };
}

const useScrollStore = create((set) => ({
  progress: 0,
  smoothProgress: 0,
  setProgress: (p) => set({ progress: p }),
  setSmoothProgress: (p) => set({ smoothProgress: p }),
}));

function useScrollProgress(spacerRef) {
  useEffect(() => {
    const compute = () => {
      const el = spacerRef.current;
      if (!el) return;
      const total = el.offsetHeight - window.innerHeight;
      const raw = total > 0 ? window.scrollY / total : 0;
      const p = clamp(raw, 0, 1);
      useScrollStore.getState().setProgress(p);
      document.body.classList.toggle("app-root--scrolled", window.scrollY > 20);
    };
    compute();
    window.addEventListener("scroll", compute, { passive: true });
    window.addEventListener("resize", compute);
    return () => {
      window.removeEventListener("scroll", compute);
      window.removeEventListener("resize", compute);
    };
  }, [spacerRef]);
}

function useArrowKeyScroll(step = 140) {
  useEffect(() => {
    const onKeyDown = (e) => {
      if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
      const tag = document.activeElement?.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || document.activeElement?.isContentEditable) return;
      e.preventDefault();
      window.scrollBy({ top: e.key === "ArrowDown" ? step : -step, behavior: "smooth" });
    };
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, [step]);
}

function ScrollSmoother() {
  useFrame((_, delta) => {
    const { progress, smoothProgress, setSmoothProgress } = useScrollStore.getState();
    setSmoothProgress(damp(smoothProgress, progress, 4, delta));
  });
  return null;
}

function useMouseParallax() {
  const mouse = useRef({ x: 0, y: 0 });
  useEffect(() => {
    const onMove = (e) => {
      if (e.pointerType !== "mouse") return;
      mouse.current.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.current.y = (e.clientY / window.innerHeight) * 2 - 1;
    };
    window.addEventListener("pointermove", onMove, { passive: true });
    return () => window.removeEventListener("pointermove", onMove);
  }, []);
  return mouse;
}

function CameraRig({ mouse, parallaxStrength = 0.18 }) {
  const { camera } = useThree();
  const lookAtTarget = useRef(new THREE.Vector3());
  const currentLookAt = useRef(new THREE.Vector3());

  useFrame((_, delta) => {
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    const [px, py, pz] = state.camera.position;
    const [lx, ly, lz] = state.camera.lookAt;
    const mx = mouse.current?.x ?? 0;
    const my = mouse.current?.y ?? 0;

    camera.position.x = damp(camera.position.x, px + mx * parallaxStrength, 6, delta);
    camera.position.y = damp(camera.position.y, py - my * parallaxStrength * 0.6, 6, delta);
    camera.position.z = damp(camera.position.z, pz, 6, delta);

    lookAtTarget.current.set(lx + mx * 0.05, ly - my * 0.05, lz);
    currentLookAt.current.lerp(lookAtTarget.current, 1 - Math.exp(-6 * delta));
    camera.lookAt(currentLookAt.current);

    if ("fov" in camera) {
      camera.fov = damp(camera.fov, state.camera.fov, 5, delta);
      camera.updateProjectionMatrix();
    }
  });

  return null;
}

function AnimatedCharacter({ mouse }) {

  useEffect(() => {

      spine1: "Spine01", spine2: "Spine02", head: "Head", neck: "NeckTwist01",
      lClavicle: "L_Clavicle", rClavicle: "R_Clavicle",

      lHand: "L_Hand", rHand: "R_Hand",

      lCalf: "L_Calf", rCalf: "R_Calf",

function CursorTrail() {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let width = window.innerWidth;
    let height = window.innerHeight;
    let points = [];
    let rafId = 0;

    const resize = () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();

    const addPoint = (x, y) => {
      points.push({ x, y, life: 1 });
      if (points.length > 40) points.shift();
    };
    const onPointerMove = (e) => addPoint(e.clientX, e.clientY);
    const onTouchMove = (e) => {
      if (e.touches && e.touches[0]) addPoint(e.touches[0].clientX, e.touches[0].clientY);
    };

    window.addEventListener("resize", resize);
    window.addEventListener("pointermove", onPointerMove, { passive: true });
    window.addEventListener("touchmove", onTouchMove, { passive: true });

    const draw = () => {
      ctx.clearRect(0, 0, width, height);
      points.forEach((p) => { p.life *= 0.94; });
      points = points.filter((p) => p.life > 0.02);

      if (points.length > 1) {
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.globalCompositeOperation = "lighter";
        for (let i = 1; i < points.length; i++) {
          const p0 = points[i - 1];
          const p1 = points[i];
          const alpha = Math.min(p0.life, p1.life) * 0.55;
          ctx.strokeStyle = clientConfig.colors.accent;
          ctx.globalAlpha = alpha;
          ctx.lineWidth = 1.5 + alpha * 4;
          ctx.beginPath();
          ctx.moveTo(p0.x, p0.y);
          ctx.lineTo(p1.x, p1.y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
      }
      rafId = requestAnimationFrame(draw);
    };
    rafId = requestAnimationFrame(draw);

    return () => {
      cancelAnimationFrame(rafId);
      window.removeEventListener("resize", resize);
      window.removeEventListener("pointermove", onPointerMove);
      window.removeEventListener("touchmove", onTouchMove);
    };
  }, []);

  return <canvas ref={canvasRef} className="cursor-trail-canvas" aria-hidden="true" />;
}

    </div>
  );
}

createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>

<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

<script type="text/babel" data-type="module" data-presets="react">
import React, { useEffect, useMemo, useRef, useState, Suspense } from "react";
import { createRoot } from "react-dom/client";
import * as THREE from "three";
import { Canvas, useFrame, useThree } from "@react-three/fiber";
import { useGLTF, OrbitControls, Grid } from "@react-three/drei";

const MODEL_URL = "./assets/models/weebpatineta.glb";

const BONE_DEFS = [
  ["spine1", "Spine01"], ["spine2", "Spine02"], ["neck", "NeckTwist01"], ["head", "Head"],
  ["lClavicle", "L_Clavicle"], ["rClavicle", "R_Clavicle"],
  ["lForearm", "L_Forearm"], ["rForearm", "R_Forearm"],
  ["lHand", "L_Hand"], ["rHand", "R_Hand"],
  ["lThigh", "L_Thigh"], ["rThigh", "R_Thigh"],
  ["lCalf", "L_Calf"], ["rCalf", "R_Calf"],
  ["lFoot", "L_Foot"], ["rFoot", "R_Foot"],
];
const BONE_KEYS = BONE_DEFS.map(([k]) => k);

const rad = (d) => (d * Math.PI) / 180;
const deg = (r) => (r * 180) / Math.PI;
const clamp = (v, min = 0, max = 1) => Math.min(max, Math.max(min, v));
const lerp = (a, b, t) => a + (b - a) * t;
function smoothstep(edge0, edge1, x) {
  const t = clamp((x - edge0) / (edge1 - edge0));
  return t * t * (3 - 2 * t);
}

/* ============================================================
   Etapas ("poses") — ahora en CANTIDAD VARIABLE. Ya no hay una lista
   fija de 6 nombres semánticos (Frente/Acercamiento/Giro/...); las
   etapas se llaman genéricamente "Pose 1", "Pose 2", etc. y se pueden
   agregar o quitar libremente desde la pestaña Pose/Cámara/Movimiento.
   Pose, Cámara, Movimiento y su Ambiente (luz/niebla/fondo) comparten
   siempre las mismas etapas.
   ============================================================ */
function makeDefaultStages() {
  return [
    { id: "pose-1", label: "Pose 1" },
    { id: "pose-2", label: "Pose 2" },
    { id: "pose-3", label: "Pose 3" },
    { id: "pose-4", label: "Pose 4" },
    { id: "pose-5", label: "Pose 5" },
    { id: "pose-6", label: "Pose 6" },
  ];
}
/* Duración de cada tramo (en vh de scroll), entre etapa[i] y etapa[i+1].
   Un valor menos que la cantidad de etapas. La suma de estos valores es
   el largo total del scroll. Editable desde la pestaña "Duración". */
const DEFAULT_DURATIONS_VH = [170, 275, 125, 190, 190];

function stagesWithProgress(stageList, durationsVh) {
  const total = durationsVh.reduce((a, b) => a + b, 0) || 1;
  let acc = 0;
  const out = [{ ...stageList[0], progress: 0 }];
  for (let i = 0; i < durationsVh.length; i++) {
    acc += durationsVh[i];
    out.push({ ...stageList[i + 1], progress: acc / total });
  }
  return out;
}
const roundProgress = (p) => Math.round(p * 1000) / 1000;

const zeroPose = () => Object.fromEntries(BONE_KEYS.map((k) => [k, { x: 0, y: 0, z: 0 }]));
const defaultCamera = () => ({ position: [0, 0, 3.5], lookAt: [0, 0.5, 0], fov: 30 });
const defaultMovement = () => ({ pos: [0, 0, 0], yaw: 0, pitch: 0 });
const defaultFx = () => ({
  light: { color: "#dfeeff", intensity: 0.7, rimColor: "#49d3ff", rimIntensity: 1.4 },
  fog: { color: "#05070a", far: 20 },
  background: "#05070a",
});

/* Todo arranca en cero / neutro: ninguna etapa tiene pose, cámara,
   movimiento ni ambiente predefinidos (salvo el ambiente, que arranca
   con un valor neutro razonable). Se arma a gusto desde la herramienta. */
function initialPoses(stageList) {
  return Object.fromEntries(stageList.map((kf) => [kf.id, zeroPose()]));
}
function initialCameras(stageList) {
  return Object.fromEntries(stageList.map((kf) => [kf.id, defaultCamera()]));
}
function initialMovements(stageList) {
  return Object.fromEntries(stageList.map((kf) => [kf.id, defaultMovement()]));
}
function initialFx(stageList) {
  return Object.fromEntries(stageList.map((kf) => [kf.id, defaultFx()]));
}

function samplePose(posesByKf, progress, stages) {
  const p = clamp(progress, 0, 1);
  if (p <= stages[0].progress) return posesByKf[stages[0].id];
  const last = stages[stages.length - 1];
  if (p >= last.progress) return posesByKf[last.id];
  let i = 0;
  while (i < stages.length - 1 && stages[i + 1].progress < p) i++;
  const a = stages[i], b = stages[i + 1];
  const span = b.progress - a.progress || 1;
  const t = clamp((p - a.progress) / span);
  const pa = posesByKf[a.id], pb = posesByKf[b.id];
  const out = {};
  BONE_KEYS.forEach((k) => { out[k] = { x: lerp(pa[k].x, pb[k].x, t), y: lerp(pa[k].y, pb[k].y, t), z: lerp(pa[k].z, pb[k].z, t) }; });
  return out;
}

function lerpVec3(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }

function sampleCamera(camsByKf, progress, stages) {
  const p = clamp(progress, 0, 1);
  if (p <= stages[0].progress) return camsByKf[stages[0].id];
  const last = stages[stages.length - 1];
  if (p >= last.progress) return camsByKf[last.id];
  let i = 0;
  while (i < stages.length - 1 && stages[i + 1].progress < p) i++;
  const a = stages[i], b = stages[i + 1];
  const span = b.progress - a.progress || 1;
  const t = clamp((p - a.progress) / span);
  const ca = camsByKf[a.id], cb = camsByKf[b.id];
  return { position: lerpVec3(ca.position, cb.position, t), lookAt: lerpVec3(ca.lookAt, cb.lookAt, t), fov: lerp(ca.fov, cb.fov, t) };
}

function sampleMovement(movesByKf, progress, stages) {
  const p = clamp(progress, 0, 1);
  if (p <= stages[0].progress) return movesByKf[stages[0].id];
  const last = stages[stages.length - 1];
  if (p >= last.progress) return movesByKf[last.id];
  let i = 0;
  while (i < stages.length - 1 && stages[i + 1].progress < p) i++;
  const a = stages[i], b = stages[i + 1];
  const span = b.progress - a.progress || 1;
  const t = smoothstep(0, 1, clamp((p - a.progress) / span));
  const ma = movesByKf[a.id], mb = movesByKf[b.id];
  return { pos: lerpVec3(ma.pos, mb.pos, t), yaw: lerp(ma.yaw, mb.yaw, t), pitch: lerp(ma.pitch, mb.pitch, t) };
}

/* ---- Personaje ----
   Se monta UNA sola vez y sólo cambian sus props, para que cambiar de
   pestaña o de etapa activa nunca provoque un remount de <primitive>
   (un remount forzaría a recapturar como "rest pose" una pose ya
   deformada). Este detalle es exclusivo de esta herramienta de
   edición: en el archivo final exportado el personaje siempre se
   monta una sola vez. */
function Character({ pose, onBonesFound }) {
  const { scene } = useGLTF(MODEL_URL);
  const bonesRef = useRef({});
  const restRef = useRef({});
  const foundOnce = useRef(false);

  useEffect(() => {
    const bones = {}; const rest = {}; const found = {};
    BONE_DEFS.forEach(([key, boneName]) => {
      const bone = scene.getObjectByName(boneName);
      if (bone) { bones[key] = bone; rest[key] = bone.quaternion.clone(); found[key] = true; }
      else found[key] = false;
    });
    bonesRef.current = bones; restRef.current = rest;
    if (!foundOnce.current) { foundOnce.current = true; onBonesFound(found); }
  }, [scene]);

  useFrame(() => {
    const bones = bonesRef.current, rest = restRef.current;
    BONE_KEYS.forEach((key) => {
      const bone = bones[key], r = rest[key];
      if (!bone || !r) return;
      const xyz = pose[key];
      const dq = new THREE.Quaternion().setFromEuler(new THREE.Euler(rad(xyz.x), rad(xyz.y), rad(xyz.z), "XYZ"));
      bone.quaternion.copy(r).multiply(dq);
    });
  });

  return <primitive object={scene} position={[0, -0.9, 0]} scale={1.7} />;
}
useGLTF.preload(MODEL_URL);

function SceneCameraDriver({ target, active }) {
  const { camera } = useThree();
  useFrame(() => {
    if (!active || !target) return;
    camera.position.set(target.position[0], target.position[1], target.position[2]);
    camera.lookAt(target.lookAt[0], target.lookAt[1], target.lookAt[2]);
    if ("fov" in camera) { camera.fov = target.fov; camera.updateProjectionMatrix(); }
  });
  return null;
}

function MovedGroup({ movement, children }) {
  const ref = useRef(null);
  useFrame(() => {
    if (!ref.current || !movement) return;
    ref.current.position.set(movement.pos[0], movement.pos[1], movement.pos[2]);
    ref.current.rotation.set(rad(movement.pitch), rad(movement.yaw), 0);
  });
  return <group ref={ref}>{children}</group>;
}

/* Si un .glb de objeto todavía no está copiado junto a este archivo,
   useGLTF tira un error de carga (404). Este boundary evita que eso
   rompa toda la herramienta — cada objeto tiene su propio boundary,
   así uno que falte no tumba a los demás. */
class ObjectBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false }; }
  static getDerivedStateFromError() { return { hasError: true }; }
  componentDidCatch() {}
  render() {
    if (this.state.hasError) return null;
    return this.props.children;
  }
}

function ObjectPreview({ obj }) {
  const { scene } = useGLTF(obj.url);
  return (
    <primitive
      object={scene}
      scale={obj.scale}
      position={obj.position}
      rotation={[0, (obj.rotationY * Math.PI) / 180, 0]}
    />
  );
}

/* La estructura de la escena es SIEMPRE la misma (luces, grilla,
   MovedGroup > Character, objetos, cámara, controles). Nunca cambia de
   forma entre pestañas, así React nunca desmonta el personaje. */
function Scene({ pose, onBonesFound, cameraTarget, sceneCameraActive, autoRotate, movement, objects, showObjects, showGrid }) {
  return (
    <>
      <ambientLight intensity={0.4} />
      <directionalLight position={[3, 4, 5]} intensity={1} />
      <directionalLight position={[-3, 2, -2]} intensity={0.4} />
      {showGrid && <Grid args={[10, 10]} position={[0, -0.02, 0]} cellColor="#333" sectionColor="#555" />}
      {showObjects &&
        objects.filter((o) => o.visible).map((o) => (
          <ObjectBoundary key={o.id}>
            <Suspense fallback={null}>
              <ObjectPreview obj={o} />
            </Suspense>
          </ObjectBoundary>
        ))}
      <MovedGroup movement={movement}>
        <Character pose={pose} onBonesFound={onBonesFound} />
      </MovedGroup>
      <SceneCameraDriver target={cameraTarget} active={sceneCameraActive} />
      <OrbitControls target={[0, 0.5, 0]} enabled={!sceneCameraActive} autoRotate={autoRotate && !sceneCameraActive} autoRotateSpeed={2.2} />
    </>
  );
}

/* ---- Generadores de código (mismo formato que espera el template) ---- */
function generateBoneArrayCode(posesByKf, stages) {
  const fmt = (n) => { const r = rad(n); return (Math.abs(r) < 0.0001 ? 0 : r).toFixed(4); };
  const kfLines = stages.map((kf) => {
    const pose = posesByKf[kf.id];
    const boneLines = BONE_KEYS.map((k) => {
      const v = pose[k];
      if (v.x === 0 && v.y === 0 && v.z === 0) return null;
      return `        ${k}: [${fmt(v.x)}, ${fmt(v.y)}, ${fmt(v.z)}],`;
    }).filter(Boolean).join("\n");
    return `  {\n    id: "${kf.id}",\n    progress: ${roundProgress(kf.progress)},\n    bones: {\n${boneLines || "      // (sin cambios respecto al rest pose)"}\n    },\n  },`;
  }).join("\n");
  return `const BONE_POSE_KEYFRAMES = [\n${kfLines}\n];`;
}

function generateScenesArrayCode(camsByKf, fxByKf, stages) {
  const fmtNum = (n) => (Math.abs(n) < 0.0001 ? 0 : Math.round(n * 1000) / 1000);
  const fmtVec = (v) => `[${v.map(fmtNum).join(", ")}]`;
  const kfLines = stages.map((kf) => {
    const cam = camsByKf[kf.id];
    const f = fxByKf[kf.id];
    return `  {
    id: "${kf.id}",
    progress: ${roundProgress(kf.progress)},
    camera: { position: ${fmtVec(cam.position)}, lookAt: ${fmtVec(cam.lookAt)}, fov: ${fmtNum(cam.fov)} },
    light: { color: "${f.light.color}", intensity: ${f.light.intensity}, rimColor: "${f.light.rimColor}", rimIntensity: ${f.light.rimIntensity} },
    fog: { color: "${f.fog.color}", far: ${f.fog.far} },
    background: "${f.background}",
  },`;
  }).join("\n");
  return `const scenes = [\n${kfLines}\n];`;
}

function generateMovementDefsCode(movesByKf, stages) {
  const fmtNum = (n) => (Math.abs(n) < 0.0001 ? 0 : Math.round(n * 1000) / 1000);
  const kfLines = stages.map((kf) => {
    const mv = movesByKf[kf.id];
    return `  { id: "${kf.id}", progress: ${roundProgress(kf.progress)}, pos: [${mv.pos.map(fmtNum).join(", ")}], yaw: ${fmtNum(mv.yaw)}, pitch: ${fmtNum(mv.pitch)} },`;
  }).join("\n");
  return `const MOVEMENT_KEYFRAMES = [
${kfLines}
];

function sampleMovement(progress) {
  const list = MOVEMENT_KEYFRAMES;
  const p = clamp(progress, 0, 1);
  if (p <= list[0].progress) return list[0];
  const last = list[list.length - 1];
  if (p >= last.progress) return last;
  let i = 0;
  while (i < list.length - 1 && list[i + 1].progress < p) i++;
  const a = list[i], b = list[i + 1];
  const span = b.progress - a.progress || 1;
  const t = smoothstep(0, 1, clamp((p - a.progress) / span));
  return {
    pos: [lerp(a.pos[0], b.pos[0], t), lerp(a.pos[1], b.pos[1], t), lerp(a.pos[2], b.pos[2], t)],
    yaw: lerp(a.yaw, b.yaw, t),
    pitch: lerp(a.pitch, b.pitch, t),
  };
}`;
}

function generateScrollLengthCode(totalVh) {
  const n = Math.round(totalVh);
  return `const SCROLL_LENGTH_VH = ${n};`;
}

function generateObjectsCode(objects) {
  const fmtNum = (n) => (Math.abs(n) < 0.0001 ? 0 : Math.round(n * 1000) / 1000);
  const fmtVec = (v) => `[${v.map(fmtNum).join(", ")}]`;
  const lines = objects.map((o) => `  { url: "${o.url}", scale: ${fmtNum(o.scale)}, position: ${fmtVec(o.position)}, rotationY: ${fmtNum(o.rotationY)} },`).join("\n");
  return `const OBJECTS = [\n${lines || "  // (sin objetos)"}\n];`;
}

function buildFullHtml(boneCode, scenesCode, movementCode, scrollLengthCode, objectsCode) {
  const tplEl = document.getElementById("tpl-source");
  let tpl = tplEl.value;
  const swap = (src, startMark, endMark, code) => {
    const start = src.indexOf(startMark);
    const end = src.indexOf(endMark);
    if (start === -1 || end === -1) return src;
    const before = src.slice(0, start + startMark.length);
    const after = src.slice(end);
    return `${before}\n${code}\n${after}`;
  };
  tpl = swap(tpl, "/*@GEN:SCENES_START*/", "/*@GEN:SCENES_END*/", scenesCode);
  tpl = swap(tpl, "/*@GEN:MOVEMENT_DEFS_START*/", "/*@GEN:MOVEMENT_DEFS_END*/", movementCode);
  tpl = swap(tpl, "/*@GEN:BONES_START*/", "/*@GEN:BONES_END*/", boneCode);
  tpl = swap(tpl, "/*@GEN:SCROLL_LENGTH_START*/", "/*@GEN:SCROLL_LENGTH_END*/", scrollLengthCode);
  tpl = swap(tpl, "/*@GEN:OBJECTS_START*/", "/*@GEN:OBJECTS_END*/", objectsCode);
  return tpl;
}

/* ---- App ---- */
function App() {
  const [section, setSection] = useState("pose"); // pose | camera | movement | timing | objects | preview

  const [stages, setStages] = useState(makeDefaultStages);
  const [durationsVh, setDurationsVh] = useState(DEFAULT_DURATIONS_VH);
  const [posesByKf, setPosesByKf] = useState(() => initialPoses(makeDefaultStages()));
  const [camsByKf, setCamsByKf] = useState(() => initialCameras(makeDefaultStages()));
  const [movesByKf, setMovesByKf] = useState(() => initialMovements(makeDefaultStages()));
  const [fxByKf, setFxByKf] = useState(() => initialFx(makeDefaultStages()));

  const stagesComputed = useMemo(() => stagesWithProgress(stages, durationsVh), [stages, durationsVh]);
  const totalVh = useMemo(() => durationsVh.reduce((a, b) => a + b, 0), [durationsVh]);
  const setDurationAt = (i, value) => {
    setDurationsVh((prev) => { const next = [...prev]; next[i] = value; return next; });
  };

  // Una sola etapa activa, compartida por Pose / Cámara / Movimiento.
  const [activeStage, setActiveStage] = useState(() => makeDefaultStages()[0].id);

  const addStage = () => {
    const n = stages.length + 1;
    const newId = `pose-${Date.now()}`;
    const lastId = stages[stages.length - 1].id;
    setStages((prev) => [...prev, { id: newId, label: `Pose ${n}` }]);
    setDurationsVh((prev) => [...prev, 150]);
    setPosesByKf((prev) => ({ ...prev, [newId]: JSON.parse(JSON.stringify(prev[lastId] || zeroPose())) }));
    setCamsByKf((prev) => ({ ...prev, [newId]: JSON.parse(JSON.stringify(prev[lastId] || defaultCamera())) }));
    setMovesByKf((prev) => ({ ...prev, [newId]: JSON.parse(JSON.stringify(prev[lastId] || defaultMovement())) }));
    setFxByKf((prev) => ({ ...prev, [newId]: JSON.parse(JSON.stringify(prev[lastId] || defaultFx())) }));
    setActiveStage(newId);
  };

  const removeStage = (id) => {
    const idx = stages.findIndex((s) => s.id === id);
    if (stages.length <= 2 || idx === -1) return;
    const remIdx = idx === 0 ? 0 : idx - 1;
    setStages((prev) => prev.filter((s) => s.id !== id));
    setDurationsVh((prev) => { const next = [...prev]; next.splice(remIdx, 1); return next; });
    setPosesByKf((prev) => { const next = { ...prev }; delete next[id]; return next; });
    setCamsByKf((prev) => { const next = { ...prev }; delete next[id]; return next; });
    setMovesByKf((prev) => { const next = { ...prev }; delete next[id]; return next; });
    setFxByKf((prev) => { const next = { ...prev }; delete next[id]; return next; });
    if (activeStage === id) {
      const remaining = stages.filter((s) => s.id !== id);
      setActiveStage(remaining[Math.max(0, idx - 1)]?.id || remaining[0]?.id);
    }
  };

  const renameStage = (id, label) => setStages((prev) => prev.map((s) => (s.id === id ? { ...s, label } : s)));

  const [scrub, setScrub] = useState(0);
  const [freeOrbit, setFreeOrbit] = useState(false);
  const [autoRotate, setAutoRotate] = useState(false);
  const [foundMap, setFoundMap] = useState({});
  const [copiedWhich, setCopiedWhich] = useState(null);
  const [downloaded, setDownloaded] = useState(false);

  // Objetos de entorno (antes "Entorno" / un solo universo.glb). Ahora
  // se pueden agregar tantos como haga falta, cada uno con su propio
  // archivo .glb, escala, posición y rotación.
  const [objects, setObjects] = useState(() => [
    { id: "obj-universo", label: "Universo (rampa)", url: "./assets/models/universo.glb", scale: 5, position: [0, -0.2, 2.2], rotationY: 0, visible: true },
  ]);
  const [showObjects, setShowObjects] = useState(true);
  const [showGrid, setShowGrid] = useState(true);

  const addObject = () => {
    const n = objects.length + 1;
    setObjects((prev) => [...prev, {
      id: `obj-${Date.now()}`,
      label: `Objeto ${n}`,
      url: `./assets/models/objeto${n}.glb`,
      scale: 1,
      position: [0, 0, 0],
      rotationY: 0,
      visible: true,
    }]);
  };
  const removeObject = (id) => setObjects((prev) => prev.filter((o) => o.id !== id));
  const updateObject = (id, patch) => setObjects((prev) => prev.map((o) => (o.id === id ? { ...o, ...patch } : o)));

  const stageIndex = stagesComputed.findIndex((s) => s.id === activeStage);

  const setBoneAxis = (boneKey, axis, value) => {
    setPosesByKf((prev) => ({ ...prev, [activeStage]: { ...prev[activeStage], [boneKey]: { ...prev[activeStage][boneKey], [axis]: value } } }));
  };
  const resetBone = (boneKey) => {
    setPosesByKf((prev) => ({ ...prev, [activeStage]: { ...prev[activeStage], [boneKey]: { x: 0, y: 0, z: 0 } } }));
  };
  const copyPoseFromPrev = () => {
    if (stageIndex <= 0) return;
    const prevId = stagesComputed[stageIndex - 1].id;
    setPosesByKf((prev) => ({ ...prev, [activeStage]: JSON.parse(JSON.stringify(prev[prevId])) }));
  };

  const setCamField = (field, axis, value) => {
    setCamsByKf((prev) => {
      const cam = { ...prev[activeStage] };
      if (field === "fov") cam.fov = value;
      else { cam[field] = [...cam[field]]; cam[field]["xyz".indexOf(axis)] = value; }
      return { ...prev, [activeStage]: cam };
    });
  };
  const setFxField = (group, field, value) => {
    setFxByKf((prev) => {
      const fx = { ...prev[activeStage] };
      if (group === "background") return { ...prev, [activeStage]: { ...fx, background: value } };
      fx[group] = { ...fx[group], [field]: value };
      return { ...prev, [activeStage]: fx };
    });
  };
  const copyCamFromPrev = () => {
    if (stageIndex <= 0) return;
    const prevId = stagesComputed[stageIndex - 1].id;
    setCamsByKf((prev) => ({ ...prev, [activeStage]: JSON.parse(JSON.stringify(prev[prevId])) }));
    setFxByKf((prev) => ({ ...prev, [activeStage]: JSON.parse(JSON.stringify(prev[prevId])) }));
  };

  const setMoveField = (field, axis, value) => {
    setMovesByKf((prev) => {
      const mv = { ...prev[activeStage] };
      if (field === "yaw" || field === "pitch") mv[field] = value;
      else { mv.pos = [...mv.pos]; mv.pos["xyz".indexOf(axis)] = value; }
      return { ...prev, [activeStage]: mv };
    });
  };
  const copyMoveFromPrev = () => {
    if (stageIndex <= 0) return;
    const prevId = stagesComputed[stageIndex - 1].id;
    setMovesByKf((prev) => ({ ...prev, [activeStage]: JSON.parse(JSON.stringify(prev[prevId])) }));
  };
  const applyYawPreset = (deg_) => setMoveField("yaw", null, deg_);
  const applyPitchPreset = (deg_) => setMoveField("pitch", null, deg_);

  const isPreview = section === "preview";
  const currentPose = isPreview ? samplePose(posesByKf, scrub, stagesComputed) : posesByKf[activeStage];
  const currentCamTarget = isPreview ? sampleCamera(camsByKf, scrub, stagesComputed) : camsByKf[activeStage];
  const currentMovement = isPreview ? sampleMovement(movesByKf, scrub, stagesComputed) : movesByKf[activeStage];
  const sceneCameraActive = !freeOrbit;

  const boneCode = useMemo(() => generateBoneArrayCode(posesByKf, stagesComputed), [posesByKf, stagesComputed]);
  const scenesCode = useMemo(() => generateScenesArrayCode(camsByKf, fxByKf, stagesComputed), [camsByKf, fxByKf, stagesComputed]);
  const movementCode = useMemo(() => generateMovementDefsCode(movesByKf, stagesComputed), [movesByKf, stagesComputed]);
  const scrollLengthCode = useMemo(() => generateScrollLengthCode(totalVh), [totalVh]);
  const objectsCode = useMemo(() => generateObjectsCode(objects), [objects]);

  const copy = async (text, which) => {
    try { await navigator.clipboard.writeText(text); setCopiedWhich(which); setTimeout(() => setCopiedWhich(null), 1500); }
    catch (e) { /* fallback: seleccionar manualmente */ }
  };

  const downloadFullHtml = () => {
    const html = buildFullHtml(boneCode, scenesCode, movementCode, scrollLengthCode, objectsCode);
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "index.html";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setDownloaded(true);
    setTimeout(() => setDownloaded(false), 2000);
  };

  const copyFullHtml = () => {
    const html = buildFullHtml(boneCode, scenesCode, movementCode, scrollLengthCode, objectsCode);
    copy(html, "full");
  };

  const showStageTabs = section === "pose" || section === "camera" || section === "movement";
  const currentStageLabel = stages.find((s) => s.id === activeStage)?.label || "";
  const currentFx = fxByKf[activeStage];

  return (
    <>
      <div className="viewport">
        <div className="top-controls">
          <span>{!freeOrbit ? "Vista: cámara de la escena (real)" : "Arrastrá para orbitar · Scroll para zoom"}</span>
          <label className="toggle-row"><input type="checkbox" checked={freeOrbit} onChange={(e) => setFreeOrbit(e.target.checked)} />Cámara libre (inspeccionar)</label>
          {freeOrbit && (
            <label className="toggle-row"><input type="checkbox" checked={autoRotate} onChange={(e) => setAutoRotate(e.target.checked)} />Auto-rotar vista</label>
          )}
          <label className="toggle-row"><input type="checkbox" checked={showObjects} onChange={(e) => setShowObjects(e.target.checked)} />Mostrar objetos</label>
          <label className="toggle-row"><input type="checkbox" checked={showGrid} onChange={(e) => setShowGrid(e.target.checked)} />Mostrar grilla</label>
        </div>
        <Canvas camera={{ position: [0, 0.3, 3.5], fov: 35 }}>
          <Scene pose={currentPose} onBonesFound={setFoundMap} cameraTarget={currentCamTarget} sceneCameraActive={sceneCameraActive} autoRotate={autoRotate} movement={currentMovement} objects={objects} showObjects={showObjects} showGrid={showGrid} />
        </Canvas>
      </div>

      <div className="panel">
        <div>
          <h1>Pose, Cámara, Movimiento &amp; Objetos</h1>
          <p className="hint">Agregá tantas poses como necesites con "+ Agregar pose" — ya no hay un número fijo de etapas. El visor de la izquierda siempre muestra la etapa que estés editando con su pose + cámara + movimiento + ambiente juntos. En "Duración" ajustás cuánto scroll dura cada tramo, y en "Objetos" agregás/ubicás los modelos estáticos del entorno (rampas, props, etc — podés tener varios a la vez). Al final descargás el index.html completo, o lo copiás directo sin bajar el archivo.</p>
        </div>

        <div className="section-tabs">
          <div className={`section-tab ${section === "pose" ? "active" : ""}`} onClick={() => setSection("pose")}>Pose</div>
          <div className={`section-tab ${section === "camera" ? "active" : ""}`} onClick={() => setSection("camera")}>Cámara</div>
          <div className={`section-tab ${section === "movement" ? "active" : ""}`} onClick={() => setSection("movement")}>Movimiento</div>
          <div className={`section-tab ${section === "timing" ? "active" : ""}`} onClick={() => setSection("timing")}>Duración</div>
          <div className={`section-tab ${section === "objects" ? "active" : ""}`} onClick={() => setSection("objects")}>Objetos</div>
          <div className={`section-tab ${section === "preview" ? "active" : ""}`} onClick={() => setSection("preview")}>Preview</div>
        </div>

        {showStageTabs && (
          <>
            <div className="section-title">Etapa (compartida por Pose / Cámara / Movimiento)</div>
            <div className="kf-tabs">
              {stagesComputed.map((kf) => (
                <div key={kf.id} className={`kf-tab ${activeStage === kf.id ? "active" : ""}`} onClick={() => setActiveStage(kf.id)}>{kf.label}<span className="p">progress {kf.progress.toFixed(2)}</span></div>
              ))}
            </div>
            <div className="btn-row">
              <button className="btn primary" onClick={addStage}>+ Agregar pose</button>
              {stages.length > 2 && <button className="btn danger" onClick={() => removeStage(activeStage)}>🗑 Eliminar "{currentStageLabel}"</button>}
            </div>
            <div className="axis-row">
              <label style={{ width: 70, fontSize: 11 }}>Nombre</label>
              <input type="text" value={currentStageLabel} onChange={(e) => renameStage(activeStage, e.target.value)} />
            </div>
          </>
        )}

        {isPreview && (
          <div className="scrub-row">
            <label style={{ fontSize: 11 }}>progress</label>
            <input type="range" min={0} max={1} step={0.001} value={scrub} onChange={(e) => setScrub(Number(e.target.value))} />
            <span className="val">{scrub.toFixed(2)}</span>
          </div>
        )}

        {section === "pose" && (
          <>
            <div className="btn-row"><button className="btn" onClick={copyPoseFromPrev}>Copiar etapa anterior</button></div>
            <div className="section-title">Huesos ({BONE_KEYS.length})</div>
            {BONE_DEFS.map(([key, boneName]) => {
              const found = foundMap[key];
              const v = posesByKf[activeStage][key];
              return (
                <div className="bone-block" key={key} style={{ opacity: found === false ? 0.4 : 1 }}>
                  <div className="bone-name">{boneName} {found === false ? "· FALTA" : ""}</div>
                  {["x", "y", "z"].map((axis) => (
                    <div className="axis-row" key={axis}>
                      <label>{axis.toUpperCase()}</label>
                      <input type="range" min={-180} max={180} value={v[axis]} onChange={(e) => setBoneAxis(key, axis, Number(e.target.value))} />
                      <span className="val">{Math.round(v[axis])}°</span>
                    </div>
                  ))}
                  <button className="btn" style={{ fontSize: 10, padding: "2px 6px" }} onClick={() => resetBone(key)}>reset</button>
                </div>
              );
            })}
          </>
        )}

        {section === "camera" && (
          <>
            <div className="btn-row"><button className="btn" onClick={copyCamFromPrev}>Copiar etapa anterior</button></div>
            <div className="cam-group">
              <div className="cam-group-title">Posición (x, y, z)</div>
              {["x", "y", "z"].map((axis, i) => (
                <div className="axis-row" key={axis}>
                  <label>{axis.toUpperCase()}</label>
                  <input type="range" min={-6} max={6} step={0.05} value={camsByKf[activeStage].position[i]} onChange={(e) => setCamField("position", axis, Number(e.target.value))} />
                  <span className="val">{camsByKf[activeStage].position[i].toFixed(2)}</span>
                </div>
              ))}
              <p className="hint">Z más grande = más lejos. Z más chico = más cerca.</p>
            </div>
            <div className="cam-group">
              <div className="cam-group-title">Mira hacia (lookAt x, y, z)</div>
              {["x", "y", "z"].map((axis, i) => (
                <div className="axis-row" key={axis}>
                  <label>{axis.toUpperCase()}</label>
                  <input type="range" min={-3} max={3} step={0.05} value={camsByKf[activeStage].lookAt[i]} onChange={(e) => setCamField("lookAt", axis, Number(e.target.value))} />
                  <span className="val">{camsByKf[activeStage].lookAt[i].toFixed(2)}</span>
                </div>
              ))}
            </div>
            <div className="cam-group">
              <div className="cam-group-title">Zoom (FOV)</div>
              <div className="axis-row">
                <label>°</label>
                <input type="range" min={15} max={50} step={0.5} value={camsByKf[activeStage].fov} onChange={(e) => setCamField("fov", null, Number(e.target.value))} />
                <span className="val">{camsByKf[activeStage].fov.toFixed(1)}</span>
              </div>
            </div>
            <div className="cam-group">
              <div className="cam-group-title">Ambiente (luz / niebla / fondo)</div>
              <div className="axis-row"><label style={{ width: 60 }}>Luz</label><input type="color" value={currentFx.light.color} onChange={(e) => setFxField("light", "color", e.target.value)} /><input type="range" min={0} max={2} step={0.01} value={currentFx.light.intensity} onChange={(e) => setFxField("light", "intensity", Number(e.target.value))} /><span className="val">{currentFx.light.intensity.toFixed(2)}</span></div>
              <div className="axis-row"><label style={{ width: 60 }}>Rim</label><input type="color" value={currentFx.light.rimColor} onChange={(e) => setFxField("light", "rimColor", e.target.value)} /><input type="range" min={0} max={3} step={0.01} value={currentFx.light.rimIntensity} onChange={(e) => setFxField("light", "rimIntensity", Number(e.target.value))} /><span className="val">{currentFx.light.rimIntensity.toFixed(2)}</span></div>
              <div className="axis-row"><label style={{ width: 60 }}>Niebla</label><input type="color" value={currentFx.fog.color} onChange={(e) => setFxField("fog", "color", e.target.value)} /><input type="range" min={5} max={40} step={0.5} value={currentFx.fog.far} onChange={(e) => setFxField("fog", "far", Number(e.target.value))} /><span className="val">{currentFx.fog.far.toFixed(1)}</span></div>
              <div className="axis-row"><label style={{ width: 60 }}>Fondo</label><input type="color" value={currentFx.background} onChange={(e) => setFxField("background", null, e.target.value)} /></div>
            </div>
          </>
        )}

        {section === "movement" && (
          <>
            <div className="btn-row"><button className="btn" onClick={copyMoveFromPrev}>Copiar etapa anterior</button></div>

            <div className="cam-group">
              <div className="cam-group-title">Posición (x, y, z)</div>
              {["x", "y", "z"].map((axis, i) => (
                <div className="axis-row" key={axis}>
                  <label>{axis.toUpperCase()}</label>
                  <input type="range" min={axis === "z" ? -20 : -3} max={axis === "z" ? 4 : 3} step={0.05} value={movesByKf[activeStage].pos[i]} onChange={(e) => setMoveField("pos", axis, Number(e.target.value))} />
                  <span className="val">{movesByKf[activeStage].pos[i].toFixed(2)}</span>
                </div>
              ))}
              <p className="hint">X: izquierda/derecha (diagonal si lo combinás con Z). Y: altura en cuadro. Z: profundidad — más negativo, más al fondo/lejos.</p>
            </div>

            <div className="cam-group">
              <div className="cam-group-title">Giro (yaw)</div>
              <div className="axis-row">
                <label>°</label>
                <input type="range" min={-180} max={180} step={1} value={movesByKf[activeStage].yaw} onChange={(e) => setMoveField("yaw", null, Number(e.target.value))} />
                <span className="val">{Math.round(movesByKf[activeStage].yaw)}°</span>
              </div>
              <div className="btn-row">
                <button className="btn" onClick={() => applyYawPreset(0)}>Frente</button>
                <button className="btn" onClick={() => applyYawPreset(-90)}>Derecha 90°</button>
                <button className="btn" onClick={() => applyYawPreset(90)}>Izquierda 90°</button>
                <button className="btn" onClick={() => applyYawPreset(180)}>Espalda 180°</button>
              </div>
            </div>

            <div className="cam-group">
              <div className="cam-group-title">Inclinación (pitch)</div>
              <div className="axis-row">
                <label>°</label>
                <input type="range" min={-90} max={90} step={1} value={movesByKf[activeStage].pitch} onChange={(e) => setMoveField("pitch", null, Number(e.target.value))} />
                <span className="val">{Math.round(movesByKf[activeStage].pitch)}°</span>
              </div>
              <div className="btn-row">
                <button className="btn" onClick={() => applyPitchPreset(0)}>Neutral</button>
                <button className="btn" onClick={() => applyPitchPreset(60)}>Adelante</button>
                <button className="btn" onClick={() => applyPitchPreset(-60)}>Atrás</button>
              </div>
            </div>
          </>
        )}

        {section === "timing" && (
          <>
            <p className="hint">Cuánto scroll (en vh) dura cada tramo entre etapas. Más vh = la transición es más lenta/larga; menos vh = más rápida/corta. La suma de los tramos reemplaza el largo total del scroll y define en qué "progress" cae cada etapa — se ve reflejado en las pestañas de arriba.</p>
            <div className="cam-group">
              {stagesComputed.slice(1).map((kf, i) => {
                const fromLabel = stages[i].label;
                return (
                  <div key={kf.id} className="axis-row" style={{ marginBottom: 8 }}>
                    <label style={{ width: 150, fontSize: 10.5 }}>{fromLabel} → {kf.label}</label>
                    <input type="range" min={20} max={800} step={5} value={durationsVh[i]} onChange={(e) => setDurationAt(i, Number(e.target.value))} />
                    <span className="val">{durationsVh[i]}vh</span>
                  </div>
                );
              })}
            </div>
            <p className="hint">Largo total del scroll: <strong>{Math.round(totalVh)}vh</strong></p>
          </>
        )}

        {section === "objects" && (
          <>
            <p className="hint">Agregá los modelos estáticos del entorno (rampas, plataformas, props, etc.) — podés tener varios a la vez, cada uno con su propio archivo, escala, posición y rotación. Copiá cada .glb en <code>assets/models/</code>, junto al del personaje, con el nombre que le pongas acá (por defecto objeto1.glb, objeto2.glb, ...).</p>
            {objects.map((obj, idx) => (
              <div className="obj-block" key={obj.id}>
                <div className="obj-block-header">
                  <input type="text" value={obj.label} onChange={(e) => updateObject(obj.id, { label: e.target.value })} />
                  <label className="toggle-row" style={{ padding: "3px 6px" }}><input type="checkbox" checked={obj.visible} onChange={(e) => updateObject(obj.id, { visible: e.target.checked })} />Visible</label>
                  <button className="btn danger" style={{ fontSize: 10, padding: "3px 6px" }} onClick={() => removeObject(obj.id)}>🗑</button>
                </div>
                <div className="axis-row">
                  <label style={{ width: 40, fontSize: 10.5 }}>Archivo</label>
                  <input type="text" value={obj.url} onChange={(e) => updateObject(obj.id, { url: e.target.value })} />
                </div>
                <div className="axis-row">
                  <label>×</label>
                  <input type="range" min={0.05} max={20} step={0.05} value={obj.scale} onChange={(e) => updateObject(obj.id, { scale: Number(e.target.value) })} />
                  <span className="val">{obj.scale.toFixed(2)}</span>
                </div>
                {["x", "y", "z"].map((axis, i) => (
                  <div className="axis-row" key={axis}>
                    <label>{axis.toUpperCase()}</label>
                    <input type="range" min={-30} max={30} step={0.1} value={obj.position[i]} onChange={(e) => {
                      const pos = [...obj.position]; pos[i] = Number(e.target.value); updateObject(obj.id, { position: pos });
                    }} />
                    <span className="val">{obj.position[i].toFixed(1)}</span>
                  </div>
                ))}
                <div className="axis-row">
                  <label>°</label>
                  <input type="range" min={-180} max={180} step={1} value={obj.rotationY} onChange={(e) => updateObject(obj.id, { rotationY: Number(e.target.value) })} />
                  <span className="val">{Math.round(obj.rotationY)}°</span>
                </div>
              </div>
            ))}
            <div className="btn-row">
              <button className="btn primary" onClick={addObject}>+ Agregar objeto</button>
            </div>
          </>
        )}

        <div className="section-title">Descarga</div>
        <p className="hint">Genera tu index.html completo con todo lo ajustado en Pose, Cámara, Movimiento, Duración y Objetos — listo para subir a GitHub Pages, o copialo directo sin descargar.</p>
        <div className="btn-row">
          <button className="btn primary" onClick={downloadFullHtml}>⬇ Descargar index.html completo</button>
          {downloaded && <span className="copied">¡Descargado!</span>}
        </div>
        <div className="btn-row">
          <button className="btn" onClick={copyFullHtml}>⧉ Copiar index.html completo</button>
          {copiedWhich === "full" && <span className="copied">¡Copiado!</span>}
        </div>

        <div className="section-title">Código individual (opcional)</div>
        <p className="hint">Por si preferís pegar a mano en tu propio archivo en vez de descargar el completo.</p>

        <details>
          <summary style={{ cursor: "pointer", fontSize: 11.5, color: "rgba(245,246,242,0.7)" }}>Ver bloques de código</summary>
          <div style={{ marginTop: 8 }}>
            <div className="section-title">Huesos</div>
            <textarea className="code" readOnly value={boneCode} onFocus={(e) => e.target.select()} />
            <div className="btn-row"><button className="btn" onClick={() => copy(boneCode, "bones")}>Copiar</button>{copiedWhich === "bones" && <span className="copied">¡Copiado!</span>}</div>

            <div className="section-title">Cámara (scenes)</div>
            <textarea className="code" readOnly value={scenesCode} onFocus={(e) => e.target.select()} />
            <div className="btn-row"><button className="btn" onClick={() => copy(scenesCode, "camera")}>Copiar</button>{copiedWhich === "camera" && <span className="copied">¡Copiado!</span>}</div>

            <div className="section-title">Movimiento</div>
            <textarea className="code" readOnly value={movementCode} onFocus={(e) => e.target.select()} />
            <div className="btn-row"><button className="btn" onClick={() => copy(movementCode, "movement")}>Copiar</button>{copiedWhich === "movement" && <span className="copied">¡Copiado!</span>}</div>

            <div className="section-title">Objetos</div>
            <textarea className="code" readOnly value={objectsCode} onFocus={(e) => e.target.select()} />
            <div className="btn-row"><button className="btn" onClick={() => copy(objectsCode, "objects")}>Copiar</button>{copiedWhich === "objects" && <span className="copied">¡Copiado!</span>}</div>
          </div>
        </details>
      </div>
    </>
  );
}

createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
