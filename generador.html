<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pose &amp; Keyframe Code Generator — weeb.glb</title>
<style>
  html, body { margin: 0; padding: 0; background: #0f0f1a; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
  #root { width: 100%; height: 100%; display: flex; }
  .viewport { flex: 1; position: relative; }
  canvas { display: block; }
  .top-controls {
    position: absolute; top: 12px; left: 12px; z-index: 5;
    color: rgba(245,246,242,0.6); font-size: 11.5px;
  }
  .panel {
    width: 380px; height: 100%; background: rgba(10,10,16,0.96); color: #f5f6f2;
    overflow-y: auto; padding: 16px; box-sizing: border-box; font-size: 13px;
    border-left: 1px solid rgba(200,255,0,0.3); display: flex; flex-direction: column; gap: 14px;
  }
  h1 { font-size: 15px; margin: 0 0 2px; color: #c8ff00; }
  p.hint { color: rgba(245,246,242,0.6); font-size: 11.5px; margin: 0; line-height: 1.4; }

  .kf-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .kf-tab {
    flex: 1 1 30%; padding: 8px 4px; text-align: center; border-radius: 6px; cursor: pointer;
    background: rgba(255,255,255,0.06); border: 1px solid transparent; font-size: 11px; line-height: 1.3;
  }
  .kf-tab.active { background: rgba(200,255,0,0.15); border-color: #c8ff00; color: #c8ff00; }
  .kf-tab .p { display: block; font-size: 9.5px; color: rgba(245,246,242,0.5); }
  .kf-tab.active .p { color: rgba(200,255,0,0.7); }

  .mode-row { display: flex; gap: 6px; }
  .mode-btn {
    flex: 1; padding: 7px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.15);
    background: transparent; color: #f5f6f2; cursor: pointer; font-size: 11.5px;
  }
  .mode-btn.active { background: #c8ff00; color: #0a0a0a; border-color: #c8ff00; font-weight: 600; }

  .scrub-row { display: flex; align-items: center; gap: 8px; }
  .scrub-row input[type=range] { flex: 1; }
  .scrub-row .val { width: 42px; text-align: right; font-variant-numeric: tabular-nums; }

  .section-title { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(245,246,242,0.5); margin: 4px 0 -4px; }

  .bone-block { padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .bone-name { font-weight: 600; margin-bottom: 4px; font-size: 12px; }
  .axis-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .axis-row label { width: 14px; color: rgba(245,246,242,0.7); font-size: 11px; }
  .axis-row input[type=range] { flex: 1; }
  .axis-row .val { width: 44px; text-align: right; font-variant-numeric: tabular-nums; color: rgba(245,246,242,0.8); font-size: 11px; }

  .btn-row { display: flex; gap: 6px; }
  .btn {
    padding: 7px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2);
    background: transparent; color: #f5f6f2; cursor: pointer; font-size: 11.5px;
  }
  .btn.primary { background: #c8ff00; color: #0a0a0a; border-color: #c8ff00; font-weight: 600; }

  textarea.code {
    width: 100%; height: 260px; resize: vertical; background: #05050a; color: #cdeb8f;
    border: 1px solid rgba(200,255,0,0.25); border-radius: 6px; padding: 10px; font-family: ui-monospace, monospace;
    font-size: 10.5px; line-height: 1.45; box-sizing: border-box;
  }
  .copied { color: #c8ff00; font-size: 11px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "three": "https://esm.sh/three@0.160.0",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.17.10?external=react,react-dom,three",
    "@react-three/drei": "https://esm.sh/@react-three/drei@9.114.3?external=react,react-dom,three,@react-three/fiber"
  }
}
</script>

<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

<script type="text/babel" data-type="module" data-presets="react">
import React, { useEffect, useMemo, useRef, useState } from "react";
import { createRoot } from "react-dom/client";
import * as THREE from "three";
import { Canvas, useFrame } from "@react-three/fiber";
import { useGLTF, OrbitControls, Environment, Grid } from "@react-three/drei";

// Mismo modelo que index.html
const MODEL_URL = "./assets/models/weeb.glb";

// Mismas claves y mismos nombres de hueso que usa `names` dentro de
// AnimatedCharacter en tu index.html (sin L_Upperarm/R_Upperarm: pesos rotos).
const BONE_DEFS = [
  ["spine1", "Spine01"],
  ["spine2", "Spine02"],
  ["neck", "NeckTwist01"],
  ["head", "Head"],
  ["lClavicle", "L_Clavicle"],
  ["rClavicle", "R_Clavicle"],
  ["lForearm", "L_Forearm"],
  ["rForearm", "R_Forearm"],
  ["lHand", "L_Hand"],
  ["rHand", "R_Hand"],
  ["lThigh", "L_Thigh"],
  ["rThigh", "R_Thigh"],
  ["lCalf", "L_Calf"],
  ["rCalf", "R_Calf"],
  ["lFoot", "L_Foot"],
  ["rFoot", "R_Foot"],
];
const BONE_KEYS = BONE_DEFS.map(([k]) => k);
const BONE_LABELS = Object.fromEntries(BONE_DEFS);

// Mismas 5 etapas y mismos breakpoints de progress que el array `scenes`
// de index.html.
const KEYFRAMES = [
  { id: "front-idle", label: "Frente", progress: 0 },
  { id: "approach", label: "Acercamiento", progress: 0.25 },
  { id: "turn", label: "Giro", progress: 0.5 },
  { id: "fall-pose", label: "Postura caída", progress: 0.7 },
  { id: "fall", label: "Caída", progress: 1 },
];

const zeroPose = () => Object.fromEntries(BONE_KEYS.map((k) => [k, { x: 0, y: 0, z: 0 }]));
const rad = (d) => (d * Math.PI) / 180;
const clamp = (v, min = 0, max = 1) => Math.min(max, Math.max(min, v));
const lerp = (a, b, t) => a + (b - a) * t;

// Interpola la pose (en grados) para un progress dado, igual que blendScenes
// en index.html pero sobre ángulos de hueso.
function samplePose(posesByKf, progress) {
  const p = clamp(progress, 0, 1);
  if (p <= KEYFRAMES[0].progress) return posesByKf[KEYFRAMES[0].id];
  const last = KEYFRAMES[KEYFRAMES.length - 1];
  if (p >= last.progress) return posesByKf[last.id];
  let i = 0;
  while (i < KEYFRAMES.length - 1 && KEYFRAMES[i + 1].progress < p) i++;
  const a = KEYFRAMES[i], b = KEYFRAMES[i + 1];
  const span = b.progress - a.progress || 1;
  const t = clamp((p - a.progress) / span);
  const pa = posesByKf[a.id], pb = posesByKf[b.id];
  const out = {};
  BONE_KEYS.forEach((k) => {
    out[k] = {
      x: lerp(pa[k].x, pb[k].x, t),
      y: lerp(pa[k].y, pb[k].y, t),
      z: lerp(pa[k].z, pb[k].z, t),
    };
  });
  return out;
}

function Character({ pose, onBonesFound }) {
  const { scene } = useGLTF(MODEL_URL);
  const bonesRef = useRef({});
  const restRef = useRef({});
  const foundOnce = useRef(false);

  useEffect(() => {
    const bones = {}; const rest = {}; const found = {};
    BONE_DEFS.forEach(([key, boneName]) => {
      const bone = scene.getObjectByName(boneName);
      if (bone) { bones[key] = bone; rest[key] = bone.quaternion.clone(); found[key] = true; }
      else found[key] = false;
    });
    bonesRef.current = bones; restRef.current = rest;
    if (!foundOnce.current) { foundOnce.current = true; onBonesFound(found); }
  }, [scene]);

  useFrame(() => {
    const bones = bonesRef.current, rest = restRef.current;
    BONE_KEYS.forEach((key) => {
      const bone = bones[key], r = rest[key];
      if (!bone || !r) return;
      const xyz = pose[key];
      const dq = new THREE.Quaternion().setFromEuler(new THREE.Euler(rad(xyz.x), rad(xyz.y), rad(xyz.z), "XYZ"));
      bone.quaternion.copy(r).multiply(dq);
    });
  });

  return <primitive object={scene} position={[0, -0.9, 0]} scale={1.7} />;
}
useGLTF.preload(MODEL_URL);

function Scene({ pose, onBonesFound }) {
  return (
    <>
      <ambientLight intensity={0.4} />
      <directionalLight position={[3, 4, 5]} intensity={1} />
      <directionalLight position={[-3, 2, -2]} intensity={0.4} />
      <Environment preset="city" background={false} />
      <Grid args={[10, 10]} position={[0, -0.02, 0]} cellColor="#333" sectionColor="#555" />
      <Character pose={pose} onBonesFound={onBonesFound} />
      <OrbitControls target={[0, 0.5, 0]} />
    </>
  );
}

function generateCode(posesByKf) {
  const fmt = (n) => {
    const r = rad(n);
    return (Math.abs(r) < 0.0001 ? 0 : r).toFixed(4);
  };
  const kfLines = KEYFRAMES.map((kf) => {
    const pose = posesByKf[kf.id];
    const boneLines = BONE_KEYS.map((k) => {
      const v = pose[k];
      if (v.x === 0 && v.y === 0 && v.z === 0) return null;
      return `        ${k}: [${fmt(v.x)}, ${fmt(v.y)}, ${fmt(v.z)}],`;
    }).filter(Boolean).join("\n");
    return `  {\n    id: "${kf.id}",\n    progress: ${kf.progress},\n    bones: {\n${boneLines || "      // (sin cambios respecto al rest pose)"}\n    },\n  },`;
  }).join("\n");

  return `/* =====================================================================
   Generado con Pose & Keyframe Code Generator.
   Pegar dentro de <script type="text/babel"> en index.html, junto a las
   otras constantes (por ejemplo, debajo de la definición de \`scenes\`).
   Reutiliza clamp(), lerp() y applyLocalDelta() que YA existen en tu
   index.html — no hace falta redefinirlos.
   ===================================================================== */

// Ángulos en RADIANES, como delta local sobre la pose de reposo (mismo
// criterio que applyLocalDelta). Cada entrada usa el mismo "progress"
// que ya usás en \`scenes\`.
const BONE_POSE_KEYFRAMES = [
${kfLines}
];

// Interpola linealmente entre los dos keyframes que rodean \`progress\`
// (idéntica lógica a blendScenes, pero por hueso).
function sampleBonePose(progress) {
  const list = BONE_POSE_KEYFRAMES;
  const p = clamp(progress, 0, 1);
  const pick = (kf) => kf.bones;
  if (p <= list[0].progress) return pick(list[0]);
  const last = list[list.length - 1];
  if (p >= last.progress) return pick(last);
  let i = 0;
  while (i < list.length - 1 && list[i + 1].progress < p) i++;
  const a = list[i], b = list[i + 1];
  const span = b.progress - a.progress || 1;
  const t = clamp((p - a.progress) / span);
  const out = {};
  const keys = new Set([...Object.keys(a.bones), ...Object.keys(b.bones)]);
  keys.forEach((k) => {
    const va = a.bones[k] || [0, 0, 0];
    const vb = b.bones[k] || [0, 0, 0];
    out[k] = [lerp(va[0], vb[0], t), lerp(va[1], vb[1], t), lerp(va[2], vb[2], t)];
  });
  return out;
}

/* ---------------------------------------------------------------------
   Dentro de AnimatedCharacter -> useFrame, REEMPLAZAR el bloque que va
   desde "if (bones.spine1) ..." hasta los "if (bones.rFoot) ..." por:
   --------------------------------------------------------------------- */
const _pose = sampleBonePose(progress);
Object.entries(_pose).forEach(([key, [ex, ey, ez]]) => {
  const bone = bones[key];
  const r = rest[key];
  if (!bone || !r) return;
  applyLocalDelta(bone, r, ex, ey, ez);
});
// Si querés conservar el idle/lag procedural que ya tenías, sumalo como
// término extra a ex/ey/ez antes de llamar a applyLocalDelta, en vez de
// borrarlo — por ejemplo:
//   applyLocalDelta(bones.lForearm, rest.lForearm, _pose.lForearm[0] + idle(1.6, 0.6, 0.3), _pose.lForearm[1], _pose.lForearm[2]);
`;
}

function App() {
  const [posesByKf, setPosesByKf] = useState(() =>
    Object.fromEntries(KEYFRAMES.map((kf) => [kf.id, zeroPose()]))
  );
  const [activeKf, setActiveKf] = useState(KEYFRAMES[0].id);
  const [mode, setMode] = useState("edit"); // "edit" | "preview"
  const [scrub, setScrub] = useState(0);
  const [foundMap, setFoundMap] = useState({});
  const [copied, setCopied] = useState(false);

  const setAxis = (boneKey, axis, value) => {
    setPosesByKf((prev) => ({
      ...prev,
      [activeKf]: { ...prev[activeKf], [boneKey]: { ...prev[activeKf][boneKey], [axis]: value } },
    }));
  };
  const resetBone = (boneKey) => {
    setPosesByKf((prev) => ({ ...prev, [activeKf]: { ...prev[activeKf], [boneKey]: { x: 0, y: 0, z: 0 } } }));
  };
  const resetKeyframe = () => {
    setPosesByKf((prev) => ({ ...prev, [activeKf]: zeroPose() }));
  };
  const copyFromPrevKeyframe = () => {
    const idx = KEYFRAMES.findIndex((k) => k.id === activeKf);
    if (idx <= 0) return;
    const prevId = KEYFRAMES[idx - 1].id;
    setPosesByKf((prev) => ({ ...prev, [activeKf]: JSON.parse(JSON.stringify(prev[prevId])) }));
  };

  const currentPose = mode === "edit" ? posesByKf[activeKf] : samplePose(posesByKf, scrub);
  const code = useMemo(() => generateCode(posesByKf), [posesByKf]);

  const copyCode = async () => {
    try {
      await navigator.clipboard.writeText(code);
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    } catch (e) {
      // Fallback: seleccionar el textarea manualmente si el clipboard falla
    }
  };

  return (
    <>
      <div className="viewport">
        <div className="top-controls">Arrastrá para orbitar • Scroll para zoom</div>
        <Canvas camera={{ position: [0, 0.3, 3.5], fov: 35 }}>
          <Scene pose={currentPose} onBonesFound={setFoundMap} />
        </Canvas>
      </div>
      <div className="panel">
        <div>
          <h1>Pose &amp; Keyframe Generator</h1>
          <p className="hint">
            Posá el personaje en cada etapa del scroll y generá el código listo para pegar en tu
            AnimatedCharacter. Los nombres de hueso y los breakpoints de progress son los mismos que
            ya usás en index.html.
          </p>
        </div>

        <div className="kf-tabs">
          {KEYFRAMES.map((kf) => (
            <div
              key={kf.id}
              className={`kf-tab ${activeKf === kf.id ? "active" : ""}`}
              onClick={() => { setActiveKf(kf.id); setMode("edit"); }}
            >
              {kf.label}
              <span className="p">progress {kf.progress}</span>
            </div>
          ))}
        </div>

        <div className="mode-row">
          <button className={`mode-btn ${mode === "edit" ? "active" : ""}`} onClick={() => setMode("edit")}>
            Editar pose
          </button>
          <button className={`mode-btn ${mode === "preview" ? "active" : ""}`} onClick={() => setMode("preview")}>
            Previsualizar secuencia
          </button>
        </div>

        {mode === "preview" && (
          <div className="scrub-row">
            <label style={{ fontSize: 11 }}>progress</label>
            <input type="range" min={0} max={1} step={0.001} value={scrub} onChange={(e) => setScrub(Number(e.target.value))} />
            <span className="val">{scrub.toFixed(2)}</span>
          </div>
        )}

        {mode === "edit" && (
          <>
            <div className="btn-row">
              <button className="btn" onClick={copyFromPrevKeyframe}>Copiar etapa anterior</button>
              <button className="btn" onClick={resetKeyframe}>Reset esta etapa</button>
            </div>

            <div className="section-title">Huesos ({BONE_KEYS.length})</div>
            {BONE_DEFS.map(([key, boneName]) => {
              const found = foundMap[key];
              const v = posesByKf[activeKf][key];
              return (
                <div className="bone-block" key={key} style={{ opacity: found === false ? 0.4 : 1 }}>
                  <div className="bone-name">
                    {boneName} {found === false ? "· FALTA" : ""}
                  </div>
                  {["x", "y", "z"].map((axis) => (
                    <div className="axis-row" key={axis}>
                      <label>{axis.toUpperCase()}</label>
                      <input
                        type="range" min={-180} max={180}
                        value={v[axis]}
                        onChange={(e) => setAxis(key, axis, Number(e.target.value))}
                      />
                      <span className="val">{v[axis]}°</span>
                    </div>
                  ))}
                  <button className="btn" style={{ fontSize: 10, padding: "2px 6px" }} onClick={() => resetBone(key)}>reset</button>
                </div>
              );
            })}
          </>
        )}

        <div className="section-title">Código generado</div>
        <textarea className="code" readOnly value={code} onFocus={(e) => e.target.select()} />
        <div className="btn-row">
          <button className="btn primary" onClick={copyCode}>Copiar código</button>
          {copied && <span className="copied">¡Copiado!</span>}
        </div>
      </div>
    </>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
