  html, body {

  @media (min-width: 769px) and (pointer: fine) {

    position: fixed;

    display: inline-block;

    right: 3vw;

<script>
  /* Scroll con inercia (Lenis). No requiere tocar el resto del código:
     Lenis intercepta la rueda/touch y anima window.scrollTo() de forma
     suave, disparando eventos "scroll" nativos igual que siempre — así
     que useScrollProgress() sigue funcionando sin cambios, solo que
     ahora el movimiento llega amortiguado en vez de "a saltos". */
  (function () {
    if (typeof Lenis === "undefined") return;
    const lenis = new Lenis({
      duration: 1.2,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      smoothWheel: true,
      smoothTouch: false, // en mobile el scroll táctil nativo se siente mejor
    });
    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);
    window.__lenis = lenis; // por si algún otro script necesita pausarlo/reanudarlo
  })();
</script>

    camera: {
      position: lerpVec3(a.camera.position, b.camera.position, t),
      lookAt: lerpVec3(a.camera.lookAt, b.camera.lookAt, t),
      fov: lerp(a.camera.fov, b.camera.fov, t),
      roll: lerp(a.camera.roll || 0, b.camera.roll || 0, t),
    },
    light: {
      color: lerpColor(a.light.color, b.light.color, t),
      intensity: lerp(a.light.intensity, b.light.intensity, t),
      azimuth: lerpAngle(a.light.azimuth ?? 45, b.light.azimuth ?? 45, t),
      elevation: lerp(a.light.elevation ?? 35, b.light.elevation ?? 35, t),
      rimColor: lerpColor(a.light.rimColor, b.light.rimColor, t),
      rimIntensity: lerp(a.light.rimIntensity, b.light.rimIntensity, t),
      ambient: lerp(a.light.ambient ?? 0.28, b.light.ambient ?? 0.28, t),
    },
    fog: {
      enabled: t < 0.5 ? (a.fog.enabled ?? true) : (b.fog.enabled ?? true),
      color: lerpColor(a.fog.color, b.fog.color, t),
      far: lerp(a.fog.far, b.fog.far, t),
    },
    background: {
      from: lerpColor(a.background.from, b.background.from, t),
      to: lerpColor(a.background.to, b.background.to, t),
      angle: lerp(a.background.angle ?? 180, b.background.angle ?? 180, t),
      alpha: lerp(a.background.alpha ?? 1, b.background.alpha ?? 1, t),
    },
  };
}

const useScrollStore = create((set) => ({
  progress: 0,
  smoothProgress: 0,
  setProgress: (p) => set({ progress: p }),
  setSmoothProgress: (p) => set({ smoothProgress: p }),
}));

function useScrollProgress(spacerRef) {
  useEffect(() => {
    // Alto "grande" del viewport (100lvh): no cambia cuando el navegador del celular esconde su barra al primer scroll.
    const probe = document.createElement("div");
    probe.style.cssText = "position:fixed;left:0;top:0;width:0;height:100vh;height:100lvh;visibility:hidden;pointer-events:none";
    document.body.appendChild(probe);
    const stableVh = () => probe.offsetHeight || window.innerHeight;
    const compute = () => {
      const el = spacerRef.current;
      if (!el) return;
      const total = el.offsetHeight - stableVh();
      const raw = total > 0 ? window.scrollY / total : 0;
      const p = clamp(raw, 0, 1);
      useScrollStore.getState().setProgress(p);
      document.body.classList.toggle("app-root--scrolled", window.scrollY > 20);
    };
    compute();
    window.addEventListener("scroll", compute, { passive: true });
    window.addEventListener("resize", compute);
    return () => {
      window.removeEventListener("scroll", compute);
      window.removeEventListener("resize", compute);
      probe.remove();
    };
  }, [spacerRef]);
}

function useArrowKeyScroll(step = 140) {
  useEffect(() => {
    const onKeyDown = (e) => {
      if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
      const tag = document.activeElement?.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || document.activeElement?.isContentEditable) return;
      e.preventDefault();
      window.scrollBy({ top: e.key === "ArrowDown" ? step : -step, behavior: "smooth" });
    };
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, [step]);
}

function ScrollSmoother() {
  useFrame((_, delta) => {
    const { progress, smoothProgress, setSmoothProgress } = useScrollStore.getState();
    setSmoothProgress(damp(smoothProgress, progress, 4, delta));
  });
  return null;
}

function useMouseParallax() {
  const mouse = useRef({ x: 0, y: 0 });
  useEffect(() => {
    const onMove = (e) => {
      if (e.pointerType !== "mouse") return;
      mouse.current.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.current.y = (e.clientY / window.innerHeight) * 2 - 1;
    };
    window.addEventListener("pointermove", onMove, { passive: true });
    return () => window.removeEventListener("pointermove", onMove);
  }, []);
  return mouse;
}

function CameraRig({ mouse, parallaxStrength = 0.18 }) {
  const { camera } = useThree();
  const lookAtTarget = useRef(new THREE.Vector3());
  const currentLookAt = useRef(new THREE.Vector3());
  const dampedRoll = useRef(0);

  useFrame((_, delta) => {
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    const [px, py, pz] = state.camera.position;
    const [lx, ly, lz] = state.camera.lookAt;
    const mx = mouse.current?.x ?? 0;
    const my = mouse.current?.y ?? 0;

    camera.position.x = damp(camera.position.x, px + mx * parallaxStrength, 6, delta);
    camera.position.y = damp(camera.position.y, py - my * parallaxStrength * 0.6, 6, delta);
    camera.position.z = damp(camera.position.z, pz, 6, delta);

    lookAtTarget.current.set(lx + mx * 0.05, ly - my * 0.05, lz);
    currentLookAt.current.lerp(lookAtTarget.current, 1 - Math.exp(-6 * delta));
    camera.up.set(0, 1, 0);
    camera.lookAt(currentLookAt.current);

    dampedRoll.current = damp(dampedRoll.current, state.camera.roll || 0, 6, delta);
    if (dampedRoll.current) camera.rotateZ((dampedRoll.current * Math.PI) / 180);

    if ("fov" in camera) {
      camera.fov = damp(camera.fov, state.camera.fov, 5, delta);
      camera.updateProjectionMatrix();
    }
  });

  return null;
}

/* ============================================================
   Estela de brillo (sparkle trail) — usada por el personaje
   (bowl1.glb) para dejar un rastro de partículas brillantes a su
   paso, que se van desvaneciendo. Es un sistema de partículas
   simple con THREE.Points + shader propio (glow radial aditivo),
   sin dependencias extra.
   ============================================================ */
const TRAIL_VERTEX_SHADER = `
  attribute float aSize;
  attribute float aOpacity;
  varying float vOpacity;
  void main() {
    vOpacity = aOpacity;
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = aSize * (300.0 / max(-mvPosition.z, 0.001));
    gl_Position = projectionMatrix * mvPosition;
  }
`;
const TRAIL_FRAGMENT_SHADER = `
  uniform vec3 uColor;
  varying float vOpacity;
  void main() {
    vec2 uv = gl_PointCoord.xy - 0.5;
    float d = length(uv) * 2.0;
    float glow = smoothstep(1.0, 0.0, d);
    float core = smoothstep(0.35, 0.0, d);
    float alpha = (glow * glow * 0.6 + core * 0.9) * vOpacity;
    vec3 col = mix(uColor, vec3(1.0), core * 0.6);
    gl_FragColor = vec4(col, alpha);
  }
`;

function SparkleTrail({ anchorRef, enabled, color, size, life, rate }) {
  const pointsRef = useRef(null);
  const materialRef = useRef(null);
  const particles = useRef([]);
  const maxParticles = useMemo(() => Math.max(8, Math.ceil(rate * life) + 8), [rate, life]);
  const positions = useMemo(() => new Float32Array(maxParticles * 3), [maxParticles]);
  const sizes = useMemo(() => new Float32Array(maxParticles), [maxParticles]);
  const opacities = useMemo(() => new Float32Array(maxParticles), [maxParticles]);
  const emitAccum = useRef(0);
  const prevAnchor = useRef(null);
  const prevProgress = useRef(null);

  useEffect(() => {
    if (materialRef.current) materialRef.current.uniforms.uColor.value.set(color);
  }, [color]);

  useFrame((_, delta) => {
    const group = pointsRef.current;
    const anchor = anchorRef && anchorRef.current;
    if (!group) return;

    if (!enabled || !anchor) {
      group.visible = false;
      particles.current.length = 0;
      prevAnchor.current = null;
      prevProgress.current = null;
      return;
    }
    group.visible = true;

    const ax = anchor.position.x, ay = anchor.position.y, az = anchor.position.z;

    // Solo emite si el scroll realmente se movió este frame — filtra el
    // "respirar" idle del personaje, que no cuenta como movimiento real.
    const progress = useScrollStore.getState().smoothProgress;
    const SCROLL_EPS = 0.00025;
    const isScrolling = prevProgress.current !== null && Math.abs(progress - prevProgress.current) > SCROLL_EPS;
    prevProgress.current = progress;

    if (isScrolling && prevAnchor.current) {
      emitAccum.current += delta;
      const emitEvery = 1 / Math.max(rate, 1);
      const from = prevAnchor.current;
      while (emitAccum.current >= emitEvery) {
        emitAccum.current -= emitEvery;
        const t = 1 - emitAccum.current / delta;
        const px = lerp(from.x, ax, isFinite(t) ? t : 1);
        const py = lerp(from.y, ay, isFinite(t) ? t : 1);
        const pz = lerp(from.z, az, isFinite(t) ? t : 1);
        particles.current.push({
          x: px, y: py, z: pz,
          age: 0,
          seed: Math.random() * Math.PI * 2,
          ox: (Math.random() - 0.5) * size * 6,
          oy: (Math.random() - 0.5) * size * 6,
          oz: (Math.random() - 0.5) * size * 6,
          sizeMul: 0.5 + Math.random() * 0.9,
        });
        if (particles.current.length > maxParticles) particles.current.shift();
      }
    } else {
      // Sin scroll: no acumules emisión pendiente, así no larga una
      // ráfaga de golpe apenas el usuario vuelve a mover la rueda.
      emitAccum.current = 0;
    }
    prevAnchor.current = { x: ax, y: ay, z: az };

    for (let i = particles.current.length - 1; i >= 0; i--) {
      particles.current[i].age += delta;
      if (particles.current[i].age >= life) particles.current.splice(i, 1);
    }

    const n = Math.min(particles.current.length, maxParticles);
    const now = performance.now() * 0.001;
    for (let i = 0; i < n; i++) {
      const p = particles.current[i];
      const t = clamp(p.age / life);
      const drift = t;
      positions[i * 3] = p.x + p.ox * drift;
      positions[i * 3 + 1] = p.y + p.oy * drift + t * size * 4;
      positions[i * 3 + 2] = p.z + p.oz * drift;
      const twinkle = 0.5 + 0.5 * Math.sin(now * 9 + p.seed * 7);
      opacities[i] = (1 - t) * (1 - t) * (0.35 + 0.65 * twinkle);
      sizes[i] = size * p.sizeMul * (1 - t * 0.35);
    }

    const geom = group.geometry;
    geom.attributes.position.needsUpdate = true;
    geom.attributes.aOpacity.needsUpdate = true;
    geom.attributes.aSize.needsUpdate = true;
    geom.setDrawRange(0, n);
  });

  return (
    <points key={maxParticles} ref={pointsRef} frustumCulled={false} userData={{ excludeFromReflection: true }}>
      <bufferGeometry>
        <bufferAttribute attach="attributes-position" count={maxParticles} array={positions} itemSize={3} />
        <bufferAttribute attach="attributes-aSize" count={maxParticles} array={sizes} itemSize={1} />
        <bufferAttribute attach="attributes-aOpacity" count={maxParticles} array={opacities} itemSize={1} />
      </bufferGeometry>
      <shaderMaterial
        ref={materialRef}
        vertexShader={TRAIL_VERTEX_SHADER}
        fragmentShader={TRAIL_FRAGMENT_SHADER}
        uniforms={{ uColor: { value: new THREE.Color(color) } }}
        transparent
        depthWrite={false}
        blending={THREE.AdditiveBlending}
      />
    </points>
  );
}

  /* Cámara de reflejo (cube camera): ubicada en el Modelo principal, cada
   ciertos frames fotografía los 360° a su alrededor (paredes, objetos,
   el PNG del perro, etc. — todo lo que haya en la escena, salvo el
   propio modelo, que se oculta un instante durante la captura) y usa
   esa foto como reflejo en los materiales metálicos del modelo. La
   cámara principal (la que ve el usuario) no necesita apuntar a lo que
   se refleja — el reflejo se calcula aparte, en 360°, todo el tiempo. */
function ReflectionProbe({ anchorRef, enabled, resolution, updateEvery, intensity }) {
  const { gl, scene } = useThree();
  const rtRef = useRef(null);
  const camRef = useRef(null);
  const frameRef = useRef(0);
  const appliedRef = useRef(new Set());
  const posRef = useRef(new THREE.Vector3());

  useEffect(() => {
    const rt = new THREE.WebGLCubeRenderTarget(resolution, {
      generateMipmaps: true,
      minFilter: THREE.LinearMipmapLinearFilter,
    });
    rtRef.current = rt;
    camRef.current = new THREE.CubeCamera(0.05, 1000, rt);
    appliedRef.current = new Set();
    return () => rt.dispose();
  }, [resolution]);

  useFrame(() => {
    if (!enabled || !anchorRef.current || !camRef.current) return;
    frameRef.current++;
    if (frameRef.current % Math.max(1, updateEvery) !== 0) return;

    const anchor = anchorRef.current;
    anchor.getWorldPosition(posRef.current);
    camRef.current.position.copy(posRef.current);

    // Oculta el modelo (para que no se refleje a sí mismo) y también todo lo
    // marcado como "no reflejar" (rayo de luz, estela de chispas) — si no,
    // esos brillos quedan pegados adentro del reflejo aunque estén apagados
    // en pantalla, porque el reflejo los captura igual un instante antes.
    const hidden = [];
    scene.traverse((obj) => {
      if (obj.userData && obj.userData.excludeFromReflection && obj.visible) {
        hidden.push(obj);
        obj.visible = false;
      }
    });
    const wasVisible = anchor.visible;
    anchor.visible = false;
    camRef.current.update(gl, scene);
    anchor.visible = wasVisible;
    hidden.forEach((obj) => { obj.visible = true; });

    const texture = rtRef.current.texture;
    anchor.traverse((child) => {
      if (!child.isMesh || !child.material) return;
      const mats = Array.isArray(child.material) ? child.material : [child.material];
      mats.forEach((m) => {
        if (!("envMap" in m)) return;
        if (!appliedRef.current.has(m.uuid)) {
          m.envMap = texture;
          m.needsUpdate = true;
          appliedRef.current.add(m.uuid);
        }
        if ("envMapIntensity" in m) m.envMapIntensity = intensity;
      });
    });
  });

  return null;
}

/* Textura de degradado para el rayo de luz: brillante en el centro,
   transparente en los bordes y en las puntas (arriba/abajo) — se genera
   una sola vez con canvas, no hace falta subir ningún asset. */
let _beamTextureCache = null;
function getBeamTexture() {
  if (_beamTextureCache) return _beamTextureCache;
  const size = 128;
  const canvas = document.createElement("canvas");
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext("2d");
  const grad = ctx.createLinearGradient(0, 0, size, 0);
  grad.addColorStop(0, "rgba(255,255,255,0)");
  grad.addColorStop(0.5, "rgba(255,255,255,1)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  const vgrad = ctx.createLinearGradient(0, 0, 0, size);
  vgrad.addColorStop(0, "rgba(0,0,0,1)");
  vgrad.addColorStop(0.12, "rgba(0,0,0,0)");
  vgrad.addColorStop(0.82, "rgba(0,0,0,0)");
  vgrad.addColorStop(1, "rgba(0,0,0,1)");
  ctx.globalCompositeOperation = "destination-out";
  ctx.fillStyle = vgrad;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(canvas);
  _beamTextureCache = tex;
  return tex;
}

/* Rayo de luz volumétrico (fake): 3 planos cruzados con degradado
   aditivo, apuntando siempre hacia la dirección/color de la luz de la
   etapa actual (se actualiza solo — nunca hay que tocar un color a
   mano acá). No es raymarching real, pero con blending aditivo encima
   de la niebla se lee como un haz de luz que baja, sin pesar nada.
   Por ahora apunta al origen de la escena (0,0,0) — si tu objeto
   principal no está ahí, movelo o avisame para agregar un offset. */
function LightBeam({ enabled, opacity, width, height }) {
  const groupRef = useRef(null);
  const matRefs = useRef([]);
  const texture = useMemo(() => getBeamTexture(), []);

  useFrame(() => {
    if (!enabled || !groupRef.current) return;
    const progress = useScrollStore.getState().smoothProgress;
    const state = blendScenes(scenes, progress);
    const dir = lightDirFromAngles(state.light.azimuth, state.light.elevation, 1);
    const dirVec = new THREE.Vector3(dir[0], dir[1], dir[2]).normalize();
    groupRef.current.position.set(dirVec.x * height * 0.5, dirVec.y * height * 0.5, dirVec.z * height * 0.5);
    groupRef.current.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirVec);
    matRefs.current.forEach((m) => {
      if (!m) return;
      m.color.set(state.light.color);
      m.opacity = opacity;
    });
  });

  if (!enabled) return null;

  return (
    <group ref={groupRef} userData={{ excludeFromReflection: true }}>
      {[0, 60, 120].map((deg, i) => (
        <mesh key={deg} rotation={[0, (deg * Math.PI) / 180, 0]}>
          <planeGeometry args={[width, height]} />
          <meshBasicMaterial
            ref={(m) => { matRefs.current[i] = m; }}
            map={texture}
            transparent
            opacity={opacity}
            color="#ffffff"
            blending={THREE.AdditiveBlending}
            depthWrite={false}
            side={THREE.DoubleSide}
            toneMapped={false}
          />
        </mesh>
      ))}
    </group>
  );
}

const CHAR_CENTER_Y = 0;

const _deltaEuler = new THREE.Euler();
const _deltaQuat = new THREE.Quaternion();
function applyLocalDelta(bone, restQuat, ex, ey, ez) {
  _deltaEuler.set(ex, ey, ez, "XYZ");

  bone.quaternion.copy(restQuat).multiply(_deltaQuat);

function AnimatedCharacter({ mouse, anchorRef }) {
  const outerRef = anchorRef;

  const bonesRef = useRef({});
  const restRef = useRef({});
  const clockRef = useRef(0);

  const chainRef = useRef({
    pelvis: 0, spine: 0, chest: 0, shoulder: 0, head: 0,
    thigh: 0, calf: 0, foot: 0,
  });

  useEffect(() => {
    const names = {
      spine1: "Spine01", spine2: "Spine02", head: "Head", neck: "NeckTwist01",
      lClavicle: "L_Clavicle", rClavicle: "R_Clavicle",
      lForearm: "L_Forearm", rForearm: "R_Forearm",
      lHand: "L_Hand", rHand: "R_Hand",
      lThigh: "L_Thigh", rThigh: "R_Thigh",
      lCalf: "L_Calf", rCalf: "R_Calf",
      lFoot: "L_Foot", rFoot: "R_Foot",
    };
    const bones = {};
    const rest = {};
    Object.entries(names).forEach(([key, boneName]) => {
      const bone = scene.getObjectByName(boneName);
      if (bone) {
        bones[key] = bone;
        rest[key] = bone.quaternion.clone();
      }

    restRef.current = rest;

  useEffect(() => {
    scene.traverse((child) => {
      if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
    });

  useFrame((_, delta) => {
    clockRef.current += delta;
    const t = clockRef.current;
    const progress = useScrollStore.getState().smoothProgress;
    const bones = bonesRef.current;
    const rest = restRef.current;
    const outer = outerRef.current;
    const pivot = pivotRef.current;
    if (!outer || !pivot) return;

    /*@GEN:MOVEMENT_START*/
    const m = sampleMovement(progress);
    const idleFloat = 0; // desactivado: hacía que CUALQUIER modelo (bowl incluido) flotara solo,
    // y esto NO pasaba en el editor (ahí no existía este bamboleo) — por eso se veía
    // distinto entre el editor y el sitio final descargado.
    outer.position.x = damp(outer.position.x, m.pos[0], 3, delta);
    outer.position.y = damp(outer.position.y, m.pos[1] + idleFloat, 5, delta);
    outer.position.z = damp(outer.position.z, m.pos[2], 2.0, delta);

    pivot.rotation.y = damp(pivot.rotation.y, (m.yaw * Math.PI) / 180, 4.5, delta);
    pivot.rotation.x = damp(pivot.rotation.x, (m.pitch * Math.PI) / 180, 4.5, delta);

    chain.chest = damp(chain.chest, chain.spine, 5.5, delta);
    chain.shoulder = damp(chain.shoulder, chain.chest, 4.2, delta);
    chain.head = damp(chain.head, chain.shoulder, 3.2, delta);

    chain.thigh = damp(chain.thigh, chain.pelvis, 6, delta);
    chain.calf = damp(chain.calf, chain.thigh, 5, delta);
    chain.foot = damp(chain.foot, chain.calf, 4, delta);

    const idleAmp = 1;
    const floatArm = 0.26 * idleAmp;
    const floatLeg = 0.18 * idleAmp;
    const legWave = Math.sin(t * 0.6 + 0.3) * floatLeg;
    const calfWave = Math.sin(t * 0.7 + 1.0) * floatLeg * 0.7;
    const footWave = Math.sin(t * 0.8 + 0.2) * floatLeg * 0.5;
    const limbFloat = {
      lForearm: [0, 0, Math.sin(t * 0.9 + 0.0) * floatArm],
      rForearm: [0, 0, Math.sin(t * 0.85 + 1.4) * floatArm],
      lHand: [Math.sin(t * 1.1 + 0.6) * floatArm * 0.6, 0, 0],
      rHand: [Math.sin(t * 1.05 + 2.1) * floatArm * 0.6, 0, 0],
      lThigh: [legWave, 0, 0],
      rThigh: [legWave, 0, 0],
      lCalf: [calfWave, 0, 0],
      rCalf: [calfWave, 0, 0],
      lFoot: [0, 0, footWave],
      rFoot: [0, 0, footWave],

    Object.entries(_pose).forEach(([key, [ex, ey, ez]]) => {
      const bone = bones[key];

      if (!bone || !r) return;
      const f = limbFloat[key];
      const fx = f ? ex + f[0] : ex;
      const fy = f ? ey + f[1] : ey;
      const fz = f ? ez + f[2] : ez;

    <group ref={outerRef} position={[0, 0, 0]}>

/* ============================================================
   Objetos de entorno. Cada uno puede ser un modelo 3D estático (.glb,
   sin huesos ni animación propia), una imagen/SVG plana o un video .mp4 (con opción
   de "billboard" para que siempre mire a cámara). Cada objeto anima
   su propia posición/escala/rotación por etapa (keyframes), leídas
   del mismo "progress" de scroll que usa el personaje — por eso el
   transform se aplica de forma imperativa (ref + useFrame) en vez de

/* ============================================================
   FADE POR TRANSPARENCIA CON BARRIDO (izq→der / der→izq).
   Cada pose de un objeto puede estar "invisible". Al pasar de una

function SceneText() {
  const refs = useRef([]);
  const charRefsByScene = useRef(scenes.map(() => []));

  useEffect(() => {
    const update = (progress) => {
      scenes.forEach((kf, i) => {
        const el = refs.current[i];
        if (!el || !kf.text) return;
        const weight = textWeight(kf, progress);
        el.style.opacity = String(weight > 0 ? 1 : 0); // el contenedor solo controla visibilidad/posición del bloque
        el.style.transform =
          kf.text.align === "center"
            ? `translateX(-50%) translateY(${(1 - weight) * 10}px)`
            : `translateY(${(1 - weight) * 10}px)`;
        el.style.pointerEvents = weight > 0.5 ? "auto" : "none";

        // Reveal en cascada por caracter (tipografía cinética)
        const chars = charRefsByScene.current[i];
        if (chars && chars.length) {
          const stagger = 0.6; // qué tan "esparcida" queda la cascada entre el primer y el último caracter
          const n = chars.length;
          chars.forEach((cel, j) => {
            if (!cel) return;
            const localW = clamp(weight * (1 + stagger) - (j / n) * stagger);
            cel.style.opacity = String(localW);
            cel.style.transform = `translateY(${(1 - localW) * 14}px)`;
            cel.style.filter = `blur(${(1 - localW) * 3}px)`;
          });
        }
      });
    };
    update(useScrollStore.getState().smoothProgress);
    const unsubscribe = useScrollStore.subscribe((s) => update(s.smoothProgress));
    return unsubscribe;
  }, []);

  return (
    <div className="scene-text-layer">
      {scenes.map((kf, i) =>
        kf.text ? (
          <div
            key={kf.id}
            ref={(el) => { refs.current[i] = el; }}
            className={`scene-text scene-text--${kf.text.align}`}
            style={{ opacity: 0 }}
          >
            {kf.text.eyebrow && <span className="scene-text__eyebrow">{kf.text.eyebrow}</span>}

            {kf.text.subtitle && <p className="scene-text__subtitle">{kf.text.subtitle}</p>}
          </div>
        ) : null
      )}

  );
}

    cancelAnimationFrame(raf);
    target.removeEventListener("pointermove", onPointer);
    target.removeEventListener("touchmove", onTouch);
  };

/* Monta el SVG en "host" y lo deja listo para dibujarse: sólo contornos, del color de las líneas.
   Devuelve { count, setDraw(p), setZoom(z, boost) } o null si el SVG no sirve. */
function ldrPrepare(host, svgText, lineColor, swPx) {

    try { const b = svg.getBBox(); if (b.width > 0 && b.height > 0) svg.setAttribute("viewBox", `${b.x} ${b.y} ${b.width} ${b.height}`); } catch (e) { /* sin viewBox */ }
  }
  const vb = (svg.getAttribute("viewBox") || "0 0 100 100").trim().split(/[\s,]+/).map(Number);
  host.style.setProperty("--ar", String((vb[2] || 100) / (vb[3] || 100)));
  const items = [];
  svg.querySelectorAll(LDR_DRAWABLE).forEach((el) => {

    try { const m = el.getScreenCTM(); if (m) k = Math.hypot(m.a, m.b) || 1; } catch (e) { /* k = 1 */ }
    items.push({ el, len, cy: r.top + r.height / 2, k });

    setDraw(p) {
      items.forEach((it, i) => {

        const f = ldrClamp((p - start) / LDR_SPAN);
        it.el.style.setProperty("stroke-dashoffset", String(it.len * (1 - ldrEase(f))), "important");

function LoaderOverlay({ cfg, simulate, contained, onDone, onClose }) {
  const prog = useProgress();
  const live = useRef({ progress: 0, active: false, total: 0 });
  live.current = { progress: prog.progress, active: prog.active, total: prog.total };
  const [gone, setGone] = useState(false);
  const rootRef = useRef(), bgRef = useRef(), zoomRef = useRef(), numRef = useRef();
  useEffect(() => {
    const pre = document.getElementById("pre-ldr");
    if (pre) pre.remove();
    const lock = (on) => { if (!contained) { document.documentElement.style.overflow = on ? "hidden" : ""; document.body.style.overflow = on ? "hidden" : ""; } };
    lock(true);
    ensureTextFont(cfg.font || "'Space Grotesk', sans-serif");
    const reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const ctl = zoomRef.current ? ldrPrepare(zoomRef.current, cfg.svg, cfg.lineColor || "#ffffff", cfg.lineWidth || 1.4) : null;
    if (ctl) { ctl.setDraw(0); ctl.setZoom(1, 1); }
    let raf = 0, fontsOk = !!simulate, okSince = 0, finishAt = 0, exitStart = 0, shown = 0;
    let last = performance.now();
    const t0 = last;
    if (!simulate) {
      const fams = [];
      if (typeof OBJECTS !== "undefined") OBJECTS.forEach((o) => { if (o.type === "text") { fams.push(o.fontFamily); Object.values(o.wordStyles || {}).forEach((w) => w.fontFamily && fams.push(w.fontFamily)); } });
      Promise.all(fams.filter(Boolean).map(ensureTextFont))
        .then(() => (document.fonts && document.fonts.ready) || null)
        .catch(() => {})
        .then(() => { fontsOk = true; });
    }
    const minMs = cfg.minMs || 1800;
    const ZOOM_MS = 1400;
    const tick = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      const el = now - t0, L = live.current;
      // progreso real de carga, pero sin avanzar más rápido que "duración mín." para que se llegue a ver la animación
      let target = simulate ? 100 : (L.total > 0 ? L.progress : Math.min(35, el / 80));
      target = Math.min(target, (el / minMs) * 100);
      const loaded = simulate ? el >= minMs : (L.total > 0 ? L.progress >= 100 && !L.active : el > 3500);
      if (loaded && fontsOk && target >= 99.9) { if (!okSince) okSince = now; } else okSince = 0;
      if (!finishAt && ((okSince && now - okSince > (simulate ? 0 : 350)) || el > 14000)) finishAt = now;
      if (finishAt) target = 100;
      shown += (target - shown) * (1 - Math.exp(-dt * (finishAt ? 14 : 5)));
      const disp = finishAt ? Math.round(shown) : Math.min(99, Math.floor(shown));
      if (numRef.current) numRef.current.textContent = String(disp).padStart(3, "0");
      if (ctl) ctl.setDraw(Math.min(1, shown / 100));
      if (finishAt && !exitStart && now - finishAt > 700) exitStart = now; // se queda un instante en 100 y recién ahí hace zoom
      if (exitStart) {
        const x = Math.min(1, (now - exitStart) / ZOOM_MS);
        const e = reduce ? 0 : Math.pow(x, 2.2);
        const z = Math.exp(Math.log(LDR_ZOOM_MAX) * e);
        if (zoomRef.current) { zoomRef.current.style.transform = `scale(${z})`; zoomRef.current.style.opacity = String(1 - ldrClamp((x - 0.72) / 0.28)); }
        if (ctl) ctl.setZoom(z, 1 + 1.5 * e);
        if (bgRef.current) bgRef.current.style.opacity = String(1 - ldrClamp((x - 0.3) / 0.5));
        if (numRef.current) numRef.current.style.opacity = String(1 - ldrClamp(x / 0.2));
        if (rootRef.current && x > 0.8) rootRef.current.style.pointerEvents = "none";
        if (x >= 1) { lock(false); setGone(true); if (onDone) onDone(); return; }
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => { cancelAnimationFrame(raf); lock(false); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);
  if (gone) return null;
  return (
    <div ref={rootRef} className={"ldr" + (contained ? " ldr--contained" : "")} onClick={onClose}
      style={{ "--ldr-bg": cfg.background || "#05070f", "--ldr-line": cfg.lineColor || "#ffffff", "--ldr-font": cfg.font || "'Space Grotesk', sans-serif" }}>
      <div ref={bgRef} className="ldr__bg" />
      <div className="ldr__stage"><div ref={zoomRef} className="ldr__zoom" /></div>
      {cfg.showNumber !== false && <div ref={numRef} className="ldr__num">000</div>}
    </div>
  );
}

/* ---- Zona fija de abajo (WhatsApp · Cómo llegar · Turnero) ----
   Los datos salen del bloque DOCK (se editan en la herramienta, pestaña Config). */
const DOCK_DOW = ["DOM", "LUN", "MAR", "MIÉ", "JUE", "VIE", "SÁB"];
const DOCK_DOW_LONG = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const dockMin = (hhmm) => { const p = String(hhmm).split(":").map(Number); return p[0] * 60 + (p[1] || 0); };
function dockNow() {
  let parts;
  const opts = { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false };
  try { parts = new Intl.DateTimeFormat("en-CA", { ...opts, timeZone: DOCK.timezone }).formatToParts(new Date()); }
  catch (e) { parts = new Intl.DateTimeFormat("en-CA", opts).formatToParts(new Date()); }
  const g = (t) => Number(parts.find((p) => p.type === t).value);
  return { y: g("year"), m: g("month"), d: g("day"), minutes: (g("hour") % 24) * 60 + g("minute") };
}
/* Un día puede tener 1 rango ["09:00","19:00"] (corrido) o varios [["09:00","13:00"],["16:00","20:00"]] (con corte). */
const dockRanges = (slot) => (!slot ? [] : Array.isArray(slot[0]) ? slot : [slot]);
function dockDays(n) {
  const now = dockNow();
  const out = [];
  for (let i = 0; i < n; i++) {
    const dt = new Date(Date.UTC(now.y, now.m - 1, now.d + i, 12));
    const dow = dt.getUTCDay();
    const rs = dockRanges(DOCK.schedule[dow]);
    let open = rs.length > 0;
    if (open && i === 0 && now.minutes >= dockMin(rs[rs.length - 1][1])) open = false; // hoy ya cerró
    out.push({ i, open, label: DOCK_DOW[dow], long: DOCK_DOW_LONG[dow], day: dt.getUTCDate(), month: dt.getUTCMonth() + 1 });
  }
  return out;
}
function dockStatus() {
  const now = dockNow();
  const dow = new Date(Date.UTC(now.y, now.m - 1, now.d, 12)).getUTCDay();
  const rs = dockRanges(DOCK.schedule[dow]);
  if (rs.some((r) => now.minutes >= dockMin(r[0]) && now.minutes < dockMin(r[1]))) return { open: true, text: "ABIERTO AHORA" };
  const next = rs.find((r) => now.minutes < dockMin(r[0])); // todavía no abrió, o está en el corte
  if (next) return { open: false, text: "ABRE HOY " + next[0] };
  for (let k = 1; k <= 7; k++) {
    const d = (dow + k) % 7;
    const r2 = dockRanges(DOCK.schedule[d]);
    if (r2.length) return { open: false, text: "ABRE " + (k === 1 ? "MAÑ." : DOCK_DOW[d]) + " " + r2[0][0] };
  }
  return { open: false, text: "CERRADO" };
}
function Dock() {
  const days = useMemo(() => dockDays(DOCK.turneroDays || 14), []);
  const [sel, setSel] = useState(null);
  const [status, setStatus] = useState(dockStatus);
  const stripRef = useRef(null);
  useEffect(() => {
    const t = setInterval(() => setStatus(dockStatus()), 60000);
    return () => clearInterval(t);
  }, []);
  const wa = (msg) => "https://wa.me/" + String(DOCK.whatsappPhone || "").replace(/\D/g, "") + "?text=" + encodeURIComponent(msg || "");
  const mapHref = DOCK.mapUrl || "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(DOCK.address || "");
  const chosen = sel != null ? days[sel] : null;
  const scrollDays = (dir) => { const el = stripRef.current; if (el) el.scrollBy({ left: dir * el.clientWidth * 0.85, behavior: "smooth" }); };
  const confirmMsg = chosen ? String(DOCK.turneroMessage || "").replace("{dia}", chosen.long + " " + chosen.day + "/" + chosen.month) : "";
  return (
    <div className="dock" style={DOCK.accent ? { "--dock-accent": DOCK.accent } : undefined}>
      <div className="dock__row">
        <a className="dock__btn" href={wa(DOCK.whatsappMessage)} target="_blank" rel="noopener">
          <span className="dock__ico"><svg viewBox="0 0 24 24"><path d="M3 21l1.6-4.7A8.5 8.5 0 1 1 8 19.6z" /><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8c-1-.4-2-1.4-2.4-2.4l.8-1-1-2z" /></svg></span>
          <span className="dock__txt"><b>WHATSAPP</b><small className={status.open ? "is-open" : ""}><i /><span>{status.text}</span></small></span>
        </a>
        <a className="dock__btn" href={mapHref} target="_blank" rel="noopener">
          <span className="dock__ico"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.800 12 21 12 21z" /><circle cx="12" cy="9.500" r="2.500" /></svg></span>
          <span className="dock__txt"><b>CÓMO LLEGAR</b><small>VER EN EL MAPA</small></span>
        </a>
      </div>
      <div>
        <div className="dock__turn-head">
          <svg viewBox="0 0 24 24"><rect x="3.500" y="5" width="17" height="15.500" rx="2.500" /><path d="M3.500 10h17M8 3v4M16 3v4" /></svg>
          <b>{DOCK.turneroTitle}</b>
          {chosen && <a className="dock__confirm" href={wa(confirmMsg)} target="_blank" rel="noopener">Pedir turno · {chosen.label} {chosen.day} ›</a>}
        </div>
        <div className="dock__days-wrap" style={{ marginTop: 6 }}>
          <button className="dock__arrow" aria-label="Días anteriores" onClick={() => scrollDays(-1)}>‹</button>
          <div className="dock__days" ref={stripRef}>
            {days.map((d) => (
              <button key={d.i} disabled={!d.open} className={"dock__day" + (!d.open ? " is-closed" : "") + (sel === d.i ? " is-sel" : "")} onClick={() => setSel(sel === d.i ? null : d.i)}>
                <span>{d.label}</span><b>{d.day}</b>{!d.open && <em>cerrado</em>}
              </button>
            ))}
          </div>
          <button className="dock__arrow" aria-label="Días siguientes" onClick={() => scrollDays(1)}>›</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const spacerRef = useRef(null);
  const stageRef = useRef(null);
  useScrollProgress(spacerRef);
  useArrowKeyScroll();
  const device = useMemo(() => getDeviceProfile(), []);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    if (!LOADER.enabled) { const p = document.getElementById("pre-ldr"); if (p) p.remove(); }
    const t = setTimeout(() => setReady(true), 60);
    return () => clearTimeout(t);
  }, []);

  return (
    <div
      className={"app-root" + (DOCK.enabled ? " app-root--phone" : "")}
      style={{
        "--shade-pct": 100 - (DOCK.splitPct || 67),
        "--shade-opacity": DOCK.shadeStrength ?? 0.7,
        "--brand-accent": clientConfig.colors.accent,
        "--brand-accent-2": clientConfig.colors.accentSecondary,
        "--color-bg": clientConfig.colors.background,
        "--color-text": clientConfig.colors.textPrimary,
        "--color-text-muted": clientConfig.colors.textMuted,
        "--font-display": clientConfig.fonts.display,
        "--font-body": clientConfig.fonts.body,
      }}
    >
      {LOADER.enabled && <LoaderOverlay cfg={LOADER} />}
      <div ref={stageRef} className={`canvas-stage ${ready ? "canvas-stage--ready" : ""}`}>
        <div className="scene-canvas">
          <Canvas
            dpr={device.dpr}
            shadows="soft"
            gl={{ antialias: true, alpha: true, powerPreference: "high-performance" }}
            camera={{ position: [0, 0.2, 6.5], fov: 35, near: 0.1, far: 60 }}
          >
            <Experience device={device} />
          </Canvas>
        </div>
        <BackgroundGradient stageRef={stageRef} />
        {VIGNETTE_ENABLED && (
          <div
            aria-hidden="true"
            style={{
              position: "absolute",
              inset: 0,
              zIndex: 3,
              pointerEvents: "none",
              background: `radial-gradient(ellipse farthest-corner at center, transparent ${(1 - VIGNETTE_OFFSET) * 100}%, rgba(0,0,0,${VIGNETTE_DARKNESS}) 100%)`,
            }}
          />
        )}
        {CURSOR.enabled && <CursorTrail />}
        <SceneText />
        <ProgressIndicator />
        <div className="scroll-hint" aria-hidden="true">
          <span>Scroll</span>
          <div className="scroll-hint__line" />
        </div>
      </div>
      <div ref={spacerRef} className="scroll-spacer" style={{ height: `${SCROLL_LENGTH_VH}vh` }} />
      {DOCK.enabled && <><div className="dock-shade" aria-hidden="true" /><Dock /></>}
    </div>
  );
}

createRoot(document.getElementById("root")).render(<App />);

</script>
