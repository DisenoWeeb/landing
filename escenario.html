      </Html>
    </group>
  ));
}


/* ---- App ---- */
function App() {
  const [section, setSection] = useState("pose"); // pose | camera | movement | timing | objects | preview

  const [modelUrl, setModelUrl] = useState(DEFAULT_MODEL_URL);
  /* Escala y centrado vertical del personaje principal. Antes estaban
     hardcodeados (scale={1.7}, position={[0,-0.9,0]}) en el visor del
     editor, y sin ningún marcador @GEN en la plantilla final — por
     eso cambiar CHAR_SCALE a mano en el index.html descargado no
     tenía efecto acá, y se perdía si volvías a descargar. Ahora viven
     en el mismo lugar que el resto de los controles (Pose/Cámara/
     Movimiento/Objetos): se ven en vivo en el visor y se graban en el
     index.html final. Los valores por defecto (0.4 / 0.05) están
     calibrados para bowl1.glb (que sin escalar mide ~4.83 de ancho x
     2.44 de alto x 3.95 de profundidad); si cambiás de modelo, tocá
     el slider hasta que se vea bien — no hace falta calcular nada. */
  const [charScale, setCharScale] = useState(1);
  const [charCenterY, setCharCenterY] = useState(0);
  /* Efectos de post-proceso del sitio exportado (viñeta/brillo). Son
     globales, no por etapa — y el visor de este editor NO los aplica
     (no tiene ese pipeline montado), así que lo que ves acá es sin
     viñeta/brillo siempre; el resultado final los aplica si los
     activás. La viñeta viene apagada por defecto porque puede tapar
     bordes de composiciones que dependen de fundirse con el fondo. */
  const [postFx, setPostFx] = useState({
    vignetteEnabled: false,
    vignetteDarkness: 0.5,
    vignetteOffset: 0.15,
    bloomEnabled: false,
    bloomIntensity: 0.5,
    beamEnabled: false,
    beamOpacity: 0.5,
    beamWidth: 2.5,
    beamHeight: 14,
  });
  const setPostFxField = (field, value) => setPostFx((prev) => ({ ...prev, [field]: value }));
  /* Estela de brillo (sparkle trail) que deja el personaje (bowl1.glb) a
     su paso, y se va desvaneciendo. A diferencia de postFx, esta SÍ se
     ve en vivo en el visor de este editor (misma implementación que
     la plantilla final), para poder ajustarla con feedback inmediato
     antes de descargar. Color dorado por defecto, a tono con el
     brillo de referencia tipo abeja/polen. */
  const [trail, setTrail] = useState({
    enabled: false,
    color: "#ffd873",
    size: 0.05,
    life: 0.9,
    rate: 40,
  });
  const setTrailField = (field, value) => setTrail((prev) => ({ ...prev, [field]: value }));
    /* Reflejo de ambiente en tiempo real sobre el Modelo principal (metal).
     resolution = nitidez del reflejo (más alto = más pesado). updateEvery
     = cada cuántos frames se recalcula (1 = todos los frames, más preciso
     pero más pesado; 3-5 rinde mejor, sobre todo en celular). */
  const [reflection, setReflection] = useState({
    enabled: false,
    resolution: 256,
    updateEvery: 2,
    intensity: 1,
  });
  const setReflectionField = (field, value) => setReflection((prev) => ({ ...prev, [field]: value }));
  const charAnchorRef = useRef(null);
  const [stages, setStages] = useState(makeDefaultStages);
  const [durationsVh, setDurationsVh] = useState(DEFAULT_DURATIONS_VH);
  const [easings, setEasings] = useState(() => DEFAULT_DURATIONS_VH.map(() => "smooth"));
  const [posesByKf, setPosesByKf] = useState(() => initialPoses(makeDefaultStages()));
  const [camsByKf, setCamsByKf] = useState(() => initialCameras(makeDefaultStages()));
  const [movesByKf, setMovesByKf] = useState(() => initialMovements(makeDefaultStages()));
  const [fxByKf, setFxByKf] = useState(() => initialFx(makeDefaultStages()));

  const stagesComputed = useMemo(() => stagesWithProgress(stages, durationsVh), [stages, durationsVh]);
  const totalVh = useMemo(() => durationsVh.reduce((a, b) => a + b, 0), [durationsVh]);
  const setDurationAt = (i, value) => {
    setDurationsVh((prev) => { const next = [...prev]; next[i] = value; return next; });
  };
  const setEasingAt = (i, value) => {
    setEasings((prev) => { const next = [...prev]; next[i] = value; return next; });
  };

  // Una sola etapa activa, compartida por Pose / Cámara / Movimiento.
  const [activeStage, setActiveStage] = useState(() => makeDefaultStages()[0].id);

  const addStage = () => {
    const n = stages.length + 1;
    const newId = `pose-${Date.now()}`;
    const lastId = stages[stages.length - 1].id;
    setStages((prev) => [...prev, { id: newId, label: `Pose ${n}` }]);
    setDurationsVh((prev) => [...prev, 150]);
    setEasings((prev) => [...prev, "smooth"]);
    setPosesByKf((prev) => ({ ...prev, [newId]: JSON.parse(JSON.stringify(prev[lastId] || zeroPose())) }));
    setCamsByKf((prev) => ({ ...prev, [newId]: JSON.parse(JSON.stringify(prev[lastId] || defaultCamera())) }));
    setMovesByKf((prev) => ({ ...prev, [newId]: JSON.parse(JSON.stringify(prev[lastId] || defaultMovement())) }));
    setFxByKf((prev) => ({ ...prev, [newId]: JSON.parse(JSON.stringify(prev[lastId] || defaultFx())) }));
    setObjectTransformsByKf((prev) => {
      const next = { ...prev };
      Object.keys(next).forEach((objId) => {
        next[objId] = { ...next[objId], [newId]: JSON.parse(JSON.stringify(next[objId][lastId] || { position: [0, 0, 0], scale: 1, rotationY: 0, hidden: false, fadeDir: "ltr" })) };
      });
      return next;
    });
    setActiveStage(newId);
  };

  const removeStage = (id) => {
    const idx = stages.findIndex((s) => s.id === id);
    if (stages.length <= 1 || idx === -1) return;
    const remIdx = idx === 0 ? 0 : idx - 1;
    setStages((prev) => prev.filter((s) => s.id !== id));
    setDurationsVh((prev) => { const next = [...prev]; next.splice(remIdx, 1); return next; });
    setEasings((prev) => { const next = [...prev]; next.splice(remIdx, 1); return next; });
    setPosesByKf((prev) => { const next = { ...prev }; delete next[id]; return next; });
    setCamsByKf((prev) => { const next = { ...prev }; delete next[id]; return next; });
    setMovesByKf((prev) => { const next = { ...prev }; delete next[id]; return next; });
    setFxByKf((prev) => { const next = { ...prev }; delete next[id]; return next; });
    setObjectTransformsByKf((prev) => {
      const next = { ...prev };
      Object.keys(next).forEach((objId) => {
        const forObj = { ...next[objId] };
        delete forObj[id];
        next[objId] = forObj;
      });
      return next;
    });
    if (activeStage === id) {
      const remaining = stages.filter((s) => s.id !== id);
      setActiveStage(remaining[Math.max(0, idx - 1)]?.id || remaining[0]?.id);
    }
  };

  const renameStage = (id, label) => setStages((prev) => prev.map((s) => (s.id === id ? { ...s, label } : s)));


  const [scrub, setScrub] = useState(0);
  const [isPlaying, setIsPlaying] = useState(false);
  const [playSpeed, setPlaySpeed] = useState(1);

  /* Reproduce automáticamente el "progress" de 0 a 1 (pasa de largo el
     scroll manual) para poder ver la coordinación real entre cámara,
     personaje y ambiente sin tener que arrastrar el slider a mano.
     "Velocidad" es un multiplicador sobre un recorrido nominal de 10s. */
  useEffect(() => {
    if (!isPlaying) return;
    const durationMs = 10000 / playSpeed;
    let raf;
    let startTime = null;
    let startScrub = scrub >= 0.999 ? 0 : scrub;
    if (scrub >= 0.999) setScrub(0);
    const tick = (now) => {
      if (startTime === null) startTime = now;
      const elapsed = now - startTime;
      const p = startScrub + elapsed / durationMs;
      if (p >= 1) { setScrub(1); setIsPlaying(false); return; }
      setScrub(p);
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [isPlaying, playSpeed]);
  const [freeOrbit, setFreeOrbit] = useState(false);
  const [autoRotate, setAutoRotate] = useState(false);
  const [foundMap, setFoundMap] = useState({});
  const [copiedWhich, setCopiedWhich] = useState(null);
  const [downloaded, setDownloaded] = useState(false);

  // Objetos de entorno (antes "Entorno" / un solo universo.glb). Ahora
  // se pueden agregar tantos como haga falta, cada uno con su propio
  // archivo (modelo .glb o imagen .png/.jpg). La posición/escala/giro
  // de cada uno vive POR ETAPA (objectTransformsByKf) — igual que la
  // Cámara o el Movimiento del personaje — así también pueden moverse
  // a lo largo del scroll y no quedan estáticos.
  const [objects, setObjects] = useState([]);
  const defaultObjectTransform = () => ({ position: [0, 0, 0], scale: 1, rotationY: 0, hidden: false, fadeDir: "ltr" });
  // Al copiar/fijar transformaciones entre poses se conserva la visibilidad
  // (invisible + dirección del fade) propia de cada pose de destino.
  const keepFade = (src, cur) => ({ ...JSON.parse(JSON.stringify(src)), hidden: !!(cur && cur.hidden), fadeDir: (cur && cur.fadeDir) || "ltr" });
  const [objectTransformsByKf, setObjectTransformsByKf] = useState({});
  const [selectedObj, setSelectedObj] = useState(null);
  const [showObjects, setShowObjects] = useState(true);
  const [showGrid, setShowGrid] = useState(true);
  const [showFx, setShowFx] = useState(true);
  const [showMobileFrame, setShowMobileFrame] = useState(true);
  const viewportRef = useRef(null);

  const addObject = (type = "model") => {
    const newId = `obj-${Date.now()}`;
    const used = objects.map((o, k) => o.color || PALETTE[k % PALETTE.length]);
    const color = PALETTE.find((c) => !used.includes(c)) || PALETTE[objects.length % PALETTE.length];
    const base = { id: newId, label: `${{ model: "Modelo", image: "Imagen", text: "Texto" }[type]} ${objects.length + 1}`, type, url: "", previewUrl: null, billboard: type !== "model", visible: true, color };
    if (type === "text") Object.assign(base, { text: "Texto", textColor: "#ffffff", fontFamily: "'Inter', sans-serif", fontWeight: 600, textAlign: "center", textOutline: false, textOutlineColor: "#000000" });
    setObjects((prev) => [...prev, base]);
    setObjectTransformsByKf((prev) => ({ ...prev, [newId]: Object.fromEntries(stagesComputed.map((st) => [st.id, defaultObjectTransform()])) }));
    setSelectedObj(newId);
  };
  const removeObject = (id) => {
    setObjects((prev) => prev.filter((o) => o.id !== id));
    setObjectTransformsByKf((prev) => { const next = { ...prev }; delete next[id]; return next; });
  };
  const updateObject = (id, patch) => setObjects((prev) => prev.map((o) => (o.id === id ? { ...o, ...patch } : o)));
  const setObjectTransform = (id, field, axis, value) => {
    setObjectTransformsByKf((prev) => {
      const forObj = { ...prev[id] };
      const cur = { ...forObj[activeStage] };
      if (field === "position") {
        const pos = [...cur.position];
        pos["xyz".indexOf(axis)] = value;
        cur.position = pos;
      } else {
        cur[field] = value;
      }
      forObj[activeStage] = cur;
      return { ...prev, [id]: forObj };
    });
  };
  const copyObjectTransformFromPrev = (id) => {
    if (stageIndex <= 0) return;
    const prevId = stagesComputed[stageIndex - 1].id;
    setObjectTransformsByKf((prev) => ({
      ...prev,
      [id]: { ...prev[id], [activeStage]: keepFade(prev[id][prevId], prev[id][activeStage]) },
    }));
  };
  const copyAllObjectTransformsFromPrev = () => {
    if (stageIndex <= 0) return;
    const prevId = stagesComputed[stageIndex - 1].id;
    setObjectTransformsByKf((prev) => {
      const next = { ...prev };
      objects.forEach((o) => {
        next[o.id] = { ...next[o.id], [activeStage]: keepFade(prev[o.id][prevId], prev[o.id][activeStage]) };
      });
      return next;
    });
  };
  /* Fija la posición/escala/rotación ACTUAL de un objeto (la de la etapa
     que estás viendo ahora) en TODAS las etapas de una — para objetos que
     no se mueven, evita tener que entrar pose por pose a acomodarlo. */
  const applyObjectTransformToAllStages = (id) => {
    const current = objectTransformsByKf[id] && objectTransformsByKf[id][activeStage];
    if (!current) return;
    const snapshot = JSON.parse(JSON.stringify(current));
    setObjectTransformsByKf((prev) => {
      const forObj = { ...prev[id] };
      stagesComputed.forEach((kf) => { forObj[kf.id] = keepFade(snapshot, forObj[kf.id]); });
      return { ...prev, [id]: forObj };
    });
  };
  /* Igual que arriba pero para TODOS los objetos a la vez — útil recién
     agregaste varios objetos nuevos y quedaron todos amontonados al
     centro: los acomodás una vez en la etapa que estés viendo y con este
     botón quedan fijos así en las 20 (o las que sean) poses de un saque. */
  const applyAllObjectTransformsToAllStages = () => {
    setObjectTransformsByKf((prev) => {
      const next = { ...prev };
      objects.forEach((o) => {
        const current = prev[o.id] && prev[o.id][activeStage];
        if (!current) return;
        const snapshot = JSON.parse(JSON.stringify(current));
        const forObj = { ...next[o.id] };
        stagesComputed.forEach((kf) => { forObj[kf.id] = keepFade(snapshot, forObj[kf.id]); });
        next[o.id] = forObj;
      });
      return next;
    });
  };
  const setObjectType = (id, type) => {
    setObjects((prev) => prev.map((o) => {
      if (o.id !== id) return o;
      if (type === "text") {
        return {
          ...o,
          type: "text",
          billboard: o.billboard ?? true,
          text: o.text ?? "Texto",
          textColor: o.textColor ?? "#ffffff",
          fontFamily: o.fontFamily ?? "'Inter', sans-serif",
          fontWeight: o.fontWeight ?? 600,
          textAlign: o.textAlign ?? "center",
          textOutline: o.textOutline ?? false,
          textOutlineColor: o.textOutlineColor ?? "#000000",
        };
      }
      let url = o.url;
      if (type === "image" && /\.glb$/i.test(url)) url = url.replace(/\.glb$/i, ".png");
      if (type === "model" && /\.(svg|png|jpe?g|webp)$/i.test(url)) url = url.replace(/\.(svg|png|jpe?g|webp)$/i, ".glb");
      return { ...o, type, url, previewUrl: type === "model" ? null : o.previewUrl, billboard: type === "image" ? (o.billboard ?? true) : false };
    }));
  };
  /* Subida real de archivo (SVG exportado de Corel Draw, PNG, JPG). El
     navegador no puede escribir el archivo en el disco del proyecto —
     eso lo hace el botón "Descargar" de abajo, con el mismo nombre que
     va a usar el index.html final — pero sí puede leerlo localmente
     con URL.createObjectURL para mostrarlo YA en el visor 3D, sin
     esperar a que lo copies a mano. */
  const uploadObjectFile = (id, file) => {
    if (!file) return;
    const blobUrl = URL.createObjectURL(file);
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    updateObject(id, {
      type: "image",
      previewUrl: blobUrl,
      url: `./assets/models/${safeName}`,
      billboard: true,
    });
  };
  /* Si editás el campo "Archivo" a mano (en vez de usar "Subir
     archivo"), esto evita el bug de dejar una imagen/SVG con el tipo
     "Modelo" seleccionado — lo que hace que el navegador intente
     leerla con el cargador de .glb y falle ("no es JSON válido"). */
  const setObjectUrl = (id, newUrl) => {
    setObjects((prev) => prev.map((o) => {
      if (o.id !== id) return o;
      const isImgExt = /\.(svg|png|jpe?g|webp)$/i.test(newUrl);
      const isGlbExt = /\.glb$/i.test(newUrl);
      let patch = { url: newUrl };
      if (isImgExt && o.type !== "image") patch = { ...patch, type: "image", billboard: o.billboard ?? true, previewUrl: null };
      if (isGlbExt && o.type !== "model") patch = { ...patch, type: "model", billboard: false, previewUrl: null };
      return { ...o, ...patch };
    }));
  };

  const stageIndex = stagesComputed.findIndex((s) => s.id === activeStage);

  const setBoneAxis = (boneKey, axis, value) => {
    setPosesByKf((prev) => ({ ...prev, [activeStage]: { ...prev[activeStage], [boneKey]: { ...prev[activeStage][boneKey], [axis]: value } } }));
  };
  const resetBone = (boneKey) => {
    setPosesByKf((prev) => ({ ...prev, [activeStage]: { ...prev[activeStage], [boneKey]: { x: 0, y: 0, z: 0 } } }));
  };
  const copyPoseFromPrev = () => {
    if (stageIndex <= 0) return;
    const prevId = stagesComputed[stageIndex - 1].id;
    setPosesByKf((prev) => ({ ...prev, [activeStage]: JSON.parse(JSON.stringify(prev[prevId])) }));
  };

  const setCamField = (field, axis, value) => {
    setCamsByKf((prev) => {
      const cam = { ...prev[activeStage] };
      if (field === "fov" || field === "roll") cam[field] = value;
      else { cam[field] = [...cam[field]]; cam[field]["xyz".indexOf(axis)] = value; }
      return { ...prev, [activeStage]: cam };
    });
  };
  const orbitRef = useRef(null);
  const liveCameraRef = useRef(null);
  const captureFreeCamera = () => {
    const live = liveCameraRef.current;
    if (!live) return;
    setCamsByKf((prev) => ({
      ...prev,
      [activeStage]: { position: live.position, lookAt: live.lookAt, fov: live.fov, roll: prev[activeStage].roll || 0 },
    }));
  };
  const setFxField = (group, field, value) => {
    setFxByKf((prev) => {
      const fx = { ...prev[activeStage] };
      fx[group] = { ...fx[group], [field]: value };
      return { ...prev, [activeStage]: fx };
    });
  };
  /* Genera un segundo color con contraste real (más oscuro/claro que
     el primero) para que, al pasar a "Degradado", el cambio se note
     de una — antes copiaba el mismo color en los dos extremos y por
     eso el botón parecía no hacer nada. */
  const nudgeColor = (hex) => {
    const c = new THREE.Color(hex);
    const lum = 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b;
    const target = new THREE.Color(lum > 0.5 ? "#000000" : "#ffffff");
    c.lerp(target, 0.55);
    return "#" + c.getHexString();
  };
  const setBackgroundMode = (mode) => {
    setFxByKf((prev) => {
      const fx = { ...prev[activeStage] };
      const bg = fx.background;
      if (mode === "solid") {
        fx.background = { ...bg, mode: "solid", to: bg.from };
      } else {
        fx.background = { ...bg, mode: "gradient", to: bg.to !== bg.from ? bg.to : nudgeColor(bg.from) };
      }
      return { ...prev, [activeStage]: fx };
    });
  };
  const setBackgroundColor = (field, value) => {
    setFxByKf((prev) => {
      const fx = { ...prev[activeStage] };
      const bg = { ...fx.background, [field]: value };
      if (fx.background.mode !== "gradient" && field === "from") bg.to = value;
      fx.background = bg;
      return { ...prev, [activeStage]: fx };
    });
  };
  const copyCamFromPrev = () => {
    if (stageIndex <= 0) return;
    const prevId = stagesComputed[stageIndex - 1].id;
    setCamsByKf((prev) => ({ ...prev, [activeStage]: JSON.parse(JSON.stringify(prev[prevId])) }));
    setFxByKf((prev) => ({ ...prev, [activeStage]: JSON.parse(JSON.stringify(prev[prevId])) }));
  };

  const setMoveField = (field, axis, value) => {
    setMovesByKf((prev) => {
      const mv = { ...prev[activeStage] };
      if (field === "yaw" || field === "pitch") mv[field] = value;
      else { mv.pos = [...mv.pos]; mv.pos["xyz".indexOf(axis)] = value; }
      return { ...prev, [activeStage]: mv };
    });
  };
  const copyMoveFromPrev = () => {
    if (stageIndex <= 0) return;
    const prevId = stagesComputed[stageIndex - 1].id;
    setMovesByKf((prev) => ({ ...prev, [activeStage]: JSON.parse(JSON.stringify(prev[prevId])) }));
  };
  const applyYawPreset = (deg_) => setMoveField("yaw", null, deg_);
  const applyPitchPreset = (deg_) => setMoveField("pitch", null, deg_);

  const isPreview = section === "preview";
  const currentPose = isPreview ? samplePose(posesByKf, scrub, stagesComputed, easings) : posesByKf[activeStage];
  const currentCamTarget = isPreview ? sampleCamera(camsByKf, scrub, stagesComputed, easings) : camsByKf[activeStage];
  const currentMovement = isPreview ? sampleMovement(movesByKf, scrub, stagesComputed, easings) : movesByKf[activeStage];
  const renderFx = isPreview ? sampleFx(fxByKf, scrub, stagesComputed, easings) : fxByKf[activeStage];
  const renderObjects = useMemo(() => objects.map((o) => {
    const transforms = objectTransformsByKf[o.id];
    if (!transforms) return { ...o, ...editFade(defaultObjectTransform()) };
    const t = isPreview ? sampleObjectTransform(transforms, scrub, stagesComputed, easings) : editFade(transforms[activeStage] || defaultObjectTransform());
    return { ...o, ...t };
  }), [objects, objectTransformsByKf, isPreview, scrub, stagesComputed, easings, activeStage]);
  const sceneCameraActive = !freeOrbit;

  const boneCode = useMemo(() => generateBoneArrayCode(posesByKf, stagesComputed, easings), [posesByKf, stagesComputed, easings]);
  const scenesCode = useMemo(() => generateScenesArrayCode(camsByKf, fxByKf, stagesComputed, easings), [camsByKf, fxByKf, stagesComputed, easings]);
  const movementCode = useMemo(() => generateMovementDefsCode(movesByKf, stagesComputed, easings), [movesByKf, stagesComputed, easings]);
  const scrollLengthCode = useMemo(() => generateScrollLengthCode(totalVh), [totalVh]);
  const objectsCode = useMemo(() => generateObjectsCode(objects, objectTransformsByKf, stagesComputed, easings), [objects, objectTransformsByKf, stagesComputed, easings]);
  const modelUrlCode = useMemo(() => generateModelUrlCode(modelUrl), [modelUrl]);
  const charTransformCode = useMemo(() => generateCharTransformCode(charScale, charCenterY), [charScale, charCenterY]);
  const postFxCode = useMemo(() => generatePostFxCode(postFx), [postFx]);
  const trailCode = useMemo(() => generateTrailCode(trail), [trail]);
  const reflectionCode = useMemo(() => generateReflectionCode(reflection), [reflection]);

  const copy = async (text, which) => {
    try { await navigator.clipboard.writeText(text); setCopiedWhich(which); setTimeout(() => setCopiedWhich(null), 1500); }
    catch (e) { /* fallback: seleccionar manualmente */ }
  };

  /* Guarda/carga el ESTADO DE EDICIÓN completo (etapas, poses, cámara,
     movimiento, ambiente, objetos y sus animaciones) como un .json
     aparte — distinto del index.html final. Esto es lo que hay que
     usar para "seguir mañana donde quedaste". Los blobs de vista
     previa (SVG/imagen subida) no se guardan porque no sobreviven
     entre sesiones — al recargar el proyecto, la ruta del archivo
     queda intacta pero hay que volver a "Subir archivo" si querés
     verla de nuevo en el visor. */
  const [projectLoadError, setProjectLoadError] = useState(null);
  const [projectLoaded, setProjectLoaded] = useState(false);

  const buildProjectSnapshot = () => ({
    kind: "weeb-scroll-project",
    version: 1,
    savedAt: new Date().toISOString(),
    modelUrl,
    charScale,
    charCenterY,
    postFx,
    trail,
    reflection,
    stages,
    durationsVh,
    easings,
    posesByKf,
    camsByKf,
    movesByKf,
    fxByKf,
    objects: objects.map((o) => ({ ...o, previewUrl: null })),
    objectTransformsByKf,
  });

  const restoreProjectState = (p) => {
    if (!p || p.kind !== "weeb-scroll-project") throw new Error("no es un archivo de proyecto de esta herramienta");
    setModelUrl(p.modelUrl || DEFAULT_MODEL_URL);
    setCharScale(typeof p.charScale === "number" ? p.charScale : 1);
    setCharCenterY(typeof p.charCenterY === "number" ? p.charCenterY : 0);
    if (p.postFx) setPostFx((prev) => ({ ...prev, ...p.postFx }));
    if (p.trail) setTrail((prev) => ({ ...prev, ...p.trail }));
    if (p.reflection) setReflection((prev) => ({ ...prev, ...p.reflection }));
    const loadedStages = p.stages && p.stages.length ? p.stages : makeDefaultStages();
    setStages(loadedStages);
    setDurationsVh(p.durationsVh || DEFAULT_DURATIONS_VH);
    setEasings(p.easings || loadedStages.slice(1).map(() => "smooth"));
    setPosesByKf(p.posesByKf || {});
    setCamsByKf(p.camsByKf || {});
    setMovesByKf(p.movesByKf || {});
    setFxByKf(p.fxByKf || {});
    setObjects(p.objects || []);
    setObjectTransformsByKf(p.objectTransformsByKf || {});
    setActiveStage(loadedStages[0].id);
    setSelectedObj(null);
    setScrub(0);
  };

  /* Al abrir un archivo que "Guardar como editor" generó, este mismo
     componente ya viene con el progreso embebido (base64, en un tag
     invisible fuera de #root). Se detecta y se carga solo, una vez,
     al montar. */
  useEffect(() => {
    const el = document.getElementById("embedded-project-b64");
    const b64 = el && el.textContent.trim();
    if (!b64) return;
    try {
      const json = decodeURIComponent(escape(atob(b64)));
      restoreProjectState(JSON.parse(json));
      setProjectLoaded(true);
      setTimeout(() => setProjectLoaded(false), 2500);
    } catch (e) {
      console.warn("No se pudo restaurar el progreso embebido:", e);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const saveProject = () => {
    const project = buildProjectSnapshot();
    const blob = new Blob([JSON.stringify(project, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "proyecto.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const loadProject = (file) => {
    if (!file) return;
    setProjectLoadError(null);
    const reader = new FileReader();
    reader.onload = () => {
      try {
        restoreProjectState(JSON.parse(reader.result));
        setProjectLoaded(true);
        setTimeout(() => setProjectLoaded(false), 2500);
      } catch (e) {
        setProjectLoadError("No se pudo leer ese archivo como proyecto (¿es el .json que bajaste con \"Guardar proyecto\" de esta misma herramienta?).");
      }
    };
    reader.readAsText(file);
  };

  /* Genera una COPIA COMPLETA de esta misma herramienta (HTML + los
     dos scripts, tal cual están corriendo ahora mismo — React nunca
     toca el texto de un <script>, así que sigue siendo el código
     original) con tu progreso actual metido adentro en base64. Al
     abrir ese archivo de nuevo — doble clic, o subido a GitHub Pages
     con el nombre que quieras — arranca ya con todo cargado. */
  const [projectName, setProjectName] = useState("proyecto");
  const saveProjectAsEditor = () => {
    const project = buildProjectSnapshot();
    const json = JSON.stringify(project);
    const b64 = btoa(unescape(encodeURIComponent(json)));
    const docClone = document.documentElement.cloneNode(true);
    const rootClone = docClone.querySelector("#root");
    if (rootClone) rootClone.innerHTML = "";
    let html = "<!DOCTYPE html>\n" + docClone.outerHTML;
    html = html.replace(
      /<script[^>]*id="embedded-project-b64"[^>]*>[\s\S]*?<\/script>/,
      `<script id="embedded-project-b64" type="text/plain">${b64}</scri` + `pt>`
    );
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const safeName = (projectName || "proyecto").trim().replace(/[^a-zA-Z0-9._-]+/g, "_") || "proyecto";
    a.href = url; a.download = `editor_${safeName}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const downloadFullHtml = () => {
        const html = buildFullHtml(boneCode, scenesCode, movementCode, scrollLengthCode, objectsCode, modelUrlCode, postFxCode, charTransformCode, trailCode, reflectionCode);
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "index.html";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setDownloaded(true);
    setTimeout(() => setDownloaded(false), 2000);
  };

  const copyFullHtml = () => {
        const html = buildFullHtml(boneCode, scenesCode, movementCode, scrollLengthCode, objectsCode, modelUrlCode, postFxCode, charTransformCode, trailCode, reflectionCode);
    copy(html, "full");
  };

  const resetAllBones = () => setPosesByKf((prev) => ({ ...prev, [activeStage]: zeroPose() }));
  const newProject = () => {
    if (!window.confirm("¿Vaciar todo y empezar un proyecto nuevo?")) return;
    const st = makeDefaultStages();
    setModelUrl(""); setCharScale(1); setCharCenterY(0);
    setPostFx({ vignetteEnabled: false, vignetteDarkness: 0.5, vignetteOffset: 0.15, bloomEnabled: false, bloomIntensity: 0.5, beamEnabled: false, beamOpacity: 0.5, beamWidth: 2.5, beamHeight: 14 });
    setTrail({ enabled: false, color: "#ffd873", size: 0.05, life: 0.9, rate: 40 });

  };
  const TABS = [
    ["cfg", "cfg", "Config"], ["pose", "pose", "Pose"], ["camera", "cam", "Cámara"], ["movement", "move", "Mov."],

  const nStages = stagesComputed.length;

  useEffect(() => { setFoundMap({}); }, [modelUrl]);

  const renderObjectEditor = (o, idx) => {

    return (

          <select value={c} onChange={(e) => updateObject(o.id, { color: e.target.value })} style={{ width: 34, padding: 2 }} title="Color">
            {PALETTE.map((p) => <option key={p} value={p} style={{ color: p }}>●</option>)}
          </select>
        </div>
        <Seg value={o.type || "model"} onChange={(v) => setObjectType(o.id, v)} options={[["model", "Modelo"], ["image", "Imagen / SVG"], ["text", "Texto"]]} />
        {isText ? (
          <>
            <textarea rows={3} value={o.text || ""} onChange={(e) => updateObject(o.id, { text: e.target.value })} />
            <ColorRow label="Color" value={o.textColor || "#ffffff"} onChange={(v) => updateObject(o.id, { textColor: v })} />
            <SelectRow label="Fuente" value={o.fontFamily || "'Inter', sans-serif"} onChange={(v) => updateObject(o.id, { fontFamily: v })}
              options={[["'Inter', sans-serif", "Inter"], ["'Space Grotesk', sans-serif", "Space Grotesk"], ["Georgia, 'Times New Roman', serif", "Serif"], ["'Courier New', monospace", "Mono"], ["system-ui, sans-serif", "Sistema"]]} />
            <SelectRow label="Peso" value={o.fontWeight || 600} onChange={(v) => updateObject(o.id, { fontWeight: Number(v) })}
              options={[[300, "Liviana 300"], [400, "Normal 400"], [500, "Media 500"], [600, "Semi 600"], [700, "Negrita 700"]]} />
            <Seg value={o.textAlign || "center"} onChange={(v) => updateObject(o.id, { textAlign: v })} options={[["left", "Izq."], ["center", "Centro"], ["right", "Der."]]} />
            <div className="row"><Switch checked={!!o.textOutline} onChange={(v) => updateObject(o.id, { textOutline: v })} label="Contorno" />
              {o.textOutline && <input type="color" value={o.textOutlineColor || "#000000"} onChange={(e) => updateObject(o.id, { textOutlineColor: e.target.value })} />}</div>
          </>

          <div className="row">
            <span className="lbl">Archivo</span>
            <PathInput value={o.url} onCommit={(v) => setObjectUrl(o.id, v)} placeholder={isImage ? "./assets/models/imagen.svg" : "./assets/models/objeto.glb"} />
            {isImage && (
              <label className="ibtn" title="Subir imagen"><Icon name="open" size={16} />

        {mismatch && <div className="warn">⚠ La extensión no coincide con el tipo</div>}
        {!isModel && <Switch checked={!!o.billboard} onChange={(v) => updateObject(o.id, { billboard: v })} label="Billboard (mira a cámara)" />}
        <div className="grp-t" style={{ marginTop: 4 }}>Transformación · {currentStageLabel}</div>
        <Slider label="Escala" min={0.05} max={20} step={0.01} value={t.scale} onChange={(v) => setObjectTransform(o.id, "scale", null, v)} />
        <Vec3 label="Posición" value={t.position} onChange={(a, v) => setObjectTransform(o.id, "position", a, v)} />
        {!(!isModel && o.billboard) && <Slider label="Giro Y" min={-180} max={180} step={0.1} value={t.rotationY} onChange={(v) => setObjectTransform(o.id, "rotationY", null, v)} />}
        <div className="grp-t" style={{ marginTop: 6 }}>Visibilidad · {currentStageLabel}</div>
        <Switch checked={!!t.hidden} onChange={(v) => setObjectTransform(o.id, "hidden", null, v)} label="Invisible en esta pose" />
        <Seg value={t.fadeDir || "ltr"} onChange={(v) => setObjectTransform(o.id, "fadeDir", null, v)} options={[["ltr", "Izq → Der"], ["rtl", "Der → Izq"], ["fade", "Simple"]]} />
        <div style={{ fontSize: 10.5, opacity: 0.6, lineHeight: 1.35 }}>Dirección del fade de transparencia al llegar a esta pose (aparece o desaparece según la pose anterior). Probalo en Preview.</div>
        <div className="tools">
          <Btn icon="copy" onClick={() => copyObjectTransformFromPrev(o.id)} disabled={stageIndex <= 0}>Desde anterior</Btn>
          <Btn icon="pin" kind="acc" onClick={() => applyObjectTransformToAllStages(o.id)}>Fijar en todas</Btn>
        </div>
      </div>
    );
  };

  return (
    <>
      <div className="viewport" ref={viewportRef}
        style={showFx ? { background: `linear-gradient(${renderFx.background.angle}deg, ${renderFx.background.from}, ${renderFx.background.to})` } : undefined}>
        <div className="vp-bar">
          {[["Libre", freeOrbit, setFreeOrbit], ["Rotar", autoRotate, setAutoRotate, freeOrbit], ["Objetos", showObjects, setShowObjects], ["Grilla", showGrid, setShowGrid], ["Ambiente", showFx, setShowFx], ["9:16", showMobileFrame, setShowMobileFrame]]
            .filter((c) => c[3] === undefined || c[3])
            .map(([t, on, set]) => <span key={t} className={`vchip ${on ? "on" : ""}`} onClick={() => set(!on)}>{t}</span>)}
        </div>
        <Canvas shadows="soft" camera={{ position: [0, 0.3, 3.5], fov: 35 }} dpr={[1, 2]} gl={{ antialias: true, alpha: true }}>
          <Scene pose={currentPose} onBonesFound={setFoundMap} cameraTarget={currentCamTarget} sceneCameraActive={sceneCameraActive} autoRotate={autoRotate} movement={currentMovement} objects={renderObjects} showObjects={showObjects} showGrid={showGrid} fx={renderFx} showFx={showFx} orbitRef={orbitRef} liveCameraRef={liveCameraRef} modelUrl={modelUrl} postFx={postFx} charScale={charScale} charCenterY={charCenterY} charAnchorRef={charAnchorRef} trail={trail} reflection={reflection}
            markers={section === "objects" && showObjects ? markers : null} selectedObjectId={selectedObj} onSelectObject={setSelectedObj} />
        </Canvas>
        {showFx && postFx.vignetteEnabled && (
          <div aria-hidden="true" style={{ position: "absolute", inset: 0, zIndex: 3, pointerEvents: "none", background: `radial-gradient(ellipse farthest-corner at center, transparent ${(1 - postFx.vignetteOffset) * 100}%, rgba(0,0,0,${postFx.vignetteDarkness}) 100%)` }} />

        {showMobileFrame && <MobileFrameOverlay containerRef={viewportRef} />}
        <div className="vp-hud">{isPreview ? `▶ ${scrub.toFixed(3)}` : `${currentStageLabel} · ${stageIndex + 1}/${nStages}`}</div>
      </div>

      <div className="panel">
        <nav className="rail">
          {TABS.map(([id, icon, label]) => (
            <button key={id} className={`rail-btn ${section === id ? "on" : ""}`} onClick={() => setSection(id)} title={label}><Icon name={icon} size={20} /><span>{label}</span></button>
          ))}
        </nav>
        <div className="main">
          <div className="topbar">
            <span className="brand">WEEB<b>/</b>SCENE</span><span className="grow" />
            <label className="ibtn" title="Abrir proyecto (.json)"><Icon name="open" size={16} />
              <input type="file" accept=".json,application/json" onChange={(e) => { loadProject(e.target.files[0]); e.target.value = ""; }} />
            </label>
            <IBtn icon="file" title="Guardar proyecto (.json)" onClick={saveProject} />
            <IBtn icon="export" kind="acc" title="Exportar index.html" onClick={downloadFullHtml} />

                <IBtn icon="trash" kind="danger" title="Eliminar pose" disabled={stages.length <= 1} onClick={() => removeStage(activeStage)} />
              </div>
            </div>

          {isPreview && (

                  <Slider label="Opacidad" min={0} max={1} step={0.01} value={postFx.beamOpacity} onChange={(v) => setPostFxField("beamOpacity", v)} />
                  <Slider label="Ancho" min={0.2} max={10} step={0.1} value={postFx.beamWidth} onChange={(v) => setPostFxField("beamWidth", v)} />
                  <Slider label="Largo" min={2} max={40} step={0.5} value={postFx.beamHeight} onChange={(v) => setPostFxField("beamHeight", v)} />

                <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>

                    const v = (posesByKf[activeStage] && posesByKf[activeStage][key]) || { x: 0, y: 0, z: 0 };
                    const side = /^l[A-Z]/.test(key) ? "l" : /^r[A-Z]/.test(key) ? "r" : "c";
                    return (
                      <div key={key} className={`bone ${side} ${v.x || v.y || v.z ? "dirty" : ""} ${foundMap[key] === false ? "missing" : ""}`}>

                        {["x", "y", "z"].map((a, i) => <Num key={a} label={a.toUpperCase()} color={AXIS_COLORS[i]} step={0.5} value={v[a]} onChange={(n) => setBoneAxis(key, a, n)} />)}
                        <button className="mini" title="Reset" onClick={() => resetBone(key)}><Icon name="reset" size={12} /></button>
                      </div>

                  })}

            {section === "camera" && (
              <>
                <div className="tools">
                  <Btn icon="copy" onClick={copyCamFromPrev} disabled={stageIndex <= 0}>Desde anterior</Btn>

                </div>
                <Group id="cam" title="Cámara">
                  <Vec3 label="Posición" value={cam.position} onChange={(a, v) => setCamField("position", a, v)} />
                  <Vec3 label="Mira a" value={cam.lookAt} onChange={(a, v) => setCamField("lookAt", a, v)} />
                  <Slider label="FOV" min={10} max={90} step={0.1} value={cam.fov} onChange={(v) => setCamField("fov", null, v)} />
                  <Slider label="Roll" min={-180} max={180} step={0.1} value={cam.roll || 0} onChange={(v) => setCamField("roll", null, v)} />
                </Group>
                <Group id="light" title="Luz principal">
                  <ColorRow label="Color" value={fxs.light.color} onChange={(v) => setFxField("light", "color", v)} />
                  <Slider label="Intens." min={0} max={5} step={0.05} value={fxs.light.intensity} onChange={(v) => setFxField("light", "intensity", v)} />
                  <Slider label="Azimut" min={0} max={360} step={1} value={fxs.light.azimuth ?? 45} onChange={(v) => setFxField("light", "azimuth", v)} />
                  <Slider label="Altura" min={-90} max={90} step={1} value={fxs.light.elevation ?? 35} onChange={(v) => setFxField("light", "elevation", v)} />
                </Group>

                  <Slider label="Intens." min={0} max={5} step={0.05} value={fxs.light.rimIntensity} onChange={(v) => setFxField("light", "rimIntensity", v)} />

                  <ColorRow label="Color" value={fxs.fog.color} onChange={(v) => setFxField("fog", "color", v)} />
                  <Slider label="Alcance" min={0} max={300} step={0.5} value={fxs.fog.far} onChange={(v) => setFxField("fog", "far", v)} />

                  <ColorRow label={fxs.background.mode === "gradient" ? "Desde" : "Color"} value={fxs.background.from} onChange={(v) => setBackgroundColor("from", v)} />
                  {fxs.background.mode === "gradient" && (
                    <>
                      <ColorRow label="Hasta" value={fxs.background.to} onChange={(v) => setBackgroundColor("to", v)} />
                      <Slider label="Ángulo" min={0} max={360} step={1} value={fxs.background.angle ?? 180} onChange={(v) => setFxField("background", "angle", v)} />
                    </>
                  )}
                </Group>
              </>
            )}

            {section === "movement" && (
              <>
                <div className="tools"><Btn icon="copy" onClick={copyMoveFromPrev} disabled={stageIndex <= 0}>Desde anterior</Btn></div>
                <Group id="mv" title="Transformación">
                  <Vec3 label="Posición" value={mv.pos} onChange={(a, v) => setMoveField("pos", a, v)} />
                  <Slider label="Giro (yaw)" min={-180} max={180} step={0.1} value={mv.yaw} onChange={(v) => setMoveField("yaw", null, v)} />
                  <Presets items={[["Frente", 0], ["Der. 90°", -90], ["Izq. 90°", 90], ["Espalda", 180]]} onPick={applyYawPreset} />
                  <Slider label="Pitch" min={-90} max={90} step={0.1} value={mv.pitch} onChange={(v) => setMoveField("pitch", null, v)} />
                  <Presets items={[["Neutro", 0], ["Adelante", 60], ["Atrás", -60]]} onPick={applyPitchPreset} />
                </Group>
              </>
            )}

            {section === "timing" && (
              nStages < 2 ? <div className="empty">Agregá una 2ª pose</div> : (
                <>
                  <div className="tl">{durationsVh.map((d, i) => <div key={i} style={{ flexGrow: d }}>{i + 1}→{i + 2}</div>)}</div>
                  <div className="stat">Total {Math.round(totalVh)} vh</div>
                  {durationsVh.map((d, i) => (
                    <div className="row" key={stagesComputed[i + 1].id}>
                      <span className="tr-n">{i + 1}→{i + 2}</span>
                      <input type="range" min={20} max={800} step={5} value={clamp(d, 20, 800)} style={{ "--pct": ((clamp(d, 20, 800) - 20) / 780) * 100 + "%" }} onChange={(e) => setDurationAt(i, Number(e.target.value))} />
                      <Num value={d} step={5} onChange={(v) => setDurationAt(i, v)} />
                      <select value={easings[i] || "smooth"} onChange={(e) => setEasingAt(i, e.target.value)} style={{ width: 82 }}>
                        <option value="smooth">Suave</option><option value="linear">Lineal</option><option value="easeIn">Entrada</option><option value="easeOut">Salida</option>
                      </select>
                    </div>
                  ))}
                </>
              )
            )}

            {section === "objects" && (
              <>
                <div className="tools">
                  <Btn icon="cube" onClick={() => addObject("model")}>Modelo</Btn>
                  <Btn icon="image" onClick={() => addObject("image")}>Imagen</Btn>
                  <Btn icon="text" onClick={() => addObject("text")}>Texto</Btn>
                  <span className="grow" />
                  <IBtn icon="copy" title="Todos desde la pose anterior" disabled={stageIndex <= 0 || !objects.length} onClick={copyAllObjectTransformsFromPrev} />
                  <IBtn icon="pin" title="Fijar todos en todas las poses" disabled={!objects.length} onClick={applyAllObjectTransformsToAllStages} />
                </div>
                <div className="outliner">
                  {objects.map((o, i) => (
                    <div key={o.id} className={`orow ${selObj && selObj.id === o.id ? "sel" : ""} ${o.visible && !(objectTransformsByKf[o.id] && objectTransformsByKf[o.id][activeStage] && objectTransformsByKf[o.id][activeStage].hidden) ? "" : "off"}`} style={{ "--oc": colorOf(o, i) }} onClick={() => setSelectedObj(o.id)}>
                      <span className="oico"><Icon name={o.type === "text" ? "text" : o.type === "image" ? "image" : "cube"} size={15} /></span>
                      <span className="oname">{o.label}</span>
                      <button className="mini" title="Visible" onClick={(e) => { e.stopPropagation(); updateObject(o.id, { visible: !o.visible }); }}><Icon name={o.visible ? "eye" : "eyeoff"} size={14} /></button>
                      <button className="mini danger" title="Eliminar" onClick={(e) => { e.stopPropagation(); removeObject(o.id); }}><Icon name="trash" size={14} /></button>
                    </div>
                  ))}
                  {!objects.length && <div className="empty">Sin objetos</div>}
                </div>
                {selObj && renderObjectEditor(selObj, objects.indexOf(selObj))}
              </>
            )}

            {section === "preview" && (
              <Slider label="Velocidad" min={0.1} max={3} step={0.05} value={playSpeed} onChange={setPlaySpeed} />
            )}

            {section === "file" && (
              <>
                <Group id="proj" title="Proyecto">
                  <div className="row"><span className="lbl">Nombre</span><input type="text" style={{ flex: 1 }} value={projectName} onChange={(e) => setProjectName(e.target.value)} /></div>
                  <div className="tools">
                    <label className="btn"><Icon name="open" size={14} />Abrir .json
                      <input type="file" accept=".json,application/json" onChange={(e) => { loadProject(e.target.files[0]); e.target.value = ""; }} />
                    </label>
                    <Btn icon="file" onClick={saveProject}>Guardar .json</Btn>
                    <Btn icon="file" onClick={saveProjectAsEditor}>Editor .html</Btn>
                  </div>
                  <div className="tools"><Btn icon="trash" kind="danger" onClick={newProject}>Nuevo proyecto (vaciar)</Btn></div>
                  {projectLoadError && <div className="err">{projectLoadError}</div>}
                </Group>
                <Group id="exp" title="Exportar">
                  <div className="tools">
                    <Btn icon="export" kind="acc" onClick={downloadFullHtml}>index.html</Btn>
                    <Btn icon="copy" onClick={copyFullHtml}>Copiar index.html</Btn>
                  </div>
                </Group>
                <Group id="code" title="Código" defaultOpen={false}>
                  {[["Huesos", boneCode, "bones"], ["Cámara", scenesCode, "camera"], ["Movimiento", movementCode, "movement"], ["Objetos", objectsCode, "objects"]].map(([t, code, k]) => (
                    <div key={k} style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                      <div className="tools"><span className="lbl">{t}</span><Btn icon="copy" onClick={() => copy(code, k)}>Copiar</Btn></div>
                      <textarea className="code" readOnly value={code} onFocus={(e) => e.target.select()} />
                    </div>
                  ))}
                </Group>
              </>
            )}
          </div>
          {toast && <div className="toast">{toast}</div>}
        </div>
      </div>
    </>
  );
}

createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
