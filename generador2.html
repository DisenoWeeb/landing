<!DOCTYPE html>
<html lang="es">
<head>

<title>Pose &amp; Cámara Generator — weeb.glb</title>
<style>

  #root { width: 100%; height: 100%; display: flex; }

  .toggle-row input { accent-color: #c8ff00; }

  }

  p.hint { color: rgba(245,246,242,0.6); font-size: 11.5px; margin: 0; line-height: 1.4; }

  .section-tabs { display: flex; gap: 6px; }
  .section-tab {
    flex: 1; padding: 8px 4px; text-align: center; border-radius: 6px; cursor: pointer;

  .kf-tabs { display: flex; flex-wrap: wrap; gap: 6px; }

  .kf-tab .p { display: block; font-size: 9.5px; color: rgba(245,246,242,0.5); }

  .axis-row input[type=range] { flex: 1; }

  .cam-group { padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.08); }

  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn {
    padding: 7px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2);
    background: transparent; color: #f5f6f2; cursor: pointer; font-size: 11.5px;
  }

  textarea.code {
    width: 100%; height: 200px; resize: vertical; background: #05050a; color: #cdeb8f;
    border: 1px solid rgba(200,255,0,0.25); border-radius: 6px; padding: 10px; font-family: ui-monospace, monospace;
    font-size: 10px; line-height: 1.4; box-sizing: border-box;
  }
  .copied { color: #c8ff00; font-size: 11px; }

<body>
<div id="root"></div>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",

    "three": "https://esm.sh/three@0.160.0",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.17.10?external=react,react-dom,three",

  }

</script>

<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

<script type="text/babel" data-type="module" data-presets="react">
import React, { useEffect, useMemo, useRef, useState } from "react";
import { createRoot } from "react-dom/client";
import * as THREE from "three";
import { Canvas, useFrame, useThree } from "@react-three/fiber";
import { useGLTF, OrbitControls, Environment, Grid } from "@react-three/drei";

// Mismo modelo que index.html
const MODEL_URL = "./assets/models/weeb.glb";

/* =====================================================================
   HUESOS — mismas claves y nombres que usa `names` en AnimatedCharacter
   ===================================================================== */
const BONE_DEFS = [
  ["spine1", "Spine01"],
  ["spine2", "Spine02"],
  ["neck", "NeckTwist01"],
  ["head", "Head"],
  ["lClavicle", "L_Clavicle"],
  ["rClavicle", "R_Clavicle"],
  ["lForearm", "L_Forearm"],
  ["rForearm", "R_Forearm"],
  ["lHand", "L_Hand"],
  ["rHand", "R_Hand"],
  ["lThigh", "L_Thigh"],
  ["rThigh", "R_Thigh"],
  ["lCalf", "L_Calf"],
  ["rCalf", "R_Calf"],
  ["lFoot", "L_Foot"],
  ["rFoot", "R_Foot"],
];
const BONE_KEYS = BONE_DEFS.map(([k]) => k);

const rad = (d) => (d * Math.PI) / 180;
const deg = (r) => (r * 180) / Math.PI;
const clamp = (v, min = 0, max = 1) => Math.min(max, Math.max(min, v));
const lerp = (a, b, t) => a + (b - a) * t;

/* =====================================================================
   ETAPAS DE POSE (huesos) — mismos breakpoints que BONE_POSE_KEYFRAMES
   en tu index.html actual. Los valores de abajo son EXACTAMENTE los que
   ya tenés puestos (convertidos de radianes a grados para los sliders),
   así el editor arranca mostrando tu pose actual, no una pose en blanco.
   ===================================================================== */
const POSE_KEYFRAMES = [
  { id: "front-idle", label: "Frente", progress: 0 },
  { id: "approach", label: "Acercamiento", progress: 0.25 },
  { id: "turn", label: "Giro", progress: 0.5 },
  { id: "fall-pose", label: "Postura caída", progress: 0.7 },
  { id: "fall", label: "Caída", progress: 1 },
];

const zeroPose = () => Object.fromEntries(BONE_KEYS.map((k) => [k, { x: 0, y: 0, z: 0 }]));
const rEntry = (rx, ry, rz) => ({ x: deg(rx), y: deg(ry), z: deg(rz) });

function initialPoses() {
  const p = Object.fromEntries(POSE_KEYFRAMES.map((kf) => [kf.id, zeroPose()]));
  p["front-idle"] = {
    ...zeroPose(),
    lClavicle: rEntry(0, 0, 0.2269), rClavicle: rEntry(0, 0, -0.2269),
    lForearm: rEntry(-0.0349, 0.7156, 0.4014), rForearm: rEntry(0.3142, -1.1868, -0.0175),
    lHand: rEntry(-0.3142, 0.5061, 0.3142), rHand: rEntry(-0.5411, -0.3840, 0),
    lThigh: rEntry(0.5411, 0, 0.0175), rThigh: rEntry(0.2793, 0, 0),
    lCalf: rEntry(-0.9774, 0, 0), rCalf: rEntry(-0.9076, 0, 0),
  };
  p["approach"] = {
    ...p["front-idle"],
    head: rEntry(-0.4538, 0, 0),
  };
  p["turn"] = {
    ...p["front-idle"],
    head: rEntry(0.0175, -0.1571, -0.0524),
    lForearm: rEntry(-0.0349, 0.5061, 0.4014), rForearm: rEntry(0.3142, -0.8727, -0.0175),
    lCalf: rEntry(-0.6807, 0, 0), rCalf: rEntry(-0.7505, -0.1571, 0),
  };
  p["fall-pose"] = {
    ...p["turn"],
    spine1: rEntry(0.5585, 0, 0), spine2: rEntry(0.4189, 0, 0),
    lThigh: rEntry(0.3665, 0, 0.0175),
    lCalf: rEntry(-1.3090, -0.1222, -0.2618), rCalf: rEntry(-1.0821, -0.1571, 0),
  };
  p["fall"] = {
    ...p["fall-pose"],
    head: rEntry(0.4014, -0.1571, -0.0524),
    lClavicle: rEntry(0, -0.6458, 0.5411), rClavicle: rEntry(-0.4363, 0.4189, -0.2269),
  };
  return p;
}

function samplePose(posesByKf, progress) {
  const p = clamp(progress, 0, 1);
  if (p <= POSE_KEYFRAMES[0].progress) return posesByKf[POSE_KEYFRAMES[0].id];
  const last = POSE_KEYFRAMES[POSE_KEYFRAMES.length - 1];
  if (p >= last.progress) return posesByKf[last.id];
  let i = 0;
  while (i < POSE_KEYFRAMES.length - 1 && POSE_KEYFRAMES[i + 1].progress < p) i++;
  const a = POSE_KEYFRAMES[i], b = POSE_KEYFRAMES[i + 1];
  const span = b.progress - a.progress || 1;
  const t = clamp((p - a.progress) / span);
  const pa = posesByKf[a.id], pb = posesByKf[b.id];
  const out = {};
  BONE_KEYS.forEach((k) => {
    out[k] = { x: lerp(pa[k].x, pb[k].x, t), y: lerp(pa[k].y, pb[k].y, t), z: lerp(pa[k].z, pb[k].z, t) };
  });
  return out;
}

/* =====================================================================
   ETAPAS DE CÁMARA — mismos breakpoints/valores que el array `scenes`
   de tu index.html actual. particles/light/fog/background/background
   quedan fijos (no editables acá) y se re-emiten tal cual al generar
   el código, para no perder nada al reemplazar el array completo.
   ===================================================================== */
const CAMERA_KEYFRAMES = [
  {
    id: "front-idle", label: "Frente", progress: 0,
    camera: { position: [0, -0.35, 4.2], lookAt: [0, -0.4, 0], fov: 28 },
    fixed: {
      particles: { spread: 1, opacity: 0.28 },
      light: { color: "#ffffff", intensity: 0.75, rimColor: "#c8ff00", rimIntensity: 1.2 },
      fog: { color: "#0f0f1a", far: 20 },
      background: "#0f0f1a",
    },
  },
  {
    id: "approach", label: "Acercamiento", progress: 0.18,
    camera: { position: [0, -0.05, 3.4], lookAt: [0, -0.1, 0], fov: 27 },
    fixed: {
      particles: { spread: 1.05, opacity: 0.3 },
      light: { color: "#ffffff", intensity: 0.8, rimColor: "#c8ff00", rimIntensity: 1.3 },
      fog: { color: "#0f0f1a", far: 19 },
      background: "#0f0f1a",
    },
  },
  {
    id: "turn", label: "Giro", progress: 0.47,
    camera: { position: [0.5, 0.1, 3.4], lookAt: [0, 0.1, 0], fov: 27 },
    fixed: {
      particles: { spread: 1.2, opacity: 0.35 },
      light: { color: "#ffffff", intensity: 0.75, rimColor: "#7dfff0", rimIntensity: 1.6 },
      fog: { color: "#0d0d18", far: 16 },
      background: "#0d0d18",
    },
  },
  {
    id: "pause", label: "Pausa", progress: 0.6,
    camera: { position: [0.3, 0.15, 3.5], lookAt: [0, 0.08, 0], fov: 28 },
    fixed: {
      particles: { spread: 1.25, opacity: 0.37 },
      light: { color: "#ffffff", intensity: 0.75, rimColor: "#7dfff0", rimIntensity: 1.65 },
      fog: { color: "#0c0c16", far: 15 },
      background: "#0c0c16",
    },
  },
  {
    id: "fall-pose", label: "Postura caída", progress: 0.8,
    camera: { position: [0.2, 0.3, 3.8], lookAt: [0, 0.05, 0], fov: 30 },
    fixed: {
      particles: { spread: 1.3, opacity: 0.4 },
      light: { color: "#ffffff", intensity: 0.7, rimColor: "#7dfff0", rimIntensity: 1.7 },
      fog: { color: "#0a0a14", far: 14 },
      background: "#0a0a14",
    },
  },
  {
    id: "fall", label: "Caída", progress: 1,
    camera: { position: [0, 0.4, 4.2], lookAt: [0, 0, 0], fov: 32 },
    fixed: {
      particles: { spread: 1.5, opacity: 0.45 },
      light: { color: "#ffffff", intensity: 0.6, rimColor: "#c8ff00", rimIntensity: 1.6 },
      fog: { color: "#000000", far: 11 },
      background: "#000000",
    },
  },
];

function initialCameras() {
  return Object.fromEntries(CAMERA_KEYFRAMES.map((kf) => [kf.id, JSON.parse(JSON.stringify(kf.camera))]));
}

function lerpVec3(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }

function sampleCamera(camsByKf, progress) {
  const p = clamp(progress, 0, 1);
  const list = CAMERA_KEYFRAMES;
  if (p <= list[0].progress) return camsByKf[list[0].id];
  const last = list[list.length - 1];
  if (p >= last.progress) return camsByKf[last.id];
  let i = 0;
  while (i < list.length - 1 && list[i + 1].progress < p) i++;
  const a = list[i], b = list[i + 1];
  const span = b.progress - a.progress || 1;
  const t = clamp((p - a.progress) / span);
  const ca = camsByKf[a.id], cb = camsByKf[b.id];
  return {
    position: lerpVec3(ca.position, cb.position, t),
    lookAt: lerpVec3(ca.lookAt, cb.lookAt, t),
    fov: lerp(ca.fov, cb.fov, t),
  };
}

/* =====================================================================
   PERSONAJE
   ===================================================================== */
function Character({ pose, onBonesFound }) {
  const { scene } = useGLTF(MODEL_URL);
  const bonesRef = useRef({});
  const restRef = useRef({});
  const foundOnce = useRef(false);

  useEffect(() => {
    const bones = {}; const rest = {}; const found = {};
    BONE_DEFS.forEach(([key, boneName]) => {
      const bone = scene.getObjectByName(boneName);
      if (bone) { bones[key] = bone; rest[key] = bone.quaternion.clone(); found[key] = true; }
      else found[key] = false;
    });
    bonesRef.current = bones; restRef.current = rest;
    if (!foundOnce.current) { foundOnce.current = true; onBonesFound(found); }
  }, [scene]);

  useFrame(() => {
    const bones = bonesRef.current, rest = restRef.current;
    BONE_KEYS.forEach((key) => {
      const bone = bones[key], r = rest[key];
      if (!bone || !r) return;
      const xyz = pose[key];
      const dq = new THREE.Quaternion().setFromEuler(new THREE.Euler(rad(xyz.x), rad(xyz.y), rad(xyz.z), "XYZ"));
      bone.quaternion.copy(r).multiply(dq);
    });
  });

  return <primitive object={scene} position={[0, -0.9, 0]} scale={1.7} />;
}
useGLTF.preload(MODEL_URL);

/* =====================================================================
   CÁMARA — en modo "cámara de escena" fuerza position/lookAt/fov exactos
   (lo que realmente vería el usuario); en modo "libre" no toca nada y
   deja que OrbitControls maneje la vista para poder inspeccionar.
   ===================================================================== */
function SceneCameraDriver({ target, active }) {
  const { camera } = useThree();
  useFrame(() => {
    if (!active || !target) return;
    camera.position.set(target.position[0], target.position[1], target.position[2]);
    camera.lookAt(target.lookAt[0], target.lookAt[1], target.lookAt[2]);
    if ("fov" in camera) { camera.fov = target.fov; camera.updateProjectionMatrix(); }
  });
  return null;
}

function Scene({ pose, onBonesFound, cameraTarget, sceneCameraActive, autoRotate }) {
  return (
    <>
      <ambientLight intensity={0.4} />
      <directionalLight position={[3, 4, 5]} intensity={1} />
      <directionalLight position={[-3, 2, -2]} intensity={0.4} />
      <Environment preset="city" background={false} />
      <Grid args={[10, 10]} position={[0, -0.02, 0]} cellColor="#333" sectionColor="#555" />
      <Character pose={pose} onBonesFound={onBonesFound} />
      <SceneCameraDriver target={cameraTarget} active={sceneCameraActive} />
      <OrbitControls
        target={[0, 0.5, 0]}
        enabled={!sceneCameraActive}
        autoRotate={autoRotate && !sceneCameraActive}
        autoRotateSpeed={2.2}
      />
    </>
  );
}

/* =====================================================================
   GENERADOR DE CÓDIGO
   ===================================================================== */
function generateBoneCode(posesByKf) {
  const fmt = (n) => { const r = rad(n); return (Math.abs(r) < 0.0001 ? 0 : r).toFixed(4); };
  const kfLines = POSE_KEYFRAMES.map((kf) => {
    const pose = posesByKf[kf.id];
    const boneLines = BONE_KEYS.map((k) => {
      const v = pose[k];
      if (v.x === 0 && v.y === 0 && v.z === 0) return null;
      return `        ${k}: [${fmt(v.x)}, ${fmt(v.y)}, ${fmt(v.z)}],`;
    }).filter(Boolean).join("\n");
    return `  {\n    id: "${kf.id}",\n    progress: ${kf.progress},\n    bones: {\n${boneLines || "      // (sin cambios respecto al rest pose)"}\n    },\n  },`;
  }).join("\n");

  return `// Reemplazá tu BONE_POSE_KEYFRAMES actual por este bloque completo.
// sampleBonePose y la aplicación en useFrame NO cambian — dejalas como están.
const BONE_POSE_KEYFRAMES = [
${kfLines}
];`;
}

function generateCameraCode(camsByKf) {
  const fmtNum = (n) => (Math.abs(n) < 0.0001 ? 0 : Math.round(n * 1000) / 1000);
  const fmtVec = (v) => `[${v.map(fmtNum).join(", ")}]`;
  const kfLines = CAMERA_KEYFRAMES.map((kf) => {
    const cam = camsByKf[kf.id];
    const f = kf.fixed;
    return `  {
    id: "${kf.id}",
    progress: ${kf.progress},
    camera: { position: ${fmtVec(cam.position)}, lookAt: ${fmtVec(cam.lookAt)}, fov: ${fmtNum(cam.fov)} },
    particles: { spread: ${f.particles.spread}, opacity: ${f.particles.opacity} },
    light: { color: "${f.light.color}", intensity: ${f.light.intensity}, rimColor: "${f.light.rimColor}", rimIntensity: ${f.light.rimIntensity} },
    fog: { color: "${f.fog.color}", far: ${f.fog.far} },
    background: "${f.background}",
  },`;
  }).join("\n");

  return `// Reemplazá tu const scenes = [...] actual por este array completo.
// particles/light/fog/background quedaron igual que en tu versión actual;
// solo se tocó "camera" en cada etapa según lo que ajustaste acá.
const scenes = [
${kfLines}
];`;
}

/* =====================================================================
   APP
   ===================================================================== */
function App() {
  const [section, setSection] = useState("pose"); // "pose" | "camera" | "preview"
  const [posesByKf, setPosesByKf] = useState(initialPoses);
  const [camsByKf, setCamsByKf] = useState(initialCameras);
  const [activePoseKf, setActivePoseKf] = useState(POSE_KEYFRAMES[0].id);
  const [activeCamKf, setActiveCamKf] = useState(CAMERA_KEYFRAMES[0].id);
  const [scrub, setScrub] = useState(0);
  const [freeOrbit, setFreeOrbit] = useState(false);
  const [autoRotate, setAutoRotate] = useState(false);
  const [foundMap, setFoundMap] = useState({});
  const [copiedWhich, setCopiedWhich] = useState(null);

  const setBoneAxis = (boneKey, axis, value) => {
    setPosesByKf((prev) => ({
      ...prev,
      [activePoseKf]: { ...prev[activePoseKf], [boneKey]: { ...prev[activePoseKf][boneKey], [axis]: value } },
    }));
  };
  const resetBone = (boneKey) => {
    setPosesByKf((prev) => ({ ...prev, [activePoseKf]: { ...prev[activePoseKf], [boneKey]: { x: 0, y: 0, z: 0 } } }));
  };
  const copyPoseFromPrev = () => {
    const idx = POSE_KEYFRAMES.findIndex((k) => k.id === activePoseKf);
    if (idx <= 0) return;
    const prevId = POSE_KEYFRAMES[idx - 1].id;
    setPosesByKf((prev) => ({ ...prev, [activePoseKf]: JSON.parse(JSON.stringify(prev[prevId])) }));
  };

  const setCamField = (field, axis, value) => {
    setCamsByKf((prev) => {
      const cam = { ...prev[activeCamKf] };
      if (field === "fov") { cam.fov = value; }
      else { cam[field] = [...cam[field]]; cam[field]["xyz".indexOf(axis)] = value; }
      return { ...prev, [activeCamKf]: cam };
    });
  };
  const copyCamFromPrev = () => {
    const idx = CAMERA_KEYFRAMES.findIndex((k) => k.id === activeCamKf);
    if (idx <= 0) return;
    const prevId = CAMERA_KEYFRAMES[idx - 1].id;
    setCamsByKf((prev) => ({ ...prev, [activeCamKf]: JSON.parse(JSON.stringify(prev[prevId])) }));
  };

  const previewMode = section === "preview";
  const currentPose = previewMode ? samplePose(posesByKf, scrub) : posesByKf[activePoseKf];
  const currentCamTarget = previewMode
    ? sampleCamera(camsByKf, scrub)
    : camsByKf[activeCamKf];
  const sceneCameraActive = previewMode && !freeOrbit;

  const boneCode = useMemo(() => generateBoneCode(posesByKf), [posesByKf]);
  const cameraCode = useMemo(() => generateCameraCode(camsByKf), [camsByKf]);

  const copy = async (text, which) => {
    try {
      await navigator.clipboard.writeText(text);
      setCopiedWhich(which);
      setTimeout(() => setCopiedWhich(null), 1500);
    } catch (e) { /* fallback: seleccionar manualmente el textarea */ }
  };

  return (
    <>
      <div className="viewport">
        <div className="top-controls">
          <span>{section === "preview" && !freeOrbit ? "Vista: cámara de escena (real)" : "Arrastrá para orbitar · Scroll para zoom"}</span>
          {section === "preview" && (
            <label className="toggle-row">
              <input type="checkbox" checked={freeOrbit} onChange={(e) => setFreeOrbit(e.target.checked)} />
              Cámara libre (inspeccionar)
            </label>
          )}
          {section === "preview" && freeOrbit && (
            <label className="toggle-row">
              <input type="checkbox" checked={autoRotate} onChange={(e) => setAutoRotate(e.target.checked)} />
              Auto-rotar vista
            </label>
          )}
        </div>
        <Canvas camera={{ position: [0, 0.3, 3.5], fov: 35 }}>
          <Scene
            pose={currentPose}
            onBonesFound={setFoundMap}
            cameraTarget={currentCamTarget}
            sceneCameraActive={sceneCameraActive}
            autoRotate={autoRotate}
          />
        </Canvas>
      </div>

      <div className="panel">
        <div>
          <h1>Pose &amp; Cámara Generator</h1>
          <p className="hint">
            Ajustá pose y cámara por etapa. Arranca precargado con los valores que ya tenés en tu
            index.html — lo que edites acá reemplaza esos valores, el resto queda igual.
          </p>
        </div>

        <div className="section-tabs">
          <div className={`section-tab ${section === "pose" ? "active" : ""}`} onClick={() => setSection("pose")}>Pose</div>
          <div className={`section-tab ${section === "camera" ? "active" : ""}`} onClick={() => setSection("camera")}>Cámara</div>
          <div className={`section-tab ${section === "preview" ? "active" : ""}`} onClick={() => setSection("preview")}>Preview</div>
        </div>

        {section === "preview" && (
          <div className="scrub-row">
            <label style={{ fontSize: 11 }}>progress</label>
            <input type="range" min={0} max={1} step={0.001} value={scrub} onChange={(e) => setScrub(Number(e.target.value))} />
            <span className="val">{scrub.toFixed(2)}</span>
          </div>
        )}

        {section === "pose" && (
          <>
            <div className="kf-tabs">
              {POSE_KEYFRAMES.map((kf) => (
                <div key={kf.id} className={`kf-tab ${activePoseKf === kf.id ? "active" : ""}`} onClick={() => setActivePoseKf(kf.id)}>
                  {kf.label}<span className="p">progress {kf.progress}</span>
                </div>
              ))}
            </div>
            <div className="btn-row">
              <button className="btn" onClick={copyPoseFromPrev}>Copiar etapa anterior</button>
            </div>
            <div className="section-title">Huesos ({BONE_KEYS.length})</div>
            {BONE_DEFS.map(([key, boneName]) => {
              const found = foundMap[key];
              const v = posesByKf[activePoseKf][key];
              return (
                <div className="bone-block" key={key} style={{ opacity: found === false ? 0.4 : 1 }}>
                  <div className="bone-name">{boneName} {found === false ? "· FALTA" : ""}</div>
                  {["x", "y", "z"].map((axis) => (
                    <div className="axis-row" key={axis}>
                      <label>{axis.toUpperCase()}</label>
                      <input type="range" min={-180} max={180} value={v[axis]} onChange={(e) => setBoneAxis(key, axis, Number(e.target.value))} />
                      <span className="val">{Math.round(v[axis])}°</span>
                    </div>
                  ))}
                  <button className="btn" style={{ fontSize: 10, padding: "2px 6px" }} onClick={() => resetBone(key)}>reset</button>
                </div>
              );
            })}
          </>
        )}

        {section === "camera" && (
          <>
            <div className="kf-tabs">
              {CAMERA_KEYFRAMES.map((kf) => (
                <div key={kf.id} className={`kf-tab ${activeCamKf === kf.id ? "active" : ""}`} onClick={() => setActiveCamKf(kf.id)}>
                  {kf.label}<span className="p">progress {kf.progress}</span>
                </div>
              ))}
            </div>
            <div className="btn-row">
              <button className="btn" onClick={copyCamFromPrev}>Copiar etapa anterior</button>
            </div>

            <div className="cam-group">
              <div className="cam-group-title">Posición (x, y, z)</div>
              {["x", "y", "z"].map((axis, i) => (
                <div className="axis-row" key={axis}>
                  <label>{axis.toUpperCase()}</label>
                  <input type="range" min={-6} max={6} step={0.05} value={camsByKf[activeCamKf].position[i]}
                    onChange={(e) => setCamField("position", axis, Number(e.target.value))} />
                  <span className="val">{camsByKf[activeCamKf].position[i].toFixed(2)}</span>
                </div>
              ))}
              <p className="hint">Z más grande = más lejos (alejar). Z más chico = más cerca (acercar).</p>
            </div>

            <div className="cam-group">
              <div className="cam-group-title">Mira hacia (lookAt x, y, z)</div>
              {["x", "y", "z"].map((axis, i) => (
                <div className="axis-row" key={axis}>
                  <label>{axis.toUpperCase()}</label>
                  <input type="range" min={-3} max={3} step={0.05} value={camsByKf[activeCamKf].lookAt[i]}
                    onChange={(e) => setCamField("lookAt", axis, Number(e.target.value))} />
                  <span className="val">{camsByKf[activeCamKf].lookAt[i].toFixed(2)}</span>
                </div>
              ))}
              <p className="hint">Mové X/Y del lookAt para "girar" el encuadre alrededor del personaje sin mover la cámara.</p>
            </div>

            <div className="cam-group">
              <div className="cam-group-title">Zoom (FOV)</div>
              <div className="axis-row">
                <label>°</label>
                <input type="range" min={15} max={50} step={0.5} value={camsByKf[activeCamKf].fov}
                  onChange={(e) => setCamField("fov", null, Number(e.target.value))} />
                <span className="val">{camsByKf[activeCamKf].fov.toFixed(1)}</span>
              </div>
              <p className="hint">FOV más chico = efecto teleobjetivo (acerca). Más grande = angular (aleja/abre).</p>
            </div>
          </>
        )}

        <div className="section-title">Código — huesos</div>
        <textarea className="code" readOnly value={boneCode} onFocus={(e) => e.target.select()} />
        <div className="btn-row">
          <button className="btn primary" onClick={() => copy(boneCode, "bones")}>Copiar código de huesos</button>
          {copiedWhich === "bones" && <span className="copied">¡Copiado!</span>}
        </div>

        <div className="section-title">Código — cámara (array scenes completo)</div>
        <textarea className="code" readOnly value={cameraCode} onFocus={(e) => e.target.select()} />
        <div className="btn-row">
          <button className="btn primary" onClick={() => copy(cameraCode, "camera")}>Copiar código de cámara</button>
          {copiedWhich === "camera" && <span className="copied">¡Copiado!</span>}
        </div>
      </div>
    </>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
